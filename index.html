      leurs mots. « Méthode inhabituelle », écrit l'un d'eux, faute de mieux. Venant d'eux,
      c'est presque un compliment.`,
   e:{budget:-11,soc:{pouvoir:16,pauvrete:10},social:6,groups:{salaries:14,jeunes:8,patrons:-6}},
   axe:{social:1}, pose:"accord_signe", rival:-8},
  {l:"Proposer un accord réduit de moitié",
   r:`Trois milliards au lieu de six. Vous coupez la proposition en deux et vous la reposez
      sur la table à quatre heures et demie.<br><br>
      Deux organisations signent, deux refusent, la CGT claque la porte et va le dire aux
      caméras dans la cour. L'accord existe quand même, bancal, à moitié soutenu — et il
      tiendra, parce que personne n'a intérêt à le faire tomber.<br><br>
      Personne ne crie victoire. Personne ne crie à la trahison. C'est exactement le genre
      de résultat dont on ne fait ni une affiche ni un slogan, et c'est peut-être pour ça
      qu'on n'en fait presque jamais.`,
   e:{budget:-5,soc:{pouvoir:7},groups:{salaries:5,patrons:-3}},
   pose:"demi_accord"},
  {l:"Refuser et renvoyer chacun à ses responsabilités",
   r:`Vous vous levez à quatre heures et demie sans signer. « Chacun connaît sa part de
      responsabilité. » Les deux camps sortent séparément et se contredisent devant les
      caméras avant même d'avoir atteint le portail.<br><br>
      Le conflit reprend dix jours plus tard, plus dur qu'avant, et cette fois il n'y a
      plus personne au milieu pour arbitrer — vous avez brûlé le seul canal de discussion
      qui existait.<br><br>
      Vous avez économisé six milliards d'euros. Vous les repaierez, avec les intérêts, en
      semaines de blocage et en points de croissance perdus. Le calcul n'était pas
      difficile à faire. Il était juste désagréable.`,
   e:{budget:3,economie:4,social:-8,groups:{salaries:-12,patrons:10,jeunes:-6}},
   axe:{autorite:1,social:-1}, rival:9}
 ]},

{id:"c3faible", ch:3, mois:14, ico:"🪧", t:"Le pays vous échappe",
 d:`Ce n'est pas une grève. C'est plus diffus, plus difficile à nommer, et donc plus
    inquiétant : des ronds-points occupés sans mot d'ordre, des conseils municipaux qui
    démissionnent en bloc, des maires qui rendent leur écharpe tricolore devant les caméras
    régionales.<br><br>
    Personne ne réclame rien de précis. Un sondage tombe à dix-neuf heures : soixante-huit
    pour cent des Français estiment que « le pouvoir ne décide plus rien ». Ce n'est pas de
    la colère, c'est du désengagement, et ça ne se combat pas avec une annonce.<br><br>
    Ce matin, Julien Ferrand a quitté son parti « pour fonder autre chose ». Il n'a pas
    dit quoi. Il n'a pas eu besoin. Le vide qu'il désigne, tout le monde le ressent — et
    on attend de voir si vous êtes capable de le combler avant lui.`,
 o:[
  {l:"Une allocution solennelle : reprendre la main",
   r:`Vingt heures, douze minutes, sans prompteur, la caméra un peu trop proche. Vous
      reconnaissez le désarroi sans le nier, vous fixez trois caps clairs, et vous ne
      promettez aucun chiffre — pour une fois.<br><br>
      Dix-neuf millions de téléspectateurs, un chiffre qu'aucune allocution n'avait fait
      depuis des années.<br><br>
      Le mouvement ne s'arrête pas. Mais il change de nature : dès le lendemain, dans les
      matinales, on recommence à débattre de ce que vous avez dit, du contenu, des trois
      caps — et non plus de votre personne. Ce déplacement-là, du « lui » au « ça », c'est
      déjà beaucoup. C'est peut-être tout ce que vous pouviez gagner ce soir.`,
   e:{social:5,groups:{salaries:6,retraites:7,ruraux:5,jeunes:4}},
   axe:{autorite:1}, pose:"reprise_main", rival:-6},
  {l:"Lancer un grand débat national",
   r:`Dix mille réunions publiques en quatre mois. Deux millions de contributions en ligne,
      des cahiers de doléances dans les mairies, quatre mois de votre agenda absorbés par
      des salles des fêtes.<br><br>
      C'est un pari sur le temps, et il ne gagne qu'à moitié. La colère se canalise, se
      met en mots, s'organise en revendications — mais les attentes que vous créez ne
      seront pas toutes satisfaites, et on vous le rappellera, longtemps, dossier par
      dossier.<br><br>
      Il reste une chose vraie, que personne ne pourra vous retirer : pendant quatre mois,
      personne n'a été empêché de parler. Dans un pays qui se sentait ignoré, ça compte
      plus qu'on ne croit.`,
   e:{budget:-7,social:8,groups:{ruraux:10,salaries:7,jeunes:5,patrons:-5}},
   axe:{social:1}, pose:"grand_debat", rival:-3},
  {l:"Faire évacuer les blocages",
   r:`Trois nuits d'opérations. Mille deux cents interpellations, quarante-sept blessés,
      dont onze parmi les forces de l'ordre.<br><br>
      Les ronds-points sont dégagés le jeudi. Le vendredi, une vidéo tourne : un retraité
      au sol, une matraque, un gendarme qui le relève finalement lui-même. Elle est vue
      quinze millions de fois en trois jours.<br><br>
      Vous avez rétabli l'ordre matériel. Vous avez aussi fabriqué un martyre, ce qui est
      le marché habituel de ce genre de décision — on récupère des giratoires et on perd
      une image. Le désengagement, lui, n'a pas reculé d'un pouce. Il s'est juste ajouté
      de la peur.`,
   e:{sec:{interieure:14},social:-11,groups:{ruraux:-14,jeunes:-11,retraites:8,patrons:7}},
   axe:{autorite:2}, pose:"evacuation", rival:13}
 ]},

/* ─────────── CHAPITRE IV · MI-MANDAT ─────────── */
{id:"c4remaniement", ch:4, mois:20, ico:"🔄", t:"Le remaniement",
 d:`Deux ans. La moitié du chemin, et le moment rituel où les présidents changent d'équipe
    pour donner l'impression qu'ils changent de cap.<br><br>
    Votre Premier ministre le sait mieux que personne : il a posé sa lettre de démission
    sur votre bureau sans un mot, en la faisant glisser du bout des doigts. Trois noms
    circulent déjà pour Matignon — un technicien, une figure sociale, un homme d'ordre —
    et chacun raconte une histoire différente sur la suite de votre mandat.<br><br>
    Dans la même heure, l'institut de sondage vous transmet une note confidentielle,
    tamponnée « strictement personnel ». Le mouvement de Julien Ferrand, qui n'existait
    pas il y a deux ans, est crédité de vingt-six pour cent des intentions de vote. Le
    choix de ce matin, c'est aussi le choix de qui vous opposez à ça.`,
 o:[
  {l:"Nommer un technicien : gérer, ne plus promettre",
   r:`Un inspecteur des finances de cinquante-quatre ans, que personne ne connaît, qui
      parle en tableaux et n'a jamais fait un meeting de sa vie.<br><br>
      Les marchés l'adorent dès l'annonce. Vos militants s'effondrent : ils comprennent que
      la parenthèse des promesses est refermée. En six mois, il redresse trois dossiers que
      personne n'avait su tenir — et il perd, méthodiquement, toutes les batailles de
      communication.<br><br>
      C'est exactement ce que vous aviez demandé : quelqu'un qui fasse tourner la machine
      sans faire d'ombre. Le problème, c'est qu'un gouvernement qui ne fait pas d'ombre ne
      fait pas rêver non plus, et qu'à deux ans d'une élection, il faudra bien que
      quelqu'un s'en charge.`,
   e:{economie:8,budget:5,cac:4,social:-4,groups:{patrons:9,salaries:-5}},
   pose:"pm_technicien"},
  {l:"Nommer une figure sociale : reprendre la gauche",
   r:`Une ancienne responsable syndicale devenue députée, respectée jusque dans les rangs
      d'en face, avec une réputation d'incorruptible.<br><br>
      La nomination réveille votre électorat d'origine, celui qui vous avait fait élire et
      qui commençait à ne plus répondre au téléphone. Bercy grince des dents. Elle pose une
      condition en acceptant : elle veut arbitrer elle-même le budget de la santé, sans
      passer par les Finances.<br><br>
      Vous acceptez. Vous ne le regretterez pas sur le fond — l'hôpital ira mieux. Mais
      vous venez de créer, à Matignon, un second centre de gravité, et il y aura des matins
      où vous ne saurez plus très bien qui gouverne.`,
   e:{soc:{pouvoir:12,pauvrete:12},budget:-8,groups:{salaries:11,jeunes:9,patrons:-10}},
   axe:{social:2}, pose:"pm_social"},
  {l:"Nommer un homme d'ordre : couper l'herbe sous le pied de Ferrand",
   r:`Un ancien préfet, passé par trois cabinets, réputé pour ne jamais reculer d'un pas
      quand il a décidé d'avancer.<br><br>
      L'effet est immédiat dans les enquêtes : Ferrand perd son monopole sur le thème de
      l'autorité, et ses intentions de vote plafonnent pour la première fois.<br><br>
      Mais votre aile gauche se disloque en quelques semaines. Deux ministres démissionnent
      coup sur coup ; l'un d'eux, en partant, lâche une phrase que reprennent tous les
      titres : « Ce n'est plus le même gouvernement. Ce n'est plus le même président. »
      Il a tort sur le second point. Il a raison sur le premier, et c'est déjà trop.`,
   e:{sec:{interieure:16},social:-6,groups:{retraites:11,ruraux:10,jeunes:-12}},
   axe:{autorite:2}, pose:"pm_ordre", rival:-8}
 ]},

{id:"c4censure", ch:4, mois:20, si:()=>S.flags.passage_force||S.flags.evacuation, ico:"⚖️", t:"La motion de censure",
 d:`Il manque neuf voix à l'opposition pour vous renverser. Neuf députés qui n'ont pas
    encore dit ce qu'ils feraient, et que la terre entière appelle depuis quarante-huit
    heures — l'opposition pour les convaincre, votre camp pour les retenir.<br><br>
    Votre directeur de cabinet a établi la liste de leurs demandes, poste par poste : une
    sous-préfecture qu'on menaçait de fermer, deux lignes ferroviaires régionales, un
    hôpital de proximité, un contournement routier. « Ça se paie, monsieur le Président.
    Mais ça se paie une fois. La prochaine fois, ils demanderont le double, parce qu'ils
    sauront que vous payez. »<br><br>
    Ferrand, lui, n'a rien demandé à personne. Il a déjà fait circuler, en interne, son
    discours pour le lendemain de la censure. Il l'a intitulé « L'après ».`,
 o:[
  {l:"Acheter les voix, une par une",
   r:`Une sous-préfecture sauvée. Deux lignes ferroviaires réinscrites au contrat de plan.
      Un hôpital de proximité dont la fermeture est « repoussée sine die ». Et neuf députés
      qui découvrent, en quarante-huit heures, que la censure serait finalement excessive.<br><br>
      La motion échoue à sept voix. Vous restez.<br><br>
      Le coût réel n'apparaît pas ce soir-là. Il apparaît dans le budget de l'année
      suivante, dilué sur quinze lignes différentes, jusqu'au jour où un journaliste
      prend le temps de faire l'addition et publie le total. À ce moment-là, le mot qu'on
      emploiera ne sera pas « habileté ». Ce sera « marchandage ».`,
   e:{budget:-14,economie:-3,groups:{ruraux:9,salaries:-6,patrons:-7}},
   pose:"marchandage", rival:6},
  {l:"Aller au bras de fer, sans rien céder",
   r:`Vous ne recevez personne. Vous ne promettez rien. Vous laissez le vote se tenir, un
      jeudi, à vingt-trois heures, dans un hémicycle électrique.<br><br>
      La motion échoue à quatre voix, et personne — pas même vos services — ne sait
      exactement pourquoi ces quatre-là ont basculé du bon côté. Vous avez tenu sans rien
      payer.<br><br>
      Vous avez surtout découvert quelque chose : votre majorité tient à quatre personnes,
      et vous ne connaissez le nom d'aucune des quatre. C'est un renseignement précieux et
      inquiétant. À partir de cette nuit, chaque texte difficile se comptera dans votre
      tête à quatre voix près.`,
   e:{social:-8,groups:{salaries:-9,jeunes:-7,patrons:12,retraites:5}},
   axe:{autorite:2}, pose:"bras_de_fer", rival:10},
  {l:"Prendre les devants : engager votre responsabilité et proposer un référendum",
   r:`Vous n'attendez pas le vote de la motion. Vous annoncez, la veille au soir, un
      référendum sur la question de fond — celle qui a mis le pays dans la rue. Vous prenez
      tout le monde de court, y compris votre propre camp, y compris le Premier ministre.<br><br>
      La censure devient sans objet : on ne renverse pas un président qui vient de rendre
      la parole au peuple. L'opposition retire sa motion en grinçant.<br><br>
      Ferrand, lui, avait un discours de victoire prêt. Il doit maintenant faire campagne
      sur une question que vous avez rédigée, à une date que vous avez fixée. C'est le
      meilleur coup politique de votre mandat, et vous le savez en le jouant.`,
   e:{social:9,budget:-5,groups:{salaries:7,jeunes:10,ruraux:8,patrons:-6}},
   axe:{social:1}, pose:"referendum", rival:-10,
   si:()=>popularite()>42}
 ]},

/* ─────────── CHAPITRE V · LA CRISE MAJEURE ───────────
   La crise frappe là où vous avez le moins investi.                      */
{id:"c5eco", ch:5, mois:26, si:()=>talonAchille()==="economie", ico:"💥", t:"Le jour où tout s'arrête",
 d:`Un fonds d'investissement a fait sauter une banque. Pas la vôtre, pas une grande — une
    banque régionale dont personne ne connaissait le nom hier, et dont tout le monde parle
    ce matin.<br><br>
    À neuf heures, deux autres établissements suspendent les retraits « par précaution ».
    À onze heures, les premières files se forment devant les distributeurs, filmées en
    boucle. La peur est un liquide : elle coule vite et elle ne remonte pas.<br><br>
    Le gouverneur de la Banque de France est dans votre bureau, et il ne prend aucun gant :
    « Vous avez jusqu'à ce soir. Demain matin, il sera trop tard — et ce ne sera plus une
    banque régionale, ce sera le système. » Trois options sur la table : la garantie
    totale, la résolution ordonnée, la nationalisation.`,
 o:[
  {l:"Garantir tous les dépôts, quoi qu'il en coûte",
   r:`Allocution à vingt-deux heures, quatre phrases, une seule qui compte : « Pas un
      épargnant français ne perdra un euro. » Elle est reprise en boucle toute la nuit.<br><br>
      Les files ont disparu le lendemain matin. Vingt-deux milliards d'euros de garanties
      publiques engagés, la dette qui bondit d'un coup, et le système qui tient.<br><br>
      Trois ans plus tard, l'État aura récupéré la quasi-totalité de la mise, la banque
      assainie aura été revendue avec une plus-value. Personne ne s'en souviendra. On se
      souvient des paniques, jamais des paniques évitées.`,
   e:{pib:0.6,budget:-22,dette:14,economie:9,cac:8,groups:{salaries:12,retraites:11,patrons:9}},
   pose:"sauvetage", rival:-6},
  {l:"Laisser la banque tomber, sauver les seuls épargnants",
   r:`La banque est mise en résolution. Les dépôts sont garantis jusqu'à cent mille euros,
      comme le prévoit la loi. Les actionnaires et les créanciers juniors perdent tout.<br><br>
      C'est orthodoxe, c'est même juste : ceux qui ont pris le risque le paient. Mais ça
      déclenche deux jours de panique supplémentaires, le temps que les marchés vérifient
      qu'aucune autre banque n'est logée à la même enseigne.<br><br>
      Quatorze mille salariés du groupe apprennent leur sort par la presse, un jeudi
      matin. La contagion est évitée, de justesse, à quelques heures près. Vous ne saurez
      jamais si vous avez eu du courage ou de la chance.`,
   e:{pib:-1.6,budget:-9,economie:-8,cac:-12,groups:{patrons:-14,salaries:5,retraites:6}},
   axe:{social:1}},
  {l:"Nationaliser et faire payer les actionnaires",
   r:`Nationalisation par ordonnance dans la nuit. Actionnaires dilués à zéro, conseil
      d'administration révoqué, deux dirigeants mis en examen dans la semaine.<br><br>
      Le pays approuve massivement — soixante-dix pour cent dans les premiers sondages.
      Enfin quelqu'un fait payer les responsables.<br><br>
      La Bourse de Paris, elle, perd huit pour cent en deux séances. Deux banques
      étrangères réduisent discrètement leur exposition à la dette française. Vous avez
      rendu la justice, et la justice, sur les marchés, a un prix qui s'affiche en temps
      réel, minute par minute.`,
   e:{pib:-2,budget:-13,economie:-4,cac:-16,soc:{pauvrete:10},
      groups:{salaries:14,jeunes:9,patrons:-20}},
   axe:{social:2}, rival:5, pose:"nationalisation"}
 ]},

{id:"c5sec", ch:5, mois:26, si:()=>talonAchille()==="securite", ico:"🚨", t:"Vingt-deux heures quarante",
 d:`L'attaque a duré six minutes. Le bilan provisoire est sur votre bureau depuis une heure,
    dans une chemise cartonnée, et vous ne l'avez pas encore retournée.<br><br>
    Le ministre de l'Intérieur parle vite, trop vite, enchaîne les éléments de langage. Le
    directeur de la DGSI, lui, ne dit qu'une phrase, à voix basse, en regardant la table :
    « Nous les avions signalés. Il y a onze mois. Le dossier a été classé, faute
    d'effectifs pour le suivre. »<br><br>
    Camille Reyes a déjà le numéro du dossier — vous l'apprenez par une note du cabinet
    glissée sous la porte. Il faut décider, cette nuit, de la réponse : l'état d'urgence,
    la vérité crue sur la défaillance, ou la frappe à l'étranger.`,
 o:[
  {l:"Décréter l'état d'urgence",
   r:`Décret signé à trois heures du matin, en vigueur à l'aube. Perquisitions
      administratives sans juge, assignations à résidence, rassemblements soumis à
      autorisation.<br><br>
      Le pays vous soutient à soixante-douze pour cent la première semaine. Le besoin de
      protection l'emporte sur tout le reste.<br><br>
      À la sixième semaine, la Défenseure des droits publie un décompte : quatre cents
      perquisitions menées sans le moindre lien établi avec le terrorisme — des militants
      écologistes, des syndicalistes, un imam qui avait critiqué le gouvernement. La courbe
      de votre soutien s'inverse exactement là, à la semaine six, et elle ne remontera
      pas.`,
   e:{sec:{interieure:24},social:-12,budget:-10,
      groups:{retraites:14,ruraux:11,jeunes:-17}},
   axe:{autorite:2}, pose:"etat_urgence"},
  {l:"Unité nationale, deuil, et la vérité sur le dossier classé",
   r:`Vous parlez à vingt heures. Vous annoncez les faits, le bilan, le deuil national — et
      vous dites aussi, dans la même allocution, que les auteurs avaient été signalés onze
      mois plus tôt et que le signalement n'avait pas été suivi. « C'est une défaillance
      de l'État. Je ne la mettrai pas sous le tapis. »<br><br>
      C'est un aveu presque inédit dans ces circonstances. Certains y voient de la
      faiblesse.<br><br>
      Le directeur de la DGSI vous en remerciera en privé, quelques jours plus tard, d'une
      phrase : « Vous m'avez évité de porter seul ce que personne, en haut, n'a jamais
      voulu porter. » Ses équipes le sauront. Ça compte, dans une maison qui se sent
      toujours seule.`,
   e:{sec:{interieure:8},social:8,groups:{salaries:9,jeunes:7,retraites:8,ruraux:6}},
   axe:{autorite:0}, pose:"franchise", rival:-9},
  {l:"Frapper à l'étranger dans les quarante-huit heures",
   r:`Quatre Rafale décollent de Djibouti. Deux cibles, une frappe à trois heures du matin,
      heure locale, sur un camp d'entraînement identifié par le renseignement.<br><br>
      Les objectifs sont détruits. Le communiqué de l'état-major parle d'une opération
      « précise et maîtrisée ».<br><br>
      Deux semaines plus tard, une ONG sur le terrain documente sept victimes civiles,
      dont trois enfants, dans un hameau proche du camp. Le ministère des Armées répond que
      les « dommages sont en cours d'évaluation ». Cette évaluation ne sera jamais publiée.
      La formule, elle, restera dans les archives, à côté de votre nom.`,
   e:{sec:{defense:22,interieure:6},budget:-14,economie:-4,
      groups:{retraites:12,ruraux:9,jeunes:-9}},
   axe:{autorite:2}, pose:"riposte"}
 ]},

{id:"c5cli", ch:5, mois:26, si:()=>talonAchille()==="climat", ico:"🏜️", t:"L'été sans eau",
 d:`Quatre-vingt-douze départements en restriction. Dans le Sud, des communes entières sont
    approvisionnées par camion-citerne depuis trois semaines — une rotation de camions
    toutes les six heures pour que les robinets crachent quelque chose le matin.<br><br>
    Le préfet du Vaucluse vous appelle directement sur votre ligne, ce qui ne se fait pas.
    Sa voix est tendue : « Monsieur le Président, j'ai des agriculteurs qui pompent la nuit
    dans des rivières interdites parce que c'est ça ou perdre leur exploitation. Et j'ai
    des maires qui m'appellent pour savoir s'ils doivent les dénoncer à la gendarmerie.
    Dites-moi ce que je leur réponds. »<br><br>
    Il fait quarante et un degrés à Avignon. Il est neuf heures du matin. La décision —
    rationner sans exception, investir massivement, ou lever les restrictions — ne peut
    pas attendre.`,
 o:[
  {l:"Rationner l'eau agricole, sans exception",
   r:`Arrêté préfectoral unifié dans les quatre-vingt-douze départements : irrigation
      interdite, aucune dérogation, contrôles renforcés.<br><br>
      Les nappes phréatiques remontent pour la première fois depuis six ans — un chiffre
      que les hydrogéologues n'espéraient plus.<br><br>
      Mais trente pour cent des récoltes de maïs sont perdues. Deux cents exploitations
      déposent le bilan à l'automne. Un syndicat agricole appelle ouvertement à « la
      désobéissance ». Vous avez sauvé l'eau du pays, et cassé une filière — et les deux
      sont vrais en même temps, sans que l'un console de l'autre.`,
   e:{cli:{eau:30,sols:14},economie:-7,groups:{ruraux:-19,jeunes:11,salaries:5}},
   axe:{ecologie:2,autorite:1}, pose:"rationnement", rival:8},
  {l:"Plan d'urgence : dessalement, retenues, réutilisation",
   r:`Vingt milliards d'euros annoncés en une semaine : trois usines de dessalement sur le
      littoral, généralisation de la réutilisation des eaux usées traitées, réfection de
      dizaines de milliers de kilomètres de canalisations qui fuient.<br><br>
      Rien ne sera opérationnel avant quatre ans, et vous le dites honnêtement, à la
      tribune, sans enjoliver.<br><br>
      En attendant, les camions-citernes continuent leur rotation. C'est le bon plan, le
      plan qu'il fallait — et il arrive avec dix ans de retard. Ce retard n'est pas votre
      faute. Il est devenu votre problème.`,
   e:{budget:-20,cli:{eau:22,air:6},economie:5,groups:{ruraux:12,patrons:8,jeunes:5}},
   axe:{ecologie:1}, pose:"plan_eau"},
  {l:"Lever les restrictions pour sauver les récoltes",
   r:`Les arrêtés sont levés en quarante-huit heures. Les pompes redémarrent, les récoltes
      sont sauvées, la filière agricole respire et vous remercie.<br><br>
      Deux mois plus tard, quatre communes du Vaucluse n'ont plus une goutte d'eau potable
      au robinet — les nappes qui les alimentaient sont à sec. Le lien est immédiat, direct,
      indiscutable : on a vidé la ressource pour arroser le maïs.<br><br>
      Le préfet qui vous avait appelé cette nuit-là demande sa mutation avant l'hiver. Il
      ne fera aucune déclaration. Son silence sera assez éloquent.`,
   e:{cli:{eau:-26,sols:-14},economie:6,groups:{ruraux:16,jeunes:-15,patrons:7}},
   axe:{ecologie:-2}, pose:"eau_sacrifiee", rival:6}
 ]},

{id:"c5soc", ch:5, mois:26, ico:"🏥", t:"L'hôpital ferme",
 d:`Ce n'est pas une grève, c'est une démission collective. Quarante-trois urgentistes d'un
    même CHU ont posé leur blouse le même matin, sur le même bureau, avec la même lettre.<br><br>
    En trois jours, six autres hôpitaux ont suivi. Une femme de cinquante-huit ans est
    morte dans une ambulance qui a cherché pendant une heure et quart un service d'urgence
    ouvert. Sa fille a parlé au journal de vingt heures, calmement, et son visage est
    maintenant sur tous les écrans du pays.<br><br>
    Le directeur général de la santé attend dans le couloir depuis une heure, avec trois
    scénarios chiffrés. Il faut choisir : la revalorisation massive, la réquisition, ou
    l'ouverture au privé.`,
 o:[
  {l:"Revalorisation immédiate et massive des soignants",
   r:`Quatre cents euros nets de plus par mois, prime de nuit doublée, deux mille postes
      ouverts en recrutement d'urgence.<br><br>
      Dix-neuf des quarante-trois démissionnaires du CHU reviennent. Dix-neuf sur
      quarante-trois : c'est beaucoup, et c'est terriblement peu. Le service rouvre en six
      semaines, à effectifs réduits.<br><br>
      Dix-neuf milliards d'euros par an, définitivement inscrits au budget de la Sécurité
      sociale. Votre successeur en héritera comme d'un dû : on ne retire pas quatre cents
      euros à une infirmière, même quand on ne sait pas comment les financer.`,
   e:{budget:-19,soc:{sante:32,pouvoir:10},groups:{salaries:15,retraites:13,patrons:-7}},
   axe:{social:2}, pose:"sauvetage_hopital", rival:-8},
  {l:"Réquisitionner les personnels démissionnaires",
   r:`Réquisition préfectorale, notifiée à domicile, un huissier à la porte, sous peine de
      sanctions disciplinaires et de poursuites.<br><br>
      Le service rouvre en quatre jours. L'ordre est rétabli, sur le papier.<br><br>
      Quarante et un soignants saisissent le tribunal administratif. Six mois plus tard, la
      réquisition sera jugée illégale, disproportionnée, attentatoire à la liberté du
      travail. Et à ce moment-là, sur les quarante-trois de départ, trente auront déjà
      quitté l'hôpital public — pour le privé, pour l'étranger, pour autre chose. Vous
      avez gagné quatre jours et perdu trente médecins.`,
   e:{sec:{interieure:4},soc:{sante:8},social:-14,
      groups:{salaries:-17,retraites:6,jeunes:-9}},
   axe:{autorite:2}, pose:"requisition", rival:12},
  {l:"Ouvrir l'hôpital public au privé pour tenir",
   r:`Convention d'urgence signée en dix jours : les cliniques privées prennent en charge
      une part des urgences publiques, remboursées à l'acte par la Sécurité sociale.<br><br>
      Ça tient. Les délais d'attente baissent, mécaniquement.<br><br>
      Et une ligne de partage apparaît dans les statistiques dès la première année, discrète
      d'abord, puis nette : les patients sans complémentaire santé attendent deux fois plus
      longtemps que les autres. Le chiffre finira par sortir, dans une étude, au pire
      moment possible — et on l'appellera « la médecine à deux vitesses de son mandat ».`,
   e:{budget:-6,soc:{sante:16,pauvrete:-12},economie:5,cac:6,
      groups:{patrons:14,salaries:-11,jeunes:-6}},
   axe:{social:-2}, pose:"privatisation", rival:7}
 ]},

/* ─────────── CHAPITRE VI · L'AFFAIRE ─────────── */

{id:"c6dossier", ch:6, mois:32, ico:"🕵️", t:"Le dossier Reyes",
 d:`Camille Reyes publie dans huit jours. Votre directeur de cabinet a obtenu le sommaire
    de l'enquête par un contact à la rédaction : trois ans de notes internes, des
    arbitrages que vous pensiez purement oraux et qui étaient consignés, et deux virements
    au départ d'un compte de campagne que personne n'a jamais su expliquer.<br><br>
    Il pose le sommaire sur votre bureau et il ne cherche pas à vous rassurer. « Ce n'est
    pas illégal, monsieur le Président. C'est pire : c'est lisible. Il n'y a pas besoin
    d'être juriste. N'importe quel électeur comprend en une lecture. »<br><br>
    Il y a une décision à prendre avant vendredi, une seule : prendre les devants, faire
    pression, ou attendre.`,
 o:[
  {l:"Tout publier vous-même, avant elle",
   r:`Vendredi, neuf heures. Trois ans de notes internes mises en ligne sur le site de
      l'Élysée, y compris les deux virements, y compris les arbitrages gênants, avec une
      note explicative de votre main.<br><br>
      Vous prenez trois jours de tempête médiatique, frontale, brutale. Et vous coupez
      l'herbe sous le pied de tout le monde : quand Camille Reyes publie, le mardi suivant,
      son article n'a plus rien à révéler.<br><br>
      Elle écrit, dans son papier, une phrase que vous garderez : « Il a choisi de se
      faire mal lui-même, avant qu'on le lui fasse. C'est rare. Ça ne rend pas les faits
      plus jolis. Mais c'est rare. »`,
   e:{social:10,groups:{salaries:8,jeunes:11,ruraux:7,retraites:5,patrons:-5}},
   axe:{social:1}, pose:"transparence", rival:-12},
  {l:"Faire pression sur le journal",
   r:`Deux coups de téléphone. Un déjeuner discret entre le secrétaire général et le
      directeur du groupe de presse. Un rappel, glissé au bon moment, du montant des aides
      publiques dont le titre bénéficie chaque année.<br><br>
      L'article paraît quand même, amputé de deux paragraphes. La rédaction publie, en
      première page, un communiqué expliquant précisément pourquoi.<br><br>
      Et Camille Reyes classe, dans un dossier, la trace datée de chaque appel, de chaque
      déjeuner, de chaque pression. Elle ne le publiera pas cette semaine. Elle le publiera
      au moment où ça fera le plus de dégâts — et elle a tout le temps du monde.`,
   e:{sec:{interieure:-6},social:-14,groups:{jeunes:-16,salaries:-11,retraites:-6}},
   axe:{autorite:2}, pose:"pression_presse", rival:16},
  {l:"Ne rien faire et préparer la riposte",
   r:`Vous laissez venir. Trois éléments de langage rédigés à l'avance, deux relais
      parlementaires briefés, un droit de réponse prêt à partir.<br><br>
      L'article sort et fait exactement le bruit qu'on avait anticipé. Votre riposte est
      correcte, cadrée, professionnelle. La séquence dure neuf jours au lieu de trois — le
      temps que la contre-offensive elle-même devienne un sujet.<br><br>
      Et sur le fond, rien n'est réglé. Les deux virements ne sont toujours pas expliqués.
      Vous avez géré un problème de communication. Vous n'avez pas traité l'affaire. Elle
      reviendra.`,
   e:{social:-6,groups:{salaries:-6,jeunes:-7}},
   pose:"silence", rival:8}
 ]},

{id:"c6enquete", ch:6, mois:32, si:()=>S.flags.franchise, ico:"📰", t:"La commission d'enquête",
 d:`Vous avez toujours joué franc jeu avec elle, et c'est peut-être pour ça que Camille
    Reyes vous a prévenu la veille, par courriel, avant de publier. L'article ne vous vise
    pas directement : il vise votre entourage, deux anciens conseillers, une association
    de financement.<br><br>
    Une commission d'enquête parlementaire est votée dans la foulée, à l'initiative de
    l'opposition. Elle peut vous laver définitivement — un rapport qui conclut à rien —
    ou passer dix-huit mois à retourner chaque tiroir pendant que vous essayez de
    gouverner.<br><br>
    Julien Ferrand a réclamé publiquement la présidence de cette commission. Il faut
    décider : coopération totale, coopération sans lui, ou secret-défense.`,
 o:[
  {l:"Accepter la commission et lui ouvrir toutes les portes",
   r:`Instruction écrite à tous les cabinets : transmettre l'intégralité des documents
      demandés, autoriser tous les collaborateurs à témoigner, sans exception, sans filtre.<br><br>
      La commission travaille quatorze mois. Elle auditionne quatre-vingts personnes. Et
      elle conclut à des « défaillances d'organisation, sans intention frauduleuse
      caractérisée ».<br><br>
      C'est une victoire terne, sans applaudissements, sans soulagement spectaculaire. Mais
      c'est la seule sorte de victoire qui soit vraiment crédible : celle qu'on obtient en
      ayant tout montré. Personne ne pourra dire que vous avez caché quoi que ce soit.`,
   e:{social:12,budget:-3,groups:{salaries:9,jeunes:12,ruraux:8,retraites:7}},
   axe:{social:1}, pose:"transparence", rival:-14},
  {l:"Accepter, mais refuser la présidence à Ferrand",
   r:`La commission est créée. Vous vous battez, en coulisse, pour qu'elle soit présidée
      par un député d'opposition — mais pas lui.<br><br>
      Ferrand crie au « verrouillage », à la « commission Potemkine », pendant trois jours,
      sur tous les plateaux. Puis il passe à autre chose : la commission, présidée par
      quelqu'un de sérieux, travaille sérieusement, et ne lui donne aucun os à ronger.<br><br>
      Vous lui avez évité une tribune de dix-huit mois. Vous avez aussi montré, à tout le
      monde, que vous y aviez pensé — que la première chose qui vous a préoccupé, c'était
      lui. Ça se remarque.`,
   e:{social:4,groups:{jeunes:4,salaries:3,patrons:4}},
   pose:"demi_transparence", rival:4},
  {l:"Invoquer le secret de la défense nationale",
   r:`Quatre pièces classées « secret-défense » et retirées du champ de la commission.
      Deux auditions refusées au nom de la sécurité nationale. Une décision juridiquement
      inattaquable — vos juristes sont formels.<br><br>
      Elle est politiquement catastrophique. À partir de ce jour, le sujet n'est plus
      l'affaire elle-même. Le sujet, c'est ce que vous cachez derrière le secret-défense.<br><br>
      Le mot « secret » figure dans quatre-vingts pour cent des titres qui vous concernent
      pendant six semaines. Vous avez transformé un dossier gênant en soupçon permanent, et
      un soupçon, contrairement à un dossier, ne se referme jamais.`,
   e:{sec:{defense:6},social:-13,groups:{jeunes:-14,salaries:-10,ruraux:-7}},
   axe:{autorite:2}, pose:"secret_defense", rival:15}
 ]},

/* ─────────── CHAPITRE VII · LE DERNIER VIRAGE ─────────── */
{id:"c7", ch:7, mois:38, ico:"⏳", t:"Ce qu'il reste à sauver",
 d:`Il vous reste six mois et un dernier budget. C'est peu. C'est aussi le budget sur
    lequel on vous jugera, celui qui restera dans les manuels d'histoire économique avec
    votre nom en légende de courbe.<br><br>
    Votre conseiller politique est arrivé sans dossier ce matin — ce qui ne lui arrive
    jamais, en dix ans que vous le connaissez. Il s'est assis, a regardé longuement le
    jardin par la fenêtre, puis vous a fixé : « Vous ne pouvez plus tout tenir en même
    temps. Le pouvoir d'achat, l'école, les comptes, le climat : il faut choisir ce que
    les gens retiendront de vous. Une chose. Une seule. Le reste, ce sera du bruit de
    fond. »<br><br>
    Il a raison, et vous le savez depuis des semaines sans avoir voulu vous l'avouer.
    Reste à décider quel héritage vaut la peine d'être payé avec les six mois, et le
    capital politique, qu'il vous reste.`,
 o:[
  {l:"Le pouvoir d'achat : un chèque à tous les ménages",
   r:`Six cents euros par foyer, sous condition de ressources, versés en trois fois avant
      l'été électoral.<br><br>
      Vingt et un milliards d'euros. C'est massif, c'est immédiatement perceptible sur un
      relevé de compte, et c'est parfaitement indéfendable devant la Cour des comptes —
      qui le dira dans un rapport que personne n'écoutera avant l'automne.<br><br>
      Les gens s'en souviendront longtemps : le chèque qui est arrivé cet été-là, juste
      quand les factures montaient. Le prochain budget s'en souviendra aussi, mais
      autrement : c'est lui qui devra trouver, sans le dire, comment rembourser un cadeau
      qu'il n'a pas fait et dont il ne récoltera aucune reconnaissance.`,
   e:{pib:-0.5,budget:-21,dette:9,soc:{pouvoir:26,pauvrete:14},
      groups:{salaries:16,retraites:14,jeunes:9,patrons:-8}},
   axe:{social:1}, pose:"legs_social"},
  {l:"L'avenir : investir massivement dans l'école et la recherche",
   r:`Seize milliards d'euros fléchés, sur sept ans, sur l'école primaire, l'université et
      les laboratoires de recherche fondamentale.<br><br>
      Aucun effet visible avant votre départ. Aucun. Les syndicats étudiants saluent du
      bout des lèvres, les retraités s'interrogent à voix haute sur « tout cet argent
      qu'on ne met pas ailleurs », et une chercheuse française récemment primée signe une
      tribune : « C'est le premier effort de cette ampleur depuis trente ans. On avait
      cessé d'y croire. »<br><br>
      C'est le genre de décision qui ne rapporte pas une voix — sauf, peut-être, dans dix
      ou quinze ans, à quelqu'un d'autre, qui n'aura même pas besoin de vous citer pour
      en récolter les fruits.`,
   e:{pib:1.4,budget:-16,soc:{educ:30},economie:8,cac:5,
      groups:{jeunes:17,patrons:7,salaries:6,retraites:-6}},
   pose:"legs_avenir"},
  {l:"Les comptes : un budget à l'équilibre, quoi qu'il en coûte",
   r:`Vingt milliards d'euros d'économies réparties sur tous les ministères. Un déficit
      ramené sous les trois pour cent du PIB pour la première fois en vingt ans.<br><br>
      Les agences de notation relèvent la perspective de la France dès la semaine suivante.
      Les taux auxquels le pays emprunte se détendent de quelques dixièmes.<br><br>
      Dans le pays, la mesure est parfaitement comprise — et elle est franchement
      impopulaire. On vous crédite du sérieux et on vous en veut, exactement dans le même
      mouvement, jusqu'au dernier jour du mandat. Vous partirez avec la réputation du
      président qui a tenu les comptes, et la certitude tranquille que cela ne s'est jamais
      transformé en affection.`,
   e:{pib:0.8,budget:20,dette:-12,economie:6,cac:9,soc:{pouvoir:-14,pauvrete:-10},
      groups:{patrons:16,salaries:-13,retraites:-11}},
   axe:{social:-2}, pose:"legs_comptes", rival:7},
  {l:"Le climat : graver la transition dans la loi avant de partir",
   r:`Une loi-cadre contraignante. Un budget carbone opposable devant le juge
      administratif. Des objectifs de réduction inscrits dans le droit, pas dans un
      discours de vœux.<br><br>
      C'est délibérément difficile à défaire — c'est même toute l'idée du texte. Trois
      fédérations industrielles saisissent le Conseil constitutionnel ; il valide
      l'essentiel des dispositions, n'en censure que deux.<br><br>
      Vous laissez derrière vous quelque chose que votre successeur ne pourra pas balayer
      d'un simple décret. Vous perdrez peut-être l'élection à cause de ça, à cause des
      emplois industriels qu'on vous accusera d'avoir sacrifiés. Mais dans trente ans,
      c'est probablement cette loi-là qu'on citera en premier quand on parlera de vous.`,
   e:{pib:-0.7,budget:-14,cli:{air:26,eau:14,foret:12,sols:10},economie:-5,
      groups:{jeunes:16,ruraux:-9,patrons:-9}},
   axe:{ecologie:2}, pose:"legs_climat"}
 ]},

/* ─────────── CHAPITRE VIII · LA CAMPAGNE ─────────── */
{id:"c8", ch:8, mois:44, ico:"🎙️", t:"Le débat",
 d:`Vingt heures cinquante. Dans huit minutes, vous serez assis en face de Julien
    Ferrand, sous les projecteurs d'un plateau glacé par la climatisation, et vingt
    millions de personnes regarderont.<br><br>
    La maquilleuse vient de finir son travail. Votre directrice de campagne tient une
    fiche qu'elle n'ose pas vous tendre : les trois questions auxquelles vous n'avez pas
    de bonne réponse. Vous les connaissez déjà par cœur. C'est pour ça que vous n'avez
    pas dormi la nuit dernière.<br><br>
    Un régisseur passe la tête par la porte de la loge : « Monsieur le Président, dans
    huit minutes. »<br><br>
    Vous ajustez votre veste, vous vérifiez le nœud de cravate dans le miroir. C'est votre
    dernier vrai choix de ce mandat — la manière dont vous entrez dans cette pièce, et ce
    que vous décidez d'y être pendant deux heures et demie : le comptable, le procureur,
    ou l'homme d'État.`,
 o:[
  {l:"Défendre votre bilan, point par point",
   r:`Deux heures quarante de chiffres, de dates, de courbes projetées sur l'écran du
      plateau. Vous êtes solide, documenté à l'excès, jamais pris en défaut sur un seul
      fait vérifiable.<br><br>
      Les fact-checkers, le lendemain matin, vous donnent raison sur onze points sur
      treize — un score écrasant, presque gênant pour votre adversaire.<br><br>
      Mais l'audience a décroché autour de la quarantième minute. Le pic d'écoute de la
      soirée était sur les passes d'armes, pas sur vos démonstrations chiffrées. On ne
      gagne pas un débat présidentiel en ayant raison plus longtemps que l'autre. On le
      gagne en un moment, une phrase, une image qui se grave — et vous n'en avez offert
      aucune.`,
   e:{groups:{salaries:5,retraites:6,patrons:5,ruraux:4,jeunes:3}},
   pose:"debat_bilan", final:true},
  {l:"Attaquer Ferrand sur ce qu'il cache",
   r:`Vous sortez le dossier à la cinquantième minute, préparé, calibré au mot près. Il
      pâlit sous le maquillage, se défend mal, bafouille sur une date. Le moment est
      spectaculaire, tout le monde le remarque en direct, les réseaux s'embrasent.<br><br>
      Les commentateurs, dans la nuit, parlent d'un « coup », d'un « uppercut au dernier
      round ».<br><br>
      Les téléspectateurs interrogés le lendemain, eux, emploient un autre mot, bien plus
      souvent : « petit ». Un président sortant qui déballe un dossier compromettant sur
      son adversaire, ça ne grandit pas celui qui déballe. Vous avez gagné l'échange de la
      cinquantième minute et perdu quelque chose de moins réparable.`,
   e:{social:-4,groups:{jeunes:-5,salaries:4,retraites:7,ruraux:5}},
   pose:"debat_attaque", rival:-14, final:true},
  {l:"Parler du pays, pas de vous ni de lui",
   r:`Vous refusez trois fois d'entrer dans les attaques personnelles — poliment, mais
      fermement, en le disant à voix haute. Vous ramenez chaque question sur le fond :
      l'école, l'hôpital, la dette, la place du pays dans les cinquante prochaines
      années.<br><br>
      Ferrand, qui avait préparé une soirée de combat rapproché, se retrouve à cogner dans
      du vide. Ses attaques restent sans réponse parce que vous refusez de jouer à ce
      jeu-là, et elles finissent par sonner creux à l'antenne.<br><br>
      Onze millions de personnes voient, pendant deux heures et demie, un homme qui parle
      du pays et un autre qui parle de son adversaire. Ça se retient, et ça se raconte le
      lendemain au bureau.`,
   e:{social:6,groups:{jeunes:9,salaries:7,ruraux:6,retraites:4,patrons:-3}},
   pose:"debat_hauteur", final:true}
 ]},

{id:"m15", ch:3, mois:15, ico:"🧯", t:"L'après",
 intro:[
  [()=>S.flags.passage_force, `Le texte est passé en force. Trois députés de votre majorité
    ont quitté le groupe dans la nuit, et l'un d'eux a rejoint Ferrand ce matin.`],
  [()=>S.flags.recul_majeur, `Vous avez retiré le texte. Vos adversaires appellent ça une
    victoire ; vos amis n'appellent ça rien du tout, et ils ne vous parlent plus.`],
  [()=>S.flags.accord_signe, `L'accord tient. Fragile, coûteux, mais il tient — et pour la
    première fois depuis des mois, personne ne défile.`]
 ],
 d:`La rue s'est vidée, mais quelque chose n'est pas revenu avec le calme. Les préfets
    emploient tous le même mot dans leurs notes de synthèse : « ressentiment ». Pas de la
    colère — de l'amertume, plus lente, plus durable.<br><br>
    Votre conseillère en communication pose une étude qualitative sur votre bureau. Elle a
    surligné en jaune une phrase qui est remontée, presque mot pour mot, dans huit groupes
    de discussion sur dix : « Il ne nous écoute que quand on casse quelque chose. »<br><br>
    Elle ne commente pas. Elle vous laisse lire, et elle attend. La question qu'elle ne
    pose pas à voix haute, c'est : qu'est-ce qu'on fait pour que les gens n'aient plus
    besoin de bloquer un dépôt de carburant pour être entendus ?`,
 o:[
  {l:"Créer une convention citoyenne permanente",
   r:`Cent cinquante citoyens tirés au sort, un mandat de deux ans, un vrai droit de
      saisine du Parlement — pas un gadget consultatif.<br><br>
      Les constitutionnalistes s'écharpent dans les tribunes, les partis ricanent, et vos
      propres conseillers vous préviennent que « ça peut vous échapper ».<br><br>
      Six mois plus tard, la convention rend un avis sur la fiscalité écologique. Il est
      mieux argumenté, mieux accepté et plus applicable que celui qu'avaient produit vos
      services. Vous ne l'admettrez jamais en public. Mais vous vous en servirez, et
      l'idée qu'un pouvoir puisse écouter sans qu'on casse quelque chose commencera,
      lentement, à faire son chemin.`,
   e:{budget:-8,social:11,groups:{salaries:9,jeunes:11,ruraux:8,patrons:-6}},
   axe:{social:1}, pose:"convention", rival:-8},
  {l:"Répondre par des résultats, pas par des dispositifs",
   r:`Pas de grand-messe, pas de commission, pas de convention. Trois mesures concrètes,
      ciblées sur les territoires qui ont bloqué, appliquées en six semaines.<br><br>
      C'est efficace et absolument invisible. Aucune caméra ne filme une prime transport
      qui arrive sur un compte en banque, ou une ligne de bus rétablie un lundi matin.<br><br>
      Un an plus tard, un institut mesurera que les Français concernés en ont bénéficié
      sans savoir d'où ça venait, ni qui l'avait décidé. C'est le sort ordinaire de ce
      qui marche : ça ne se voit pas, donc ça ne se crédite pas, donc on continue de
      penser que rien n'est fait.`,
   e:{economie:7,soc:{pouvoir:8},cac:4,groups:{patrons:8,salaries:5}},
   pose:"resultats"},
  {l:"Considérer que le conflit est derrière vous",
   r:`Vous passez à autre chose. L'agenda reprend, les déplacements internationaux
      reprennent, et le mot « crise » disparaît des éléments de langage. Officiellement,
      c'est réglé.<br><br>
      Ça ne l'est pas. Ça a juste changé de forme. Les préfets signalent, chaque semaine,
      des « regroupements informels » — un rond-point ici, une occupation de mairie là,
      sans mot d'ordre, sans porte-parole, sans personne à qui parler.<br><br>
      Ce qui ne se règle pas ne disparaît pas. Ça se sédimente. Ça durcit. Et un jour, sur
      un prétexte que personne n'aura vu venir, ça ressort — plus dur, et sans que vous
      ayez rien vu monter.`,
   e:{groups:{salaries:-8,jeunes:-9,ruraux:-6}},
   pose:"deni_social", rival:11}
 ]},

{id:"m16", ch:3, mois:16, ico:"🎤", t:"La phrase",
 intro:[
  [()=>S.flags.pm_ordre, `Votre Premier ministre a été nommé pour parler dur. Il a fini par
    parler trop.`],
  [()=>S.axes.social>=3, `Le ministre en cause était votre caution sociale. C'est ce qui
    rend la phrase impardonnable, et pas seulement embarrassante.`]
 ],
 d:`Un micro qu'on croyait coupé. Une salle qui se vide après un discours. Et quatorze mots,
    enregistrés par le téléphone d'un attaché parlementaire resté au fond : « De toute
    façon, ces gens-là ne votent pas, alors. »<br><br>
    À midi, la phrase a son mot-clé et son montage. À dix-huit heures, elle a sa
    manifestation, place de la République, spontanée. Le ministre jure qu'il parlait
    d'autre chose, d'un sondage, d'une statistique d'abstention — et personne ne l'écoute,
    parce que personne n'a jamais écouté un démenti.<br><br>
    Il attend dans l'antichambre depuis quarante minutes. Vous devez décider, avant le
    journal, si vous le gardez, si vous le faites s'excuser, ou si vous le sortez.`,
 o:[
  {l:"Le limoger avant vingt heures",
   r:`Il est démissionné à dix-neuf heures quarante, juste avant le journal. C'est net,
      c'est rapide, et ça coupe la séquence en une soirée : le lendemain, on parle déjà de
      son successeur.<br><br>
      Il ne vous le pardonnera pas. Il pensait que sa fidélité le protégeait, il découvre
      qu'elle ne pesait rien face à une soirée de télévision.<br><br>
      Dans dix-huit mois, quand un journaliste cherchera quelqu'un qui connaît l'intérieur
      de votre cabinet, les arbitrages, les colères, les petites lâchetés — il saura à qui
      téléphoner. Et l'ancien ministre, lui, décrochera.`,
   e:{social:7,groups:{salaries:9,jeunes:10,ruraux:7,patrons:-4}},
   pose:"limogeage", rival:-7},
  {l:"Lui faire présenter des excuses et le garder",
   r:`Il lit, face caméra, un texte de quarante secondes qu'il n'a pas écrit et auquel il
      ne croit pas. Ça s'entend. La sincérité ne se joue pas, et il joue mal.<br><br>
      La séquence, au lieu de mourir en une soirée, dure quatre jours de plus : les
      plateaux commentent les excuses, la crédibilité des excuses, le langage corporel
      pendant les excuses.<br><br>
      Vous avez gardé un ministre abîmé, qui n'a plus d'autorité sur son administration,
      et vous avez perdu quatre jours d'agenda présidentiel à parler de lui. Le pire des
      deux mondes : ni la fermeté du limogeage, ni le calme de l'oubli.`,
   e:{social:-4,groups:{salaries:-6,jeunes:-7,retraites:-3}},
   pose:"excuses", rival:5},
  {l:"Le défendre : « on ne gouverne pas avec des extraits »",
   r:`Vous prenez sa défense, longuement, dans une déclaration à la sortie du Conseil.
      Vous expliquez qu'une phrase sortie de son contexte n'est pas une politique, que le
      procès permanent tue le débat, que vous ne céderez pas à la « meute ».<br><br>
      C'est juridiquement défendable et politiquement suicidaire. La manifestation prévue
      pour le week-end rassemble trois fois plus de monde qu'annoncé.<br><br>
      Et le mot « mépris » entre officiellement dans le vocabulaire qu'on emploie pour
      parler de vous — plus seulement de lui. Ce mot-là, une fois qu'il est accolé à un
      président, ne se décolle plus jamais complètement.`,
   e:{sec:{interieure:4},social:-10,groups:{jeunes:-13,salaries:-10,patrons:9,retraites:5}},
   axe:{autorite:1}, pose:"defense_ministre", rival:12}
 ]},

{id:"m17", ch:3, mois:17, ico:"🤝", t:"La visite d'État",
 intro:[
  [()=>S.flags.refus_ue, `Vous vous êtes brouillé avec Bruxelles il y a six mois. Il vous
    faut des amis ailleurs — et c'est exactement ce que sait celui qui arrive mardi.`],
  [()=>S.dette>150, `Votre dette vous rend poli avec les gens qui ont de l'argent. Lui en a
    beaucoup, et il le sait.`]
 ],
 d:`Il atterrit mardi. Dans une main, quatre-vingts milliards d'euros de contrats — turbines,
    trains, réacteurs, une commande qui ferait vivre trois bassins d'emploi pendant dix
    ans. Dans l'autre, un bilan épouvantable : deux journalistes emprisonnés le mois
    dernier, une opposition qui a cessé d'exister, des élections dont personne ne connaît
    plus le résultat à l'avance.<br><br>
    Le Quai d'Orsay a préparé trois scénarios de visite. Votre ministre de l'Économie veut
    les contrats et le silence. Votre ministre des Affaires étrangères veut au minimum un
    communiqué commun mentionnant les droits humains, sinon la France « perd sa voix ».<br><br>
    Les deux sont dans votre bureau. Les deux vous regardent. Il faut choisir ce que la
    France est venue chercher.`,
 o:[
  {l:"Signer les contrats, se taire sur le reste",
   r:`Quatre-vingts milliards d'euros, signés en grande pompe sous les lambris, trente
      mille emplois annoncés sur dix ans. Pas un mot sur les deux journalistes, ni en
      public, ni au dîner d'État.<br><br>
      Trois ONG quittent la salle avant la conférence de presse commune. Le soir, une photo
      fait le tour du monde : vous, souriant, la main dans la main de votre invité, sur le
      perron.<br><br>
      Cette photo ressortira à chaque fois qu'on vous entendra prononcer les mots
      « valeurs », « principes » ou « exemplarité ». Elle est devenue, en une soirée, la
      légende de tout ce que vous direz sur le sujet pendant le reste du mandat.`,
   e:{pib:1.8,economie:12,cac:9,budget:7,social:-8,groups:{patrons:15,jeunes:-13,salaries:-5}},
   axe:{social:-1}, pose:"contrats_signes", rival:6},
  {l:"Signer, évoquer les prisonniers en privé",
   r:`Vous signez les contrats. Et au cours du tête-à-tête, sans témoin, sans note, vous
      glissez la question des deux journalistes. On vous répond, poliment, qu'il s'agit
      d'une « affaire intérieure » et que la France a « toute confiance dans la justice »
      de son partenaire.<br><br>
      L'un des deux journalistes sera libéré quatorze mois plus tard, sans explication, un
      matin de mai.<br><br>
      Vous ne saurez jamais si c'est grâce à vous. Personne ne le saura — et c'est
      exactement le défaut de cette méthode : elle ne coûte rien, elle ne se voit pas, et
      elle ne se raconte pas. Y compris quand elle marche.`,
   e:{pib:1,economie:7,cac:4,budget:3,groups:{patrons:8,jeunes:-4}},
   pose:"realpolitik"},
  {l:"Conditionner publiquement les contrats à des libérations",
   r:`Vous le dites devant les caméras, à la conférence de presse commune, en sa présence :
      pas de contrats tant que les deux journalistes sont en cellule. La délégation écourte
      la visite de vingt-quatre heures et repart sans dîner.<br><br>
      Les contrats partent, dans les mois qui suivent, chez un concurrent européen qui n'a
      pas eu vos scrupules. Trois mille emplois qui n'existeront pas, un patronat furieux,
      un maire de votre camp qui parle de « posture ».<br><br>
      Et une tribune, signée par dix-huit intellectuels et deux prix Nobel, qui vous
      remercie « d'avoir rappelé qu'un pays n'est pas qu'un carnet de commandes ». Vous
      avez choisi votre camp. Il ne se paie pas en emplois.`,
   e:{pib:-0.9,economie:-6,cac:-7,social:10,groups:{jeunes:14,salaries:7,patrons:-14}},
   pose:"conditionnalite", rival:-9}
 ]},

{id:"m18", ch:4, mois:18, ico:"📊", t:"La Cour des comptes",
 intro:[
  [()=>S.dette>150, `Le rapport était attendu. Ce qui ne l'était pas, c'est le ton : la
    Cour n'alerte plus, elle constate.`],
  [()=>S.flags.franchise, `Vous aviez dit la vérité sur les comptes il y a un an. Le
    rapport le rappelle, et ça vous épargne une partie de la volée.`]
 ],
 d:`Le rapport annuel fait quatre cents pages. Une seule fait la une : celle où le Premier
    président écrit, noir sur blanc, que « la trajectoire actuelle ne permet aucun retour à
    l'équilibre avant la fin de la décennie ». C'est-à-dire : jamais, à votre échelle.<br><br>
    Il vous reçoit en fin de journée, courtois, glacial, dans un bureau qui sent le vieux
    cuir. « Nous ne faisons pas de politique, monsieur le Président. Nous faisons de
    l'arithmétique. Et l'arithmétique, en ce moment, ne vous est pas favorable. »<br><br>
    Il vous laisse une note de huit pages sur le bureau, trois options soulignées. Un plan
    d'économies brutal, un effort étalé et indolore, ou l'assomption pure et simple de la
    dette. Le pays vous jugera sur celle que vous choisirez, et la Cour aussi.`,
 o:[
  {l:"Annoncer un plan d'économies de vingt milliards",
   r:`Vingt milliards d'euros, dont sept sur la santé et quatre sur les collectivités. Le
      plan est présenté un mercredi matin, en quarante minutes, avec des tableaux.<br><br>
      Les marchés applaudissent : le spread se resserre de douze points dans la journée.
      La Cour publie un communiqué favorable, ce qui n'arrive presque jamais.<br><br>
      Et dans la semaine, les fédérations hospitalières publient une carte de France :
      service par service, ville par ville, tous les établissements menacés par les coupes.
      Elle est lisible d'un coup d'œil. Elle circulera sur les pare-brise, dans les
      tracts, sur les réseaux, jusqu'à l'élection. Chaque fermeture aura votre nom dessus.`,
   e:{budget:16,dette:-8,economie:4,soc:{pouvoir:-14,sante:-10,pauvrete:-8},
      groups:{patrons:14,salaries:-13,retraites:-11}},
   axe:{social:-2}, pose:"plan_economies", rival:10},
  {l:"Étaler l'effort sur cinq ans, sans coupe brutale",
   r:`Un milliard et demi d'économies par an, réparti sur tous les ministères, sans qu'aucun
      poste ne saute vraiment. Indolore. Personne ne descend dans la rue pour un milliard
      et demi dilué.<br><br>
      La Cour des comptes publie un communiqué de deux paragraphes, sec : l'effort est
      « manifestement insuffisant au regard des enjeux ». Elle a raison, et vous le savez
      en lisant le communiqué.<br><br>
      Mais vous avez acheté une année entière de calme social, une année sans carte de
      France des services fermés, une année où le mot « austérité » ne vous colle pas à la
      peau. À deux ans d'une élection, une année, ça vaut cher.`,
   e:{budget:6,dette:-2,groups:{patrons:5,salaries:-3}},
   pose:"effort_etale"},
  {l:"Assumer la dette : « investir maintenant, payer plus tard »",
   r:`Vous montez au créneau pour défendre frontalement la dette publique — ce qu'aucun de
      vos prédécesseurs n'avait osé faire aussi directement. « On ne construit pas un pays
      en équilibrant chaque ligne chaque année. »<br><br>
      Deux économistes vous soutiennent publiquement. Quinze vous éreintent. Le taux
      d'emprunt de la France à dix ans monte de trente points de base dans la semaine.<br><br>
      Ce n'est pas la catastrophe qu'on vous avait promise — les marchés ne vous ferment
      pas la porte. Ce n'est pas rien non plus : chaque point de taux, ce sont des
      milliards d'intérêts en plus, et votre successeur les paiera en vous citant.`,
   e:{dette:7,economie:6,soc:{pouvoir:8},cac:-5,
      groups:{salaries:8,jeunes:9,patrons:-11}},
   axe:{social:1}, pose:"dette_assumee", rival:5}
 ]},

{id:"m19", ch:4, mois:19, ico:"📰", t:"Le premier papier",
 intro:[
  [()=>S.flags.silence||S.flags.evitement, `Camille Reyes a commencé par ce que vous
    n'avez pas dit. C'est toujours par là qu'on commence.`],
  [()=>S.flags.franchise, `Elle vous a prévenu par courriel, la veille, à vingt-trois
    heures. Elle n'était pas obligée. Vous le notez.`],
  [()=>S.flags.contrats_signes, `Le papier s'ouvre sur une photo de vous serrant une main
    qu'il aurait mieux valu ne pas serrer.`]
 ],
 d:`Quatre pages, signées Camille Reyes. Pas d'illégalité, pas de scandale, pas de valise
    de billets : une mécanique. Comment les arbitrages se prennent chez vous. Qui entre
    dans le bureau. Qui n'y entre jamais. Qui parle en dernier, juste avant que vous
    décidiez.<br><br>
    Le portrait n'est pas malveillant, et c'est précisément ce qui le rend redoutable. On
    y voit un homme entouré de six personnes qui pensent la même chose que lui, qui se
    connaissent depuis vingt ans, et qui appellent ça « l'équipe ».<br><br>
    Ferrand a partagé le lien à sept heures ce matin, sans un commentaire — le silence
    valant approbation. Il faut décider comment on répond à un article qui ne vous accuse
    de rien, sinon d'être enfermé.`,
 o:[
  {l:"Ouvrir le bureau : nommer trois conseillers venus d'ailleurs",
   r:`Une directrice d'hôpital de banlieue. Un maire d'un village de quatre cents habitants.
      Une responsable syndicale de la métallurgie. Ils arrivent en février, et les anciens
      les regardent de travers pendant six bonnes semaines — la nouvelle venue met trop de
      sucre, l'autre ne connaît pas les codes.<br><br>
      Puis quelque chose se déplace dans les réunions. Quelqu'un dit « ça ne marchera pas
      sur le terrain, je le sais, j'y étais lundi » — et pour la première fois, on
      s'arrête, et on l'écoute.<br><br>
      Camille Reyes écrira, un an plus tard, que c'est la seule chose concrète que son
      article aura produite. Elle l'écrira sans ironie.`,
   e:{social:8,economie:4,groups:{salaries:7,jeunes:8,ruraux:6}},
   pose:"ouverture_cabinet", rival:-8},
  {l:"Accorder un long entretien à Camille Reyes",
   r:`Trois heures. Aucun conseiller dans la pièce, un magnétophone posé sur la table basse
      entre vous deux, et des questions auxquelles vous n'aviez pas de réponse préparée.<br><br>
      Elle publie quatorze mille signes, in extenso. Ce n'est ni complaisant ni assassin :
      c'est précis, et c'est pire. Vous y apparaissez plus seul que vous ne pensiez l'être,
      plus fatigué aussi.<br><br>
      Beaucoup de lecteurs vous trouveront, pour la première fois, humain — un homme, pas
      une fonction. Vos conseillers, eux, sont livides pendant une semaine : un président
      qui doute à voix haute, dans un journal, ça ne se fait pas. Sauf que ça vient de se
      faire, et que ça vous a rendu service.`,
   e:{social:6,groups:{jeunes:9,salaries:6,patrons:-3}},
   pose:"entretien_reyes", rival:-5},
  {l:"Faire savoir au journal que l'Élysée n'aime pas cet exercice",
   r:`Un coup de téléphone. Le secrétaire général de l'Élysée au directeur de la
      publication, un dimanche soir. Rien d'illégal, rien d'écrit, rien qu'un ton — celui
      qu'on prend pour rappeler à quelqu'un qu'on connaît son numéro.<br><br>
      Le directeur en parle à sa rédaction dès le lendemain matin, parce que c'est ce qu'on
      fait dans une rédaction qui se respecte.<br><br>
      Et Camille Reyes ouvre un fichier, y note la date de l'appel, l'heure, le nom de
      celui qui a appelé, ce qui a été dit. Elle ne le publiera pas tout de suite. Elle
      attendra le moment où ça fera le plus mal. Elle en a, du temps.`,
   e:{social:-9,groups:{jeunes:-12,salaries:-8}},
   axe:{autorite:1}, pose:"pression_presse", rival:13}
 ]},

{id:"m21", ch:4, mois:21, ico:"🗳️", t:"Les municipales",
 intro:[
  [()=>S.rival>=50, `Le mouvement de Ferrand présente des listes dans deux cents villes.
    Il y a deux ans, il n'avait même pas de parti.`],
  [()=>popularite()<38, `Vos candidats ont pris l'habitude de ne pas mettre votre photo
    sur leurs affiches. Cette fois, certains ont retiré jusqu'à l'étiquette.`]
 ],
 d:`Vingt heures, un dimanche. Les estimations tombent sur les écrans, et votre directeur
    de campagne ne dit rien pendant huit secondes — ce qui, dans ce métier, est une
    éternité.<br><br>
    Vous perdez onze grandes villes, dont trois que vous teniez depuis vingt ans. Le
    mouvement de Ferrand en gagne quatre, dont deux qu'on croyait imprenables, dans des
    fiefs qui n'avaient jamais basculé.<br><br>
    « Ce n'est pas une élection nationale », répètent les commentateurs, et ils ont
    raison sur le papier — et tout le monde, y compris eux, sait que c'est faux. Il faut
    parler avant vingt-deux heures. Reconnaître, relativiser, ou durcir.`,
 o:[
  {l:"Reconnaître la défaite et annoncer un changement de cap",
   r:`Vingt et une heures dix. « Les Français m'ont adressé un message, ce soir, et je l'ai
      reçu. » Vous annoncez trois inflexions concrètes, dont une qui contredit ouvertement
      votre programme de campagne.<br><br>
      C'est le genre de soirée où l'on perd, et où l'on regagne un peu — pas assez, mais un
      peu. On vous trouve « lucide », mot rare pour un soir de claque.<br><br>
      Julien Ferrand, qui avait préparé un discours de triomphe pour la même heure, doit le
      réécrire pendant que vous parlez encore. Le sien tombera à plat : difficile de
      célébrer sa victoire face à un adversaire qui vient de s'incliner proprement.`,
   e:{social:9,groups:{salaries:8,jeunes:7,ruraux:9,retraites:5}},
   pose:"lecon_tiree", rival:-10},
  {l:"Relativiser : « un scrutin local, des enjeux locaux »",
   r:`Vous employez, mot pour mot, la formule que tous vos prédécesseurs ont employée le
      soir d'une défaite municipale.<br><br>
      Elle n'a jamais marché pour aucun d'eux. Elle ne marche pas pour vous. Le lendemain,
      deux de vos ministres, interrogés dans les matinales, ne la reprennent pas — ils
      parlent d'« avertissement sévère », ce qui est une manière polie de prendre leurs
      distances.<br><br>
      C'est le premier signe visible, public, que votre propre camp a commencé à préparer
      l'après. Pas contre vous, pas encore. Mais sans vous.`,
   e:{groups:{salaries:-7,ruraux:-9,jeunes:-6}},
   pose:"relativisation", rival:9},
  {l:"Durcir : accélérer les réformes pendant qu'il en est temps",
   r:`Trois textes engagés en six semaines. La logique est brutale et assumée : puisqu'on
      est impopulaire de toute façon, autant l'être pour quelque chose qui restera.<br><br>
      Le patronat approuve. Les marchés aussi. Les éditorialistes économiques parlent de
      « fin de mandat courageuse ».<br><br>
      Votre majorité, elle, découvre qu'on lui demande de voter des textes difficiles juste
      après avoir perdu onze villes et pris la porte dans ses circonscriptions. Quatre
      députés quittent le groupe avant l'été. Vous gouvernez désormais avec une marge que
      vous comptez sur les doigts d'une main.`,
   e:{economie:9,cac:6,social:-8,groups:{patrons:13,salaries:-9,jeunes:-6}},
   axe:{autorite:1}, pose:"acceleration", rival:7}
 ]},

{id:"m22", ch:4, mois:22, ico:"🔌", t:"La panne",
 intro:[
  [()=>S.projetsFinis.includes("nuc"), `Vos réacteurs sont entrés en service l'an dernier.
    Ce sont eux qui tiennent le réseau ce soir. Personne ne le dira à la télévision.`],
  [()=>S.flags.budget_ecolo, `Vous aviez sanctuarisé la transition écologique. On va vous
    demander si la transition, c'est ça : des bougies dans les couloirs d'hôpital.`]
 ],
 d:`Dix-neuf heures dix, un mardi de février, moins huit degrés sur le pays. Trois régions
    basculent dans le noir en trente secondes — un défaut de fréquence, un délestage
    automatique qui part en cascade.<br><br>
    Onze millions de foyers sans électricité. Deux cents trains arrêtés en pleine voie, des
    passagers dans le froid. Des blocs opératoires qui basculent sur groupe électrogène en
    pleine intervention.<br><br>
    Le réseau sera rétabli dans la nuit, RTE vous le garantit. Ce qui ne se rétablira pas
    tout seul, c'est l'idée qui vient de s'installer dans onze millions de têtes : que ça
    peut recommencer. RTE demande des arbitrages pour l'hiver prochain — sécuriser à prix
    d'or, rationner, ou revenir aux fossiles.`,
 o:[
  {l:"Lancer un plan de sécurisation du réseau",
   r:`Douze milliards d'euros sur six ans. Lignes enterrées, postes doublés, capacités de
      stockage, interconnexions avec les voisins.<br><br>
      C'est le type même de l'investissement dont personne ne parle jamais — sauf le jour
      où il manque. RTE publie une note technique enthousiaste que trois personnes liront
      en entier.<br><br>
      L'hiver suivant se passe sans le moindre incident. Le pays a oublié la panne. Personne
      ne fera le lien entre l'hiver tranquille et les douze milliards signés deux ans plus
      tôt. C'est ça, gouverner sur le long terme : payer maintenant pour un problème que
      les gens ne verront jamais, parce que vous l'aurez empêché.`,
   e:{pib:1.1,budget:-17,economie:7,sec:{defense:5},groups:{patrons:9,salaries:7,ruraux:8}},
   pose:"plan_reseau"},
  {l:"Imposer la sobriété : rationner les gros consommateurs",
   r:`Quotas contraignants pour les cinq cents plus gros consommateurs industriels du pays,
      effectifs sous soixante jours, sanctions à la clé.<br><br>
      Deux sites annoncent des arrêts temporaires. Un troisième menace de délocaliser et le
      fait savoir dans la presse. Le patronat parle de « décision idéologique ».<br><br>
      Mais le réseau tient tout l'hiver sans une coupure. Et les émissions du pays baissent,
      pour la première fois, plus vite que la trajectoire prévue — un effet secondaire que
      personne n'avait mis en avant. Le patronat ne vous le pardonnera pas. Les
      climatologues, si.`,
   e:{pib:-1.1,cli:{air:16},economie:-6,cac:-7,groups:{jeunes:10,patrons:-13,salaries:-4}},
   axe:{ecologie:2}, pose:"sobriete_imposee"},
  {l:"Relancer les énergies fossiles le temps de tenir",
   r:`Deux centrales à charbon redémarrées en urgence. Une dérogation de vingt-quatre mois,
      signée un vendredi soir, publiée au Journal officiel le samedi pour limiter les
      commentaires.<br><br>
      Le réseau est sécurisé dans la semaine. Les factures se stabilisent. Le mot
      « provisoire » figure onze fois dans le décret — un record.<br><br>
      Les émissions du secteur électrique remontent de quatorze pour cent en un an. C'est
      une courbe simple, en hausse, facile à projeter sur un écran. Vos adversaires
      l'afficheront à chaque meeting, avec une seule légende : « la transition selon
      lui ».`,
   e:{pib:1.3,cli:{air:-24,eau:-8},economie:8,cac:6,budget:-6,
      groups:{patrons:11,ruraux:7,jeunes:-15}},
   axe:{ecologie:-2}, pose:"retour_fossile", rival:5}
 ]},

{id:"m23", ch:4, mois:23, ico:"⚓", t:"Le contrat du siècle",
 intro:[
  [()=>valeur("securite")<45, `Nos armées manquent de tout depuis deux ans. Ce contrat
    pourrait tout changer — ou finir de tout épuiser.`],
  [()=>S.flags.budget_defense, `Vous avez sanctuarisé la défense. L'industrie s'en
    souvient, et elle vient chercher la suite.`]
 ],
 d:`Un pays allié veut douze bâtiments de guerre. Trente mille emplois pendant quinze ans.
    Trois chantiers navals qui revivent, à Saint-Nazaire, à Lorient, à Cherbourg. Et une
    clause, en petits caractères : la maintenance sera assurée sur place, chez l'acheteur,
    pas chez nous — l'emploi durable partirait avec les bateaux.<br><br>
    Les syndicats de Saint-Nazaire ont déjà sorti les banderoles, et pour une fois elles
    sont dans votre sens : « Signez. »<br><br>
    Le Quai d'Orsay signale, dans une note de deux lignes, que l'acheteur est en guerre
    depuis quatorze mois sur sa frontière est. La délégation atterrit jeudi. Il faut
    décider si on signe, si on renégocie la clause, ou si on refuse pendant que ça tire.`,
 o:[
  {l:"Signer : trente mille emplois valent bien un silence",
   r:`Signature à Saint-Nazaire, sous les portiques de la grande cale, devant deux mille
      salariés qui applaudissent debout, casque à la main.<br><br>
      C'est une des rares fois de tout votre mandat où l'on vous acclame vraiment, sans
      arrière-pensée, sans que ça retombe le lendemain. Vous vous en souviendrez.<br><br>
      Une ONG publiera, trois mois plus tard, un rapport sur l'usage réel des premiers
      bâtiments livrés, sur la frontière est. Vous l'aurez lu avant sa sortie, dans une
      note du renseignement. Vous n'aurez rien pu en dire. Les trente mille emplois, eux,
      seront bien là.`,
   e:{pib:2,economie:13,cac:10,budget:9,sec:{defense:8},social:-7,
      groups:{patrons:15,salaries:11,jeunes:-12}},
   pose:"contrat_naval", rival:4},
  {l:"Signer, mais rapatrier la maintenance en France",
   r:`Quatre semaines de renégociation, ligne par ligne, pour arracher une clause de
      maintenance de quinze ans exécutée sur le sol français.<br><br>
      Le contrat est plus petit d'un cinquième. Il est aussi bien meilleur : ce n'est plus
      une commande ponctuelle, c'est de l'activité garantie sur quinze ans, des emplois
      qu'aucune conjoncture ne menace.<br><br>
      Les syndicats, qui s'attendaient à être sacrifiés sur l'autel de la signature rapide,
      saluent publiquement votre ténacité. Un dirigeant syndical qui ne vous a jamais rien
      concédé lâche : « Là, il a bien travaillé. » C'est assez rare pour que vous le
      gardiez.`,
   e:{pib:1.3,economie:8,cac:5,budget:4,sec:{defense:6},groups:{patrons:9,salaries:9}},
   pose:"contrat_negocie", rival:-4},
  {l:"Refuser tant que le conflit dure",
   r:`Vous refusez, clairement, en le disant : la France ne vendra pas d'armes à un pays
      engagé dans une guerre offensive, quel que soit le nombre d'emplois en jeu.<br><br>
      À Saint-Nazaire, deux mille personnes qui vous applaudissaient la semaine dernière
      apprennent par la radio qu'il n'y aura pas de commande. Le maire, pourtant de votre
      camp, déclare aux caméras qu'il « ne comprend pas ce choix ».<br><br>
      Vous avez eu raison sur le principe. Personne, à Saint-Nazaire, ne vous en
      félicitera — et vous n'êtes pas sûr d'avoir le droit de leur en vouloir.`,
   e:{pib:-1,economie:-9,cac:-8,social:9,groups:{jeunes:12,salaries:-9,patrons:-13}},
   pose:"contrat_refuse", rival:6}
 ]},

{id:"m24", ch:4, mois:24, ico:"📺", t:"Le document",
 intro:[
  [()=>S.flags.silence||S.flags.enterrement, `Vous avez enterré au moins un dossier depuis
    deux ans. Vous ne savez pas lequel elle a.`],
  [()=>S.flags.transparence||S.flags.franchise, `Vous avez pris l'habitude de tout
    publier. C'est votre seule assurance ce soir.`]
 ],
 d:`Interview de mi-mandat. Deux heures en direct, deux journalistes en face, six millions
    de personnes devant leur écran.<br><br>
    À la quarante-troisième minute, l'une des deux ouvre une chemise cartonnée et pose une
    feuille sur la table, côté caméra, bien à plat, pour que le cadrage la prenne. C'est
    une note interne. Votre paraphe est en bas à droite. Vous la reconnaissez avant même
    d'avoir fini de la lire : c'est celle où l'on vous alertait, il y a dix-huit mois, sur
    exactement ce qui s'est produit depuis — un scénario, une date, une recommandation
    que vous n'avez pas suivie.<br><br>
    Le direct ne s'arrête pas. La caméra est sur votre visage. Vous avez peut-être trois
    secondes avant que le silence, lui, devienne la réponse.`,
 o:[
  {l:"« Oui. Je l'ai lue. Et je n'en ai pas assez tenu compte. »",
   r:`Vous ne cherchez pas la sortie de secours. Vous reconnaissez la note, sa date, sa
      recommandation, et l'erreur — la vôtre.<br><br>
      Il y a un silence de deux secondes sur le plateau. En direct, deux secondes, c'est
      un gouffre. Les deux journalistes, qui avaient préparé trois relances, n'en utilisent
      aucune.<br><br>
      La séquence sera vue quarante millions de fois en trois jours, découpée, commentée,
      analysée image par image. Et la plupart des commentaires diront la même chose, avec
      les mêmes mots : « Au moins, il l'a dit. » Dans un pays qui ne croit plus personne,
      c'est une phrase qui vaut cher.`,
   e:{social:12,groups:{salaries:11,jeunes:12,ruraux:8,retraites:6,patrons:-4}},
   pose:"mi_mandat_humilite", rival:-14},
  {l:"Contester le contexte, document en main, point par point",
   r:`Vous prenez la note, vous la reprenez ligne par ligne, à l'écran, et vous démontrez
      qu'elle ne disait pas tout à fait ce qu'on lui fait dire — que la recommandation
      était plus nuancée, que le contexte était différent.<br><br>
      Vous avez, techniquement, raison sur plusieurs points.<br><br>
      Mais la démonstration dure onze minutes. Et onze minutes de justification en direct,
      document en main, la voix qui monte un peu — ça ressemble toujours à un aveu, même
      quand ça n'en est pas un. Le lendemain, personne ne retient vos arguments. On retient
      que vous vous êtes défendu longtemps.`,
   e:{economie:3,groups:{patrons:7,retraites:5,jeunes:-6,salaries:-4}},
   pose:"mi_mandat_bilan", rival:5},
  {l:"Demander comment une note classifiée est arrivée sur ce plateau",
   r:`Vous posez la question de la fuite. En direct. Avec le ton qu'il faut pour qu'elle
      sonne moins comme une interrogation que comme une menace.<br><br>
      La journaliste répond calmement qu'elle protège ses sources, et que c'est son
      métier.<br><br>
      Le lendemain, le régulateur de l'audiovisuel reçoit huit cents signalements. La
      Société des journalistes de la chaîne publie un communiqué de soutien à sa
      consœur. Et vous, vous avez réussi une chose : déplacer le sujet. Le problème n'est
      plus la note que vous n'avez pas suivie. Le problème, c'est vous, qui menacez une
      journaliste en direct.`,
   e:{sec:{interieure:5},social:-11,
      groups:{jeunes:-14,salaries:-10,retraites:6}},
   axe:{autorite:2}, pose:"mi_mandat_menace", rival:12}
 ]},

{id:"m25", ch:5, mois:25, ico:"🩺", t:"Le rapport qu'on vous cache",
 intro:[
  [()=>talonAchille()==="social", `Le domaine dont on vient vous parler est aussi celui que
    vous avez le moins financé. Le rapport le dit à sa façon : poliment.`],
  [()=>S.flags.plan_economies, `Votre plan d'économies est passé par là. On vous montre
    aujourd'hui ce qu'il a coûté ailleurs.`]
 ],
 d:`Une note de l'inspection générale, quarante pages, restée trois mois dans un tiroir
    avant de remonter jusqu'à votre bureau. Elle décrit, service par service, chiffres à
    l'appui, un système qui ne tient plus que parce que des gens s'épuisent — et qui
    cédera, mécaniquement, le jour où ces gens s'arrêteront.<br><br>
    L'inspectrice qui l'a signée a demandé à vous voir en personne. Ce n'est pas dans les
    usages : une inspectrice ne monte pas à l'Élysée. Elle a insisté, deux fois, et fini
    par obtenir un créneau de vingt minutes.<br><br>
    Elle attend dans le couloir avec son classeur sur les genoux. La question, une fois
    qu'elle sera repartie, sera de savoir ce que vous faites de ce qu'elle vous aura dit —
    et si le pays le sait, ou pas.`,
 o:[
  {l:"La recevoir et publier le rapport intégralement",
   r:`Les quarante pages en ligne dès le lendemain, sans une ligne caviardée, la note de
      synthèse en tête, la signature de l'inspectrice en bas.<br><br>
      La presse s'en empare pendant une semaine entière, et c'est douloureux : chaque
      chiffre devient un titre, chaque service en tension devient un reportage.<br><br>
      Mais l'inspectrice témoigne, à visage découvert, qu'on ne lui a rien demandé de
      couper, rien enjolivé, rien retardé. Dans un pays qui soupçonne tout le monde de
      tout cacher, ce détail-là — une fonctionnaire qui dit « on m'a laissée écrire ce que
      je voulais » — pèse plus lourd qu'un plan de communication à trois millions.`,
   e:{social:9,soc:{sante:12},budget:-6,groups:{salaries:10,jeunes:7,retraites:8}},
   pose:"franchise", rival:-8},
  {l:"La recevoir, agir, mais garder le rapport confidentiel",
   r:`Vous agissez, vite et sérieusement : crédits débloqués en urgence, deux directions
      d'administration réorganisées, un moratoire immédiat sur les fermetures de service.
      Sur le fond, c'est probablement la bonne réponse.<br><br>
      Le rapport, lui, reste au coffre. Estampillé « diffusion restreinte ».<br><br>
      Il fuitera dans dix-huit mois, à un moment que vous n'aurez pas choisi, probablement
      le pire. Et à ce moment-là, on ne retiendra ni les crédits, ni les réorganisations,
      ni le moratoire. On retiendra une seule chose : qu'il était au coffre, et que vous
      l'y aviez mis.`,
   e:{soc:{sante:14},budget:-9,groups:{salaries:6,retraites:6}},
   pose:"action_discrete"},
  {l:"Renvoyer le dossier au ministère concerné",
   r:`Le dossier redescend d'un étage, accompagné d'une note de cabinet demandant « un plan
      d'action sous deux mois ». Le ministère accuse réception et promet une « feuille de
      route ».<br><br>
      La feuille de route ne verra jamais le jour. Les crédits ne bougeront pas. Le système
      continuera de tenir sur les épaules de ceux qui s'épuisent, jusqu'à ce que ça
      craque.<br><br>
      L'inspectrice demande sa mutation trois mois plus tard, sans faire de bruit. Elle
      n'en parlera à personne — sauf une fois, des années après, à une journaliste qui
      travaillera sur la manière dont l'État enterre ce qui le dérange.`,
   e:{soc:{sante:-8},social:-5,groups:{salaries:-7,retraites:-6}},
   pose:"enterrement", rival:8}
 ]},

{id:"m27", ch:5, mois:27, ico:"🧱", t:"Le lendemain",
 intro:[
  [()=>S.flags.etat_urgence, `L'état d'urgence est en vigueur depuis un mois. Les préfets
    en redemandent, le Conseil d'État s'en inquiète, et vous devez trancher.`],
  [()=>S.flags.sauvetage, `Vous avez garanti les dépôts. Le système a tenu. La facture,
    elle, arrive maintenant.`],
  [()=>S.flags.rationnement, `Vous avez rationné l'eau agricole. Trois préfectures sont
    encore bloquées par des tracteurs.`],
  [()=>S.flags.requisition, `Vous avez réquisitionné des soignants. Quarante d'entre eux
    ont porté plainte, et le tribunal a accepté d'examiner l'affaire.`]
 ],
 d:`La crise aiguë est passée. Reste ce qu'elle a laissé derrière elle : des mesures
    d'exception prises en quarante-huit heures, dans l'urgence, sans débat — et qui, si
    personne ne décide activement de les arrêter, deviendront permanentes par la seule
    force de l'inertie.<br><br>
    Le secrétaire général pose sur votre bureau une liste de dix-sept dispositifs
    d'exception à reconduire ou à laisser expirer. Il connaît le calcul par cœur :
    « Reconduire, ça ne se voit pas. Laisser expirer, ça se voit tout de suite — et
    surtout le jour où quelque chose tourne mal, et où l'on dira que vous aviez désarmé. »<br><br>
    L'échéance légale est vendredi minuit.`,
 o:[
  {l:"Tout laisser expirer et revenir au droit commun",
   r:`Les dix-sept dispositifs tombent à minuit, vendredi. Aucune prolongation, aucune
      exception, aucun régime transitoire.<br><br>
      Le Conseil d'État publie un communiqué d'une chaleur inhabituelle — pour cette
      institution, c'est presque de l'enthousiasme. Deux préfets, à l'inverse, écrivent au
      ministre pour dire leur inquiétude, et l'un d'eux fait fuiter sa lettre.<br><br>
      S'il ne se passe rien pendant six mois, personne ne s'en souviendra. S'il se passe
      quoi que ce soit — un attentat, une émeute, un incident — cette décision sera la
