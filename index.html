   r:`Vous refusez trois fois d'entrer dans les attaques personnelles. Vous parlez de l'école, de l'hôpital, des cinquante prochaines années.<br><br>Ferrand, qui avait préparé une soirée de combat, se retrouve à cogner dans du vide. Onze millions de personnes voient un homme qui parle du pays et un autre qui parle de son adversaire.`,
   e:{social:6,groups:{jeunes:9,salaries:7,ruraux:6,retraites:4,patrons:-3}},
   pose:"debat_hauteur", final:true}
 ]},

{id:"m15", ch:3, mois:15, ico:"🧯", t:"L'après",
 intro:[
  [()=>S.flags.passage_force, `Le texte est passé. Trois députés de votre majorité ont
    quitté le groupe dans la nuit, et l'un d'eux a rejoint Ferrand ce matin.`],
  [()=>S.flags.recul_majeur, `Vous avez retiré le texte. Vos adversaires appellent ça une
    victoire ; vos amis n'appellent ça rien du tout, ils ne vous parlent plus.`],
  [()=>S.flags.accord_signe, `L'accord tient. Fragile, coûteux, mais il tient — et pour la
    première fois depuis des mois, personne ne défile.`]
 ],
 d:`La rue s'est vidée, mais quelque chose n'est pas revenu. Les préfets emploient tous le
    même mot dans leurs notes : « ressentiment ».<br><br>
    Votre conseillère en communication pose une étude qualitative sur la table. Elle a
    surligné une phrase revenue dans huit groupes sur dix : « Il ne nous écoute que
    quand on casse quelque chose. »<br><br>
    Elle ne dit rien de plus. Elle attend.`,
 o:[
  {l:"Créer une convention citoyenne permanente",
   r:`Cent cinquante citoyens tirés au sort, un mandat de deux ans, un droit de saisine du Parlement.<br><br>Les constitutionnalistes s'écharpent, les partis ricanent, et six mois plus tard la convention rend un avis sur la fiscalité qui est meilleur que celui de vos services. Vous ne l'admettrez pas publiquement.`,
   e:{budget:-8,social:11,groups:{salaries:9,jeunes:11,ruraux:8,patrons:-6}},
   axe:{social:1}, pose:"convention", rival:-8},
  {l:"Répondre par des résultats, pas par des dispositifs",
   r:`Pas de grand-messe, pas de commission : trois mesures appliquées en six semaines.<br><br>C'est efficace et parfaitement invisible. Un an plus tard, un institut mesurera que les Français concernés en ont bénéficié sans savoir d'où ça venait. C'est le sort ordinaire de ce qui marche.`,
   e:{economie:7,soc:{pouvoir:8},cac:4,groups:{patrons:8,salaries:5}},
   pose:"resultats"},
  {l:"Considérer que le conflit est derrière vous",
   r:`Vous passez à autre chose. Officiellement, la crise est close.<br><br>Elle ne l'est pas : elle a juste changé de forme. Les préfets signalent des « regroupements informels » toutes les semaines, sans mot d'ordre et sans interlocuteur. Ce qui ne se règle pas ne disparaît pas, ça se sédimente.`,
   e:{groups:{salaries:-8,jeunes:-9,ruraux:-6}},
   pose:"deni_social", rival:11}
 ]},

{id:"m16", ch:3, mois:16, ico:"🎤", t:"La phrase",
 intro:[
  [()=>S.flags.pm_ordre, `Votre Premier ministre a été nommé pour parler dur. Il a fini par
    parler trop.`],
  [()=>S.axes.social>=3, `Le ministre en question était votre caution sociale. C'est ce qui
    rend la phrase impardonnable.`]
 ],
 d:`Un micro qu'on croyait coupé, une salle qui se vide, et quatorze mots enregistrés par un
    téléphone : « De toute façon, ces gens-là ne votent pas, alors. »<br><br>
    À midi, la phrase a son mot-clé. À dix-huit heures, elle a sa manifestation. Le ministre
    jure qu'il parlait d'autre chose, et personne ne l'écoute : personne n'a jamais écouté
    un démenti.<br><br>
    Il attend dans l'antichambre depuis quarante minutes.`,
 o:[
  {l:"Le limoger avant vingt heures",
   r:`Il est démissionné à dix-neuf heures quarante, avant le journal. C'est net, c'est rapide, et ça coupe la séquence.<br><br>Il ne vous le pardonnera pas. Dans dix-huit mois, quand un journaliste cherchera quelqu'un pour raconter les coulisses de votre cabinet, il saura à qui téléphoner.`,
   e:{social:7,groups:{salaries:9,jeunes:10,ruraux:7,patrons:-4}},
   pose:"limogeage", rival:-7},
  {l:"Lui faire présenter des excuses et le garder",
   r:`Il lit un texte de quarante secondes qu'il n'a pas écrit. Personne n'y croit, à commencer par lui.<br><br>La séquence dure quatre jours de plus qu'elle n'aurait dû. Vous avez gardé un ministre affaibli et perdu quatre jours d'agenda. Le pire des deux mondes.`,
   e:{social:-4,groups:{salaries:-6,jeunes:-7,retraites:-3}},
   pose:"excuses", rival:5},
  {l:"Le défendre : « on ne gouverne pas avec des extraits »",
   r:`Vous prenez sa défense, longuement, en expliquant qu'une phrase sortie de son contexte n'est pas une politique.<br><br>C'est juridiquement vrai et politiquement suicidaire. La manifestation prévue rassemble trois fois plus de monde que prévu. Le mot « mépris » entre officiellement dans le vocabulaire qu'on emploie pour vous.`,
   e:{sec:{interieure:4},social:-10,groups:{jeunes:-13,salaries:-10,patrons:9,retraites:5}},
   axe:{autorite:1}, pose:"defense_ministre", rival:12}
 ]},

{id:"m17", ch:3, mois:17, ico:"🤝", t:"La visite d'État",
 intro:[
  [()=>S.flags.refus_ue, `Vous vous êtes fâché avec Bruxelles il y a six mois. Il vous faut
    des amis ailleurs, et c'est exactement ce que sait celui qui arrive.`],
  [()=>S.dette>150, `Votre dette vous rend poli avec les gens qui ont de l'argent. Lui en a
    beaucoup.`]
 ],
 d:`Il arrive mardi avec quatre-vingts milliards de contrats dans une main et un bilan
    épouvantable dans l'autre. Deux journalistes emprisonnés le mois dernier, une opposition
    qui n'existe plus, et une industrie qui a besoin de nos turbines.<br><br>
    Le Quai d'Orsay a préparé trois scénarios. Votre ministre de l'Économie veut les contrats.
    Votre ministre des Affaires étrangères veut un communiqué sur les droits humains.<br><br>
    Les deux vous regardent.`,
 o:[
  {l:"Signer les contrats, et se taire sur le reste",
   r:`Quatre-vingts milliards, signés en grande pompe, trente mille emplois annoncés sur dix ans.<br><br>Aucun mot sur les deux journalistes. Trois ONG quittent la salle avant la conférence de presse. Le soir, une photo de vous souriant, main dans la main, fait le tour du monde — et elle ressortira à chaque fois qu'on parlera de vos principes.`,
   e:{pib:1.8,economie:12,cac:9,budget:7,social:-8,groups:{patrons:15,jeunes:-13,salaries:-5}},
   axe:{social:-1}, pose:"contrats_signes", rival:6},
  {l:"Signer, et évoquer les prisonniers en privé",
   r:`Vous signez, et vous glissez le sujet en tête-à-tête, sans témoin. On vous répond qu'il s'agit d'une « affaire intérieure ».<br><br>Un des deux journalistes sera libéré quatorze mois plus tard, sans explication. Vous ne saurez jamais si c'est grâce à vous. Personne ne le saura, et c'est précisément le problème de cette méthode.`,
   e:{pib:1,economie:7,cac:4,budget:3,groups:{patrons:8,jeunes:-4}},
   pose:"realpolitik"},
  {l:"Conditionner publiquement les contrats à des libérations",
   r:`Vous le dites devant les caméras, en sa présence. La délégation écourte la visite de vingt-quatre heures.<br><br>Les contrats partent chez un concurrent européen. Trois mille emplois évaporés, un patronat furieux, et une tribune de dix-huit intellectuels qui vous remercie. Vous avez choisi votre camp, et il ne paie pas en emplois.`,
   e:{pib:-0.9,economie:-6,cac:-7,social:10,groups:{jeunes:14,salaries:7,patrons:-14}},
   pose:"conditionnalite", rival:-9}
 ]},

{id:"m18", ch:4, mois:18, ico:"📊", t:"La Cour des comptes",
 intro:[
  [()=>S.dette>150, `Le rapport était attendu. Ce qui ne l'était pas, c'est le ton : la Cour
    n'alerte plus, elle constate.`],
  [()=>S.flags.franchise, `Vous aviez dit la vérité sur les comptes il y a un an. Le rapport
    le rappelle, et ça vous épargne une partie de la volée.`]
 ],
 d:`Le rapport annuel fait quatre cents pages et une seule fait la une : celle où le Premier
    président écrit que « la trajectoire actuelle ne permet aucun retour à l'équilibre avant
    la fin de la décennie ».<br><br>
    Il vous reçoit en fin de journée, courtois, glacial. « Nous ne faisons pas de politique,
    monsieur le Président. Nous faisons de l'arithmétique, et l'arithmétique ne vous est pas
    favorable. »<br><br>
    Il vous laisse une note de huit pages. Trois options.`,
 o:[
  {l:"Annoncer un plan d'économies de vingt milliards",
   r:`Vingt milliards, dont sept sur la santé et quatre sur les collectivités. Le plan est présenté un mercredi matin en quarante minutes.<br><br>Les marchés applaudissent, le spread se resserre. Les fédérations hospitalières publient dans la semaine une liste de services menacés, service par service, ville par ville. Cette liste circulera jusqu'à l'élection.`,
   e:{budget:16,dette:-8,economie:4,soc:{pouvoir:-14,sante:-10,pauvrete:-8},
      groups:{patrons:14,salaries:-13,retraites:-11}},
   axe:{social:-2}, pose:"plan_economies", rival:10},
  {l:"Étaler l'effort sur cinq ans, sans coupe brutale",
   r:`Un milliard cinq par an, indolore et invisible. Personne ne descend dans la rue pour un milliard cinq.<br><br>La Cour des comptes publie un communiqué de deux paragraphes pour dire que c'est « insuffisant au regard des enjeux ». Elle a raison, et vous le savez. Mais vous avez gagné une année de calme.`,
   e:{budget:6,dette:-2,groups:{patrons:5,salaries:-3}},
   pose:"effort_etale"},
  {l:"Assumer la dette : « investir maintenant, payer plus tard »",
   r:`Vous prenez la parole pour défendre la dette, ce qu'aucun président n'avait fait aussi frontalement.<br><br>Deux économistes vous soutiennent, quinze vous éreintent, et le taux à dix ans monte de trente points de base dans la semaine. Ce n'est pas la catastrophe annoncée. Ce n'est pas rien non plus.`,
   e:{dette:7,economie:6,soc:{pouvoir:8},cac:-5,
      groups:{salaries:8,jeunes:9,patrons:-11}},
   axe:{social:1}, pose:"dette_assumee", rival:5}
 ]},

{id:"m19", ch:4, mois:19, ico:"📰", t:"Le premier papier",
 intro:[
  [()=>S.flags.silence||S.flags.evitement, `Camille Reyes a commencé par ce que vous n'avez
    pas dit. C'est toujours par là qu'on commence.`],
  [()=>S.flags.franchise, `Elle vous a prévenu par courriel, la veille, à vingt-trois heures.
    Ce n'était pas obligé. Vous le notez.`],
  [()=>S.flags.contrats_signes, `Le papier s'ouvre sur une photo de vous serrant une main
    qu'il aurait mieux valu ne pas serrer.`]
 ],
 d:`Quatre pages. Pas d'illégalité, pas de scandale : une mécanique. Comment les arbitrages
    se prennent chez vous, qui entre dans le bureau, qui n'y entre jamais.<br><br>
    Le portrait n'est pas malveillant, et c'est ce qui le rend redoutable. On y voit un homme
    entouré de six personnes qui pensent la même chose que lui.<br><br>
    Ferrand a partagé le lien à sept heures ce matin, sans un commentaire.`,
 o:[
  {l:"Ouvrir le bureau : nommer trois conseillers venus d'ailleurs",
   r:`Une directrice d'hôpital, un maire rural, une syndicaliste. Ils arrivent en février et les anciens les regardent de travers pendant six semaines.<br><br>Puis quelque chose change dans les réunions : quelqu'un dit « ça ne marchera pas sur le terrain » et on l'écoute. Camille Reyes écrira plus tard que c'est la seule chose que son article a produite.`,
   e:{social:8,economie:4,groups:{salaries:7,jeunes:8,ruraux:6}},
   pose:"ouverture_cabinet", rival:-8},
  {l:"Accorder un long entretien à Camille Reyes",
   r:`Trois heures, sans conseiller dans la pièce, avec un magnétophone posé entre vous deux.<br><br>Elle publie quatorze mille signes. Ce n'est ni complaisant ni assassin : c'est précis. Vous y apparaissez plus seul que vous ne pensiez l'être. Beaucoup de lecteurs vous trouveront plus humain. Vos conseillers, eux, sont livides.`,
   e:{social:6,groups:{jeunes:9,salaries:6,patrons:-3}},
   pose:"entretien_reyes", rival:-5},
  {l:"Faire savoir au journal que l'Élysée n'aime pas cet exercice",
   r:`Un coup de téléphone du secrétaire général au directeur de la publication. Rien d'illégal, rien d'écrit.<br><br>Le directeur en parle à sa rédaction le jour même. Camille Reyes garde une note de la conversation, datée. Elle ne la publiera pas tout de suite. Elle la publiera au pire moment.`,
   e:{social:-9,groups:{jeunes:-12,salaries:-8}},
   axe:{autorite:1}, pose:"pression_presse", rival:13}
 ]},

{id:"m21", ch:4, mois:21, ico:"🗳️", t:"Les municipales",
 intro:[
  [()=>S.rival>=50, `Le mouvement de Ferrand présente des listes dans deux cents villes.
    Il y a deux ans, il n'avait pas de parti.`],
  [()=>popularite()<38, `Vos candidats ont pris l'habitude de ne pas mettre votre photo sur
    leurs affiches. Cette fois, certains ont retiré jusqu'à l'étiquette.`]
 ],
 d:`Vingt heures, dimanche. Les estimations tombent et votre directeur de campagne ne dit
    rien pendant huit secondes, ce qui est très long.<br><br>
    Vous perdez onze grandes villes. Ferrand en gagne quatre, dont deux qu'on croyait
    imprenables. Ce n'est pas une élection nationale, tout le monde le répète, et tout le
    monde sait que c'est faux.<br><br>
    Il faut parler avant vingt-deux heures.`,
 o:[
  {l:"Reconnaître la défaite et annoncer un changement de cap",
   r:`Vingt-et-une heures dix. « Les Français m'ont adressé un message et je l'ai reçu. » Vous annoncez trois inflexions, dont une qui contredit votre programme.<br><br>C'est le genre de soirée où l'on perd et où l'on gagne un peu quand même. Ferrand, qui préparait un discours de triomphe, doit le réécrire pendant que vous parlez.`,
   e:{social:9,groups:{salaries:8,jeunes:7,ruraux:9,retraites:5}},
   pose:"lecon_tiree", rival:-10},
  {l:"Relativiser : « un scrutin local, des enjeux locaux »",
   r:`Vous employez la formule que tous vos prédécesseurs ont employée après une claque.<br><br>Elle n'a jamais marché pour eux et elle ne marche pas pour vous. Deux de vos ministres, interrogés le lendemain, ne la reprennent pas. C'est le premier signe visible que votre camp commence à se préparer à l'après.`,
   e:{groups:{salaries:-7,ruraux:-9,jeunes:-6}},
   pose:"relativisation", rival:9},
  {l:"Durcir : accélérer les réformes pendant qu'il en est temps",
   r:`Trois textes engagés en six semaines. La logique est claire : puisqu'on est impopulaire, autant l'être pour quelque chose.<br><br>Le patronat approuve, les marchés aussi. Votre majorité, elle, découvre qu'on lui demande de voter des textes difficiles après avoir perdu onze villes. Quatre députés quittent le groupe avant l'été.`,
   e:{economie:9,cac:6,social:-8,groups:{patrons:13,salaries:-9,jeunes:-6}},
   axe:{autorite:1}, pose:"acceleration", rival:7}
 ]},

{id:"m22", ch:4, mois:22, ico:"🔌", t:"La panne",
 intro:[
  [()=>S.projetsFinis.includes("nuc"), `Vos réacteurs sont entrés en service l'an dernier.
    Ce sont eux qui tiennent le réseau ce soir. Personne ne le dira à la télévision.`],
  [()=>S.flags.budget_ecolo, `Vous aviez sanctuarisé la transition. On va vous demander si
    la transition, c'est ça : des bougies dans les couloirs d'hôpital.`]
 ],
 d:`Dix-neuf heures dix, un mardi de février. Trois régions basculent en trente secondes.
    Onze millions de foyers, deux cents trains arrêtés en pleine voie, et des blocs
    opératoires qui passent sur groupe électrogène.<br><br>
    Le réseau sera rétabli dans la nuit, ça, on vous le garantit. Ce qui ne se rétablira pas
    tout seul, c'est l'idée qui vient de s'installer : que ça peut recommencer.<br><br>
    RTE demande des arbitrages pour l'hiver prochain.`,
 o:[
  {l:"Lancer un plan de sécurisation du réseau",
   r:`Douze milliards sur six ans : lignes enterrées, redondances, stockage.<br><br>C'est le genre d'investissement dont personne ne parle jamais, sauf le jour où il manque. RTE publie une note technique enthousiaste que trois personnes liront. L'hiver suivant se passera sans incident, et personne ne fera le lien.`,
   e:{pib:1.1,budget:-17,economie:7,sec:{defense:5},groups:{patrons:9,salaries:7,ruraux:8}},
   pose:"plan_reseau"},
  {l:"Imposer la sobriété : rationner les gros consommateurs",
   r:`Quotas contraignants pour les cinq cents plus gros consommateurs industriels, effectifs sous soixante jours.<br><br>Deux sites annoncent des arrêts temporaires, un troisième menace de partir. Mais le réseau tient l'hiver, et les émissions baissent pour la première fois plus vite que la trajectoire prévue. Le patronat ne vous le pardonnera pas.`,
   e:{pib:-1.1,cli:{air:16},economie:-6,cac:-7,groups:{jeunes:10,patrons:-13,salaries:-4}},
   axe:{ecologie:2}, pose:"sobriete_imposee"},
  {l:"Relancer les énergies fossiles le temps de tenir",
   r:`Deux centrales à charbon redémarrées, une dérogation de vingt-quatre mois signée un vendredi soir.<br><br>Le réseau est sécurisé, les factures se stabilisent. Le mot « provisoire » figure onze fois dans le décret. Les émissions du secteur électrique remontent de quatorze pour cent en un an, et cette courbe-là, vos adversaires l'afficheront partout.`,
   e:{pib:1.3,cli:{air:-24,eau:-8},economie:8,cac:6,budget:-6,
      groups:{patrons:11,ruraux:7,jeunes:-15}},
   axe:{ecologie:-2}, pose:"retour_fossile", rival:5}
 ]},

{id:"m23", ch:4, mois:23, ico:"⚓", t:"Le contrat du siècle",
 intro:[
  [()=>valeur("securite")<45, `Nos armées manquent de tout depuis deux ans. Ce contrat
    pourrait tout changer, ou finir de tout épuiser.`],
  [()=>S.flags.budget_defense, `Vous avez sanctuarisé la défense. L'industrie s'en souvient
    et vient chercher la suite.`]
 ],
 d:`Un pays allié veut douze bâtiments. Trente mille emplois pendant quinze ans, trois
    chantiers navals qui revivent, et une clause : la maintenance sera assurée sur place,
    pas chez nous.<br><br>
    Les syndicats de Saint-Nazaire ont déjà sorti les banderoles — pour, cette fois. Le
    Quai d'Orsay signale que l'acheteur est en guerre depuis quatorze mois.<br><br>
    La délégation atterrit jeudi.`,
 o:[
  {l:"Signer : trente mille emplois valent bien un silence",
   r:`Signature à Saint-Nazaire, sous les grues, devant deux mille salariés qui applaudissent debout.<br><br>C'est une des rares fois de votre mandat où l'on vous acclame vraiment. Une ONG publiera trois mois plus tard un rapport sur l'usage des bâtiments livrés. Vous l'aurez lu avant tout le monde.`,
   e:{pib:2,economie:13,cac:10,budget:9,sec:{defense:8},social:-7,
      groups:{patrons:15,salaries:11,jeunes:-12}},
   pose:"contrat_naval", rival:4},
  {l:"Signer, mais rapatrier la maintenance en France",
   r:`Quatre semaines de renégociation pour une clause de maintenance de quinze ans, sur le sol français.<br><br>Le contrat est plus petit et bien meilleur : c'est de l'emploi durable, pas une commande. Les syndicats, qui s'attendaient à être sacrifiés, saluent publiquement. C'est assez rare pour être noté.`,
   e:{pib:1.3,economie:8,cac:5,budget:4,sec:{defense:6},groups:{patrons:9,salaries:9}},
   pose:"contrat_negocie", rival:-4},
  {l:"Refuser tant que le conflit dure",
   r:`Vous refusez, en le disant clairement, en citant le conflit.<br><br>À Saint-Nazaire, deux mille personnes qui vous applaudissaient la semaine dernière apprennent qu'il n'y aura pas de commande. Le maire, de votre camp, déclare qu'il « ne comprend pas ». Vous avez eu raison sur le principe et personne ne vous en félicitera là-bas.`,
   e:{pib:-1,economie:-9,cac:-8,social:9,groups:{jeunes:12,salaries:-9,patrons:-13}},
   pose:"contrat_refuse", rival:6}
 ]},

{id:"m24", ch:4, mois:24, ico:"📺", t:"Le document",
 intro:[
  [()=>S.flags.silence||S.flags.enterrement, `Vous avez enterré au moins un dossier depuis
    deux ans. Vous ne savez pas lequel elle a.`],
  [()=>S.flags.transparence||S.flags.franchise, `Vous avez pris l'habitude de tout publier.
    C'est votre seule assurance ce soir.`]
 ],
 d:`Interview de mi-mandat, deux heures en direct. À la quarante-troisième minute, la
    journaliste sort une feuille d'une chemise et la pose face à vous, côté caméra.<br><br>
    C'est une note interne, avec votre paraphe en bas à droite. Vous la reconnaissez avant
    d'avoir fini de la lire : c'est celle où l'on vous alertait, il y a dix-huit mois, sur
    exactement ce qui s'est produit depuis.<br><br>
    Six millions de personnes regardent votre visage. Vous avez peut-être trois secondes.`,
 o:[
  {l:"« Oui. Je l'ai lue. Et je n'en ai pas assez tenu compte. »",
   r:`Vous ne cherchez pas la sortie. Vous reconnaissez la note, la date, et l'erreur.<br><br>Il y a un silence de deux secondes sur le plateau, ce qui est très long en direct. La séquence sera vue quarante millions de fois en trois jours, et la plupart des commentaires diront la même chose : « au moins, il l'a dit ».`,
   e:{social:12,groups:{salaries:11,jeunes:12,ruraux:8,retraites:6,patrons:-4}},
   pose:"mi_mandat_humilite", rival:-14},
  {l:"Contester le contexte, document en main, point par point",
   r:`Vous reprenez la note ligne par ligne et vous démontrez qu'elle disait autre chose que ce qu'on lui fait dire.<br><br>Vous avez techniquement raison. Sur le plateau, la démonstration dure onze minutes, et onze minutes de justification en direct ressemblent toujours à un aveu, même quand elles n'en sont pas une.`,
   e:{economie:3,groups:{patrons:7,retraites:5,jeunes:-6,salaries:-4}},
   pose:"mi_mandat_bilan", rival:5},
  {l:"Demander comment une note classifiée est arrivée sur ce plateau",
   r:`Vous posez la question de la fuite, en direct, avec le ton qu'il faut pour qu'elle sonne comme une menace.<br><br>La journaliste répond calmement qu'elle protège ses sources. Le lendemain, le CSA reçoit huit cents signalements et la Société des journalistes de la chaîne publie un communiqué. Vous avez déplacé le sujet, et vous l'avez déplacé sur vous.`,
   e:{sec:{interieure:5},social:-11,
      groups:{jeunes:-14,salaries:-10,retraites:6}},
   axe:{autorite:2}, pose:"mi_mandat_menace", rival:12}
 ]},

/* ═══════════ ANNÉE III ═══════════ */

{id:"m25", ch:5, mois:25, ico:"🩺", t:"Le rapport qu'on vous cache",
 intro:[
  [()=>talonAchille()==="social", `Le domaine dont on vous parle est aussi celui que vous
    avez le moins financé. Le rapport le dit à sa manière : poliment.`],
  [()=>S.flags.plan_economies, `Votre plan d'économies passe par là. On vous montre
    aujourd'hui ce qu'il a coûté ailleurs.`]
 ],
 d:`Une note de l'inspection générale, restée trois mois dans un tiroir avant d'arriver
    chez vous. Elle décrit, service par service, un système qui tient parce que des gens
    s'épuisent, et qui cédera quand ils s'arrêteront.<br><br>
    L'inspectrice qui l'a signée a demandé à vous voir. Ce n'est pas dans les usages.
    Elle a insisté.<br><br>
    Elle est là, dans le couloir, avec son classeur.`,
 o:[
  {l:"La recevoir et publier le rapport intégralement",
   r:`Quatre cents pages en ligne, sans expurgation, avec la note de synthèse en tête.<br><br>La presse s'en empare pendant une semaine et c'est douloureux. Mais l'inspectrice qui l'a signé témoigne à visage découvert qu'on ne l'a pas censurée. Dans un pays qui doute de tout, ce détail-là vaut plus qu'un plan de communication.`,
   e:{social:9,soc:{sante:12},budget:-6,groups:{salaries:10,jeunes:7,retraites:8}},
   pose:"franchise", rival:-8},
  {l:"La recevoir, agir, mais garder le rapport confidentiel",
   r:`Vous agissez : crédits débloqués, deux directions réorganisées, un moratoire sur les fermetures.<br><br>Le rapport, lui, reste au coffre. Il fuitera dans dix-huit mois, à un moment que vous n'aurez pas choisi, et on retiendra surtout qu'il était au coffre.`,
   e:{soc:{sante:14},budget:-9,groups:{salaries:6,retraites:6}},
   pose:"action_discrete"},
  {l:"Renvoyer le dossier au ministère concerné",
   r:`Le dossier redescend d'un étage. Le ministère accuse réception et promet une « feuille de route ».<br><br>L'inspectrice demande sa mutation trois mois plus tard. Elle n'en parlera à personne, sauf une fois, à une journaliste, longtemps après.`,
   e:{soc:{sante:-8},social:-5,groups:{salaries:-7,retraites:-6}},
   pose:"enterrement", rival:8}
 ]},

{id:"m27", ch:5, mois:27, ico:"🧱", t:"Le lendemain",
 intro:[
  [()=>S.flags.etat_urgence, `L'état d'urgence est en vigueur depuis un mois. Les préfets
    en redemandent, le Conseil d'État s'en inquiète, et vous devez trancher.`],
  [()=>S.flags.sauvetage, `Vous avez garanti les dépôts. Le système a tenu. La facture,
    elle, arrive maintenant.`],
  [()=>S.flags.rationnement, `Vous avez rationné l'eau agricole. Trois préfectures sont
    encore bloquées par des tracteurs.`],
  [()=>S.flags.requisition, `Vous avez réquisitionné des soignants. Quarante d'entre eux
    ont porté plainte, et le tribunal a accepté d'examiner l'affaire.`]
 ],
 d:`La crise est passée. Reste ce qu'elle a laissé : des mesures d'exception prises en
    quarante-huit heures et qui, si personne ne fait rien, deviendront permanentes par
    simple inertie.<br><br>
    Le secrétaire général vous tend une liste de dix-sept dispositifs à reconduire ou à
    laisser expirer. « Reconduire ne se voit pas. Laisser expirer, ça se voit tout de
    suite, et seulement quand ça tourne mal. »<br><br>
    L'échéance est vendredi.`,
 o:[
  {l:"Tout laisser expirer et revenir au droit commun",
   r:`Les dix-sept dispositifs tombent à minuit le vendredi. Aucune prolongation, aucune exception.<br><br>Le Conseil d'État publie un communiqué inhabituellement chaleureux. Deux préfets écrivent au ministre pour dire leur inquiétude. S'il se passe quoi que ce soit dans les six mois, cette décision sera la première chose qu'on vous reprochera.`,
   e:{social:11,sec:{interieure:-9},groups:{jeunes:13,salaries:8,retraites:-7}},
   axe:{autorite:-2}, pose:"retour_droit_commun", rival:-6},
  {l:"Reconduire ce qui protège, abandonner le reste",
   r:`Six dispositifs reconduits, onze abandonnés, avec une clause de réexamen annuel.<br><br>Personne n'est content et personne ne descend dans la rue. C'est exactement ce que produit un arbitrage raisonnable, et c'est pour ça que si peu de gouvernements en font.`,
   e:{sec:{interieure:6},social:3,groups:{salaries:4,retraites:4}},
   pose:"tri_mesures"},
  {l:"Tout reconduire : « ce n'est pas le moment de désarmer »",
   r:`Les dix-sept mesures sont inscrites dans le droit commun par amendement, un mardi soir, en vingt minutes de débat.<br><br>La Défenseure des droits publie une saisine. Trois ans plus tard, personne ne se souviendra que ces pouvoirs étaient censés être temporaires. C'est ainsi que ça se passe toujours, et vous le saviez en signant.`,
   e:{sec:{interieure:16},social:-12,groups:{retraites:11,ruraux:8,jeunes:-16}},
   axe:{autorite:2}, pose:"exception_permanente", rival:9}
 ]},

{id:"m28", ch:5, mois:28, ico:"🌾", t:"La zone",
 intro:[
  [()=>S.axes.ecologie>=3, `Vous avez bâti votre mandat sur l'écologie. Ce sont vos propres
    électeurs qui campent là-bas.`],
  [()=>S.dette>170, `Avec votre dette, quinze milliards devraient être impensables. On vient
    quand même vous les proposer, et l'argument est bon.`]
 ],
 d:`Quinze milliards, douze ans de travaux, quatre mille emplois directs : l'usine qui
    remettrait la France dans la course. Le site retenu est une zone humide classée, et
    trois cents personnes y vivent sous bâches depuis onze mois.<br><br>
    Le préfet a préparé l'évacuation pour mardi. Il vous prévient dans une note d'une page :
    « Nous aurons des blessés. Je ne peux pas vous garantir que nous n'aurons que ça. »<br><br>
    L'industriel, lui, a un autre site en Pologne et une réunion d'actionnaires en mars.`,
 o:[
  {l:"Ordonner l'évacuation et lancer le chantier",
   r:`Mardi, cinq heures. Onze cents gendarmes, trois cents occupants, quatre heures d'opération.<br><br>Bilan : trente-huit blessés, dont un jeune homme de vingt-deux ans qui perdra l'usage d'un œil. Son visage sera l'affiche de tous les cortèges pendant deux ans. La première pierre est posée en juin, sous protection policière.`,
   e:{pib:3.5,budget:-16,economie:14,cac:10,cli:{eau:-18,foret:-12},social:-10,
      groups:{patrons:15,salaries:9,jeunes:-17}},
   axe:{autorite:2,ecologie:-2}, pose:"grand_projet", rival:11},
  {l:"Déplacer le projet sur une friche industrielle, plus cher, plus lent",
   r:`Deux milliards de dépollution et dix-huit mois de retard. L'industriel a menacé de partir trois fois avant de signer.<br><br>La zone humide est classée définitivement. Sur la friche, on trouve un site qui n'aurait jamais intéressé personne et qui redevient quelque chose. C'est la solution la plus chère et la seule dont vous serez fier.`,
   e:{pib:2,budget:-24,economie:8,cac:4,cli:{sols:10},
      groups:{patrons:5,jeunes:8,salaries:6}},
   pose:"projet_deplace", rival:-6},
  {l:"Renoncer : l'usine ira en Pologne",
   r:`L'annonce tombe un jeudi : le groupe retient le site de Basse-Silésie.<br><br>Les militants de la zone humide dansent sous la pluie, et on les comprend. À quatre-vingts kilomètres de là, un bassin d'emploi qui espérait quatre mille postes apprend la nouvelle par la presse. Les deux images passent au même journal.`,
   e:{pib:-1.8,economie:-9,cac:-8,cli:{eau:14,foret:10},
      groups:{jeunes:13,patrons:-15,salaries:-9,ruraux:-6}},
   axe:{ecologie:2}, pose:"quotidien_prefere", rival:7}
 ]},

{id:"m29", ch:5, mois:29, ico:"🌍", t:"La conférence",
 intro:[
  [()=>S.axes.ecologie>=3, `Vous arrivez avec un bilan climatique réel. C'est assez rare
    pour qu'on vous demande de présider une session.`],
  [()=>S.axes.ecologie<=-2, `Vous arrivez avec un bilan que les ONG ont chiffré avant vous.
    Elles vous attendent à l'entrée.`],
  [()=>S.flags.retour_fossile, `Votre retour aux fossiles a été noté. Deux délégations ont
    demandé que la France ne préside aucune session.`]
 ],
 d:`Conférence climat, dernière nuit. Le texte final tient en trois pages et bloque sur un
    seul verbe : « réduire » ou « limiter ». Quatre pays refusent le premier.<br><br>
    La présidente de la conférence vient vous chercher à deux heures du matin : « Si la
    France bouge, trois autres suivent. Si elle ne bouge pas, il n'y a pas d'accord et
    tout le monde saura pourquoi. »<br><br>
    Votre industrie vous a écrit trois fois cette semaine.`,
 o:[
  {l:"Faire basculer la France du côté du texte fort",
   r:`Vous annoncez le ralliement à quatre heures dix du matin. Trois pays suivent dans l'heure, l'accord est sauvé.<br><br>La présidente de la conférence vous embrasse devant les caméras. Vos fédérations industrielles publient un communiqué glacial le lendemain, et deux d'entre elles annoncent le gel d'investissements en France.`,
   e:{pib:-0.9,cli:{air:24,eau:10,foret:8},economie:-7,cac:-6,
      groups:{jeunes:15,patrons:-13,ruraux:-7}},
   axe:{ecologie:2}, pose:"accord_climat", rival:-6},
  {l:"Négocier un texte fort assorti de compensations industrielles",
   r:`Le texte est adopté, avec un mécanisme d'ajustement carbone aux frontières que la France a arraché en huit heures.<br><br>Les ONG trouvent que c'est insuffisant. L'industrie trouve que c'est jouable. C'est le genre de compromis dont personne ne fait un slogan et qui change réellement des trajectoires.`,
   e:{cli:{air:12,eau:6},budget:-9,economie:3,groups:{jeunes:8,patrons:4}},
   axe:{ecologie:1}, pose:"climat_compense"},
  {l:"Protéger l'industrie française et bloquer",
   r:`La France bloque. Il n'y a pas d'accord, et tout le monde sait pourquoi.<br><br>Vos industriels vous remercient discrètement. Le lendemain, quatre-vingts pays publient une déclaration commune sans la France. C'est la première fois de votre mandat que vous êtes cité comme un obstacle, et cette étiquette est très difficile à décoller.`,
   e:{pib:1,cli:{air:-16,eau:-6},economie:8,cac:7,
      groups:{patrons:14,ruraux:8,jeunes:-17}},
   axe:{ecologie:-2}, pose:"blocage_climat", rival:7}
 ]},

{id:"m30", ch:6, mois:30, ico:"🧑‍⚖️", t:"Le procès",
 intro:[
  [()=>S.flags.pression_presse, `Vous avez déjà fait pression sur un journal. On vous le
    ressortira à la barre, dans les couloirs, partout.`],
  [()=>S.flags.transparence||S.flags.franchise, `Vous avez pris l'habitude de dire les
    choses. C'est votre meilleure protection aujourd'hui.`]
 ],
 d:`Ce n'est pas vous. C'est votre prédécesseur, jugé pour des faits vieux de dix ans, et
    la République entière regarde le banc.<br><br>
    Trois de vos ministres actuels ont travaillé avec lui. Un journaliste a fait le compte
    et publié la liste. Votre entourage vous conseille le silence absolu ; votre garde des
    Sceaux vous conseille exactement le contraire.<br><br>
    Le verdict tombe dans huit jours.`,
 o:[
  {l:"Ne rien dire : la justice passe, l'exécutif se tait",
   r:`Silence complet pendant huit jours, y compris le jour du verdict.<br><br>C'est constitutionnellement irréprochable et politiquement muet. Vos ministres cités par la presse se débrouillent seuls, ce dont deux d'entre eux vous tiendront rigueur longtemps.`,
   e:{social:3,groups:{retraites:4,patrons:4,jeunes:-3}},
   pose:"silence_judiciaire"},
  {l:"Annoncer une loi d'inéligibilité automatique",
   r:`Inéligibilité définitive pour tout élu condamné pour manquement à la probité, sans exception ni délai.<br><br>Le texte est voté à une majorité écrasante parce que personne ne peut voter contre. Trois de vos propres députés seront concernés dans les cinq ans. Vous le saviez en le proposant.`,
   e:{social:12,groups:{salaries:11,jeunes:14,ruraux:9,patrons:-8}},
   pose:"ineligibilite", rival:-12},
  {l:"Dénoncer un procès politique",
   r:`Vous employez les mots « acharnement » et « justice à deux vitesses » dans une interview de vingt minutes.<br><br>Les syndicats de magistrats répondent en bloc, y compris ceux qui ne répondent jamais. Le premier président de la Cour de cassation prend la parole publiquement, ce qui n'était pas arrivé depuis quinze ans.`,
   e:{sec:{interieure:-5},social:-11,groups:{jeunes:-13,salaries:-9,ruraux:6}},
   axe:{autorite:1}, pose:"procès_politique", rival:11}
 ]},

{id:"m33", ch:6, mois:33, ico:"🕳️", t:"Ce qui reste de l'affaire",
 intro:[
  [()=>S.flags.transparence, `Vous avez tout publié. L'orage est passé plus vite que prévu,
    et il vous en reste quelque chose d'inattendu : du crédit.`],
  [()=>S.flags.pression_presse, `Votre pression sur le journal a fuité. Ce n'est plus
    l'affaire qu'on commente, c'est ce que vous avez fait pour l'étouffer.`],
  [()=>S.flags.secret_defense, `Le secret-défense que vous avez invoqué occupe désormais
    plus de place dans le débat que le dossier lui-même.`]
 ],
 d:`Trois semaines que ça dure. Les révélations se sont taries mais l'affaire a changé de
    nature : elle n'est plus un scandale, elle est devenue un adjectif qu'on vous accole.<br><br>
    Votre directrice de la communication propose une contre-offensive en trois temps.
    Votre plume, elle, ne propose rien : « Il n'y a pas de bon texte pour ça. Il n'y a que
    des faits nouveaux. »<br><br>
    Le journal de vingt heures ouvre encore dessus ce soir.`,
 o:[
  {l:"Produire des faits nouveaux : réforme du financement politique",
   r:`Plafonnement des dons, publicité intégrale des comptes de campagne, contrôle indépendant renforcé.<br><br>Vous changez de sujet en changeant les règles, ce qui est la seule manière honnête de changer de sujet. Le texte survivra à votre mandat, et c'est peut-être ce qui restera de cette année-là.`,
   e:{social:13,budget:-4,groups:{salaries:10,jeunes:13,ruraux:8,patrons:-6}},
   pose:"reforme_financement", rival:-13},
  {l:"Changer de sujet par une annonce économique massive",
   r:`Un plan de quinze milliards annoncé le mardi, qui prend toute la place médiatique du mercredi.<br><br>Ça marche trois jours. Puis un journaliste demande en conférence de presse si le plan a été avancé pour couvrir l'affaire, et la question, elle, ne se referme jamais.`,
   e:{budget:-13,economie:10,cac:7,groups:{patrons:11,salaries:7}},
   pose:"diversion"},
  {l:"Attendre que ça passe",
   r:`Rien. Pas de réaction, pas de contre-feu, pas d'annonce.<br><br>L'affaire s'éteint effectivement au bout de cinq semaines, comme s'éteignent toutes les affaires. Elle laisse un dépôt : dans les enquêtes d'opinion, l'item « honnête » perd onze points et ne les récupérera pas.`,
   e:{social:-7,groups:{salaries:-6,jeunes:-8,retraites:-4}},
   pose:"attente", rival:7}
 ]},

{id:"m34", ch:6, mois:34, ico:"🏭", t:"Le plan social",
 intro:[
  [()=>S.eco<45, `L'économie va mal depuis des mois. Ce plan social ne sera pas le
    dernier, et tout le monde le sait.`],
  [()=>S.flags.contrat_naval, `Le groupe qui ferme est celui-là même que vous avez sauvé
    l'an dernier avec le contrat naval. On vous le rappellera.`]
 ],
 d:`Quatre mille postes, six sites, une décision prise dans un conseil d'administration à
    l'étranger un mardi matin.<br><br>
    Le PDG accepte de vous voir. Il est courtois et il a ses chiffres : sans cette
    restructuration, le groupe perd son avance en trois ans, et alors ce ne sont pas quatre
    mille emplois qui partent, mais dix-huit mille.<br><br>
    Dans la cour de l'usine de Hagondange, il y a deux cents personnes et une caméra.`,
 o:[
  {l:"Entrer au capital pour bloquer les fermetures",
   r:`L'État prend 21 % du groupe pour dix-neuf milliards et obtient un moratoire de trois ans sur les fermetures.<br><br>Les six sites restent ouverts. À Hagondange, on vous applaudit debout. À Bercy, on calcule ce que coûte chaque emploi sauvé et on obtient un chiffre qu'on ne rendra pas public.`,
   e:{pib:-0.6,budget:-19,economie:-4,cac:-8,soc:{pauvrete:12},
      groups:{salaries:16,ruraux:11,patrons:-14}},
   axe:{social:2}, pose:"entree_capital", rival:-7},
  {l:"Négocier un plan de reconversion financé par le groupe",
   r:`Quatre mille salariés, dix-huit mois de formation payés par l'entreprise, une clause de reclassement prioritaire.<br><br>Les sites ferment quand même. Mais deux ans plus tard, soixante-huit pour cent des salariés ont retrouvé un emploi, ce qui est un résultat exceptionnel dont personne ne parlera jamais.`,
   e:{budget:-7,soc:{educ:10,pauvrete:6},groups:{salaries:8,ruraux:5,patrons:-4}},
   pose:"reconversion"},
  {l:"Laisser faire : « l'État n'est pas un actionnaire »",
   r:`Vous assumez la doctrine en conférence de presse, en expliquant que sauver des sites condamnés coûte plus cher que d'accompagner les gens.<br><br>C'est probablement vrai. À Hagondange, deux mille personnes brûlent votre portrait le soir même, et le maire, qui vous soutenait, annonce qu'il ne le fera plus.`,
   e:{pib:0.9,economie:6,cac:7,soc:{pauvrete:-14,pouvoir:-8},
      groups:{patrons:13,salaries:-15,ruraux:-11}},
   axe:{social:-2}, pose:"non_intervention", rival:12}
 ]},

{id:"m35", ch:6, mois:35, ico:"🛰️", t:"L'incident",
 intro:[
  [()=>valeur("securite")>65, `Nos armées ont les moyens de répondre. C'est une chance :
    ça vous laisse le choix, au lieu de vous l'imposer.`],
  [()=>valeur("securite")<40, `Le chef d'état-major a une phrase pour résumer nos moyens :
    « Nous pouvons faire une chose. Une seule. Choisissez laquelle. »`]
 ],
 d:`Un câble sous-marin sectionné au large de Brest, et un bâtiment non identifié qui
    croisait dans la zone quatre heures plus tôt. Trois millions de foyers privés
    d'internet, deux hôpitaux coupés de leurs serveurs.<br><br>
    Personne ne revendique. Tout le monde a compris. Le chef d'état-major particulier attend
    dans le salon vert avec trois enveloppes.<br><br>
    Nos alliés demandent ce que la France compte faire. Ils demandent poliment, mais ils
    demandent.`,
 o:[
  {l:"Rendre l'incident public et l'attribuer nommément",
   r:`Conférence de presse du ministre des Armées : le bâtiment est nommé, le pavillon aussi, les preuves sont montrées.<br><br>L'attribution publique est rare et elle a un effet : aucun nouvel incident pendant quatorze mois. Elle a aussi un coût : deux contrats commerciaux annulés et un ambassadeur rappelé.`,
   e:{sec:{defense:14,interieure:6},economie:-4,
      groups:{retraites:10,ruraux:8,patrons:-5}},
   axe:{autorite:1}, pose:"attribution_publique"},
  {l:"Répondre discrètement, dans le même registre",
   r:`Rien n'est dit. Onze jours plus tard, une infrastructure comparable connaît une avarie « d'origine indéterminée » à quatre mille kilomètres d'ici.<br><br>Le message est reçu. Aucun journal ne fera le lien, et c'était le but. Vous avez répondu sans que le pays sache qu'il avait été attaqué.`,
   e:{sec:{defense:12},social:-3,groups:{retraites:6,jeunes:-4}},
   pose:"riposte_discrete"},
  {l:"Ne rien dire et investir en silence dans la protection des câbles",
   r:`Douze milliards sur cinq ans : drones sous-marins, capteurs, deux bâtiments spécialisés.<br><br>Le programme est classé, le budget est fondu dans une ligne opaque, et il ne rapportera jamais un point de sondage. Dans dix ans, il sera considéré comme la décision la plus lucide de votre mandat par les trois personnes qui en connaîtront l'existence.`,
   e:{budget:-12,sec:{defense:16},economie:4,groups:{patrons:6}},
   pose:"protection_silencieuse"}
 ]},

{id:"m36", ch:6, mois:36, ico:"🥀", t:"La trahison",
 intro:[
  [()=>S.rival>=60, `Ferrand est donné gagnant depuis des mois. Les rats ne quittent pas le
    navire par lâcheté : ils le quittent parce qu'ils savent lire.`],
  [()=>popularite()>52, `Vous remontez dans les sondages. C'est précisément ce qui rend ce
    qui va suivre incompréhensible.`]
 ],
 d:`Il a demandé à vous voir seul, sans note, en fin de journée. Trois ans qu'il tient un
    ministère régalien ; deux campagnes ensemble ; c'est lui qui vous a présenté votre
    directrice de cabinet.<br><br>
    Il reste debout. « Je pars. J'annonce demain à onze heures que je rejoins Julien. »
    Il ne se justifie pas, ne s'excuse pas. Il ajoute seulement : « Vous ne m'écoutiez plus
    depuis longtemps. »<br><br>
    Il a les clés du ministère dans la poche et sept années de dossiers dans la tête.`,
 o:[
  {l:"Le laisser partir sans un mot public",
   r:`Il annonce à onze heures. Vous ne réagissez pas, votre entourage non plus, et l'Élysée publie un communiqué de deux lignes remerciant « le ministre pour son travail ».<br><br>La dignité a un coût : pendant trois jours, il occupe seul l'espace. Elle a aussi un rendement : personne ne peut dire que vous avez été petit.`,
   e:{social:4,groups:{retraites:5,patrons:4,salaries:3}},
   pose:"depart_digne", rival:4},
  {l:"Prendre les devants : l'annoncer vous-même ce soir, à votre manière",
   r:`Vous parlez le soir même, avant lui, et vous racontez la conversation telle qu'elle a eu lieu — sans l'accabler.<br><br>Son annonce du lendemain tombe à plat : elle n'a plus rien à révéler. Il vous en voudra pour ça plus que pour tout le reste, et c'est le prix normal d'un coup bien joué.`,
   e:{social:6,economie:3,groups:{salaries:7,retraites:6,jeunes:5}},
   pose:"gouverner_jusquau_bout", rival:-7},
  {l:"Faire savoir ce que vous savez de lui",
   r:`Deux « off » en vingt-quatre heures, un déjeuner avec un éditorialiste, et une information sur ses frais de mandat qui sort le vendredi.<br><br>Il est abîmé. Vous aussi : trois journalistes recoupent l'origine des fuites et remontent à votre cabinet en une semaine. On appelle ça une victoire à la Pyrrhus, et c'en est une.`,
   e:{social:-12,sec:{interieure:-4},
      groups:{jeunes:-13,salaries:-11,ruraux:-7,patrons:5}},
   axe:{autorite:2}, pose:"represailles", rival:13}
 ]},

/* ═══════════ ANNÉE IV ═══════════ */

{id:"m37", ch:7, mois:37, ico:"🧾", t:"Le dernier budget",
 intro:[
  [()=>S.dette>180, `Votre dernier budget sera lu comme un testament. Avec ces chiffres,
    ce sera un testament contesté.`],
  [()=>S.flags.plan_economies, `Vous avez déjà coupé une fois. Recommencer maintenant, à
    un an du scrutin, personne ne vous le pardonnera.`]
 ],
 d:`Le dernier que vous ferez voter. Celui que votre successeur exécutera, et dont il dira
    pendant deux ans qu'il en a hérité.<br><br>
    Votre ministre du Budget a préparé deux versions : une sincère, une électorale. Il les
    a posées côte à côte sans commentaire, ce qui est sa manière à lui de donner un avis.<br><br>
    Le Conseil des ministres l'examine dans six jours.`,
 o:[
  {l:"La version sincère, même si elle fait mal",
   r:`Vous présentez le budget tel qu'il est, avec les hypothèses réelles et les impasses assumées.<br><br>Il est adopté sans enthousiasme. Votre successeur, quel qu'il soit, trouvera des comptes lisibles. C'est peu spectaculaire et c'est probablement ce qui manque le plus à ce métier.`,
   e:{budget:13,dette:-7,economie:5,cac:6,soc:{pouvoir:-10},
      groups:{patrons:12,salaries:-8,retraites:-7}},
   pose:"budget_sincere", rival:5},
  {l:"La version électorale : dépenser maintenant",
   r:`Le budget est généreux, sincèrement insincère, et tout le monde le sait dans l'hémicycle.<br><br>Le Haut Conseil des finances publiques rend un avis assassin en douze lignes. Il est publié un vendredi. Personne ne le lit, sauf Julien Ferrand, qui en fera une affiche.`,
   e:{pib:-0.8,budget:-16,dette:9,soc:{pouvoir:18,pauvrete:10},
      groups:{salaries:13,retraites:11,jeunes:8,patrons:-10}},
   pose:"budget_electoral", rival:-8},
  {l:"Un budget d'investissement, ni l'un ni l'autre",
   r:`Ni relance ni austérité : douze milliards fléchés sur l'industrie, la formation et l'énergie.<br><br>C'est un budget qu'on ne peut pas résumer en un slogan, ce qui est son défaut principal. Les économistes le trouvent bon, les électeurs ne le comprennent pas, et il faudra six ans pour savoir qui avait raison.`,
   e:{pib:1.2,budget:-8,dette:4,economie:9,cac:5,soc:{educ:10},
      groups:{patrons:8,jeunes:9,salaries:4}},
   pose:"budget_investissement"}
 ]},

{id:"m39", ch:7, mois:39, ico:"🤐", t:"L'homme qui sait",
 intro:[
  [()=>S.flags.marchandage, `Il a la liste des sous-préfectures que vous avez sauvées pour
    acheter neuf voix. Elle est précise.`],
  [()=>S.flags.pression_presse, `Il sait ce que votre cabinet a fait pour retarder un
    article. Il en a la trace écrite.`],
  [()=>!S.flags.marchandage&&!S.flags.pression_presse, `Il n'a rien de compromettant, et
    c'est justement pour ça qu'il est dangereux : il inventera.`]
 ],
 d:`Un ancien conseiller, parti fâché il y a deux ans. Il publie un livre en septembre, en
    pleine campagne, chez un éditeur qui sait faire du bruit.<br><br>
    L'intermédiaire qui vous transmet le message est très clair sur ce qu'il propose : un
    poste, n'importe lequel, et le manuscrit part à la corbeille.<br><br>
    Personne d'autre que vous n'est au courant de cette conversation.`,
 o:[
  {l:"Refuser tout net et laisser paraître le livre",
   r:`Vous refusez en une phrase et vous raccrochez.<br><br>Le livre sort en septembre. Il est méchant, mal écrit et se vend correctement. Rien de ce qu'il contient n'est vérifiable, et c'est justement ce qui le rend inoffensif à moyen terme.`,
   e:{social:7,groups:{jeunes:8,salaries:6,ruraux:5}},
   pose:"refus_chantage", rival:4},
  {l:"Lui donner le poste",
   r:`Il est nommé au Conseil économique et social un mardi de juillet, en pleine torpeur estivale.<br><br>Le manuscrit ne sortira jamais. Mais un attaché parlementaire au courant en parle à quelqu'un, qui en parle à Camille Reyes. Elle mettra huit mois à l'établir. Elle a le temps.`,
   e:{social:-12,groups:{jeunes:-14,salaries:-11,ruraux:-8}},
   axe:{autorite:1}, pose:"chantage_cede", rival:14},
  {l:"Prendre les devants : raconter vous-même ces deux années",
   r:`Un entretien-fleuve de quatre heures, publié in extenso, où vous racontez les arbitrages, y compris ceux que vous avez ratés.<br><br>Le livre de l'ancien conseiller sort trois mois plus tard dans un paysage où tout a déjà été dit. Il fait quatre articles et disparaît.`,
   e:{social:10,budget:-3,groups:{salaries:9,jeunes:11,retraites:5,patrons:-4}},
   pose:"recit_assume", rival:-10}
 ]},

{id:"m40", ch:7, mois:40, ico:"🧊", t:"La vague",
 intro:[
  [()=>S.axes.ecologie>=3, `Vous avez investi dans la prévention pendant quatre ans.
    Ce soir, on va savoir si ça servait à quelque chose.`],
  [()=>S.axes.ecologie<=-2, `Les digues n'ont pas été refaites. Le rapport qui le
    recommandait date de votre première année.`]
 ],
 d:`Une tempête que les modèles annonçaient « centennale » et qui est la troisième en six
    ans. Deux cent mille foyers évacués sur la façade atlantique, une ville coupée du monde
    pendant trente-six heures.<br><br>
    Vous y allez demain matin. La question n'est pas d'y aller : c'est ce que vous direz
    en descendant de l'hélicoptère, devant des gens qui ont tout perdu et qui ont voté,
    ici, majoritairement contre vous.<br><br>
    Les caméras seront à quatre mètres.`,
 o:[
  {l:"Annoncer un plan digues et adaptation, chiffré, immédiat",
   r:`Vingt milliards sur dix ans : digues, renaturation, relocalisation de deux cents habitations.<br><br>C'est le premier plan d'adaptation de cette ampleur en France. Un maire de droite, qui ne vous a jamais soutenu, déclare à la télévision qu'il faut « saluer quand c'est juste ». Ça vaut tous les sondages de la semaine.`,
   e:{budget:-20,cli:{eau:20,sols:10},soc:{pauvrete:8},
      groups:{ruraux:15,salaries:8,jeunes:9}},
   axe:{ecologie:1}, pose:"plan_adaptation", rival:-9},
  {l:"Rester deux jours sur place, sans rien annoncer",
   r:`Quarante-huit heures, sans annonce, sans chiffre. Vous écoutez et vous notez.<br><br>Un pompier volontaire vous dit : « Les autres sont venus deux heures. » C'est la phrase qui restera. Les annonces viendront trois semaines plus tard, mieux calibrées pour avoir été entendues.`,
   e:{social:9,groups:{ruraux:13,salaries:7,retraites:6}},
   pose:"presence_longue", rival:-6},
  {l:"Une visite courte : le pays a d'autres urgences",
   r:`Deux heures dix, hélicoptère, gilet de sauvetage, poignées de main.<br><br>Un habitant filme votre départ et commente : « Il est resté moins longtemps que l'eau. » La vidéo fait onze millions de vues en trois jours. Vous avez économisé une journée d'agenda.`,
   e:{economie:3,groups:{ruraux:-14,salaries:-6,jeunes:-5}},
   pose:"visite_courte", rival:10}
 ]},

{id:"m41", ch:7, mois:41, ico:"🚑", t:"Le meeting",
 intro:[
  [()=>S.axes.autorite>=3, `Vous avez durci le pays pendant quatre ans. On vous demandera
    ce soir si ce climat-là vous appartient un peu.`],
  [()=>valeur("securite")<40, `Les renseignements avaient signalé un risque en janvier.
    La note existe. Elle sortira.`]
 ],
 d:`Vingt et une heures dix, salle des fêtes de Villeurbanne. Un homme de vingt-six ans a
    tiré trois fois vers la tribune pendant le meeting de Julien Ferrand.<br><br>
    Ferrand n'est pas touché. Une militante de soixante-treize ans est en réanimation, et
    un jeune du service d'ordre a pris une balle dans l'épaule en s'interposant.<br><br>
    Le tireur criait quelque chose. On ne sait pas encore quoi, et pendant les trois heures
    que durera cette incertitude, le pays entier va décider tout seul.`,
 o:[
  {l:"Aller à l'hôpital cette nuit, et voir Ferrand",
   r:`Vous arrivez à deux heures dix. Vous voyez la militante — elle est intubée, vous ne lui parlez pas. Vous voyez le jeune du service d'ordre, qui vous demande des nouvelles des autres avant de parler de lui.<br><br>Puis vous voyez Ferrand, dix minutes, sans caméras. Personne ne saura ce qui s'est dit. Le lendemain, il refusera de vous attaquer pendant huit jours.`,
   e:{social:12,sec:{interieure:6},
      groups:{salaries:10,retraites:12,ruraux:9,jeunes:7}},
   pose:"ralliement_digne", rival:-9},
  {l:"Allocution solennelle : suspendre la campagne huit jours",
   r:`Vingt heures, allocution de six minutes. Toutes les réunions publiques suspendues, tous les candidats appelés à faire de même.<br><br>Le pays s'arrête un peu et respire. Huit jours plus tard, la campagne reprend, plus courte et plus grave. Vous avez perdu du temps de terrain et gagné une stature.`,
   e:{social:9,sec:{interieure:8},economie:-3,
      groups:{retraites:11,salaries:7,ruraux:6}},
   pose:"campagne_suspendue", rival:-4},
  {l:"Annoncer des mesures d'ordre immédiates avant toute enquête",
   r:`Vous parlez à minuit : contrôle renforcé des meetings, fichier élargi, moyens exceptionnels.<br><br>À trois heures du matin, on apprend que le tireur agissait seul, sans mobile politique établi. Vos annonces se retrouvent en porte-à-faux, prises pour ce qu'elles sont : une réaction avant les faits.`,
   e:{sec:{interieure:18},social:-9,
      groups:{retraites:13,ruraux:10,jeunes:-15,salaries:-5}},
   axe:{autorite:2}, pose:"ordre_immediat", rival:8}
 ]},

{id:"m42", ch:7, mois:42, ico:"🎒", t:"Le lycée",
 intro:[
  [()=>S.flags.revalo_profs, `Vous avez revalorisé les enseignants il y a trois ans. Ce
    sont eux qui parleront aux caméras, et ils ne vous détestent pas.`],
  [()=>valeur("social")<40, `Cela fait des années que les rapports parlent de la santé
    mentale des adolescents. Cela fait des années qu'ils s'empilent.`]
 ],
 d:`Un lycée de deux mille élèves à Poitiers. Un garçon de dix-sept ans, une arme prise chez
    son père, et onze minutes avant l'intervention du RAID.<br><br>
    Deux morts, une professeure de mathématiques et un élève de seconde. Le tireur est
    vivant. On a retrouvé sur son ordinateur trois signalements faits par des camarades,
    en février, sur une plateforme qui n'a jamais donné suite.<br><br>
    Les parents attendent devant les grilles depuis quatre heures du matin.`,
 o:[
  {l:"Un plan national de santé mentale pour la jeunesse",
   r:`Trois mille postes, consultations gratuites jusqu'à vingt-cinq ans, un dispositif d'alerte dans chaque établissement.<br><br>Les professeurs de Poitiers publient une lettre ouverte pour dire qu'il aurait fallu le faire avant. Ils ont raison. Le plan tiendra, parce que la douleur du moment aura permis de le financer.`,
   e:{budget:-18,soc:{sante:20,educ:14},
      groups:{jeunes:15,salaries:11,retraites:6,patrons:-6}},
   axe:{social:1}, pose:"prog_sante_mentale", rival:-10},
  {l:"Sécuriser les établissements : portiques, contrôles, présence policière",
   r:`Portiques dans quinze cents lycées, un référent sécurité par établissement.<br><br>Les parents se sentent mieux, les élèves beaucoup moins. Un proviseur résume à la radio : « Nous avons transformé nos écoles en aéroports et nous n'avons rien réglé de ce qui a fait basculer ce garçon. » La phrase tourne beaucoup.`,
   e:{budget:-14,sec:{interieure:18},soc:{educ:-8},
      groups:{retraites:12,ruraux:9,jeunes:-11}},
   axe:{autorite:2}, pose:"prog_securite"},
  {l:"S'attaquer aux armes détenues à domicile, quitte à affronter le lobby",
   r:`Coffres obligatoires, contrôle biennal, retrait automatique en cas de signalement.<br><br>Les fédérations de chasse organisent la plus grosse manifestation de leur histoire. Le texte passe quand même, amputé d'un tiers. Le nombre d'armes déclarées augmente de dix-huit pour cent en un an, ce qui veut dire qu'elles existaient déjà.`,
   e:{sec:{interieure:14},social:5,economie:-3,
      groups:{jeunes:11,salaries:8,ruraux:-14,patrons:-5}},
   pose:"prog_armes", rival:6}
 ]},

{id:"m43", ch:8, mois:43, ico:"🚌", t:"La campagne",
 intro:[
  [()=>S.rival>=62, `Dans les salles, il y a du monde. Dans les sondages, il n'y a rien.
    Vos équipes ont arrêté de commenter les deux ensemble.`],
  [()=>S.flags.terrain_regulier, `Vous faites ça depuis trois ans. Ça se voit : vous
    connaissez les prénoms, et ça change tout.`],
  [()=>popularite()<35, `Deux meetings ont été annulés faute de sécurité. On ne l'a pas
    dit à la presse.`]
 ],
 d:`Six semaines, quatre-vingts déplacements, et une odeur de gymnase que vous n'oublierez
    pas. Vous avez perdu quatre kilos et gagné une certitude : le pays ne vous doit rien.<br><br>
    À Amiens, une femme vous attrape le bras dans la foule et vous dit une phrase de six
    mots. Votre équipe voudrait que vous la citiez partout. Vous n'êtes pas sûr d'en avoir
    le droit.<br><br>
    Le premier tour est dans huit jours.`,
 o:[
  {l:"Faire campagne sur la peur de l'autre",
   r:`Trois meetings, un cap : ce que le pays deviendrait avec lui.<br><br>Ça mobilise vos plus âgés et ça fonctionne dans les sondages. Ça déprime aussi une partie de vos militants, dont deux responsables de fédération démissionnent. Vous avez gagné des points en vendant quelque chose que vous n'aimez pas.`,
   e:{social:-8,groups:{retraites:13,ruraux:9,jeunes:-14,salaries:-4}},
   axe:{autorite:1}, pose:"campagne_peur", rival:-7},
  {l:"Faire campagne sur votre bilan, chiffres en main",
   r:`Cent vingt réunions, un document de quarante pages, des chiffres vérifiables.<br><br>C'est solide, précis et un peu froid. Deux fact-checkers confirment l'essentiel de vos données, ce qui est rare et ne fait pas la une. Vous convainquez ceux qui écoutaient déjà.`,
   e:{economie:4,groups:{patrons:9,retraites:6,salaries:5}},
   pose:"campagne_bilan"},
  {l:"Faire campagne sur les gens rencontrés, pas sur vous",
   r:`Vous ouvrez chaque meeting par une histoire : une infirmière, un agriculteur, une prof.<br><br>Ce n'est pas un procédé, ce sont des gens que vous avez vraiment vus depuis cinq ans, et ça s'entend. Les salles écoutent autrement. C'est la meilleure campagne que vous ayez faite, et vous l'avez trouvée à la fin.`,
   e:{social:10,groups:{salaries:11,ruraux:12,jeunes:9,retraites:6}},
   pose:"campagne_terrain", rival:-11}
 ]},

{id:"m46", ch:8, mois:46, ico:"🗳️", t:"Le premier tour",
 intro:[
  [()=>S.rival>=60, `Il est arrivé en tête. De onze points. Les commentateurs parlent déjà
    au passé de votre quinquennat.`],
  [()=>S.rival<40, `Vous êtes en tête. Personne n'y croyait il y a un an, à commencer
    par vous.`]
 ],
 d:`Vingt heures. Deux visages sur l'écran, le vôtre et le sien, et deux semaines pour
    convaincre ceux qui n'ont voulu ni de l'un ni de l'autre.<br><br>
    Les reports sont un calcul froid : trois millions d'électeurs à aller chercher quelque
    part, et chaque endroit où vous irez les chercher vous en fera perdre ailleurs.<br><br>
    Votre directrice de campagne pose la carte électorale sur la table. « Où est-ce qu'on
    va, monsieur le Président ? »`,
 o:[
  {l:"Chercher les abstentionnistes des quartiers populaires",
   r:`Onze déplacements en douze jours, des salles pleines, des questions dures.<br><br>La participation monte de quatre points dans les quartiers concernés. C'est peu et c'est énorme : ces quatre points-là ne se trouvent nulle part ailleurs. Vos adversaires vous accusent de « clientélisme », ce qui est le mot qu'on emploie quand quelqu'un va chercher des voix qu'on avait renoncé à chercher.`,
   e:{soc:{pauvrete:10},groups:{jeunes:14,salaries:9,retraites:-6}},
   pose:"report_populaire", rival:-8},
  {l:"Chercher l'électorat modéré de droite",
   r:`Trois déplacements en province, un discours sur l'autorité et un autre sur l'entreprise.<br><br>Ça marche : les reports se solidifient. Mais deux de vos soutiens de gauche annoncent qu'ils ne voteront pas, et une partie de votre électorat de premier tour vous regarde partir sans bouger.`,
   e:{economie:5,cac:4,groups:{patrons:12,retraites:11,jeunes:-9}},
   axe:{social:-1}, pose:"report_droite", rival:-9},
  {l:"Ne courir après personne : tenir votre ligne jusqu'au bout",
   r:`Pas de virage, pas de meeting de circonstance. Vous dites la même chose qu'il y a cinq ans, avec cinq ans de dossiers en plus.<br><br>C'est reposant et risqué. Un éditorialiste écrit : « Il n'a pas cherché à plaire, ce qui est soit du courage, soit de la fatigue. » Vous ne saurez jamais lequel des deux c'était.`,
   e:{social:7,groups:{salaries:6,jeunes:6,ruraux:5,patrons:4}},
   pose:"report_ligne", rival:-4}
 ]},

{id:"m47", ch:8, mois:47, ico:"🌙", t:"La veille",
 intro:[
  [()=>S.rival>=55, `Vous savez déjà. Tout le monde sait déjà. Il reste à le vivre.`],
  [()=>S.rival<42, `Vous avez de l'avance et personne n'ose prononcer le mot « victoire »,
    par superstition.`]
 ],
 d:`Le dernier soir. Plus de meeting, plus de sondage publiable, plus rien à faire qu'attendre
    que soixante-dix millions de personnes fassent leur affaire de cinq ans de votre vie.<br><br>
    Vous êtes seul dans le bureau. Sur la table, deux discours : celui de la victoire et celui
    de la défaite. Le second est meilleur, c'est toujours le cas.<br><br>
    Quelqu'un frappe. C'est votre plume, qui vient chercher les corrections.`,
 o:[
  {l:"Corriger les deux discours et rentrer dormir",
   r:`Vous relisez les deux textes, vous coupez trois adjectifs dans celui de la défaite, et vous rentrez à minuit.<br><br>Vous dormez quatre heures. C'est plus que les nuits précédentes.`,
   e:{groups:{salaries:3,retraites:3,ruraux:2}},
   pose:"veille_calme"},
  {l:"Ajouter un dernier message aux Français, ce soir, en direct",
   r:`Deux minutes, sans prompteur, à vingt heures trente. Vous ne demandez pas un vote : vous dites ce que vous avez essayé de faire.<br><br>Quatre millions de personnes regardent. Ce n'est pas décisif, mais dans une élection serrée, plus rien n'est négligeable.`,
   e:{social:6,groups:{salaries:6,jeunes:5,ruraux:5,retraites:4}},
   pose:"veille_message", rival:-5},
  {l:"Appeler Ferrand",
   r:`Vous l'appelez à vingt-deux heures. La conversation dure quatre minutes et reste courtoise.<br><br>Vous lui dites que quel que soit le résultat, la passation se fera correctement. Il répond la même chose. Aucun des deux ne le racontera, et c'est ce qui rend ce coup de fil important.`,
   e:{social:5,groups:{retraites:7,patrons:5,jeunes:3}},
   pose:"veille_appel", rival:-3}
 ]},

{id:"m31", ch:6, mois:31, ico:"🧑‍🌾", t:"Le blocage",
 intro:[
  [()=>S.flags.rationnement||S.flags.eau_sacrifiee, `Le monde agricole ne vous a pas
    pardonné l'été dernier. Ce blocage-là commence avec un contentieux.`],
  [()=>S.axes.ecologie>=3, `Vos normes environnementales sont les plus strictes d'Europe.
    C'est écrit sur les banderoles, et ce n'est pas un compliment.`]
 ],
 d:`Ils sont arrivés à quatre heures du matin. Six cents tracteurs, huit axes autoroutiers,
    et un dépôt pétrolier bloqué depuis hier soir.<br><br>
    Le président de la FNSEA vous appelle lui-même : « Je ne les contrôle plus. Ce n'est pas
    une menace, monsieur le Président, c'est un constat. Il y a des gens là-bas qui n'ont
    plus rien à perdre et qui le savent. »<br><br>
    Les préfets attendent des consignes avant le lever du jour.`,
 o:[
  {l:"Recevoir les organisations et suspendre trois normes",
   r:`Trois arrêtés suspendus dans la nuit, un moratoire de deux ans sur un quatrième.<br><br>Les tracteurs repartent avant midi. Les associations environnementales, elles, publient une carte des zones concernées : ce sont précisément celles où les nappes sont déjà les plus dégradées.`,
   e:{cli:{sols:-14,eau:-8},economie:5,groups:{ruraux:15,jeunes:-11,patrons:6}},
   axe:{ecologie:-1}, pose:"normes_suspendues", rival:-6},
  {l:"Débloquer une aide d'urgence sans toucher aux normes",
   r:`Quatre cents millions débloqués en quarante-huit heures, versés avant la fin du mois.<br><br>C'est cher, ça ne règle rien sur le fond, et ça évite un mort. Le président de la FNSEA vous appelle pour vous remercier, en privé. Il continuera à vous critiquer en public, et c'est le jeu.`,
   e:{budget:-14,groups:{ruraux:9,jeunes:4}},
   pose:"aide_agricole"},
  {l:"Faire dégager les axes avant le lever du jour",
   r:`Six heures du matin, huit axes rouverts, cent dix interpellations.<br><br>Un tracteur a été poussé dans le fossé par un blindé et l'image est très mauvaise. Le trafic est rétabli avant l'heure de pointe et la circulation reprend. Dans les campagnes, on retiendra le blindé.`,
   e:{sec:{interieure:12},social:-10,groups:{ruraux:-17,retraites:7,jeunes:-5}},
   axe:{autorite:2}, pose:"deblocage_force", rival:12}
 ]},

{id:"m45", ch:8, mois:45, ico:"🎬", t:"La vidéo",
 intro:[
  [()=>S.flags.debat_attaque, `Vous l'avez attaqué au débat sur ce qu'il cachait. On dira
    que vous récoltez ce que vous avez semé.`],
  [()=>S.flags.pression_presse, `Vous avez déjà fait pression sur un journal. Personne ne
    vous croira quand vous crierez à la manipulation.`],
  [()=>S.flags.transparence, `Vous avez tout publié pendant cinq ans. C'est votre seul
    capital ce matin, et il va falloir le dépenser en entier.`]
 ],
 d:`Quarante et une secondes. On vous y voit, dans un salon que vous reconnaissez, dire
    une phrase que vous n'avez jamais dite, sur des gens que vous n'avez jamais méprisés
    comme ça.<br><br>
    C'est un faux. Les experts le confirmeront, et il leur faudra entre trois et six jours.
    Le vote est dans huit.<br><br>
    À onze heures, la vidéo avait onze millions de vues. Trois grandes chaînes l'ont
    diffusée en annonçant qu'elle était « probablement truquée ».`,
 o:[
  {l:"Démentir sur toutes les antennes, immédiatement, sans attendre les experts",
   r:`Sept plateaux en trente heures, la même phrase répétée : « C'est faux, et ce sera prouvé. »<br><br>Vous avez l'air sincère parce que vous l'êtes. Mais démentir, c'est répéter, et la vidéo gagne trois millions de vues pendant que vous en parlez. L'expertise arrivera le surlendemain du vote.`,
   e:{social:6,groups:{salaries:7,retraites:6,ruraux:5,jeunes:4}},
   pose:"sprint_final", rival:-5},
  {l:"Publier tout : agenda, images sources, expertise en direct",
   r:`Vous ouvrez tout : agenda du jour concerné, images brutes de l'événement réel, deux laboratoires en direct sur un plateau.<br><br>La démonstration est technique et incontestable. Elle prend quarante minutes et la moitié du pays la regarde. Le faux s'effondre en une soirée, et quelque chose d'autre s'installe : l'idée qu'on peut vérifier.`,
   e:{social:11,budget:-4,groups:{jeunes:13,salaries:9,patrons:5}},
   pose:"transparence_totale", rival:-11},
  {l:"Porter plainte et faire suspendre les comptes qui la relaient",
   r:`Plainte déposée, référé obtenu, quatre cents comptes suspendus en quarante-huit heures.<br><br>La vidéo, elle, continue de circuler par messagerie privée. Et le débat glisse : on ne parle plus du faux, on parle d'un président qui fait fermer des comptes à huit jours du vote.`,
   e:{sec:{interieure:6},social:-9,
      groups:{jeunes:-13,salaries:-7,retraites:7}},
   axe:{autorite:2}, pose:"censure_plateformes", rival:7}
 ]},

{id:"m48", ch:8, mois:48, ico:"⏳", t:"Le dimanche",
 intro:[
  [()=>S.rival>=55, `Vous avez fait ce que vous pouviez. Les derniers chiffres disent que
    ce ne sera pas assez, et les derniers chiffres se trompent rarement.`],
  [()=>S.rival<40, `Tout indique que vous allez l'emporter. Vous n'arrivez pas à y croire
    complètement, et c'est probablement une bonne chose.`],
  [()=>S.flags.transparence, `Quoi qu'il arrive ce soir, vous n'aurez rien caché. C'est
    peu de chose et c'est beaucoup.`]
 ],
 d:`Dix heures du matin. Vous avez voté à onze heures moins le quart devant deux cents
    photographes, et depuis, il n'y a plus rien à faire.<br><br>
    Cinq ans tiennent dans les huit heures qui viennent. Le personnel de l'Élysée est
    étrangement silencieux ; ils ont déjà vécu ça, et ils savent que ce soir, quoi qu'il
    arrive, cette maison changera d'habitudes.<br><br>
    Votre plus jeune conseiller vous demande si vous voulez qu'on allume les écrans.`,
 o:[
  {l:"« Non. On les allumera à vingt heures. »",
   r:`Vous passez la journée dans le parc, puis dans le bureau, à ne rien faire d'utile.<br><br>À dix-neuf heures cinquante, le personnel se rassemble sans qu'on l'ait demandé. Quelqu'un allume la télévision. Personne ne parle.`,
   e:{groups:{salaries:3,retraites:4,ruraux:3,jeunes:2}},
   pose:"dimanche_calme", final:true},
  {l:"Écrire une lettre à votre successeur, quel qu'il soit",
   r:`Vous écrivez trois pages à la main, dans le bureau vide. Vous y mettez les dossiers qu'on ne trouve pas dans les notes : ceux dont on hérite sans le savoir.<br><br>Vous la glissez dans le tiroir du bureau. Elle y sera dans huit heures, que ce soit vous ou lui qui l'ouvre.`,
   e:{social:6,groups:{jeunes:6,salaries:5,retraites:5,ruraux:4}},
   pose:"lettre_successeur", final:true},
  {l:"Passer les derniers coups de fil : chaque voix compte encore",
   r:`Quarante appels dans la journée : des maires, des présidents de fédération, deux syndicalistes.<br><br>Vous ne demandez rien. Vous remerciez, ce qui est la seule chose qu'on puisse encore faire un dimanche à quatorze heures. Trois d'entre eux vous rappelleront le soir, quel que soit le résultat.`,
   e:{groups:{salaries:5,ruraux:6,retraites:4}},
   pose:"derniers_appels", rival:-3, final:true}
 ]},

/* ═══════════ ANNÉE V · le second mandat commence ═══════════ */

{id:"n49", ch:9, mois:49, ico:"🏛️", t:"Le second serment",
 intro:[
  [()=>S.rival>=55, `Vous avez gagné de justesse. La moitié du pays a voté pour l'autre,
    et cette moitié-là ne l'oubliera pas.`],
  [()=>S.rival<40, `Vous avez gagné largement. C'est précisément ce qui rend la suite
    dangereuse : personne ne vous dira plus non.`]
 ],
 d:`Salle des fêtes, deuxième investiture. Les mêmes lustres, les mêmes visages, et une
    différence que personne ne prononce à voix haute : dans cinq ans, vous partirez.<br><br>
    Le président du Conseil constitutionnel proclame les résultats. En descendant de
    l'estrade, votre secrétaire général vous glisse : « À partir d'aujourd'hui, monsieur le
    Président, tout ce que vous ferez sera pour après vous. »<br><br>
    Trois personnes dans cette salle veulent déjà votre place.`,
 o:[
  {l:"Annoncer que vous ne vous représenterez jamais, dès ce soir",
   r:`Vous le dites en huit mots, à la fin du discours, sans que personne s'y attende.<br><br>
      L'effet est immédiat et double : vous gagnez une liberté d'action que peu de présidents
      ont connue, et vous devenez un homme dont on compte les jours. Les deux commencent
      le même soir.`,
   e:{social:8,groups:{salaries:7,jeunes:9,ruraux:6,retraites:5}},
   pose:"renonciation_publique", rival:-6},
  {l:"Former un gouvernement de personnalités hors parti",
   r:`Une directrice d'hôpital, un économiste, une préfète, un ancien juge. Six ministres
      sur dix-huit n'ont jamais été élus.<br><br>
      Les partis hurlent à la technocratie. Les nominations sont saluées ailleurs, et deux
      dossiers qui traînaient depuis quatre ans sont réglés en six semaines.`,
   e:{economie:7,social:5,soc:{sante:8},groups:{patrons:8,salaries:5,jeunes:5}},
   pose:"gouvernement_experts"},
  {l:"Reconduire l'équipe sortante : la continuité, rien d'autre",
   r:`Aucun changement, aucun signal. Le communiqué tient en quatre lignes.<br><br>
      Vos ministres sont soulagés et vos militants consternés. Un éditorial résume ce que
      beaucoup pensent : « Il a gagné cinq ans et il n'a rien à en faire. » La phrase est
      injuste. Elle vous suivra quand même.`,
   e:{economie:3,groups:{patrons:5,jeunes:-6,salaries:-4}},
   pose:"continuite_seche", rival:7}
 ]},

{id:"n50", ch:9, mois:50, ico:"🗝️", t:"Ce que vous n'aviez pas pu faire",
 intro:[
  [()=>S.flags.recul_majeur||S.flags.recul_precoce, `Il y a un texte que vous avez retiré
    sous la pression. Il est toujours dans un tiroir, et vous le savez.`],
  [()=>S.dette>160, `Avec cette dette, la marge est étroite. Ce qui n'a pas été fait en
    cinq ans coûtera plus cher aujourd'hui.`]
 ],
 d:`Votre directrice de cabinet a préparé une liste : les réformes abandonnées du premier
    mandat. Onze dossiers, tous impopulaires, tous nécessaires.<br><br>
    « Vous avez trois ans de fenêtre utile, monsieur le Président. Après, plus personne ne
    votera rien pour un homme qui s'en va. Ce que vous ne lancez pas avant l'an VII ne se
    fera pas. »<br><br>
    Elle a souligné trois lignes.`,
 o:[
  {l:"La réforme des retraites, enfin, et jusqu'au bout",
   r:`Le texte est déposé en mars. Six semaines de manifestations, quatre nuits de débat,
      et une loi qui passe à onze voix.<br><br>
      Le système est équilibré à l'horizon 2050 pour la première fois depuis trente ans.
      Votre popularité perd quatorze points en un trimestre. Vous saviez le prix, vous
      l'avez payé, et il n'y a rien d'héroïque là-dedans : juste un calcul assumé.`,
   e:{budget:16,dette:-9,economie:8,soc:{pouvoir:-18,pauvrete:-10},
      groups:{salaries:-16,retraites:-14,patrons:14}},
   axe:{social:-1}, pose:"retraites_faites", rival:9},
  {l:"La refonte de l'État : fusionner, supprimer, simplifier",
   r:`Quatre agences supprimées, deux ministères fusionnés, trente mille postes non
      remplacés sur cinq ans.<br><br>
      C'est austère, technique, et ça produit un effet inattendu : les délais administratifs
      baissent de trente pour cent en deux ans. Personne ne vous en remerciera parce que
      personne ne mesure ce qui a cessé d'être pénible.`,
   e:{budget:12,economie:9,cac:5,social:-8,
      groups:{patrons:12,salaries:-9,ruraux:-6}},
   pose:"refonte_etat"},
  {l:"La grande loi sur la fin de vie et la santé mentale",
   r:`Deux ans de travaux, une convention citoyenne, un texte qui divise les familles avant
      de diviser l'Assemblée.<br><br>
      Il passe en novembre. Ce n'est pas une réforme d'économie ni de puissance : c'est
      celle dont on vous parlera dans les dîners pendant vingt ans, et celle que des gens
      vous remercieront d'avoir faite, en vous croisant, longtemps après.`,
   e:{budget:-11,soc:{sante:24,pauvrete:10},social:9,
      groups:{salaries:9,retraites:11,jeunes:8}},
   axe:{social:1}, pose:"loi_fin_de_vie", rival:-8}
 ]},

{id:"n51", ch:9, mois:51, ico:"👥", t:"Les trois qui attendent",
 d:`Ils sont trois dans votre camp à vouloir vous succéder, et ils ont commencé le soir de
    votre réélection.<br><br>
    Le Premier ministre a la légitimité. La ministre de l'Économie a les réseaux et les
    résultats. Le jeune président de région a quarante et un ans et un talent que vous
    n'aviez pas à son âge.<br><br>
    Aucun des trois n'a demandé à vous voir. C'est bien pire : ils s'organisent sans vous.`,
 o:[
  {l:"Choisir maintenant et l'installer",
   r:`Vous tranchez pour l'un d'eux et vous lui donnez les moyens : agenda, dossiers,
      déplacements internationaux.<br><br>
      Les deux autres comprennent en une semaine. L'un reste et travaille, l'autre commence
      à parler aux journalistes. Vous avez un dauphin et un ennemi intérieur, ce qui est
      le tarif normal.`,
   e:{social:3,groups:{patrons:5,retraites:4}},
   dauphin:22, pose:"dauphin_choisi"},
  {l:"Les faire travailler ensemble et trancher plus tard",
   r:`Vous les mettez sur trois grands dossiers, publiquement, à égalité.<br><br>
      Ils se surveillent et ils produisent : c'est le meilleur trimestre gouvernemental
      depuis longtemps. La question reste ouverte, ce qui vous garde puissant et les garde
      loyaux. Jusqu'au jour où il faudra choisir, et ce jour approchera.`,
   e:{economie:6,social:5,groups:{salaries:5,patrons:6,jeunes:4}},
   dauphin:10, pose:"competition_ouverte"},
  {l:"Ne pas entrer dans ce jeu : gouverner, c'est tout",
   r:`Vous refusez la question chaque fois qu'on vous la pose, et on vous la posera
      quatre-vingts fois.<br><br>
      Vous gardez les mains libres. Votre camp, lui, s'organise sans vous et se divise
      lentement, en trois écuries qui ne se parlent plus. Ce sera le problème de la fin,
      et ce sera un vrai problème.`,
   e:{economie:4,groups:{patrons:4}},
   dauphin:-8, pose:"succession_ignoree"}
 ]},

{id:"n52", ch:9, mois:52, ico:"🌐", t:"La guerre ailleurs",
 intro:[
  [()=>valeur("securite")<45, `Nos armées sont à l'os. Ce que vous allez promettre, il
    faudra pouvoir le tenir.`],
  [()=>S.flags.riposte||S.axes.autorite>=4, `Vous avez déjà frappé une fois. On vous
    regarde différemment dans les états-majors alliés.`]
 ],
 d:`Un allié européen est attaqué sur son flanc est. Pas une escarmouche : des colonnes
    blindées, une capitale sous alerte, et un article de traité que personne n'avait
    jamais invoqué.<br><br>
    Le Conseil de défense siège depuis onze heures. Trois options sur la table, et un chef
    d'état-major qui répète la même phrase : « Ce que nous enverrons, nous ne l'aurons plus
    ici pendant dix-huit mois. »<br><br>
    L'Assemblée sera consultée. Elle ne décidera pas.`,
 o:[
  {l:"Envoyer une brigade et l'annoncer clairement",
   r:`Quatre mille hommes, deux escadrons, un porte-avions repositionné en Méditerranée.
      L'annonce est faite à l'Assemblée dans un silence qu'on n'y entend jamais.<br><br>
      La dissuasion fonctionne : l'offensive s'arrête à cent kilomètres de la capitale.
      Trois soldats français mourront en dix-huit mois. Vous écrirez trois lettres.`,
   e:{sec:{defense:22,interieure:4},budget:-18,economie:-4,
      groups:{retraites:9,ruraux:7,jeunes:-8}},
   axe:{autorite:1}, pose:"engagement_militaire"},
  {l:"Soutien matériel et logistique, sans troupes au sol",
   r:`Munitions, radars, formation. Deux milliards, aucun soldat français exposé.<br><br>
      C'est le choix raisonnable et il est reçu comme tel : ni héroïque ni lâche. L'allié
      obtient ce dont il a besoin sans obtenir ce qu'il demandait. Il s'en souviendra dans
      les deux sens.`,
   e:{sec:{defense:10},budget:-9,economie:-2,groups:{patrons:4,jeunes:3}},
   pose:"soutien_materiel"},
  {l:"Pousser une médiation et refuser l'escalade",
   r:`Vous proposez Paris comme lieu de négociation et vous refusez tout envoi.<br><br>
      Deux capitales alliées parlent de « défection ». La médiation échoue en six semaines.
      Mais elle laisse un canal ouvert qui servira, dix-huit mois plus tard, à négocier un
      cessez-le-feu que personne d'autre n'aurait pu obtenir.`,
   e:{sec:{defense:-8},budget:-3,social:6,
      groups:{jeunes:10,salaries:6,retraites:-9,ruraux:-5}},
   axe:{autorite:-1}, pose:"mediation"}
 ]},

{id:"n54", ch:10, mois:54, ico:"⚙️", t:"La machine grippe",
 intro:[
  [()=>S.flags.refonte_etat, `Vous avez réformé l'État il y a deux ans. On vous dira que
    c'est pour ça, et ce ne sera qu'à moitié faux.`],
  [()=>popularite()<40, `Vous n'avez plus les moyens politiques d'imposer grand-chose.
    Les administrations le savent avant vous.`]
 ],
 d:`Un décret d'application signé il y a quatorze mois n'est toujours pas appliqué dans
    quatre régions. Personne n'a refusé : ça ne s'est simplement pas fait.<br><br>
    Votre secrétaire général a mené l'enquête et le résultat est plus inquiétant qu'un
    sabotage : « Ils attendent, monsieur le Président. Ils attendent le suivant. C'est la
    première fois que je vois ça aussi tôt. »<br><br>
    Il vous reste quarante-deux mois.`,
 o:[
  {l:"Faire un exemple : deux préfets et un directeur d'administration limogés",
   r:`Trois mouvements publiés au Journal officiel un vendredi matin, sans explication.<br><br>
      Le message passe et le décret est appliqué en trois semaines. Le corps préfectoral,
      lui, se ferme d'un bloc. Pendant les trois années qui restent, les notes qui vous
      remontent seront plus prudentes, donc moins utiles.`,
   e:{sec:{interieure:6},economie:5,social:-6,groups:{patrons:7,salaries:-6}},
   axe:{autorite:2}, pose:"exemple_prefets"},
  {l:"Aller les voir, région par région, et comprendre pourquoi",
   r:`Quatre déplacements, quatre journées entières passées dans des salles de réunion sans
      caméras.<br><br>
      Le blocage n'était pas politique : le décret était inapplicable en l'état, et personne
      n'avait osé le dire. Vous le réécrivez. C'est la chose la moins spectaculaire que vous
      ferez cette année et probablement la plus utile.`,
   e:{economie:7,soc:{sante:6},social:5,groups:{ruraux:8,salaries:6}},
   pose:"ecoute_terrain", dauphin:4},
  {l:"Contourner : créer une agence directement rattachée à l'Élysée",
   r:`Une structure de quatre-vingts personnes, rattachée au président, dotée d'un pouvoir
      d'injonction.<br><br>
      Ça marche vite. Ça crée aussi un doublon de plus dans un État qui en compte déjà trop,
      et votre successeur le supprimera dans les six mois. Vous aurez gagné trois ans
      d'efficacité et laissé une couche supplémentaire.`,
