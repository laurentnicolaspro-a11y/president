  {l:"Envoyer une brigade et l'annoncer clairement",
   r:`Quatre mille hommes, deux escadrons, un porte-avions repositionné en Méditerranée.
      L'annonce est faite à l'Assemblée dans un silence qu'on n'y entend jamais.<br><br>
      La dissuasion fonctionne : l'offensive s'arrête à cent kilomètres de la capitale.
      Trois soldats français mourront en dix-huit mois. Vous écrirez trois lettres.`,
   e:{sec:{defense:22,interieure:4},budget:-18,economie:-4,
      groups:{retraites:9,ruraux:7,jeunes:-8}},
   axe:{autorite:1}, pose:"engagement_militaire"},
  {l:"Soutien matériel et logistique, sans troupes au sol",
   r:`Munitions, radars, formation. Deux milliards, aucun soldat français exposé.<br><br>
      C'est le choix raisonnable et il est reçu comme tel : ni héroïque ni lâche. L'allié
      obtient ce dont il a besoin sans obtenir ce qu'il demandait. Il s'en souviendra dans
      les deux sens.`,
   e:{sec:{defense:10},budget:-9,economie:-2,groups:{patrons:4,jeunes:3}},
   pose:"soutien_materiel"},
  {l:"Pousser une médiation et refuser l'escalade",
   r:`Vous proposez Paris comme lieu de négociation et vous refusez tout envoi.<br><br>
      Deux capitales alliées parlent de « défection ». La médiation échoue en six semaines.
      Mais elle laisse un canal ouvert qui servira, dix-huit mois plus tard, à négocier un
      cessez-le-feu que personne d'autre n'aurait pu obtenir.`,
   e:{sec:{defense:-8},budget:-3,social:6,
      groups:{jeunes:10,salaries:6,retraites:-9,ruraux:-5}},
   axe:{autorite:-1}, pose:"mediation"}
 ]},

{id:"n54", ch:10, mois:54, ico:"⚙️", t:"La machine grippe",
 intro:[
  [()=>S.flags.refonte_etat, `Vous avez réformé l'État il y a deux ans. On vous dira que
    c'est pour ça, et ce ne sera qu'à moitié faux.`],
  [()=>popularite()<40, `Vous n'avez plus les moyens politiques d'imposer grand-chose.
    Les administrations le savent avant vous.`]
 ],
 d:`Un décret d'application signé il y a quatorze mois n'est toujours pas appliqué dans
    quatre régions. Personne n'a refusé : ça ne s'est simplement pas fait.<br><br>
    Votre secrétaire général a mené l'enquête et le résultat est plus inquiétant qu'un
    sabotage : « Ils attendent, monsieur le Président. Ils attendent le suivant. C'est la
    première fois que je vois ça aussi tôt. »<br><br>
    Il vous reste quarante-deux mois.`,
 o:[
  {l:"Faire un exemple : deux préfets et un directeur d'administration limogés",
   r:`Trois mouvements publiés au Journal officiel un vendredi matin, sans explication.<br><br>
      Le message passe et le décret est appliqué en trois semaines. Le corps préfectoral,
      lui, se ferme d'un bloc. Pendant les trois années qui restent, les notes qui vous
      remontent seront plus prudentes, donc moins utiles.`,
   e:{sec:{interieure:6},economie:5,social:-6,groups:{patrons:7,salaries:-6}},
   axe:{autorite:2}, pose:"exemple_prefets"},
  {l:"Aller les voir, région par région, et comprendre pourquoi",
   r:`Quatre déplacements, quatre journées entières passées dans des salles de réunion sans
      caméras.<br><br>
      Le blocage n'était pas politique : le décret était inapplicable en l'état, et personne
      n'avait osé le dire. Vous le réécrivez. C'est la chose la moins spectaculaire que vous
      ferez cette année et probablement la plus utile.`,
   e:{economie:7,soc:{sante:6},social:5,groups:{ruraux:8,salaries:6}},
   pose:"ecoute_terrain", dauphin:4},
  {l:"Contourner : créer une agence directement rattachée à l'Élysée",
   r:`Une structure de quatre-vingts personnes, rattachée au président, dotée d'un pouvoir
      d'injonction.<br><br>
      Ça marche vite. Ça crée aussi un doublon de plus dans un État qui en compte déjà trop,
      et votre successeur le supprimera dans les six mois. Vous aurez gagné trois ans
      d'efficacité et laissé une couche supplémentaire.`,
   e:{budget:-7,economie:6,groups:{patrons:5,salaries:-3}},
   pose:"agence_elysee"}
 ]},

{id:"n55", ch:10, mois:55, ico:"🧊", t:"Le rapport du GIEC",
 intro:[
  [()=>S.axes.ecologie>=4, `Vous avez fait de l'écologie votre marque. Ce rapport va dire
    si ça a servi à quelque chose.`],
  [()=>S.axes.ecologie<=-2, `Vous avez reculé sur le climat à plusieurs reprises. Le
    rapport ne vous nomme pas. Les journalistes s'en chargeront.`]
 ],
 d:`Le nouveau rapport tombe un mardi. Il dit ce que disaient les précédents, avec des
    intervalles de confiance plus étroits et des dates plus proches.<br><br>
    Une phrase du résumé pour décideurs circule dans toutes les rédactions : les
    engagements actuels mènent à un réchauffement de 2,7 °C. La France est dans la
    trajectoire, pas devant.<br><br>
    Vous recevez les auteurs français jeudi. Ils sont fatigués d'être reçus.`,
 o:[
  {l:"Inscrire les budgets carbone dans la Constitution",
   r:`Congrès réuni à Versailles. Le texte passe à quatre-vingt-onze voix au-dessus de la
      majorité requise, après huit mois de bataille.<br><br>
      C'est irréversible, ou presque. Trois fédérations industrielles saisissent tout ce
      qui peut être saisi et perdent. Vos successeurs devront faire avec, et c'était
      exactement le but.`,
   e:{cli:{air:26,eau:14,foret:12,sols:10},economie:-8,cac:-7,budget:-6,
      groups:{jeunes:16,patrons:-15,ruraux:-8}},
   axe:{ecologie:3}, pose:"climat_constitution", rival:6},
  {l:"Un plan d'adaptation massif : accepter ce qui vient",
   r:`Trente milliards sur dix ans : littoral, forêts, réseaux d'eau, plan canicule
      permanent.<br><br>
      C'est le premier plan français à admettre que le réchauffement aura lieu de toute
      façon. Certains y voient un renoncement. Les préfets, eux, savent que c'est ce qui
      leur manquait depuis quinze ans.`,
   e:{budget:-22,cli:{eau:18,foret:14,sols:12},soc:{sante:8},
      groups:{ruraux:11,jeunes:8,patrons:-6}},
   axe:{ecologie:2}, pose:"plan_adaptation_majeur"},
  {l:"Recevoir, remercier, et ne rien annoncer",
   r:`Une heure quarante d'échange, un communiqué de six lignes, aucune mesure.<br><br>
      L'une des auteurs déclare en sortant : « Nous avons été écoutés. Nous l'avons déjà
      été. » La séquence dure deux jours. Elle laisse cette impression durable qu'entre
      savoir et agir, il y a chez vous une distance qu'on ne comble pas.`,
   e:{cli:{air:-6},groups:{jeunes:-13,salaries:-4}},
   axe:{ecologie:-1}, pose:"giec_ignore", rival:8}
 ]},

{id:"n56", ch:10, mois:56, ico:"💊", t:"La pénurie",
 d:`Quatre molécules essentielles manquent depuis six semaines : un antibiotique
    pédiatrique, deux anticancéreux, un traitement du diabète.<br><br>
    Les pharmaciens rationnent. Deux cent quarante mille patients sont concernés. La cause
    est connue depuis quinze ans : quatre-vingts pour cent des principes actifs viennent de
    deux pays.<br><br>
    Le directeur général de la santé pose une note sur la table : « Nous pouvons gérer la
    crise. Nous ne pouvons pas gérer la suivante avec les mêmes moyens. »`,
 o:[
  {l:"Relocaliser : financer la production de principes actifs en France",
   r:`Quatre milliards, trois sites, une commande publique garantie sur dix ans — le seul
      argument qui décide un industriel.<br><br>
      Le premier site produit trente mois plus tard. Vous ne serez plus là. Mais lors de la
      pénurie suivante, en 2034, la France sera l'un des trois pays européens à ne pas
      rationner.`,
   e:{budget:-15,economie:9,soc:{sante:14},cac:4,
      groups:{patrons:9,salaries:8,retraites:9}},
   pose:"relocalisation_sante", dauphin:3},
  {l:"Réquisitionner les stocks et plafonner les prix",
   r:`Réquisition par décret, plafonnement, interdiction d'exportation.<br><br>
      La crise passe en quatre semaines. Deux laboratoires réduisent leur présence en
      France l'année suivante, et l'un d'eux retire deux médicaments du marché national.
      Vous avez résolu le problème et fabriqué le suivant.`,
   e:{soc:{sante:16,pouvoir:6},economie:-6,cac:-8,
      groups:{salaries:11,retraites:12,patrons:-14}},
   axe:{social:1}, pose:"requisition_medicaments"},
  {l:"Acheter en urgence sur le marché mondial, à n'importe quel prix",
   r:`Onze avions affrétés en trois semaines, à quatre fois le prix normal.<br><br>
      Les rayons se remplissent, la crise disparaît des journaux. Le surcoût est de neuf
      cents millions, et la dépendance est exactement la même qu'avant. On appelle ça
      gérer, et ce n'est pas rien, mais ce n'est que ça.`,
   e:{budget:-11,soc:{sante:10},groups:{retraites:7,salaries:5}},
   pose:"achat_urgence"}
 ]},

/* ═══════════ ANNÉE VI ═══════════ */

{id:"n61", ch:11, mois:61, ico:"🏗️", t:"Le chantier de votre nom",
 intro:[
  [()=>S.dette>175, `Avec cette dette, un grand projet est une provocation. Vos conseillers
    vous le disent tous, sauf un.`],
  [()=>S.projetsFinis.length>=4, `Vous avez déjà livré quatre grands chantiers. Celui-ci
    serait celui dont on se souviendra.`]
 ],
 d:`Chaque président laisse un bâtiment, une ligne, un institut. C'est vaniteux et c'est
    ainsi depuis deux siècles.<br><br>
    Trois projets sont sur la table : un institut de recherche sur le vivant à Saclay, une
    ligne ferroviaire transversale qui désenclaverait le centre du pays, un programme de
    reconstruction de deux cents écoles rurales.<br><br>
    Un seul sera financé. Les trois directeurs de projet attendent dans trois salons
    différents.`,
 o:[
  {l:"L'institut : miser sur la science",
   r:`Deux milliards, quatre mille chercheurs, un bâtiment que vous n'inaugurerez pas.<br><br>
      Onze ans plus tard, une équipe y publiera un travail qui changera la prise en charge
      d'une maladie neurodégénérative. Votre nom sera sur une plaque à l'entrée que
      personne ne lira jamais.`,
   e:{budget:-13,economie:11,cac:6,soc:{educ:12},pib:1.4,
      groups:{jeunes:12,patrons:8}},
   pose:"legs_institut", dauphin:4},
  {l:"La ligne : désenclaver le centre",
   r:`Six milliards, neuf ans de travaux, quatre cents kilomètres.<br><br>
      Douze départements qui n'avaient rien vu venir depuis quarante ans voient arriver des
      pelleteuses. Le coût dérapera de trente pour cent, comme toujours. Et dans quinze
      ans, on prendra ce train sans savoir qui l'a décidé.`,
   e:{budget:-17,economie:9,cli:{air:8},pib:1.7,
      groups:{ruraux:17,salaries:7,patrons:5}},
   pose:"legs_ligne"},
  {l:"Les écoles : deux cents communes rurales",
   r:`Un milliard deux, deux cents chantiers, aucune inauguration nationale.<br><br>
      Ce n'est pas un grand projet, c'est deux cents petits. Aucun journal n'en parlera.
      Deux cents maires, eux, garderont la photo du jour de la réouverture dans leur
      bureau, et c'est une autre façon de rester quelque part.`,
   e:{budget:-9,soc:{educ:20,pauvrete:8},
      groups:{ruraux:15,jeunes:10,salaries:7}},
   pose:"legs_ecoles", dauphin:3}
 ]},

{id:"n62", ch:11, mois:62, ico:"📉", t:"Le décrochage industriel",
 intro:[
  [()=>S.eco<50, `L'économie va mal depuis longtemps. Cette annonce-là est la conséquence,
    pas la cause.`],
  [()=>S.flags.legs_institut||S.flags.relocalisation_sante, `Vous avez investi dans la
    recherche et la production. C'est long. Ce dossier-ci n'attendra pas.`]
 ],
 d:`Le dernier fabricant européen de composants pour éoliennes annonce sa fermeture. Ce
    n'est pas une usine de plus : c'est le dernier maillon d'une filière.<br><br>
    Après lui, chaque éolienne installée en France sera intégralement importée. Le rapport
    qui vous est remis emploie une formule sèche : « perte de souveraineté irréversible à
    horizon cinq ans ».<br><br>
    L'acquéreur potentiel est un fonds asiatique. Il a déjà déposé son offre.`,
 o:[
  {l:"Bloquer la vente et nationaliser la filière",
   r:`Décret d'investissement étranger, veto, entrée de l'État à 34 %.<br><br>
      La filière survit. Le fonds saisit l'arbitrage international et la France perdra en
      2031, avec une indemnité de six cents millions. Vous aurez gardé la filière et payé
      pour ça, ce qui est un choix défendable et un chèque bien réel.`,
   e:{budget:-16,economie:7,cli:{air:8},cac:-6,pib:0.8,
      groups:{salaries:14,patrons:-11,jeunes:8}},
   axe:{social:1}, pose:"nationalisation_filiere"},
  {l:"Monter un consortium européen en six semaines",
   r:`Trois États, quatre industriels, un tour de table bouclé à Bruxelles un dimanche
      soir.<br><br>
      C'est la solution la plus élégante et la plus improbable. Elle tient. La production
      reste en Europe, répartie sur trois pays, et la France en garde le tiers. Votre
      ministre de l'Industrie en pleurera dans l'avion du retour.`,
   e:{budget:-8,economie:11,cac:6,cli:{air:6},pib:1.2,
      groups:{patrons:11,salaries:9,jeunes:6}},
   pose:"consortium_europeen", dauphin:5},
  {l:"Laisser vendre : le marché décide",
   r:`La vente est autorisée en trois semaines. Le site reste ouvert dix-huit mois, puis
      la production part.<br><br>
      Six cents emplois. Et une dépendance de plus, ajoutée à une liste qui s'allonge
      depuis trente ans sans que personne n'ait jamais eu à en répondre.`,
   e:{economie:-7,cli:{air:-6},pib:-1.2,
      groups:{salaries:-13,patrons:6,jeunes:-8}},
   pose:"vente_autorisee", rival:9}
 ]},

{id:"n63", ch:11, mois:63, ico:"🕊️", t:"Le prisonnier",
 intro:[
  [()=>S.flags.contrats_signes||S.flags.realpolitik, `Vous avez déjà serré cette main-là
    en échange de contrats. On vous rappellera le prix que vous aviez accepté de payer.`],
  [()=>S.flags.conditionnalite, `Vous aviez refusé les contrats pour des prisonniers, il y
    a des années. On s'en souvient là-bas, et pas en bien.`]
 ],
 d:`Un universitaire franco-iranien, détenu depuis quatre ans, entame une grève de la faim.
    Trente-huit jours. Les médecins estiment qu'il lui reste deux semaines.<br><br>
    Le canal officieux transmet une demande : la libération d'un ingénieur détenu en France,
    poursuivi pour violation d'embargo. Un échange, sans le mot.<br><br>
    Le garde des Sceaux rappelle que la France n'échange pas de prisonniers. Le Quai
    d'Orsay rappelle que si.`,
 o:[
  {l:"Accepter l'échange, discrètement",
   r:`Deux avions, un aéroport de province, aucune caméra. Il rentre un mardi à l'aube,
      dix-neuf kilos en moins.<br><br>
      Sa famille vous remercie en privé et ne dira jamais rien publiquement, comme convenu.
      Trois mois plus tard, une note du renseignement signale que l'ingénieur libéré a repris
      ses activités. Vous avez sauvé une vie et rendu quelque chose en échange.`,
   e:{social:7,sec:{defense:-6},groups:{salaries:8,jeunes:9,retraites:5}},
   pose:"echange_prisonnier"},
  {l:"Refuser l'échange et internationaliser le dossier",
   r:`Vous portez l'affaire devant l'ONU, vous obtenez quatorze cosignataires, vous faites
      du bruit.<br><br>
      Il arrête sa grève au cinquante-quatrième jour, sur demande de sa famille. Il sera
      libéré vingt-deux mois plus tard, sans contrepartie visible. Vous n'avez rien cédé et
      il a passé presque deux ans de plus en cellule.`,
   e:{sec:{defense:5},social:4,groups:{jeunes:6,patrons:4,retraites:-4}},
   pose:"refus_echange"},
  {l:"Négocier autre chose : lever des sanctions ciblées",
   r:`Trois sanctions bancaires levées contre sa libération. Ni échange de prisonniers, ni
      refus : un troisième terme, trouvé en dix jours.<br><br>
      Il rentre en février. Deux de vos alliés européens protestent contre la levée. Vous
      avez inventé une sortie, ce qui est le fond du métier et ne s'enseigne nulle part.`,
   e:{social:6,economie:-3,groups:{jeunes:7,salaries:6,patrons:-4}},
   pose:"negociation_laterale", dauphin:3}
 ]},

{id:"n65", ch:12, mois:65, ico:"🎯", t:"Le retour de Ferrand",
 intro:[
  [()=>S.rival>=60, `Il n'est jamais vraiment parti. Il n'a fait que descendre d'un
    étage pour mieux remonter.`],
  [()=>S.rival<40, `On le disait fini après sa défaite. Les gens finis reviennent
    souvent, et mieux préparés.`]
 ],
 d:`Il a passé trois ans à faire le tour des fédérations, des salons agricoles et des
    plateaux de deuxième partie de soirée. Il a maigri, il a appris à parler moins fort,
    et il vient d'annoncer sa candidature pour dans trente mois.<br><br>
    Son discours d'annonce dure vingt-six minutes. Il ne vous attaque pas une seule fois.
    Il parle du pays « d'après », comme si vous étiez déjà de l'histoire ancienne.<br><br>
    C'est beaucoup plus efficace que tout ce qu'il a fait avant.`,
 o:[
  {l:"L'attaquer frontalement, dès maintenant",
   r:`Vous répondez en deux jours, dans une interview, en démontant son bilan régional
      point par point.<br><br>
      Vous avez raison sur les faits. Mais un président sortant qui s'en prend à un
      candidat trente mois avant le scrutin, ça se voit : vous venez de le désigner comme
      votre successeur naturel. C'est exactement ce qu'il espérait.`,
   e:{social:-5,groups:{jeunes:-6,salaries:-4,retraites:4}},
   axe:{autorite:1}, pose:"attaque_ferrand", rival:8},
  {l:"L'ignorer et occuper le terrain par des résultats",
   r:`Aucune réponse, aucun commentaire, quatre déplacements de terrain dans le mois.<br><br>
      Vous refusez le duel et vous forcez la comparaison sur ce que vous faites contre ce
      qu'il promet. C'est plus lent et plus solide. Il devra venir vous chercher, et venir
      chercher un président sortant coûte toujours quelque chose.`,
   e:{economie:6,social:5,groups:{salaries:6,ruraux:6,patrons:5}},
   pose:"ignorer_ferrand", rival:-6},
  {l:"Le prendre au sérieux : proposer un débat sur le fond",
   r:`Vous proposez publiquement un débat contradictoire sur la dette et l'énergie. Il
      accepte, il ne peut pas faire autrement.<br><br>
      Le débat a lieu en juin et il est excellent, ce que personne n'attendait. Vous en
      sortez tous les deux grandis, ce qui vous coûte davantage qu'à lui : il n'avait pas
      de stature, il en a une maintenant.`,
   e:{social:8,economie:4,groups:{jeunes:8,salaries:7,patrons:5}},
   pose:"debat_ferrand", rival:4}
 ]},

{id:"n66", ch:12, mois:66, ico:"🩸", t:"Le scandale sanitaire",
 intro:[
  [()=>S.flags.privatisation||S.flags.hopital_prive, `Vous avez ouvert l'hôpital au privé.
    Le dispositif en cause est né de là, et tout le monde le sait déjà.`],
  [()=>S.flags.sauvetage_hopital||S.flags.relocalisation_sante, `Vous avez beaucoup investi
    dans la santé. C'est ce qui rend l'affaire plus incompréhensible encore.`]
 ],
 d:`Un dispositif médical implanté chez soixante mille patientes depuis douze ans. Un
    registre norvégien montre un taux de complications quatre fois supérieur à celui
    déclaré.<br><br>
    L'agence française a été alertée en 2019. Le signalement a été classé. La personne qui
    l'a classé est aujourd'hui à la retraite et parle volontiers aux journalistes.<br><br>
    Les premières plaintes sont déposées jeudi. Il y en aura huit mille.`,
 o:[
  {l:"Retrait immédiat, fonds d'indemnisation, commission indépendante",
   r:`Retrait du marché en quarante-huit heures, huit cents millions provisionnés, une
      commission présidée par une magistrate qu'on ne peut soupçonner de rien.<br><br>
      La commission rendra un rapport accablant pour l'agence et pour deux gouvernements,
      dont le vôtre. Vous l'aurez commandé vous-même. C'est la seule manière d'être cru
      quand on est en cause.`,
   e:{budget:-14,soc:{sante:12},social:9,
      groups:{salaries:10,retraites:9,jeunes:7,patrons:-6}},
   pose:"transparence", rival:-10},
  {l:"Suspendre le dispositif et laisser la justice travailler",
   r:`Suspension conservatoire, aucune commission, aucun fonds.<br><br>
      C'est juridiquement irréprochable et humainement insuffisant. Les victimes se
      constituent en association et obtiendront gain de cause en 2036. D'ici là, elles
      auront occupé onze fois le parvis de votre ministère.`,
   e:{soc:{sante:4},social:-5,groups:{salaries:-6,retraites:-5}},
   pose:"suspension_seule"},
  {l:"Défendre l'agence : « nous n'allons pas juger avec dix ans de recul »",
   r:`Vous prenez la défense de l'expertise publique, ce qui part d'une bonne intention.<br><br>
      Le lendemain, une patiente de trente-quatre ans témoigne au journal de vingt heures.
      Votre phrase est diffusée juste avant son témoignage. C'est le genre de montage qu'on
      ne peut pas reprocher aux journalistes : il suffisait de mettre les deux à la suite.`,
   e:{soc:{sante:-10},social:-13,
      groups:{salaries:-12,retraites:-11,jeunes:-9}},
   pose:"defense_agence", rival:12}
 ]},

{id:"n67", ch:12, mois:67, ico:"🧮", t:"Le mur",
 intro:[
  [()=>S.dette>190, `La dette a franchi tous les seuils. Ce rendez-vous n'est plus une
    alerte, c'est une convocation.`],
  [()=>S.dette<130, `Vous avez tenu les comptes. Ce rendez-vous, pour une fois, n'est pas
    une épreuve.`]
 ],
 d:`Le taux à dix ans a pris quatre-vingts points de base en trois semaines. Ce n'est pas
    une crise : c'est une réévaluation, ce qui est pire, parce que ça ne redescend pas.<br><br>
    Le directeur de l'Agence France Trésor est formel : « À ce niveau, la charge de la dette
    dépasse le budget de l'Éducation nationale dans dix-huit mois. Ce n'est pas une
    projection, monsieur le Président. C'est de l'arithmétique. »<br><br>
    Il vous reste trente mois.`,
 o:[
  {l:"Un plan de redressement de trente milliards, assumé publiquement",
   r:`Trente milliards sur trois ans, présentés dans une allocution de quinze minutes où
      vous nommez chaque coupe.<br><br>
      Les taux se détendent en dix jours. Le pays encaisse mal, très mal. Mais votre
      successeur héritera d'une trajectoire tenable, et il ne vous en remerciera jamais
      parce qu'on ne remercie pas pour ce qu'on n'a pas eu à subir.`,
   e:{budget:20,dette:-16,economie:6,cac:8,soc:{pouvoir:-16,sante:-10,pauvrete:-10},
      groups:{patrons:15,salaries:-15,retraites:-13}},
   axe:{social:-2}, pose:"redressement_assume", rival:8},
  {l:"Réduire par la croissance : investir davantage, pas moins",
   r:`Vous refusez l'austérité et vous engagez douze milliards sur l'industrie et
      l'énergie.<br><br>
      C'est un pari sur le dénominateur : si la croissance vient, le ratio baisse sans
      couper. Deux économistes vous soutiennent publiquement, les marchés attendent, et
      la réponse ne viendra qu'après votre départ.`,
   e:{budget:-9,dette:5,economie:12,cac:5,pib:1.6,
      groups:{patrons:8,salaries:7,jeunes:6}},
   pose:"pari_croissance"},
  {l:"Gagner du temps : allonger la maturité de la dette",
   r:`L'AFT émet à trente et cinquante ans pendant six mois, verrouillant les taux
      actuels.<br><br>
      C'est technique, intelligent et strictement indolore aujourd'hui. La charge est
      lissée, le problème est reporté d'une décennie. Vous avez acheté du temps avec
      l'argent de gens qui n'étaient pas nés.`,
   e:{budget:6,dette:-3,cac:3,groups:{patrons:5}},
   pose:"maturite_allongee"}
 ]},

/* ═══════════ ANNÉE VII · la succession ═══════════ */

{id:"n73", ch:13, mois:73, ico:"🪑", t:"Le Premier ministre s'en va",
 intro:[
  [()=>S.dauphin>=45, `Celui que vous prépariez est parfaitement placé. Il vient de
    comprendre que Matignon est un piège autant qu'un tremplin.`],
  [()=>S.dauphin<25, `Vous n'avez préparé personne. Cette vacance-là arrive au pire
    moment possible.`]
 ],
 d:`Il démissionne un mercredi matin, poliment, en invoquant « le temps nécessaire pour
    préparer l'avenir ». Tout le monde traduit : il part faire campagne.<br><br>
    Vous avez trois jours pour nommer quelqu'un. Et ce que vous ferez de Matignon dans les
    vingt-quatre mois qui viennent décidera si votre camp a un candidat ou trois.<br><br>
    Le téléphone n'a pas cessé de sonner depuis l'annonce.`,
 o:[
  {l:"Nommer votre dauphin : lui donner la vitrine",
   r:`Il est nommé le vendredi. Matignon lui donne une exposition quotidienne et une
      responsabilité sur chaque mauvaise nouvelle.<br><br>
      Il gagne dix points en six mois et en reperd huit lors de la première crise. C'est
      le prix du poste : on n'y grandit qu'en y souffrant, et certains n'y survivent pas.`,
   e:{social:4,economie:3,groups:{patrons:5,salaries:4}},
   dauphin:16, pose:"dauphin_matignon"},
  {l:"Nommer un technicien loyal : garder la main jusqu'au bout",
   r:`Un directeur d'administration centrale, sans ambition présidentielle, sans réseau
      partisan.<br><br>
      Vous gouvernez sans partage pendant deux ans, ce qui est confortable. Votre camp,
      lui, entre en campagne sans machine ni chef, et il le paiera exactement le jour où
      il faudra être prêt.`,
   e:{economie:6,budget:4,groups:{patrons:7}},
   dauphin:-10, pose:"pm_technique"},
  {l:"Nommer une rivale : la mettre à l'épreuve du réel",
   r:`Vous nommez celle qui vous critiquait le plus, ce que personne n'avait envisagé.<br><br>
      Elle accepte en vingt minutes. Elle est bonne, et ça se voit. Vous avez transformé
      une adversaire en héritière possible, et vous avez perdu le contrôle du calendrier :
      désormais, c'est elle qui incarne l'avenir.`,
   e:{social:7,economie:5,groups:{jeunes:8,salaries:6,patrons:4}},
   dauphin:12, pose:"rivale_matignon", rival:-5}
 ]},

{id:"n74", ch:13, mois:74, ico:"⚡", t:"La motion",
 intro:[
  [()=>popularite()<35, `Vous n'avez plus de majorité solide depuis des mois. Cette
    motion-là a une chance réelle.`],
  [()=>S.flags.retraites_faites||S.flags.redressement_assume, `Vous avez fait passer
    ce que personne n'osait faire. On vient vous en présenter la note.`]
 ],
 d:`Une motion de censure déposée par l'opposition, soutenue en coulisse par onze députés
    de votre majorité qui trouvent que le président sortant les encombre.<br><br>
    Il manque cinq voix. Votre directeur des relations avec le Parlement a fait le compte :
    « Ils ne veulent pas vous renverser, monsieur le Président. Ils veulent qu'on sache
    qu'ils pourraient. »<br><br>
    Le vote est jeudi à seize heures.`,
 o:[
  {l:"Recevoir les onze, un par un, et écouter",
   r:`Onze rendez-vous en deux jours, vingt minutes chacun. Vous ne promettez rien à neuf
      d'entre eux : vous les écoutez, ce que personne n'avait fait depuis trois ans.<br><br>
      Huit votent contre la censure. La motion échoue à treize voix. Deux d'entre eux
      deviendront des soutiens fidèles jusqu'au bout, pour une raison qu'ils n'expliqueront
      jamais bien.`,
   e:{social:6,groups:{salaries:6,ruraux:5,retraites:4}},
   pose:"ecoute_deputes", dauphin:3},
  {l:"Poser la question de confiance : les obliger à choisir devant le pays",
   r:`Vous transformez la censure en vote de confiance, en direct, à l'Assemblée.<br><br>
      Le pari est risqué et il passe à neuf voix. Les onze frondeurs, exposés nommément,
      rentrent dans le rang pour dix-huit mois. Vous avez gagné en dramatisant, ce qui
      marche une fois et une seule.`,
   e:{social:-4,economie:4,groups:{patrons:8,retraites:5,jeunes:-5}},
   axe:{autorite:1}, pose:"confiance_posee"},
  {l:"Ne rien faire : laisser le vote avoir lieu",
   r:`Aucun appel, aucun rendez-vous, aucune consigne. La motion recueille dix-neuf voix
      de moins que la majorité requise.<br><br>
      Vous avez tenu sans rien céder. Mais les onze savent maintenant qu'ils existent, et
      ils recommenceront à chaque texte difficile. Vous avez gagné un vote et perdu une
      majorité.`,
   e:{groups:{patrons:4,salaries:-5,jeunes:-4}},
   pose:"censure_ignoree", rival:6}
 ]},

{id:"n76", ch:13, mois:76, ico:"🌾", t:"La terre",
 intro:[
  [()=>S.axes.ecologie>=4, `Vous avez imposé des normes que ces gens-là subissent depuis
    six ans. Ils viennent chercher des comptes.`],
  [()=>S.flags.normes_suspendues, `Vous aviez suspendu les normes il y a quatre ans. On
    revient chercher la suite.`]
 ],
 d:`Un agriculteur de cinquante-six ans s'est donné la mort dans son exploitation en
    laissant une lettre de deux pages. Elle est publiée par sa fille.<br><br>
    Elle ne parle pas de normes ni de subventions. Elle parle de trente ans de travail, de
    prix qu'il ne fixait pas, et d'une phrase qui revient : « Je n'ai jamais eu le droit de
    décider de ce que je vendais. »<br><br>
    Deux cents tracteurs sont partis vers Paris hier soir.`,
 o:[
  {l:"Imposer des prix planchers par la loi",
   r:`Prix minimum garanti sur six filières, opposable à la grande distribution.<br><br>
      Bruxelles ouvre une procédure en trois semaines. La France la perdra en 2033, mais
      d'ici là le dispositif aura tenu quatre ans, et il aura fait remonter le revenu médian
      agricole de dix-huit pour cent. Certains combats valent d'être perdus plus tard.`,
   e:{budget:-9,economie:-4,soc:{pouvoir:-6},cli:{sols:6},
      groups:{ruraux:19,salaries:-5,patrons:-12}},
   axe:{social:1}, pose:"prix_planchers", rival:-9},
  {l:"Un plan de reprise : installer mille jeunes agriculteurs par an",
   r:`Portage foncier, garantie de revenu sur cinq ans, formation. Mille installations par
      an pendant huit ans.<br><br>
      C'est long et ça ne calme personne aujourd'hui. En 2038, la France sera le seul pays
      d'Europe de l'Ouest où l'âge moyen des agriculteurs aura cessé d'augmenter.`,
   e:{budget:-13,cli:{sols:12},soc:{pauvrete:6},
      groups:{ruraux:13,jeunes:9,patrons:-4}},
   axe:{ecologie:1}, pose:"installation_jeunes", dauphin:3},
  {l:"Aller à l'enterrement, sans annonce",
   r:`Une église de village, cent quarante personnes, aucune caméra — vous avez demandé
      qu'il n'y en ait pas.<br><br>
      Sa fille vous serre la main à la sortie et ne dit rien. Vous n'annoncez rien cette
      semaine-là. Ce n'est pas une politique agricole. C'est la seule chose juste à faire
      ce jour-là, et vous la faites.`,
   e:{social:8,groups:{ruraux:14,salaries:7,retraites:6}},
   pose:"enterrement", rival:-7}
 ]},

{id:"n78", ch:14, mois:78, ico:"📚", t:"Le bilan qu'on écrit sans vous",
 intro:[
  [()=>S.dette>180, `La dette occupe quatre chapitres sur douze. C'est ce qu'on retiendra,
    quoi que vous ayez fait par ailleurs.`],
  [()=>S.axes.ecologie>=5, `Le chapitre climat est le plus long. Pour une fois, une
    politique aura eu le temps de produire des courbes.`]
 ],
 d:`Trois historiens et deux économistes publient un ouvrage de six cents pages sur vos
    huit années. Ils ne vous ont pas demandé d'entretien.<br><br>
    Le livre n'est ni un pamphlet ni une hagiographie : c'est pire, c'est un inventaire.
    Chaque promesse, chaque chiffre, chaque écart entre les deux.<br><br>
    Votre directrice de la communication l'a lu en une nuit. Elle a corné dix-neuf pages.`,
 o:[
  {l:"Leur ouvrir les archives de l'Élysée",
   r:`Vous autorisez l'accès aux notes, aux arbitrages, aux comptes rendus de Conseil.<br><br>
      La deuxième édition, deux ans plus tard, sera plus dure sur certains points et
      beaucoup plus juste sur d'autres. Elle deviendra la référence. Vous aurez accepté
      d'être jugé sur pièces plutôt que sur impressions.`,
   e:{social:9,groups:{jeunes:10,salaries:7,patrons:4}},
   pose:"archives_ouvertes", rival:-7},
  {l:"Répondre par un entretien-fleuve",
   r:`Six heures d'entretien, publiées intégralement, où vous reprenez leurs griefs un
      par un.<br><br>
      Vous êtes convaincant sur les deux tiers. Le dernier tiers, celui où vous n'avez pas
      de réponse, est celui qu'on citera. C'est toujours celui-là.`,
   e:{social:5,groups:{salaries:5,retraites:4,jeunes:3}},
   pose:"entretien_fleuve"},
  {l:"Ne pas commenter : l'Histoire ne se négocie pas",
   r:`Silence complet. Aucun élément de langage, aucune consigne à vos ministres.<br><br>
      Le livre se vend à quatre-vingt mille exemplaires et devient la version admise. Vous
      avez refusé de vous défendre, ce qui est digne, et vous avez laissé cinq personnes
      écrire seules ce que huit ans ont voulu dire.`,
   e:{groups:{patrons:3,retraites:3}},
   pose:"silence_historiens"}
 ]},

{id:"n80", ch:14, mois:80, ico:"🌊", t:"La submersion",
 intro:[
  [()=>S.flags.plan_adaptation_majeur||S.flags.plan_adaptation, `Vos digues datent de
    quatre ans. On va savoir cette nuit si elles valaient leur prix.`],
  [()=>S.axes.ecologie<=0, `Les rapports recommandaient de renforcer ce littoral depuis
    dix ans. Ils sont tous dans les mêmes tiroirs.`]
 ],
 d:`Une conjonction de coefficient de marée, de dépression et de vent que les modèles
    donnaient à une chance sur deux cents par an. Elle s'est produite deux fois en six ans.<br><br>
    Onze communes sous deux mètres d'eau, quatre mille évacuations, deux morts. Une commune
    entière est déclarée inhabitable à terme par les géomètres.<br><br>
    Le maire vous appelle à trois heures du matin : « Il faut leur dire qu'ils ne
    reviendront pas. Je ne peux pas le faire seul. »`,
 o:[
  {l:"Aller le dire vous-même : cette commune ne sera pas reconstruite",
   r:`Vous êtes dans la salle des fêtes le lendemain à quinze heures. Vous dites la
      phrase que personne n'avait jamais dite à des Français : votre village ne sera pas
      reconstruit.<br><br>
      Il y a des cris, puis un silence très long. Le relogement est financé à cent pour
      cent, sur place ou ailleurs, au choix. C'est la journée la plus dure de vos huit ans.`,
   e:{budget:-16,cli:{eau:14,sols:8},social:6,
      groups:{ruraux:8,salaries:6,jeunes:7}},
   axe:{ecologie:2}, pose:"repli_assume", dauphin:4},
  {l:"Reconstruire, avec des digues plus hautes",
   r:`Six cents millions de digues, une promesse de retour sous dix-huit mois.<br><br>
      Les habitants rentrent, la commune revit, et le rapport du BRGM classe la zone en
      risque « fort à très fort » à horizon 2050. Vous avez rendu leur village à des gens
      qui y tenaient. Quelqu'un d'autre aura à leur reparler.`,
   e:{budget:-19,cli:{eau:-6},groups:{ruraux:15,salaries:6,jeunes:-6}},
   pose:"reconstruction"},
  {l:"Laisser les préfets arbitrer commune par commune",
   r:`Vous déléguez, avec une enveloppe et une doctrine.<br><br>
      Trois communes sont reconstruites, une est abandonnée, et le choix a reposé sur des
      fonctionnaires qui n'avaient pas de mandat pour ça. Deux préfets demanderont leur
      mutation dans l'année.`,
   e:{budget:-11,cli:{eau:4},groups:{ruraux:-6,salaries:-3}},
   pose:"delegation_prefets"}
 ]},

{id:"n82", ch:14, mois:82, ico:"🤖", t:"La bascule",
 d:`Un rapport interministériel estime que quatre cent mille emplois de bureau seront
    automatisés en France d'ici cinq ans. Comptabilité, back-office bancaire, service
    client, une partie du droit.<br><br>
    Ce ne sont pas des ouvriers cette fois : ce sont des diplômés, des cadres moyens, des
    gens qui votent et qui écrivent.<br><br>
    Le rapport devait rester confidentiel. Il sera dans la presse jeudi, et vous le savez.`,
 o:[
  {l:"Taxer l'automatisation pour financer la reconversion",
   r:`Une contribution sur les gains de productivité automatisés, fléchée vers la
      formation.<br><br>
      Les entreprises hurlent, trois quittent leur siège français. Le fonds lève quatre
      milliards par an et forme cent vingt mille personnes en trois ans. C'est la
      première réponse structurée d'un pays européen sur ce sujet, et elle sera copiée.`,
   e:{budget:8,economie:-6,cac:-9,soc:{educ:16,pauvrete:10},
      groups:{salaries:12,jeunes:9,patrons:-16}},
   axe:{social:2}, pose:"taxe_automatisation"},
  {l:"Un droit universel à la reconversion, financé par l'État",
   r:`Deux ans de formation financés pour tout actif dont le métier disparaît, sans
      condition.<br><br>
      Neuf milliards par an. C'est massif, c'est simple, et ça devient très vite un droit
      auquel personne n'osera toucher. Votre successeur en héritera comme on hérite d'une
      maison : sans avoir choisi, et sans pouvoir la vendre.`,
   e:{budget:-17,soc:{educ:20,pauvrete:12},economie:5,
      groups:{salaries:14,jeunes:12,patrons:-6}},
   axe:{social:1}, pose:"droit_reconversion", dauphin:4},
  {l:"Miser sur l'attractivité : que les emplois créés soient créés ici",
   r:`Crédit d'impôt massif sur les métiers émergents, campus, visas accélérés.<br><br>
      Onze mille emplois qualifiés créés en trois ans, concentrés dans quatre
      métropoles. Les quatre cent mille autres, eux, sont dans des villes moyennes où
      rien de tout cela n'arrive. Vous avez traité la moitié du problème, la plus
      facile.`,
   e:{economie:12,cac:9,pib:1.5,soc:{pauvrete:-8},
      groups:{patrons:13,jeunes:8,ruraux:-9,salaries:-6}},
   pose:"attractivite"}
 ]},

/* ═══════════ ANNÉE VIII · la sortie ═══════════ */

{id:"n85", ch:15, mois:85, ico:"🎖️", t:"L'adoubement",
 intro:[
  [()=>S.dauphin>=55, `Votre candidat est prêt. Le lui dire publiquement peut tout
    consolider — ou tout figer.`],
  [()=>S.dauphin<25, `Vous n'avez personne, et il est trop tard pour fabriquer
    quelqu'un. Il va falloir faire avec.`]
 ],
 d:`Le congrès de votre camp se tient dans six semaines. Il désignera un candidat, avec
    ou sans vous.<br><br>
    Trois noms, une salle de trois mille personnes, et une question que tout le monde vous
    posera : est-ce que le président sortant prend parti ?<br><br>
    Votre soutien vaut vingt points dans une primaire fermée. Il en coûte peut-être autant
    au second tour.`,
 o:[
  {l:"Le soutenir publiquement, sans ambiguïté",
   r:`Vous montez à la tribune du congrès et vous dites son nom. La salle se lève.<br><br>
      Il gagne la primaire au premier tour. Il passera ensuite six mois à expliquer qu'il
      n'est pas votre continuateur, ce qui est difficile quand on a été désigné par vous
      devant trois mille personnes et quarante caméras.`,
   e:{social:3,groups:{patrons:5,retraites:4,jeunes:-4}},
   dauphin:20, pose:"adoubement_public"},
  {l:"Le soutenir en coulisse, rester neutre en public",
   r:`Vous ne dites rien publiquement et vous passez quarante coups de fil.<br><br>
      Il gagne la primaire de justesse. Il peut se présenter comme un homme neuf, ce qui
      est faux et efficace. C'est la manœuvre la plus utile de votre fin de mandat et
      personne ne saura jamais qu'elle a eu lieu.`,
   e:{groups:{patrons:3,salaries:3}},
   dauphin:13, pose:"soutien_coulisse"},
  {l:"Rester strictement à l'écart : le congrès est souverain",
   r:`Vous refusez de vous exprimer, y compris en privé. Le congrès désigne au troisième
      tour, après une bataille de six semaines.<br><br>
      Le candidat désigné sort abîmé d'une primaire fratricide. Vous avez respecté la
      démocratie interne de votre camp, et votre camp part au combat avec un chef
      contesté.`,
   e:{social:5,groups:{jeunes:5,salaries:4}},
   dauphin:-6, pose:"neutralite_congres"}
 ]},

{id:"n88", ch:15, mois:88, ico:"🗃️", t:"Ce qui restait dans le coffre",
 intro:[
  [()=>S.flags.pression_presse||S.flags.secret_defense||S.flags.chantage_cede,
    `Vous avez déjà tenté d'étouffer quelque chose. Ce dossier-ci a attendu son heure,
     et son heure est excellente.`],
  [()=>S.flags.transparence||S.flags.archives_ouvertes, `Vous avez tout ouvert depuis
    des années. C'est ce qui rend ce dossier presque inoffensif.`]
 ],
 d:`Camille Reyes publie à sept mois du scrutin. Ce n'est pas sur vous : c'est sur une
    décision prise en votre nom, il y a six ans, par des gens qui ne sont plus là.<br><br>
    Un marché public, une commission, un intermédiaire. Rien qui vous soit imputable
    juridiquement, tout qui vous soit imputable politiquement.<br><br>
    Votre avocat vous dit que vous ne risquez rien. Votre directrice de campagne vous dit
    que ce n'est pas la question.`,
 o:[
  {l:"Saisir la justice vous-même et tout rendre public",
   r:`Signalement au parquet le jour même, documents publiés dans la foulée.<br><br>
      L'enquête durera trois ans et n'aboutira à rien vous concernant. Mais l'image du
      président sortant qui saisit lui-même la justice sur son propre dossier fait
      quelque chose dans un pays qui n'y croyait plus.`,
   e:{social:11,groups:{salaries:9,jeunes:12,ruraux:8,retraites:6}},
   pose:"transparence", rival:-11, dauphin:6},
  {l:"Répondre sur le fond, sans dramatiser",
   r:`Une conférence de presse de quarante minutes, tous les documents sur la table,
      aucune plainte, aucune indignation.<br><br>
      C'est propre et ça retombe en dix jours. Ni gain ni perte, ce qui, à sept mois d'un
      scrutin et pour un dossier de cette nature, ressemble beaucoup à une victoire.`,
   e:{social:4,groups:{salaries:4,patrons:3}},
   pose:"reponse_sobre"},
  {l:"Dénoncer une opération de déstabilisation",
   r:`Vous parlez de calendrier, de manipulation, de « ceux qui tiennent la plume ».<br><br>
      La Société des journalistes du titre publie l'intégralité de sa méthode d'enquête
      en réponse. Elle est irréprochable. Vous avez transformé un dossier de six ans en
      affaire du moment, et vous avez fourni le carburant vous-même.`,
   e:{social:-12,groups:{jeunes:-14,salaries:-10,retraites:-5}},
   axe:{autorite:1}, pose:"destabilisation", rival:13, dauphin:-8}
 ]},

{id:"n92", ch:16, mois:92, ico:"📜", t:"Le dernier Conseil",
 intro:[
  [()=>popularite()<35, `Vous partez impopulaire, comme presque tous. Ce Conseil-là sera
    silencieux.`],
  [()=>S.pib>3600, `Vous laissez un pays plus riche qu'à votre arrivée. C'est rare et
    ça ne se dit pas à voix haute.`]
 ],
 d:`Salle Murat, une dernière fois. Les mêmes lustres, une table où plus personne n'est
    celui de la photo d'il y a huit ans.<br><br>
    L'ordre du jour tient en une page. Après, il y aura les remerciements, la photo, et
    ce moment où vingt-deux personnes ne sauront pas comment sortir d'une pièce.<br><br>
    Le secrétaire général vous demande si vous voulez dire quelque chose.`,
 o:[
  {l:"Un dernier arbitrage : signer les décrets en attente",
   r:`Onze décrets d'application signés en séance, dont quatre que vos services
      repoussaient depuis dix-huit mois.<br><br>
      Ce n'est pas un discours, c'est du travail — la dernière chose qu'on attend d'un
      président sortant. Deux de ces décrets seront cités dans dix ans comme des
      tournants. Personne ne se souviendra qu'ils ont été signés un jour de départ.`,
   e:{economie:6,soc:{sante:8,educ:6},social:5,
      groups:{salaries:6,patrons:5,jeunes:5}},
   pose:"derniers_decrets", dauphin:3},
  {l:"Parler : dire ce que vous avez appris",
   r:`Vingt minutes, sans notes. Vous parlez des trois décisions que vous auriez prises
      autrement et de la seule chose que vous avez comprise trop tard : que le temps
      politique et le temps du pays ne sont pas le même.<br><br>
      Quelqu'un enregistre. Le texte circulera pendant des années dans les cabinets
      ministériels, sans que personne ne sache jamais qui l'a sorti.`,
   e:{social:8,groups:{jeunes:9,salaries:7,retraites:6,ruraux:5}},
   pose:"lecon_transmise", dauphin:5},
  {l:"Expédier le Conseil et partir tôt",
   r:`Vingt-cinq minutes, ordre du jour épuisé, pas de discours.<br><br>
      Vous quittez la salle le premier, ce qui ne s'était pas produit en huit ans. Deux
      ministres restent assis quelques secondes de trop. On appellera ça de la pudeur ou
      de l'indifférence selon qui racontera.`,
   e:{groups:{patrons:2,retraites:2}},
   pose:"depart_sec"}
 ]},

{id:"n95", ch:16, mois:95, ico:"✉️", t:"La lettre",
 intro:[
  [()=>S.dauphin>=55, `Votre camp est en tête. La lettre que vous écrivez a des chances
    d'être lue par quelqu'un que vous connaissez.`],
  [()=>S.rival>=60, `Ferrand va gagner. Cette lettre sera lue par lui, et il en fera ce
    qu'il voudra.`]
 ],
 d:`La tradition veut qu'on laisse une lettre dans le tiroir du bureau. Elle n'est pas
    obligatoire et personne ne saura si vous l'avez écrite, sauf celui qui ouvrira.<br><br>
    Vous avez huit ans de dossiers dans la tête et trois pages devant vous. Il y a des
    choses qu'on ne trouve dans aucune note de service : le nom d'un interlocuteur qui
    décroche vraiment, un pays qu'il faut appeler avant les autres, un chiffre qu'on ne
    donne jamais aux journalistes.<br><br>
    Le stylo est posé. Il est vingt-trois heures.`,
 o:[
  {l:"Tout lui donner : les dossiers, les noms, les erreurs",
   r:`Neuf pages, finalement. Vous y mettez les quatre dossiers qui exploseront dans les
      deux ans, les noms de ceux qui savent, et vos trois erreurs les plus coûteuses,
      expliquées.<br><br>
      Vous ne saurez jamais s'il l'a lue. Mais dix-huit mois plus tard, sur un dossier
      précis, il prendra exactement la décision que vous recommandiez, et personne ne
      comprendra pourquoi.`,
   e:{social:7,groups:{salaries:6,jeunes:7,retraites:5,ruraux:5}},
   pose:"lettre_complete", dauphin:4},
  {l:"Écrire quelques lignes : lui souhaiter bonne chance, rien de plus",
   r:`Six lignes, courtoises, sans contenu. C'est ce que font la plupart.<br><br>
      Vous refermez le tiroir à vingt-trois heures dix. La République continuera sans que
      rien ne se transmette, comme elle l'a toujours fait, et chaque président
      redécouvrira seul ce que le précédent avait mis huit ans à apprendre.`,
   e:{groups:{retraites:3,patrons:2}},
   pose:"lettre_breve"},
  {l:"Ne rien laisser",
   r:`Le tiroir reste vide.<br><br>
      Ce n'est pas de la rancune : c'est que vous ne trouvez pas la première phrase.
      Vous éteignez la lampe à minuit et vous sortez. Le lendemain, quelqu'un ouvrira ce
      tiroir et n'y trouvera rien, et ne saura pas si c'est un message.`,
   e:{groups:{jeunes:-3,salaries:-2}},
   pose:"tiroir_vide"}
 ]},

{id:"n96", ch:16, mois:96, ico:"🚪", t:"Le dernier dimanche",
 intro:[
  [()=>S.dauphin>=55, `Votre camp est donné vainqueur. Ce serait la première fois depuis
    longtemps qu'une succession se passe ainsi.`],
  [()=>S.rival>=60, `Ferrand l'emportera ce soir. Vous le savez depuis trois semaines.`],
  [()=>S.dauphin<25, `Votre camp n'avait pas de candidat solide. Le résultat de ce soir
    était écrit il y a deux ans.`]
 ],
 d:`Huit ans, jour pour jour. Vous n'êtes pas candidat, et pour la première fois depuis
    très longtemps, ce dimanche ne parle pas de vous.<br><br>
    Les cartons sont faits depuis mardi. Le bureau est vide, sauf le tiroir. À vingt
    heures, un nom s'affichera et cette maison changera de mains.<br><br>
    Il est quatorze heures. Le parc est ouvert et il n'y a personne dedans.`,
 o:[
  {l:"Marcher une dernière fois dans le parc",
   r:`Vous faites le tour, seul, pendant quarante minutes. Un jardinier vous salue de
      loin et continue son travail, ce qui est exactement ce qu'il fallait.<br><br>
      À vingt heures, vous regardez les résultats debout, au fond de la salle, entouré de
      gens qui ne travaillent déjà plus pour vous.`,
   e:{groups:{salaries:2,retraites:2}}, final:true},
  {l:"Recevoir une dernière fois vos équipes, une par une",
   r:`Quarante personnes, cinq minutes chacune : les conseillers, les huissiers, les
      cuisiniers, les chauffeurs. Vous connaissez leurs prénoms parce que huit ans, c'est
      long.<br><br>
      Trois pleurent. Vous aussi, à la fin, et personne ne le racontera. C'est la seule
      chose de la journée qui vous appartienne vraiment.`,
   e:{social:5,groups:{salaries:6,jeunes:4,ruraux:4}}, final:true},
  {l:"Travailler jusqu'à la dernière heure",
   r:`Trois notes, deux appels à des chefs d'État, une nomination signée à dix-neuf
      heures quarante.<br><br>
      Vous étiez président jusqu'à vingt heures et vous l'aurez été jusqu'à vingt heures.
      Il y a des gens pour trouver ça dérisoire et d'autres pour trouver ça juste. Vous
      n'aurez pas à choisir : vous serez déjà parti.`,
   e:{economie:3,groups:{patrons:4,retraites:3}}, final:true}
 ]},

{id:"n53", ch:9, mois:53, ico:"🏚️", t:"La cité",
 intro:[[()=>S.axes.autorite>=4, `Vous avez durci pendant cinq ans. Ce quartier-là en a
   reçu sa part.`]],
 d:`Quatre tours de quatorze étages, construites en 1968, promises à la démolition depuis
    onze ans. Un ascenseur sur six fonctionne.<br><br>
    Une femme de trente-huit ans est morte dans la cage d'escalier, faute d'avoir pu être
    évacuée au douzième étage. Les pompiers ont mis cinquante minutes à la descendre.<br><br>
    Le maire, qui vous soutient, vous écrit une lettre publique de deux pages.`,
 o:[
  {l:"Lancer la démolition-reconstruction, financée par l'État",
   r:`Trois cents millions, quatre ans de travaux, mille deux cents relogements garantis
      dans la commune.<br><br>
      Les premières familles emménagent trente mois plus tard. Le maire vous invite à
      l'inauguration ; vous n'y allez pas, pour que ce soit son inauguration.`,
   e:{budget:-14,soc:{pauvrete:18,sante:8},social:8,
      groups:{salaries:10,jeunes:12,ruraux:-4}},
   axe:{social:1}, pose:"renovation_urbaine", dauphin:3},
  {l:"Un plan national sur le bâti dégradé : trois cents quartiers",
   r:`Deux milliards, trois cents quartiers, une agence dédiée.<br><br>
      C'est trop pour être fait vite et trop peu pour tout traiter. Cinquante quartiers
      seront rénovés en cinq ans, deux cent cinquante attendront. Les habitants des
      cinquante ne sauront pas qu'ils ont eu de la chance.`,
   e:{budget:-19,soc:{pauvrete:14},economie:5,
      groups:{salaries:8,jeunes:9,ruraux:5}},
   pose:"plan_bati"},
  {l:"Renvoyer au bailleur social et à la commune",
   r:`Compétence locale, financement local, réponse en trois lignes.<br><br>
      Le maire publie votre courrier. Il est parfaitement exact juridiquement et il fait
      un effet désastreux, parce qu'une femme est morte et qu'on répond par un partage de
      compétences.`,
   e:{soc:{pauvrete:-8},social:-9,groups:{salaries:-9,jeunes:-11}},
   pose:"renvoi_bailleur", rival:8}
 ]},

{id:"n57", ch:10, mois:57, ico:"📋", t:"Le rapport annuel",
 intro:[[()=>S.dette>185, `Le rapport est plus dur que les précédents. Il a de bonnes
   raisons de l'être.`]],
 d:`La Cour des comptes rend son rapport public. Le chapitre qui vous concerne s'intitule
    « Huit ans de dépenses non financées » et il n'y a pas d'ambiguïté sur le sujet.<br><br>
    Le Premier président vous reçoit à sa demande. « Je ne fais pas de politique. Mais je
    vous dois de vous dire que si rien n'est fait dans les dix-huit mois, ce sera fait
    contre vous, et beaucoup plus brutalement. »<br><br>
    Il vous laisse cinquante-deux recommandations classées par ordre de faisabilité.`,
 o:[
  {l:"Appliquer les vingt premières recommandations",
   r:`Vingt mesures techniques, sept milliards d'économies, aucune ligne de programme
      politique touchée.<br><br>
      La Cour salue publiquement, ce qui n'arrive presque jamais. Le pays ne le remarque
      pas. C'est exactement le genre de travail qui rend un État gouvernable et qui ne
      gagne aucune élection.`,
   e:{budget:11,dette:-6,economie:4,groups:{patrons:9,salaries:-4}},
   pose:"recommandations_appliquees"},
  {l:"Contester la méthode et défendre vos choix",
   r:`Une réponse officielle de quarante pages, argumentée, publiée en annexe du rapport.<br><br>
      Votre argumentaire tient sur les deux tiers. Le tiers restant est repris par tous vos
      adversaires, et la séquence rappelle à tout le monde que la dette existe — ce que
      vous vouliez précisément éviter.`,
   e:{economie:-3,cac:-4,groups:{patrons:-6,salaries:3}},
   pose:"contestation_cour", rival:6},
  {l:"Créer une règle d'or budgétaire dans la loi organique",
   r:`Toute dépense nouvelle devra être gagée. Le texte passe en huit mois.<br><br>
      C'est contraignant pour vous et surtout pour vos successeurs, qui n'ont rien
      demandé. Deux d'entre eux tenteront de le défaire et échoueront, parce qu'on ne
      défait pas une règle de sérieux sans expliquer pourquoi.`,
   e:{budget:8,dette:-5,economie:5,cac:6,soc:{pouvoir:-6},
      groups:{patrons:12,salaries:-7,jeunes:-4}},
   axe:{social:-1}, pose:"regle_or"}
 ]},

{id:"n58", ch:10, mois:58, ico:"❄️", t:"Le grand froid",
 intro:[[()=>S.projetsFinis.includes("nuc"), `Vos réacteurs tournent à plein. C'est la
   seule raison pour laquelle on ne parle pas de coupures.`]],
 d:`Onze jours à moins huit en moyenne nationale. La consommation électrique bat son
    record historique un mardi à dix-neuf heures.<br><br>
    Le réseau tient, de justesse. Ce qui ne tient pas, c'est le reste : quatre cent mille
    foyers en précarité énergétique déclarée, deux morts dans la rue à Lille, et un système
    d'hébergement d'urgence saturé depuis huit jours.<br><br>
    Le préfet d'Île-de-France demande l'autorisation de réquisitionner des bâtiments vides.`,
 o:[
  {l:"Autoriser la réquisition de bâtiments vides",
   r:`Quatre-vingts immeubles de bureaux vacants réquisitionnés en six jours, onze mille
      places ouvertes.<br><br>
      Les propriétaires attaquent, le Conseil d'État valide au nom de la dignité humaine.
      Personne ne meurt de froid en France cet hiver-là. C'est mesurable, c'est rare, et
      ça vous vaudra un procès de trois ans.`,
   e:{budget:-7,soc:{pauvrete:20,sante:8},social:9,
      groups:{salaries:9,jeunes:11,patrons:-13}},
   axe:{social:2}, pose:"requisition_batiments"},
  {l:"Chèque énergie exceptionnel et places d'hébergement financées",
   r:`Trois cents euros pour quatre millions de foyers, quatre mille places
      supplémentaires financées à l'hôtel.<br><br>
      C'est immédiat, coûteux et sans conflit. Les places à l'hôtel coûteront quatre fois
      le prix d'un logement pérenne, ce que tout le monde sait depuis vingt ans et que
      personne ne change parce que l'hiver arrive toujours trop vite.`,
   e:{budget:-15,soc:{pouvoir:12,pauvrete:10},
      groups:{salaries:9,retraites:8,jeunes:6}},
   pose:"cheque_hiver"},
  {l:"Gérer avec les moyens existants",
   r:`Le dispositif habituel, activé un peu plus tôt, avec les mêmes capacités.<br><br>
      Il y aura sept morts dans la rue cet hiver-là, chiffre communiqué en mars par une
      association et jamais confirmé officiellement. C'est à peu près la moyenne des dix
      dernières années, ce qui est précisément le problème.`,
   e:{soc:{pauvrete:-10},social:-7,groups:{salaries:-7,jeunes:-9}},
   pose:"hiver_ordinaire", rival:7}
 ]},

{id:"n59", ch:10, mois:59, ico:"⚖️", t:"Le procès",
 intro:[[()=>S.flags.transparence, `Vous aviez tout publié à l'époque. Le procès s'ouvre
   sans que personne ne puisse dire que vous avez caché.`]],
 d:`Le procès de l'affaire s'ouvre. Deux anciens collaborateurs sur le banc, sept ans après
    les faits, et vous cité comme témoin.<br><br>
    Vous n'êtes pas mis en cause. Vous devrez néanmoins répondre sous serment à des
    questions sur ce que vous saviez et sur ce que vous avez fait de ce que vous saviez.<br><br>
    L'audience est publique. Elle est filmée, à titre exceptionnel.`,
 o:[
  {l:"Témoigner sans rien esquiver",
   r:`Trois heures et quarante minutes. Vous reconnaissez avoir su, avoir sous-estimé, et
      n'avoir pas voulu voir.<br><br>
      Un ancien collaborateur pleure dans le box. La présidente vous remercie d'une phrase
      inhabituelle : « Il est rare qu'un témoin de votre rang réponde à ce que nous
      demandons. » Le verdict tombera dans neuf mois.`,
   e:{social:11,groups:{salaries:9,jeunes:12,ruraux:7,retraites:6}},
   pose:"temoignage_franc", rival:-9},
  {l:"Répondre strictement aux questions, rien de plus",
   r:`Une heure vingt, des réponses courtes et exactes, aucun développement.<br><br>
      C'est irréprochable et froid. Les commentateurs parlent de « rigueur »,
      les proches des prévenus de « lâchage ». Les deux ont raison.`,
   e:{groups:{patrons:4,retraites:3,salaries:-3}},
   pose:"temoignage_minimal"},
  {l:"Invoquer votre immunité pour ne pas comparaître",
   r:`Vos avocats saisissent, la Cour de cassation tranche en votre faveur en six semaines.<br><br>
      Vous ne témoignez pas. C'est votre droit constitutionnel et c'est la seule image
      que retiendra le pays : un président qui ne vient pas. Les deux prévenus seront
      condamnés seuls.`,
   e:{social:-13,groups:{jeunes:-14,salaries:-11,ruraux:-7}},
   pose:"immunite_invoquee", rival:12}
 ]},

{id:"n60", ch:10, mois:60, ico:"🥂", t:"Cinq ans",
 intro:[
  [()=>popularite()<35, `Vous partez du principe que personne ne regardera. Sept
    millions de personnes regarderont.`],
  [()=>S.dauphin>=45, `Votre successeur possible sera dans la salle demain. Ce que vous
    direz ce soir le concernera autant que vous.`]
 ],
 d:`Cinquième allocution de vœux. Vous connaissez le studio, l'éclairagiste, la marque au
    sol.<br><br>
    Votre plume a écrit un texte de bilan. Votre directrice de cabinet pense qu'il faut
    parler de l'après. Et pour la première fois, quelqu'un a osé la phrase à voix haute
    dans une réunion : « Il faudra bien commencer à préparer la sortie. »<br><br>
    Il vous reste trois ans.`,
 o:[
  {l:"Fixer trois objectifs pour les trois années restantes",
   r:`Trois engagements, chiffrés, datés, avec une clause : un point d'étape public tous
      les six mois.<br><br>
      C'est piégeant et c'est le but : vous venez de vous obliger. Deux seront tenus, un
      ne le sera pas, et vous aurez à l'expliquer devant les caméras à trois reprises.`,
   e:{economie:5,social:6,groups:{salaries:6,patrons:6,jeunes:5}},
   pose:"trois_objectifs", dauphin:3},
  {l:"Parler de ce que la France sera dans vingt ans",
   r:`Douze minutes sur le climat, l'école et le vieillissement. Pas un mot sur vous.<br><br>
      L'audience est moyenne et le texte circule pendant des mois dans les milieux qui
      lisent. Ce n'est pas un discours de président en exercice : c'est déjà autre chose,
      et certains le remarquent avec inquiétude.`,
   e:{social:7,cli:{air:5},groups:{jeunes:11,salaries:5}},
   pose:"voeux_horizon"},
  {l:"Un bilan classique, chiffres à l'appui",
   r:`Huit minutes de résultats, correctement présentés et parfaitement oubliés le
      lendemain.<br><br>
      C'est le format le plus sûr et le moins utile. Vous avez consommé une des rares
      occasions où sept millions de Français vous écoutent sans y être obligés.`,
   e:{economie:3,groups:{patrons:5,retraites:4}},
   pose:"voeux_classique"}
 ]},

{id:"n64", ch:11, mois:64, ico:"🇪🇺", t:"Les européennes",
 intro:[[()=>S.rival>=55, `Sa liste est donnée en tête depuis trois mois. Ce sera un test
   grandeur nature.`]],
 d:`Scrutin de mi-mandat, proportionnel, un tour. C'est-à-dire : le moment idéal pour
    sanctionner un président sans conséquence.<br><br>
    Vingt heures. Votre liste fait 17,4 %. Celle de Ferrand, 29,1 %. C'est la première fois
    qu'il arrive en tête d'un scrutin national.<br><br>
    Il parle à vingt heures vingt et il a la sobriété de ceux qui savent qu'ils n'ont pas
    besoin d'en rajouter.`,
 o:[
  {l:"Prendre acte publiquement et changer de méthode",
   r:`Vous parlez le soir même : vous ne contestez rien, vous annoncez deux inflexions.<br><br>
      Ce n'est pas glorieux et c'est efficace : la séquence dure trois jours au lieu de
      trois semaines. Vos députés, qui craignaient un déni, respirent.`,
   e:{social:7,groups:{salaries:7,ruraux:7,jeunes:5}},
   pose:"lecon_europeennes", rival:-7, dauphin:3},
  {l:"Rappeler que c'est un scrutin européen, pas national",
   r:`L'argument est juste : la participation est faible, le mode de scrutin favorise les
      oppositions.<br><br>
      Personne ne l'entend. C'est la troisième fois de votre mandat que vous relativisez
      une défaite électorale, et à la troisième, l'argument ne fonctionne plus du tout.`,
   e:{groups:{salaries:-6,ruraux:-7,jeunes:-5}},
   pose:"relativisation_2", rival:8},
  {l:"Remanier profondément dans les quinze jours",
   r:`Six ministres remplacés, deux ministères fusionnés, une équipe rajeunie de sept ans
      de moyenne.<br><br>
      Le signal est fort. Il est aussi coûteux : six ministres sortants, dont deux
      compétents, deviennent six personnes disponibles pour raconter des choses aux
      journalistes.`,
   e:{economie:4,social:4,groups:{jeunes:7,salaries:4,patrons:-3}},
   pose:"remaniement_2", dauphin:-4}
 ]},

{id:"n68", ch:12, mois:68, ico:"🗳️", t:"Le référendum",
 intro:[[()=>S.flags.referendum||S.flags.convention, `Vous avez déjà consulté les Français
   directement. Ils s'en souviennent, en bien.`]],
 d:`Une proposition de loi d'initiative citoyenne atteint les quatre millions sept cent
    mille signatures. Le seuil est franchi pour la première fois depuis la création du
    dispositif.<br><br>
    Le texte demande l'inscription de la protection de l'eau dans la Constitution. Il est
    court, bien rédigé, et il gêne quatre filières économiques.<br><br>
    Vous n'êtes pas obligé de convoquer le référendum. La Constitution vous en laisse le
    choix, et tout le monde le sait.`,
 o:[
  {l:"Convoquer le référendum",
   r:`Scrutin en octobre. Le oui l'emporte à 61,3 %, avec une participation de 44 %.<br><br>
      L'eau entre dans la Constitution. Deux filières industrielles devront revoir leurs
      process en cinq ans. Vous n'avez rien décidé : vous avez laissé décider, et c'est
      la seule fois de vos huit ans où ça s'est produit à cette échelle.`,
   e:{cli:{eau:26,sols:12},economie:-6,cac:-6,social:10,
      groups:{jeunes:15,salaries:8,ruraux:-6,patrons:-13}},
   axe:{ecologie:2}, pose:"referendum_eau", rival:-10, dauphin:4},
  {l:"Reprendre le texte par voie parlementaire, sans référendum",
   r:`Le texte est repris, amendé, adopté en dix mois — vidé d'un tiers de sa portée.<br><br>
      Les initiateurs dénoncent une « confiscation ». Ils ont raison sur la forme et la
      loi existe quand même, ce qui n'était pas acquis. Le compromis a ce défaut de ne
      contenter personne et cette qualité d'exister.`,
   e:{cli:{eau:12,sols:6},social:3,groups:{jeunes:5,patrons:-5}},
   pose:"voie_parlementaire"},
  {l:"Ne pas donner suite",
   r:`Vous ne convoquez rien et vous ne reprenez rien. Le texte reste lettre morte.<br><br>
      Quatre millions sept cent mille signatures pour rien. C'est la démonstration la plus
      efficace jamais faite en France que le dispositif d'initiative citoyenne ne sert à
      rien, et c'est vous qui l'avez administrée.`,
   e:{social:-12,cli:{eau:-6},
      groups:{jeunes:-16,salaries:-9,ruraux:-6}},
   pose:"ric_enterre", rival:14}
 ]},

{id:"n69", ch:12, mois:69, ico:"🚨", t:"La nuit de Marseille",
 intro:[[()=>valeur("securite")<45, `Les moyens manquent depuis des années dans cette
   ville. Le rapport le disait en 2027.`]],
 d:`Trois règlements de comptes en une nuit, dont un devant une école. Un enfant de neuf
    ans est mort dans la voiture de sa mère.<br><br>
    Le préfet de police demande des moyens exceptionnels. Le procureur demande des
    magistrats. Le maire demande les deux et un plan sur dix ans.<br><br>
    Vous serez sur place demain. Cette fois, personne n'attend un discours.`,
 o:[
  {l:"Opération d'ampleur : mille policiers, six mois, saturation",
   r:`Mille hommes déployés, deux cent quarante interpellations en six semaines,
      quatre-vingts armes saisies.<br><br>
      Les fusillades cessent pendant huit mois. Elles reprennent en juin, avec des acteurs
      plus jeunes. Un commissaire résume : « Nous avons enlevé une couche. Il y en avait
      une en dessous. »`,
   e:{budget:-11,sec:{interieure:20},social:-4,
      groups:{retraites:12,ruraux:8,jeunes:-6}},
   axe:{autorite:2}, pose:"operation_marseille"},
  {l:"Frapper l'argent : moyens judiciaires et saisies d'avoirs",
   r:`Quarante magistrats spécialisés, une agence de saisie renforcée, coopération
      bancaire européenne.<br><br>
      C'est lent : dix-huit mois avant les premiers résultats. Puis quatre cents millions
      d'avoirs saisis en deux ans et trois réseaux démantelés par le haut. Personne n'en
      fera un journal télévisé.`,
   e:{budget:-9,sec:{interieure:14},economie:4,
      groups:{salaries:7,patrons:6,retraites:7}},
   pose:"saisies_avoirs", dauphin:3},
  {l:"Un plan global : sécurité, école, emploi, sur dix ans",
   r:`Deux milliards, dix ans, quatre ministères. C'est ce que demandent tous les rapports
      depuis vingt ans.<br><br>
      Le plan est lancé. Il survivra deux ans après votre départ, puis sera « redéployé »,
      ce qui est le mot administratif pour dire abandonné. Ce que vous aurez construit en
      trois ans tiendra quand même : deux collèges, un commissariat, six cents emplois.`,
   e:{budget:-17,sec:{interieure:12},soc:{educ:12,pauvrete:10},
      groups:{salaries:8,jeunes:9,retraites:6}},
   pose:"plan_global_marseille"}
 ]},

{id:"n70", ch:12, mois:70, ico:"🎓", t:"L'université",
 d:`Quarante mille étudiants sans affectation à la rentrée. Le système d'admission a
    saturé, et cette fois, ce sont des bacheliers avec mention qui restent sur le carreau.<br><br>
    Les présidents d'université écrivent une lettre commune : ils accueillent trente pour
    cent d'étudiants de plus qu'il y a quinze ans avec le même nombre d'enseignants.<br><br>
    Une occupation commence à Nanterre le lundi.`,
 o:[
  {l:"Créer quinze mille postes et rouvrir des filières",
   r:`Quinze mille postes sur cinq ans, huit milliards, la première hausse réelle du
      budget par étudiant depuis vingt ans.<br><br>
      Le taux d'encadrement remonte pour la première fois depuis 2005. Les effets sur la
      réussite en licence apparaîtront dans six ans, dans une étude que trois cents
      personnes liront.`,
   e:{budget:-17,soc:{educ:24},economie:5,
      groups:{jeunes:16,salaries:8,patrons:-5}},
   axe:{social:1}, pose:"universite_financee", dauphin:4},
  {l:"Développer massivement l'apprentissage et les formations courtes",
   r:`Deux cent mille places d'apprentissage supplémentaires, financées par une réforme
      des exonérations.<br><br>
      L'insertion professionnelle est excellente et les universités restent saturées. Vous
      avez répondu à un problème d'emploi par une politique d'emploi, et le problème posé
      était celui de l'université.`,
   e:{budget:-9,economie:10,soc:{educ:8},pib:0.8,
      groups:{patrons:12,jeunes:7,salaries:5}},
   pose:"apprentissage"},
  {l:"Instaurer une sélection assumée à l'entrée",
   r:`Sélection généralisée en licence, votée en huit mois après trois mois de blocages.<br><br>
      Le système cesse de saturer parce qu'il refuse ouvertement au lieu de refuser par
      tirage. C'est plus honnête et parfaitement inacceptable pour la moitié du pays.
      Quarante mille jeunes restent dehors, mais on leur dit pourquoi.`,
   e:{budget:4,soc:{educ:6,pauvrete:-12},economie:4,
      groups:{patrons:10,jeunes:-17,salaries:-7}},
   axe:{social:-2}, pose:"selection_universite", rival:6}
 ]},

{id:"n71", ch:12, mois:71, ico:"🔥", t:"L'été qui ne finit pas",
 intro:[[()=>S.axes.ecologie>=5, `Vous avez tout fait, ou presque. Ça arrive quand même,
   et il faut l'expliquer.`]],
 d:`Cinquante-deux jours consécutifs au-dessus de trente degrés. Deux cent quarante mille
    hectares brûlés dans le Sud-Ouest, la plus grande surface jamais enregistrée.<br><br>
    Le directeur de la sécurité civile est net : « Nos moyens ont été dimensionnés pour un
    climat qui n'existe plus. Nous tenons parce que nos gens ne dorment pas. »<br><br>
    Trois pompiers sont morts en août.`,
 o:[
  {l:"Doubler les moyens de la sécurité civile",
   r:`Quarante appareils, six mille postes, une flotte européenne mutualisée dont la
      France prend la tête.<br><br>
      L'été suivant est aussi chaud et la surface brûlée est divisée par trois. C'est le
      genre de chiffre qu'on ne peut pas contester et dont personne ne parle, parce que
      ce qui n'a pas brûlé ne fait pas d'images.`,
   e:{budget:-18,cli:{foret:16,air:6},sec:{interieure:8},
      groups:{ruraux:14,salaries:8,retraites:7}},
   pose:"securite_civile", dauphin:4},
  {l:"Reboiser autrement : forêts résilientes, coupe-feu, gestion",
   r:`Un milliard sur quinze ans, essences méditerranéennes, pare-feu entretenus,
      sylviculture repensée.<br><br>
      Ça ne produira rien avant vingt ans, ce que vous dites explicitement. C'est
      probablement la décision la plus rationnelle de votre second mandat et la moins
      commentée.`,
   e:{budget:-9,cli:{foret:24,sols:10,eau:6},
      groups:{ruraux:9,jeunes:9,patrons:-4}},
   axe:{ecologie:2}, pose:"forets_resilientes"},
  {l:"Gérer avec l'existant et compenser les sinistrés",
   r:`Six cents millions d'indemnisation, aucun moyen supplémentaire.<br><br>
      Les sinistrés sont indemnisés correctement, ce qui n'est pas rien. L'été suivant,
      la même chose se produit et on indemnise à nouveau. Un pompier volontaire déclare à
      la radio : « On nous paie les dégâts, on ne nous donne pas les moyens de les
      éviter. »`,
   e:{budget:-12,cli:{foret:-8},groups:{ruraux:6,jeunes:-8}},
   pose:"indemnisation_seule", rival:6}
 ]},

{id:"n72", ch:12, mois:72, ico:"🕰️", t:"Six ans",
 intro:[
  [()=>S.dauphin>=50, `Votre camp a un candidat crédible. C'est le moment de le dire ou
    de se taire définitivement.`],
  [()=>popularite()<32, `Vous êtes au plus bas. Cet exercice-là va être long.`]
 ],
 d:`Interview de mi-second mandat, deux heures, deux journalistes. Le même exercice qu'il
    y a quatre ans, avec une différence : personne ne vous demande plus ce que vous ferez,
    on vous demande ce que vous laissez.<br><br>
    Première question, posée d'emblée : « Qu'est-ce qui, dans votre bilan, ne survivra pas
    à votre départ ? »<br><br>
    C'est une bonne question et vous n'avez pas préparé de réponse.`,
 o:[
  {l:"Répondre franchement : nommer ce qui est fragile",
   r:`Vous citez deux réformes qui seront défaites et vous expliquez pourquoi elles n'ont
      pas pris.<br><br>
      C'est inhabituel au point d'être désarçonnant. Les deux journalistes changent de
      rythme. Le lendemain, l'extrait le plus partagé est celui-là, et le commentaire qui
      revient est : « On n'a jamais entendu ça. »`,
   e:{social:10,groups:{jeunes:11,salaries:9,ruraux:7,retraites:5}},
   pose:"franchise_bilan", rival:-9, dauphin:4},
  {l:"Défendre l'ensemble : tout tiendra",
   r:`Deux heures à soutenir que le bilan est cohérent et durable.<br><br>
      C'est ce qu'on attend d'un président et personne n'y croit, à commencer par les
      journalistes qui ont préparé la liste des dispositifs déjà détricotés. La séquence
      est propre et parfaitement inutile.`,
   e:{economie:3,groups:{patrons:6,retraites:4,jeunes:-4}},
   pose:"defense_bilan"},
  {l:"Parler de la suite : ce qu'il faudra faire après vous",
   r:`Vous consacrez l'essentiel de l'entretien à trois chantiers que vous ne mènerez pas.<br><br>
      C'est généreux et ça sonne comme un aveu d'inachèvement. Deux des trois chantiers
      figureront dans le programme de votre successeur, quel qu'il soit. Vous aurez fixé
      l'agenda de quelqu'un d'autre.`,
   e:{social:7,economie:4,groups:{jeunes:9,salaries:6,patrons:5}},
   pose:"agenda_suivant", dauphin:6}
 ]},

{id:"n75", ch:13, mois:75, ico:"🩺", t:"Les internes",
 d:`Neuf mille internes en grève illimitée. Ils tiennent l'hôpital public la nuit et les
    week-ends depuis toujours, pour un salaire horaire inférieur au SMIC quand on compte
    les heures réelles.<br><br>
    Ils ne demandent pas d'argent en premier : ils demandent que les heures soient
    comptées. C'est plus embarrassant, parce que ça se vérifie.<br><br>
    Trois hôpitaux ont déprogrammé toutes les opérations non urgentes.`,
 o:[
  {l:"Décompter et payer toutes les heures réelles",
   r:`Comptage obligatoire, paiement rétroactif sur douze mois, plafond horaire opposable.<br><br>
      Un milliard huit cents millions par an, un chiffre que personne n'avait osé calculer
      parce que le calculer obligeait à le payer. La grève cesse en neuf jours. Deux mille
      internes qui allaient quitter la médecine hospitalière restent.`,
   e:{budget:-13,soc:{sante:22},social:8,
      groups:{salaries:11,jeunes:14,retraites:8}},
   axe:{social:1}, pose:"internes_payes", dauphin:4},
  {l:"Revaloriser sans changer le décompte des heures",
   r:`Plus quatre cents euros mensuels, sans toucher au comptage.<br><br>
      La grève s'arrête à moitié : deux syndicats signent, un continue trois semaines. Le
      problème de fond reste entier et reviendra dans deux ans, exactement au même endroit,
      avec des gens plus jeunes et plus en colère.`,
   e:{budget:-7,soc:{sante:10},groups:{jeunes:6,salaries:5}},
   pose:"revalorisation_partielle"},
  {l:"Réquisitionner : la continuité des soins d'abord",
   r:`Réquisition dans onze établissements, notifiée par les préfets.<br><br>
      Les blocs rouvrent en quatre jours. Sept cents internes annoncent qu'ils ne
      s'inscriront pas au tableau de l'Ordre en France. Les deux tiers le feront quand
      même. Le tiers restant, ce sont deux cents médecins de moins par an.`,
   e:{soc:{sante:4},social:-12,
      groups:{jeunes:-16,salaries:-10,retraites:5}},
   axe:{autorite:2}, pose:"requisition_internes", rival:9}
 ]},

{id:"n77", ch:13, mois:77, ico:"🛰️", t:"L'écoute",
 intro:[[()=>S.flags.attribution_publique||S.flags.riposte_discrete, `Vous avez déjà eu
   affaire à eux. Cette fois, c'est chez vous.`]],
 d:`Un logiciel espion a été trouvé sur les téléphones de quatre ministres et de deux de
    vos conseillers. Il y est depuis onze mois.<br><br>
    L'attribution technique est établie à un niveau de certitude que les services
    qualifient de « très élevé ». Le pays concerné est un partenaire commercial de premier
    plan et un allié militaire de circonstance.<br><br>
    Le Conseil de défense se réunit à vingt-deux heures.`,
 o:[
  {l:"Rendre public et convoquer l'ambassadeur",
   r:`Communiqué à sept heures, ambassadeur convoqué à neuf, expulsion de trois
      diplomates à midi.<br><br>
      L'affaire est mondiale en vingt-quatre heures. Deux contrats sont gelés, un
      partenariat de renseignement est suspendu six mois. Et les écoutes s'arrêtent, ce
      qui était le but et ce que personne ne pourra vérifier publiquement.`,
   e:{sec:{defense:12,interieure:8},economie:-6,cac:-5,pib:-0.6,
      groups:{retraites:8,ruraux:6,patrons:-9}},
   axe:{autorite:1}, pose:"expulsion_diplomates"},
  {l:"Traiter en silence et durcir la protection",
   r:`Aucune déclaration. Téléphones souverains pour trois cents personnes, audit complet,
      un message passé par le canal direct.<br><br>
      Les écoutes cessent en trois semaines. Personne ne saura jamais qu'il s'est passé
      quelque chose, ce qui est exactement ce que vous vouliez et qui ne vous rapportera
      rien.`,
   e:{budget:-8,sec:{defense:16},groups:{patrons:4}},
   pose:"traitement_silencieux"},
  {l:"Répondre par une capacité offensive assumée",
   r:`Doctrine cyber offensive publiée, commandement dédié, budget quadruplé.<br><br>
      La France devient le troisième pays européen à assumer publiquement une capacité
      offensive. C'est dissuasif et c'est une escalade : deux autres pays annoncent la
      même chose dans les dix-huit mois.`,
   e:{budget:-13,sec:{defense:22,interieure:6},economie:4,
      groups:{retraites:9,patrons:6,jeunes:-5}},
   axe:{autorite:2}, pose:"cyber_offensif"}
 ]},

{id:"n79", ch:14, mois:79, ico:"💶", t:"Le budget qu'on ne votera pas",
 intro:[[()=>popularite()<35, `Votre majorité ne vous doit plus rien. Ce budget-là va
   se négocier ligne par ligne.`]],
 d:`Le projet de loi de finances est rejeté en première lecture par soixante-treize voix.
    Ce n'est pas arrivé depuis 1979.<br><br>
    Onze députés de votre majorité ont voté contre, sept se sont abstenus. Aucun n'a
    demandé de contrepartie : ils ont simplement estimé qu'ils n'avaient plus rien à perdre
    à vous désavouer.<br><br>
    Il reste six semaines avant la date limite constitutionnelle.`,
 o:[
  {l:"Négocier un budget de compromis avec l'opposition modérée",
   r:`Quatre semaines de négociation, deux milliards de concessions, un texte adopté par
      une majorité inédite qui ne durera pas au-delà du vote.<br><br>
      Le budget existe. Il n'est ni le vôtre ni le leur, il est médiocre et il est voté,
      ce qui, en la circonstance, ressemble beaucoup à une réussite.`,
   e:{budget:-6,economie:3,social:5,
      groups:{salaries:5,ruraux:5,patrons:3}},
   pose:"budget_compromis", dauphin:3},
  {l:"Engager la responsabilité du gouvernement une dernière fois",
   r:`Le 49.3, pour la énième fois, dans un climat où plus personne n'y croit.<br><br>
      Le budget passe. Une motion de censure est déposée dans l'heure et échoue à six
      voix. Vous gouvernez désormais à six voix près, et tout le monde le sait, y compris
      les marchés.`,
   e:{budget:5,economie:-3,cac:-5,social:-9,
      groups:{salaries:-9,jeunes:-8,patrons:5}},
   axe:{autorite:2}, pose:"49_3_final", rival:10},
  {l:"Gouverner par ordonnances budgétaires",
   r:`L'article 47 s'applique : le budget entre en vigueur par ordonnance faute de vote
      dans les délais.<br><br>
      C'est constitutionnel et ça n'était arrivé qu'une fois sous la Ve République. Le
      pays retient qu'un budget a été appliqué sans être voté, et l'expression
      « fin de règne » apparaît le lendemain dans quatre éditoriaux.`,
   e:{budget:8,social:-12,cac:-4,
      groups:{salaries:-11,jeunes:-10,ruraux:-7,patrons:6}},
   axe:{autorite:2}, pose:"ordonnances", rival:12}
 ]},

{id:"n81", ch:14, mois:81, ico:"💧", t:"Le partage",
 intro:[[()=>S.flags.referendum_eau, `L'eau est dans la Constitution depuis un an.
   L'arbitrage change complètement de nature.`]],
 d:`Le lac de barrage qui alimente une agglomération de quatre cent mille habitants est à
    dix-sept pour cent de sa capacité. Il alimente aussi trois cents exploitations et une
    centrale.<br><br>
    Il n'y a pas assez pour les trois. Le préfet a besoin d'une doctrine nationale, pas
    d'un arbitrage local, et il a raison : ce sera le premier cas d'une longue série.<br><br>
    Vous avez huit jours pour écrire une règle qui vaudra pour trente ans.`,
 o:[
  {l:"Priorité absolue à l'eau potable, puis santé, puis le reste",
   r:`Décret de hiérarchisation : boisson, santé, sécurité, puis agriculture, puis
      industrie.<br><br>
      C'est net et brutal. Trois cents exploitations perdent leur saison, la centrale
      réduit de moitié. Mais la règle existe, elle est publiée, et les vingt années
      suivantes s'appuieront dessus sans avoir à la réinventer dans l'urgence.`,
   e:{cli:{eau:20},economie:-7,soc:{sante:8},
      groups:{ruraux:-14,salaries:7,jeunes:9,patrons:-8}},
   axe:{ecologie:2}, pose:"hierarchie_eau"},
  {l:"Répartition négociée localement, sous arbitrage préfectoral",
   r:`Une commission par bassin, un préfet qui tranche en dernier ressort.<br><br>
      Ça fonctionne cette année-là parce que les gens se connaissent. Ça ne fonctionnera
      pas partout et personne ne pourra dire pourquoi ça a marché ici et pas ailleurs. La
      subsidiarité a ce défaut : elle ne se réplique pas.`,
   e:{cli:{eau:8},groups:{ruraux:6,salaries:3}},
   pose:"gestion_bassin"},
  {l:"Investir en urgence : interconnexions et réutilisation",
   r:`Neuf cents millions pour relier trois bassins et réutiliser les eaux usées de
      l'agglomération.<br><br>
      Rien avant trois ans. Vous arbitrez donc quand même pour cette année-là, en
      urgence, sans règle. Mais dans quatre ans, ce conflit précis n'existera plus, ce qui
      est la seule vraie manière de régler un arbitrage.`,
   e:{budget:-13,cli:{eau:14},economie:4,
      groups:{ruraux:8,patrons:5,jeunes:6}},
   pose:"interconnexions", dauphin:3}
 ]},

{id:"n83", ch:14, mois:83, ico:"🏙️", t:"Trois nuits",
 intro:[[()=>S.axes.autorite>=5, `Sept ans de fermeté. On va voir ce qu'elle vaut quand
   ça déborde vraiment.`]],
 d:`Un adolescent de seize ans tué par un tir policier lors d'un refus d'obtempérer. La
    vidéo dure onze secondes et ne laisse pas de place au doute.<br><br>
