      toute première chose qu'on vous reprochera, et vous le savez en signant.`,
   e:{social:11,sec:{interieure:-9},groups:{jeunes:13,salaries:8,retraites:-7}},
   axe:{autorite:-2}, pose:"retour_droit_commun", rival:-6},
  {l:"Reconduire ce qui protège, abandonner le reste",
   r:`Six dispositifs reconduits — ceux qui touchent au renseignement et à la sécurité des
      sites sensibles. Onze abandonnés — ceux qui pesaient sur les libertés publiques
      ordinaires. Le tout assorti d'une clause de réexamen annuel devant le Parlement.<br><br>
      Personne n'est content. Les tenants de la fermeté trouvent que vous désarmez ; les
      défenseurs des libertés trouvent que vous en gardez trop. Personne ne descend dans
      la rue.<br><br>
      C'est exactement ce que produit un arbitrage raisonnable : un mécontentement partagé,
      pas de manifestation, pas de titre. C'est aussi pour ça que si peu de gouvernements
      en font.`,
   e:{sec:{interieure:6},social:3,groups:{salaries:4,retraites:4}},
   pose:"tri_mesures"},
  {l:"Tout reconduire : « ce n'est pas le moment de désarmer »",
   r:`Les dix-sept mesures sont inscrites dans le droit commun, par voie d'amendement, un
      mardi soir, dans un hémicycle à moitié vide, en vingt minutes de débat.<br><br>
      La Défenseure des droits publie une saisine. Deux universitaires écrivent une
      tribune. Ça dure trois jours.<br><br>
      Trois ans plus tard, plus personne ne se souviendra que ces pouvoirs étaient censés
      être temporaires, exceptionnels, liés à une crise précise. Ils seront devenus le
      droit. C'est ainsi que ça se passe, à chaque fois, dans chaque pays — et vous le
      saviez parfaitement en signant.`,
   e:{sec:{interieure:16},social:-12,groups:{retraites:11,ruraux:8,jeunes:-16}},
   axe:{autorite:2}, pose:"exception_permanente", rival:9}
 ]},

{id:"m28", ch:5, mois:28, ico:"🌾", t:"La zone",
 intro:[
  [()=>S.axes.ecologie>=3, `Vous avez bâti votre mandat sur l'écologie. Ce sont vos propres
    électeurs qui campent là-bas.`],
  [()=>S.dette>170, `Avec votre dette, quinze milliards devraient être impensables. On
    vient quand même vous les proposer, et l'argument est bon.`]
 ],
 d:`Quinze milliards d'euros. Douze ans de travaux. Quatre mille emplois directs, dix mille
    indirects. L'usine qui remettrait la France dans une course qu'elle est en train de
    perdre. Le site retenu est une zone humide classée, et trois cents personnes y vivent
    sous bâches depuis onze mois, décidées à empêcher les pelleteuses.<br><br>
    Le préfet a préparé l'évacuation pour mardi. Il vous prévient dans une note d'une seule
    page, sans fioriture : « Nous aurons des blessés. Je ne peux pas vous garantir que
    nous n'aurons que ça. »<br><br>
    L'industriel, lui, a un site de repli en Pologne et une réunion de son conseil
    d'administration en mars. Il attend votre réponse pour arbitrer.`,
 o:[
  {l:"Ordonner l'évacuation et lancer le chantier",
   r:`Mardi, cinq heures du matin. Onze cents gendarmes mobiles, trois cents occupants,
      quatre heures d'opération dans la boue et les grenades lacrymogènes.<br><br>
      Bilan : trente-huit blessés. Parmi eux, un jeune homme de vingt-deux ans qui perdra
      l'usage d'un œil. Son visage — le bandeau, la cicatrice — deviendra l'affiche de tous
      les cortèges du pays pendant deux ans.<br><br>
      La première pierre de l'usine est posée en juin, sous protection policière, sans
      public. Les quatre mille emplois viendront. La photo du jeune homme aussi, à chaque
      fois que vous prononcerez le mot « écologie ».`,
   e:{pib:3.5,budget:-16,economie:14,cac:10,cli:{eau:-18,foret:-12},social:-10,
      groups:{patrons:15,salaries:9,jeunes:-17}},
   axe:{autorite:2,ecologie:-2}, pose:"grand_projet", rival:11},
  {l:"Déplacer le projet sur une friche industrielle",
   r:`Deux milliards d'euros de dépollution en plus, dix-huit mois de retard sur le
      calendrier. L'industriel a menacé de tout arrêter trois fois avant de signer
      l'avenant.<br><br>
      La zone humide est classée définitivement, protégée pour de bon. Et sur la friche —
      un ancien site chimique dont personne ne voulait — on installe une usine neuve, on
      dépollue un terrain empoisonné depuis quarante ans, on redonne une fonction à
      quelque chose de mort.<br><br>
      C'est la solution la plus chère, la plus lente, la plus compliquée à défendre en
      Conseil. C'est aussi la seule dont vous serez vraiment fier, dix ans après.`,
   e:{pib:2,budget:-24,economie:8,cac:4,cli:{sols:10},
      groups:{patrons:5,jeunes:8,salaries:6}},
   pose:"projet_deplace", rival:-6},
  {l:"Renoncer : l'usine ira en Pologne",
   r:`L'annonce tombe un jeudi, par communiqué du groupe : le site retenu sera celui de
      Basse-Silésie. La France est hors course.<br><br>
      Les militants de la zone humide dansent sous la pluie devant les caméras, et on les
      comprend : ils ont gagné, contre un géant industriel et contre l'État.<br><br>
      À quatre-vingts kilomètres de là, un bassin d'emploi sinistré qui espérait quatre
      mille postes apprend la nouvelle par la presse locale. Le maire ne fait pas de
      déclaration. Il n'y a rien à dire. Les deux images — la fête sous la pluie, le bassin
      d'emploi silencieux — passent au même journal, à la suite.`,
   e:{pib:-1.8,economie:-9,cac:-8,cli:{eau:14,foret:10},
      groups:{jeunes:13,patrons:-15,salaries:-9,ruraux:-6}},
   axe:{ecologie:2}, pose:"quotidien_prefere", rival:7}
 ]},

{id:"m29", ch:5, mois:29, ico:"🌍", t:"La conférence",
 intro:[
  [()=>S.axes.ecologie>=3, `Vous arrivez avec un bilan climatique réel. C'est assez rare
    pour qu'on vous propose de présider une session.`],
  [()=>S.axes.ecologie<=-2, `Vous arrivez avec un bilan que les ONG ont déjà chiffré pour
    vous. Elles vous attendent à l'entrée.`],
  [()=>S.flags.retour_fossile, `Votre retour aux fossiles a été noté. Deux délégations ont
    demandé, officiellement, que la France ne préside aucune session.`]
 ],
 d:`Conférence climat, dernière nuit, salle de plénière. Le texte final tient en trois
    pages et tout bloque sur un seul verbe, à l'article 4 : les émissions doivent-elles
    « diminuer » ou seulement « être limitées » ? Quatre pays refusent le premier mot.<br><br>
    La présidente de la conférence vient vous chercher personnellement à deux heures du
    matin, dans le couloir. « Si la France bascule vers le texte fort, trois autres pays
    suivront dans l'heure. Si elle ne bouge pas, il n'y a pas d'accord — et demain matin,
    tout le monde saura à cause de qui. »<br><br>
    Vos fédérations industrielles vous ont écrit trois fois cette semaine. La dernière
    lettre parlait de « ligne rouge ».`,
 o:[
  {l:"Faire basculer la France du côté du texte fort",
   r:`Vous annoncez le ralliement de la France à quatre heures dix du matin, devant la
      plénière épuisée. Trois pays suivent dans l'heure, comme prévu. L'accord est sauvé,
      in extremis.<br><br>
      La présidente de la conférence vous embrasse devant les caméras — l'image fait le
      tour du monde.<br><br>
      Le lendemain, vos fédérations industrielles publient un communiqué glacial de quatre
      lignes. Dans la semaine, deux d'entre elles annoncent le gel de projets
      d'investissement en France, « dans l'attente de clarifications ». Vous avez sauvé un
      accord planétaire et fâché durablement ceux qui financent l'emploi chez vous.`,
   e:{pib:-0.9,cli:{air:24,eau:10,foret:8},economie:-7,cac:-6,
      groups:{jeunes:15,patrons:-13,ruraux:-7}},
   axe:{ecologie:2}, pose:"accord_climat", rival:-6},
  {l:"Négocier un texte fort assorti de compensations industrielles",
   r:`Huit heures de négociation, sans dormir, pour arracher un mécanisme d'ajustement
      carbone aux frontières — une taxe sur les importations des pays qui ne respectent
      pas les mêmes règles que nous.<br><br>
      Le texte est adopté avec le verbe fort. Les ONG trouvent le mécanisme « insuffisant ».
      L'industrie française le trouve « jouable » : elle ne sera pas mise en concurrence
      déloyale.<br><br>
      C'est le genre de compromis dont personne ne fait un slogan, qu'aucune photo ne
      résume — et qui, discrètement, change réellement des trajectoires d'émissions sur
      dix ans.`,
   e:{cli:{air:12,eau:6},budget:-9,economie:3,groups:{jeunes:8,patrons:4}},
   axe:{ecologie:1}, pose:"climat_compense"},
  {l:"Protéger l'industrie française et bloquer",
   r:`La France ne bascule pas. Vous maintenez la position des quatre pays réticents. Il
      n'y a pas d'accord, et tout le monde, à l'aube, sait exactement pourquoi.<br><br>
      Vos industriels vous remercient, discrètement, par des canaux discrets.<br><br>
      Le lendemain, quatre-vingts pays publient une déclaration commune sur le climat —
      sans la France. C'est la première fois de tout votre mandat que le nom de votre pays
      est cité, dans la presse mondiale, comme celui d'un obstacle. Cette étiquette-là,
      une fois qu'elle est posée, est presque impossible à décoller.`,
   e:{pib:1,cli:{air:-16,eau:-6},economie:8,cac:7,
      groups:{patrons:14,ruraux:8,jeunes:-17}},
   axe:{ecologie:-2}, pose:"blocage_climat", rival:7}
 ]},

{id:"m30", ch:6, mois:30, ico:"🧑‍⚖️", t:"Le procès",
 intro:[
  [()=>S.flags.pression_presse, `Vous avez déjà fait pression sur un journal. On vous le
    ressortira à la barre, dans les couloirs, partout.`],
  [()=>S.flags.transparence||S.flags.franchise, `Vous avez pris l'habitude de dire les
    choses. C'est votre meilleure protection aujourd'hui.`]
 ],
 d:`Ce n'est pas vous sur le banc. C'est votre prédécesseur, jugé pour des faits vieux de
    dix ans — financement occulte, emplois fictifs — et la République entière regarde
    l'audience en direct.<br><br>
    Le problème, c'est que trois de vos ministres actuels ont travaillé dans son cabinet à
    l'époque des faits. Un journaliste a fait le compte, publié la liste, avec les dates.<br><br>
    Votre entourage vous conseille le silence absolu : « L'exécutif ne commente pas la
    justice, point. » Votre garde des Sceaux vous conseille exactement l'inverse : « Si
    vous ne dites rien, c'est votre silence qu'on interprétera. » Le verdict tombe dans
    huit jours.`,
 o:[
  {l:"Ne rien dire : la justice passe, l'exécutif se tait",
   r:`Silence complet pendant huit jours. Aucune déclaration, aucune consigne à vos
      ministres, rien le jour du verdict.<br><br>
      C'est constitutionnellement irréprochable. La séparation des pouvoirs dans toute sa
      pureté.<br><br>
      C'est aussi politiquement muet. Vos trois ministres cités par la presse se
      débrouillent seuls, chacun de son côté, avec des éléments de langage improvisés — et
      deux d'entre eux vous en tiendront rigueur longtemps : ils se sont sentis lâchés au
      moment où ils avaient besoin d'un mot de couverture, un seul.`,
   e:{social:3,groups:{retraites:4,patrons:4,jeunes:-3}},
   pose:"silence_judiciaire"},
  {l:"Annoncer une loi d'inéligibilité automatique",
   r:`Le projet de loi est déposé dans la semaine : inéligibilité définitive, sans délai ni
      exception, pour tout élu condamné pour manquement à la probité.<br><br>
      Le texte est voté à une majorité écrasante, tous bords confondus — parce que personne,
      dans un hémicycle, ne peut se permettre de voter contre l'honnêteté en public.<br><br>
      Trois de vos propres députés seront concernés par ce texte dans les cinq ans, et
      exclus. Vous le saviez en le proposant. C'est peut-être même pour ça que vous l'avez
      proposé : une loi qui vous coûte à vous aussi est plus crédible.`,
   e:{social:12,groups:{salaries:11,jeunes:14,ruraux:9,patrons:-8}},
   pose:"ineligibilite", rival:-12},
  {l:"Dénoncer un procès politique",
   r:`Dans une interview de vingt minutes, vous employez les mots « acharnement »,
      « justice à deux vitesses », « on ne juge pas un homme dix ans après ».<br><br>
      La réponse est immédiate et massive. Les syndicats de magistrats publient un
      communiqué commun — y compris ceux qui ne s'expriment jamais. Le premier président de
      la Cour de cassation prend la parole publiquement, chose qui n'était pas arrivée
      depuis quinze ans, pour rappeler que « la justice ne rend pas de comptes au
      pouvoir ». Vous avez transformé le procès de votre prédécesseur en conflit entre
      vous et l'institution judiciaire.`,
   e:{sec:{interieure:-5},social:-11,groups:{jeunes:-13,salaries:-9,ruraux:6}},
   axe:{autorite:1}, pose:"procès_politique", rival:11}
 ]},

{id:"m33", ch:6, mois:33, ico:"🕳️", t:"Ce qui reste de l'affaire",
 intro:[
  [()=>S.flags.transparence, `Vous avez tout publié. L'orage est passé plus vite que prévu,
    et il vous en reste quelque chose d'inattendu : du crédit.`],
  [()=>S.flags.pression_presse, `Votre pression sur le journal a fuité. Ce n'est plus
    l'affaire qu'on commente, c'est ce que vous avez fait pour l'étouffer.`],
  [()=>S.flags.secret_defense, `Le secret-défense que vous avez invoqué occupe désormais
    plus de place dans le débat que le dossier lui-même.`]
 ],
 d:`Trois semaines que ça dure. Les révélations se sont taries — il n'y a plus rien de
    neuf à sortir — mais l'affaire a changé de nature. Ce n'est plus un scandale avec des
    faits. C'est devenu un adjectif qu'on accole à votre nom, dans les matinales, comme
    une évidence.<br><br>
    Votre directrice de la communication propose une contre-offensive en trois temps, avec
    un calendrier, des relais, une séquence. Votre plume, elle, ne propose rien. Elle dit
    juste, en posant son stylo : « Il n'y a pas de bon texte pour ça. Il n'y a que des
    faits nouveaux. Trouvez-en, ou attendez. »<br><br>
    Le journal de vingt heures ouvre encore sur l'affaire ce soir. Il faut décider : agir,
    diversion, ou patience.`,
 o:[
  {l:"Produire des faits nouveaux : réforme du financement politique",
   r:`Vous ne répondez pas à l'affaire. Vous changez les règles qui l'ont rendue possible :
      plafonnement strict des dons, publicité intégrale et immédiate des comptes de
      campagne, autorité de contrôle indépendante aux pouvoirs renforcés.<br><br>
      C'est la seule manière honnête de changer de sujet — en s'attaquant à la cause plutôt
      qu'en enterrant le symptôme.<br><br>
      Le texte est voté en huit mois. Il survivra à votre mandat, à celui d'après, à celui
      d'encore après. Dans vingt ans, quand on cherchera ce qui reste de cette année-là,
      c'est cette loi qu'on citera — pas l'affaire.`,
   e:{social:13,budget:-4,groups:{salaries:10,jeunes:13,ruraux:8,patrons:-6}},
   pose:"reforme_financement", rival:-13},
  {l:"Changer de sujet par une annonce économique massive",
   r:`Un plan de quinze milliards d'euros pour l'industrie, annoncé un mardi matin en
      grande pompe, qui occupe toute la place médiatique du mercredi et du jeudi.<br><br>
      Ça marche trois jours. Exactement trois.<br><br>
      Puis un journaliste, en conférence de presse, pose la question tout haut : « Ce plan
      était-il prêt, ou a-t-il été avancé pour couvrir l'affaire ? » Vous répondez que non,
      bien sûr. Et la question, elle, ne se referme plus jamais. Elle s'accroche au plan
      comme une étiquette : « le plan de la diversion ».`,
   e:{budget:-13,economie:10,cac:7,groups:{patrons:11,salaries:7}},
   pose:"diversion"},
  {l:"Attendre que ça passe",
   r:`Rien. Aucune réaction, aucun contre-feu, aucune annonce. Vous continuez l'agenda
      comme si de rien n'était.<br><br>
      L'affaire s'éteint effectivement, au bout de cinq semaines, comme s'éteignent toutes
      les affaires — par lassitude, parce qu'il y a autre chose à commenter.<br><br>
      Elle laisse un dépôt, invisible mais mesurable. Dans les enquêtes d'opinion, à la
      question « diriez-vous que c'est quelqu'un d'honnête ? », votre score perd onze
      points. Il ne les récupérera pas d'ici la fin du mandat. Une affaire qui passe ne
      disparaît pas : elle se dissout dans l'image.`,
   e:{social:-7,groups:{salaries:-6,jeunes:-8,retraites:-4}},
   pose:"attente", rival:7}
 ]},

{id:"m34", ch:6, mois:34, ico:"🏭", t:"Le plan social",
 intro:[
  [()=>S.eco<45, `L'économie va mal depuis des mois. Ce plan social ne sera pas le
    dernier, et tout le monde le sait.`],
  [()=>S.flags.contrat_naval, `Le groupe qui ferme est celui-là même que vous avez sauvé
    l'an dernier avec le contrat naval. On vous le rappellera.`]
 ],
 d:`Quatre mille postes. Six sites. Une décision prise à l'étranger, dans un conseil
    d'administration, un mardi matin, communiquée à Bercy par fax quinze minutes avant la
    presse.<br><br>
    Le PDG accepte de vous recevoir. Il est courtois, il a ses chiffres, et son argument
    n'est pas absurde : sans cette restructuration maintenant, le groupe perd son avance
    technologique en trois ans — et alors, ce ne sont pas quatre mille emplois qui
    partent, mais dix-huit mille.<br><br>
    Dans la cour de l'usine de Hagondange, en Moselle, deux cents personnes se sont
    rassemblées. Une seule caméra, mais elle tourne. Il faut décider : entrer au capital,
    négocier une reconversion, ou laisser faire.`,
 o:[
  {l:"Entrer au capital pour bloquer les fermetures",
   r:`L'État prend vingt et un pour cent du groupe, pour dix-neuf milliards d'euros, et
      obtient en échange un moratoire de trois ans sur toute fermeture de site français.<br><br>
      Les six sites restent ouverts. À Hagondange, on vous applaudit debout, on brandit
      des pancartes « Merci ».<br><br>
      À Bercy, dans le même temps, on fait un calcul qu'on ne rendra jamais public : le
      coût par emploi sauvé, sur trois ans, ramené à l'année. Le chiffre est énorme. Il
      resterait dans un tiroir si un jour un rapport de la Cour des comptes ne le sortait
      pas.`,
   e:{pib:-0.6,budget:-19,economie:-4,cac:-8,soc:{pauvrete:12},
      groups:{salaries:16,ruraux:11,patrons:-14}},
   axe:{social:2}, pose:"entree_capital", rival:-7},
  {l:"Négocier un plan de reconversion financé par le groupe",
   r:`Quatre mille salariés. Dix-huit mois de formation intégralement payés par
      l'entreprise. Une clause de reclassement prioritaire dans les autres sites du groupe,
      en France et en Europe.<br><br>
      Les six sites ferment quand même. C'est dur, et sur le moment, ça ressemble à une
      défaite.<br><br>
      Deux ans plus tard, un cabinet indépendant mesure le taux de retour à l'emploi des
      salariés concernés : soixante-huit pour cent. Un résultat exceptionnel, largement
      au-dessus de la moyenne des plans sociaux. Personne n'en parlera jamais — parce qu'un
      site fermé fait une image, et un ouvrier qui retrouve du travail, non.`,
   e:{budget:-7,soc:{educ:10,pauvrete:6},groups:{salaries:8,ruraux:5,patrons:-4}},
   pose:"reconversion"},
  {l:"Laisser faire : « l'État n'est pas un actionnaire »",
   r:`Vous assumez la doctrine en conférence de presse, posément : sauver des sites
      condamnés par la technologie coûte plus cher, à long terme, que d'accompagner
      correctement les gens vers autre chose.<br><br>
      C'est probablement vrai, économiquement. Ça ne s'entend pas quand on est celui qui
      perd son emploi.<br><br>
      À Hagondange, le soir même, deux mille personnes brûlent votre portrait devant la
      grille de l'usine. Le maire, qui vous soutenait depuis le début, annonce le lendemain
      qu'il ne le fera plus. Il ne rejoint personne. Il s'en va, c'est tout.`,
   e:{pib:0.9,economie:6,cac:7,soc:{pauvrete:-14,pouvoir:-8},
      groups:{patrons:13,salaries:-15,ruraux:-11}},
   axe:{social:-2}, pose:"non_intervention", rival:12}
 ]},

{id:"m35", ch:6, mois:35, ico:"🛰️", t:"L'incident",
 intro:[
  [()=>valeur("securite")>65, `Nos armées ont les moyens de répondre. C'est une chance :
    ça vous laisse le choix, au lieu de vous l'imposer.`],
  [()=>valeur("securite")<40, `Le chef d'état-major a une phrase pour résumer nos moyens :
    « Nous pouvons faire une chose. Une seule. Choisissez laquelle. »`]
 ],
 d:`Un câble sous-marin de communication, sectionné net au large de Brest. Et, croisant
    dans la zone quatre heures plus tôt, un navire sans pavillon identifiable, repéré par
    un satellite.<br><br>
    Trois millions de foyers privés d'internet du jour au lendemain. Deux hôpitaux coupés
    de leurs serveurs centraux, obligés de revenir au papier. Des transactions bancaires
    bloquées par milliers.<br><br>
    Personne ne revendique. Tout le monde a compris. Le chef d'état-major particulier
    attend dans le salon vert avec trois enveloppes. Nos alliés demandent, poliment mais
    fermement, ce que la France compte faire — et si elle compte faire quelque chose.`,
 o:[
  {l:"Rendre l'incident public et l'attribuer nommément",
   r:`Conférence de presse solennelle du ministre des Armées. Le navire est nommé, son
      pavillon réel est nommé, les images satellite sont projetées sur écran.<br><br>
      L'attribution publique d'un acte hostile est rare — les États préfèrent d'habitude
      le silence. Elle a un effet net : aucun nouvel incident de ce type pendant quatorze
      mois. Le message a été reçu.<br><br>
      Elle a aussi un coût, immédiat : deux contrats commerciaux importants sont annulés
      dans la semaine par le pays mis en cause, et notre ambassadeur là-bas est rappelé
      « pour consultations » — c'est-à-dire pour longtemps.`,
   e:{sec:{defense:14,interieure:6},economie:-4,
      groups:{retraites:10,ruraux:8,patrons:-5}},
   axe:{autorite:1}, pose:"attribution_publique"},
  {l:"Répondre discrètement, dans le même registre",
   r:`Rien n'est dit publiquement. Aucune conférence de presse, aucune protestation
      diplomatique visible.<br><br>
      Onze jours plus tard, à quatre mille kilomètres de la France, une infrastructure
      comparable — un câble, un pipeline — connaît une avarie « d'origine indéterminée ».
      Personne n'établit de lien. Personne n'est censé en établir.<br><br>
      Le message est reçu, là où il devait l'être, par ceux qui devaient le recevoir. Le
      pays, lui, ne saura jamais qu'il a été attaqué, ni qu'on a répondu. C'est peut-être
      la bonne manière de faire. C'est en tout cas une manière dont on ne peut pas se
      vanter.`,
   e:{sec:{defense:12},social:-3,groups:{retraites:6,jeunes:-4}},
   pose:"riposte_discrete"},
  {l:"Ne rien dire et investir en silence dans la protection des câbles",
   r:`Aucune riposte. À la place, un programme : douze milliards d'euros sur cinq ans.
      Drones sous-marins de surveillance, réseau de capteurs sur les câbles stratégiques,
      deux bâtiments de la Marine spécialisés dans la protection des fonds marins.<br><br>
      Le programme est classifié. Son budget est fondu dans une ligne opaque de la loi de
      programmation militaire. Il ne rapportera jamais un seul point de sondage — personne
      ne saura qu'il existe.<br><br>
      Dans dix ans, quand les câbles sous-marins seront devenus un enjeu de sécurité
      majeur pour toute l'Europe, ce programme sera considéré comme la décision la plus
      lucide de votre mandat — par les trois personnes qui en connaîtront l'existence.`,
   e:{budget:-12,sec:{defense:16},economie:4,groups:{patrons:6}},
   pose:"protection_silencieuse"}
 ]},

{id:"m36", ch:6, mois:36, ico:"🥀", t:"La trahison",
 intro:[
  [()=>S.rival>=60, `Ferrand est donné gagnant depuis des mois. Les rats ne quittent pas
    le navire par lâcheté : ils le quittent parce qu'ils savent lire une ligne d'eau.`],
  [()=>popularite()>52, `Vous remontez dans les sondages. C'est précisément ce qui rend ce
    qui va suivre incompréhensible.`]
 ],
 d:`Il a demandé à vous voir seul, en fin de journée, sans note et sans conseiller. Trois
    ans qu'il tient un ministère régalien. Deux campagnes menées ensemble, épaule contre
    épaule. C'est lui qui vous a présenté, il y a huit ans, celle qui est aujourd'hui
    votre directrice de cabinet.<br><br>
    Il reste debout, près de la fenêtre. « Je pars. Demain, à onze heures, j'annonce que
    je rejoins Julien Ferrand. » Il ne se justifie pas, ne s'excuse pas, ne hausse pas le
    ton. Il ajoute seulement, avant de partir : « Vous ne m'écoutiez plus depuis
    longtemps. C'est peut-être ça, le vrai problème. »<br><br>
    Il a les clés de son ministère dans la poche et sept ans de dossiers dans la tête.`,
 o:[
  {l:"Le laisser partir sans un mot public",
   r:`Il annonce le lendemain à onze heures, sur un plateau, avec les honneurs dus à une
      recrue de poids. Vous ne réagissez pas. Votre entourage non plus, sur consigne.
      L'Élysée publie un communiqué de deux lignes remerciant « le ministre pour son
      travail au service du pays ».<br><br>
      La dignité a un coût : pendant trois jours, il occupe seul tout l'espace médiatique,
      raconte sa version, explique son départ, et vous ne dites rien.<br><br>
      Elle a aussi un rendement, plus lent : personne ne pourra jamais dire que vous avez
      été petit, revanchard, mesquin. Dans une fin de mandat, cette réputation-là vaut
      quelque chose.`,
   e:{social:4,groups:{retraites:5,patrons:4,salaries:3}},
   pose:"depart_digne", rival:4},
  {l:"Prendre les devants : l'annoncer vous-même ce soir",
   r:`Vous parlez le soir même, avant lui, dans une déclaration brève. Vous racontez la
      conversation telle qu'elle a eu lieu, sans l'accabler, sans en rajouter : un ministre
      qui part, un désaccord de fond, une porte qui se ferme proprement.<br><br>
      Son annonce du lendemain tombe à plat. Il n'a plus rien à révéler — vous avez déjà
      tout dit, et mieux que lui.<br><br>
      Il vous en voudra pour ça plus que pour tout le reste. Lui avoir volé son moment, sa
      mise en scène, son « je fais mes valises et je claque la porte » — ça, il ne le
      pardonne pas. C'est le prix normal d'un coup bien joué.`,
   e:{social:6,economie:3,groups:{salaries:7,retraites:6,jeunes:5}},
   pose:"gouverner_jusquau_bout", rival:-7},
  {l:"Faire savoir ce que vous savez de lui",
   r:`Deux confidences « off » à des journalistes en vingt-quatre heures. Un déjeuner avec
      un éditorialiste influent. Et, le vendredi, une information sur l'usage de ses frais
      de mandat qui sort dans un hebdomadaire.<br><br>
      Il est abîmé. Sa défection, qui devait être un coup d'éclat, devient un départ sous
      les soupçons.<br><br>
      Vous êtes abîmé aussi. En une semaine, trois journalistes recoupent l'origine des
      fuites et la font remonter, sans ambiguïté, jusqu'à votre cabinet. On appelle ça une
      victoire à la Pyrrhus. C'en est une : vous avez gagné le combat et perdu quelque
      chose de plus difficile à réparer.`,
   e:{social:-12,sec:{interieure:-4},
      groups:{jeunes:-13,salaries:-11,ruraux:-7,patrons:5}},
   axe:{autorite:2}, pose:"represailles", rival:13}
 ]},

/* ═══════════ ANNÉE IV ═══════════ */

{id:"m37", ch:7, mois:37, ico:"🧾", t:"Le dernier budget",
 intro:[
  [()=>S.dette>180, `Votre dernier budget sera lu comme un testament. Avec les chiffres
    de dette qui sont les vôtres aujourd'hui, ce sera un testament contesté ligne à ligne.`],
  [()=>S.flags.plan_economies, `Vous avez déjà taillé une fois dans la dépense, et le pays
    s'en souvient. Recommencer maintenant, à un an du scrutin, personne ne vous le
    pardonnera.`]
 ],
 d:`C'est le dernier budget que vous ferez voter. Celui que votre successeur, quel qu'il
    soit, devra exécuter — et dont il expliquera pendant deux ans qu'il en a hérité, en
    pointant votre nom à chaque conférence de presse.<br><br>
    Votre ministre du Budget est venu vous voir un soir, après le Conseil. Il a posé sur
    la table deux chemises cartonnées. Une version sincère : les hypothèses de croissance
    réelles, les impasses assumées, un déficit qui ne fait rêver personne. Une version
    électorale : optimiste sur tout, généreuse partout, indéfendable poste par poste
    devant la Cour des comptes. Il les a laissées côte à côte, sans un mot — et ce
    silence, chez un homme qui parle habituellement trop, est la forme la plus nette du
    conseil.<br><br>
    Le Conseil des ministres arbitre dans six jours. Vous devez trancher : la vérité qui
    coûte des points, l'artifice qui en rapporte, ou l'entre-deux que personne ne saura
    résumer en campagne.`,
 o:[
  {l:"La version sincère, même si elle fait mal",
   r:`Vous présentez le budget tel qu'il est. Croissance à un virgule un pour cent — pas à
      un virgule huit comme on aurait aimé l'écrire. Déficit affiché sans habillage
      comptable. Aucune recette exceptionnelle glissée en annexe pour boucler la
      dernière ligne.<br><br>
      Il est adopté sans le moindre enthousiasme, dans un hémicycle qui aurait préféré
      des cadeaux à distribuer en circonscription. Deux députés de votre camp s'abstiennent
      pour marquer le coup.<br><br>
      Mais votre successeur, en ouvrant ces dossiers le lendemain de son entrée en
      fonction, trouvera des comptes lisibles, des hypothèses qui tiennent, et pas une
      seule bombe à retardement dissimulée dans une sous-annexe. C'est peu spectaculaire.
      C'est probablement ce qui manque le plus, et le plus systématiquement, à ce
      métier.`,
   e:{budget:13,dette:-7,economie:5,cac:6,soc:{pouvoir:-10},
      groups:{patrons:12,salaries:-8,retraites:-7}},
   pose:"budget_sincere", rival:5},
  {l:"La version électorale : dépenser maintenant",
   r:`Le budget est généreux. Baisses d'impôts ciblées, dépenses nouvelles annoncées en
      fanfare, hypothèses de croissance que plus personne ne défend sérieusement. Il est
      sincèrement insincère, et chacun le sait dans l'hémicycle en levant la main pour le
      voter.<br><br>
      Le Haut Conseil des finances publiques rend un avis assassin : douze lignes,
      publiées un vendredi soir pour limiter la casse médiatique du week-end. Presque
      personne ne le lit.<br><br>
      Sauf Julien Ferrand. Il le fait agrandir, encadrer, et le brandit à chacun de ses
      meetings pendant six semaines : « Voilà l'état réel des comptes qu'il vous laisse, et
      qu'il n'a pas eu le courage de vous montrer. » La phrase fait mouche parce qu'elle
      est vraie.`,
   e:{pib:-0.8,budget:-16,dette:9,soc:{pouvoir:18,pauvrete:10},
      groups:{salaries:13,retraites:11,jeunes:8,patrons:-10}},
   pose:"budget_electoral", rival:-8},
  {l:"Un budget d'investissement, ni l'un ni l'autre",
   r:`Ni relance financée à crédit, ni austérité affichée. Douze milliards d'euros fléchés
      précisément sur trois cibles : la réindustrialisation, la formation professionnelle,
      la production d'énergie décarbonée.<br><br>
      C'est un budget qu'on ne peut pas résumer en une phrase de meeting, et c'est son
      défaut principal — en campagne, ce qui ne se résume pas ne s'entend pas, et ce qui
      ne s'entend pas n'existe pas.<br><br>
      Les économistes le jugent bon, sérieux, bien ciblé, et le disent dans des tribunes
      que personne ne partage. Les électeurs, eux, ne le comprennent pas et n'en
      retiennent rien de précis. Il faudra attendre six ou sept ans pour savoir qui avait
      raison, et à ce moment-là, plus personne ne se souviendra de qui l'avait fait
      voter.`,
   e:{pib:1.2,budget:-8,dette:4,economie:9,cac:5,soc:{educ:10},
      groups:{patrons:8,jeunes:9,salaries:4}},
   pose:"budget_investissement"}
 ]},

{id:"m39", ch:7, mois:39, ico:"🤐", t:"L'homme qui sait",
 intro:[
  [()=>S.flags.marchandage, `Il a la liste des sous-préfectures que vous avez sauvées pour
    acheter neuf voix au moment du vote clé. Elle est précise, datée, chiffrée
    poste par poste.`],
  [()=>S.flags.pression_presse, `Il sait exactement ce que votre cabinet a fait pour
    retarder la publication d'un article gênant. Il en a gardé la trace écrite.`],
  [()=>!S.flags.marchandage&&!S.flags.pression_presse, `Il n'a rien de vraiment
    compromettant sous le coude. C'est précisément pour ça qu'il est dangereux : ce
    qu'il n'a pas, il l'inventera, et personne ne fera le tri.`]
 ],
 d:`Un ancien conseiller, parti fâché il y a deux ans, écarté d'un arbitrage qu'il
    croyait avoir gagné. Il publie un livre en septembre — en plein cœur de la campagne,
    ce qui n'est évidemment pas un hasard de calendrier — chez un éditeur réputé pour
    savoir faire du bruit avec peu de matière.<br><br>
    L'intermédiaire qui vous transmet le message est d'une clarté désagréable : un poste,
    n'importe lequel, une nomination honorable dans un organisme tranquille, et le
    manuscrit part au pilon avant même d'être imprimé.<br><br>
    Personne d'autre que vous n'est au courant de cette conversation. Personne ne saura
    jamais ce que vous avez répondu — sauf, plus tard, en creux, à travers ce qui aura
    fini par être publié, ou pas.`,
 o:[
  {l:"Refuser tout net et laisser paraître le livre",
   r:`Vous refusez en une phrase, sans négocier une virgule, et vous raccrochez.<br><br>
      Le livre sort en septembre, en pleine campagne. Il est méchant, mal écrit, bâti sur
      des rancunes personnelles mal digérées, et il se vend correctement pendant trois
      semaines avant de refluer.<br><br>
      Rien de ce qu'il contient n'est vérifiable — pas un document, pas une source
      nommée, rien que des « il m'a dit » et des « j'étais dans la pièce ce jour-là ». Et
      c'est justement ce qui le rend inoffensif à moyen terme : un livre de règlement de
      comptes sans la moindre preuve, ça fait un pic de ventes, deux plateaux de
      télévision, et ça retombe. Vous avez tenu bon pour le prix d'un mauvais mois de
      presse.`,
   e:{social:7,groups:{jeunes:8,salaries:6,ruraux:5}},
   pose:"refus_chantage", rival:4},
  {l:"Lui donner le poste",
   r:`Il est nommé au Conseil économique, social et environnemental un mardi de juillet,
      en pleine torpeur estivale, dans un communiqué de trois lignes que pas un
      journaliste ne relève sur le moment.<br><br>
      Le manuscrit ne sortira jamais. Il part au pilon comme promis, et vous avez éteint
      l'incendie avant même qu'il prenne, proprement, sans bruit, sans trace apparente.<br><br>
      Mais un attaché parlementaire, au courant de la nomination et de son motif réel, en
      parle à quelqu'un un soir de fatigue, qui en parle à Camille Reyes. Elle mettra huit
      mois à tout établir, recouper, dater pièce par pièce, sans jamais rien publier de
      prématuré. Elle sortira son enquête quand ce sera solide, inattaquable, impossible à
      démentir. Elle a tout le temps devant elle. Vous, beaucoup moins.`,
   e:{social:-12,groups:{jeunes:-14,salaries:-11,ruraux:-8}},
   axe:{autorite:1}, pose:"chantage_cede", rival:14},
  {l:"Prendre les devants : raconter vous-même ces deux années",
   r:`Un entretien-fleuve de quatre heures, publié in extenso dans un grand quotidien, où
      vous racontez vous-même les arbitrages de ces deux dernières années — y compris ceux
      que vous avez ratés, y compris les tensions internes, y compris ce départ qui a mal
      tourné.<br><br>
      Le livre de l'ancien conseiller sort trois mois plus tard, dans un paysage où tout
      a déjà été dit, où chaque anecdote a déjà été racontée, mieux et plus tôt, par le
      principal intéressé lui-même.<br><br>
      Il fait quatre articles polis et disparaît des tables des libraires en un mois. On
      ne tue pas un livre de coulisses en tentant de le censurer. On le tue en publiant
      les coulisses soi-même, d'abord, et en entier.`,
   e:{social:10,budget:-3,groups:{salaries:9,jeunes:11,retraites:5,patrons:-4}},
   pose:"recit_assume", rival:-10}
 ]},

{id:"m40", ch:7, mois:40, ico:"🧊", t:"La vague",
 intro:[
  [()=>S.axes.ecologie>=3, `Vous avez investi dans la prévention et l'adaptation pendant
    quatre ans, contre l'avis de beaucoup. Ce soir, on va savoir si ça servait à quelque
    chose.`],
  [()=>S.axes.ecologie<=-2, `Les digues n'ont pas été refaites faute d'arbitrage
    favorable. Le rapport qui le recommandait, urgent, date de votre première année de
    mandat.`]
 ],
 d:`Une tempête que les modèles climatiques annonçaient encore « centennale » il y a
    quinze ans — et qui est la troisième en six ans. Deux cent mille foyers évacués sur
    toute la façade atlantique. Une ville de taille moyenne coupée du monde pendant
    trente-six heures : sans eau courante, sans électricité, sans route praticable.<br><br>
    Vous y allez demain matin, à la première heure. La question n'est pas d'y aller ou
    non — elle ne se pose pas. C'est ce que vous direz en descendant de l'hélicoptère,
    devant des gens qui ont tout perdu il y a quelques heures, et qui ont voté, dans ce
    département, très majoritairement contre vous.<br><br>
    Les caméras seront à quatre mètres. Chaque mot, chaque silence, chaque geste maladroit
    passera en boucle au journal de vingt heures pendant trois jours.`,
 o:[
  {l:"Annoncer un plan digues et adaptation, chiffré, immédiat",
   r:`Vingt milliards d'euros sur dix ans : renforcement des digues existantes,
      renaturation des zones tampons, relocalisation volontaire et intégralement financée
      des deux cents habitations les plus exposées.<br><br>
      C'est le premier plan d'adaptation de cette ampleur jamais lancé dans le pays. Il
      admet publiquement ce que personne n'osait formuler à voix haute : la mer va monter,
      durablement, et il faut s'y préparer plutôt que de faire semblant de la
      repousser.<br><br>
      Un maire de droite, qui ne vous a jamais soutenu et ne le fera jamais, déclare au
      micro d'une radio locale : « Il faut savoir saluer quand c'est juste. » Cette
      phrase-là, dans la bouche d'un adversaire déclaré, vaut plus que tous les sondages
      de la semaine réunis.`,
   e:{budget:-20,cli:{eau:20,sols:10},soc:{pauvrete:8},
      groups:{ruraux:15,salaries:8,jeunes:9}},
   axe:{ecologie:1}, pose:"plan_adaptation", rival:-9},
  {l:"Rester deux jours sur place, sans rien annoncer",
   r:`Quarante-huit heures sur le terrain. Aucune annonce, aucun chiffre lâché à la presse,
      aucun plan sorti d'un dossier. Vous écoutez, vous prenez des notes, vous restez
      quand les caméras sont déjà reparties.<br><br>
      Un pompier volontaire, épuisé, le visage noir de fatigue, vous glisse en fin de
      deuxième journée : « Les autres, ils sont venus deux heures. » C'est cette
      phrase-là qui restera de la visite — pas une mesure, une phrase d'homme
      fatigué.<br><br>
      Les annonces viendront trois semaines plus tard, une fois le terrain vraiment
      compris, une fois les besoins réels remontés. Elles seront mieux calibrées, mieux
      acceptées localement — parce qu'elles auront été précédées de deux jours d'écoute,
      et que ça, ça s'entend dans un discours.`,
   e:{social:9,groups:{ruraux:13,salaries:7,retraites:6}},
   pose:"presence_longue", rival:-6},
  {l:"Une visite courte : le pays a d'autres urgences",
   r:`Deux heures dix sur place, montre en main. Hélicoptère, gilet de sauvetage orange
      par-dessus le costume, poignées de main rapides sur le parking d'un gymnase, un mot
      au maire, et redécollage avant le déjeuner pour un autre déplacement.<br><br>
      Un habitant filme votre hélicoptère qui repart et poste la vidéo avec une légende de
      sept mots : « Il est resté moins longtemps que l'eau. »<br><br>
      Onze millions de vues en trois jours. Vous avez économisé une demi-journée d'agenda
      présidentiel déjà surchargé. Vous l'avez payée au prix fort : cette phrase, désormais,
      résume à elle seule votre rapport au terrain, et elle ressortira à chaque
      catastrophe d'ici la fin du mandat.`,
   e:{economie:3,groups:{ruraux:-14,salaries:-6,jeunes:-5}},
   pose:"visite_courte", rival:10}
 ]},

{id:"m41", ch:7, mois:41, ico:"🚑", t:"Le meeting",
 intro:[
  [()=>S.axes.autorite>=3, `Vous avez nettement durci le pays pendant quatre ans. On vous
    demandera, ce soir et les jours suivants, si ce climat-là ne vous appartient pas un
    peu.`],
  [()=>valeur("securite")<40, `Les services de renseignement avaient signalé un risque
    diffus autour des meetings dès janvier. La note existe, elle est archivée, et elle
    finira par sortir.`]
 ],
 d:`Vingt et une heures dix, salle des fêtes de Villeurbanne. Un homme de vingt-six ans a
    tiré trois fois en direction de la tribune, en plein meeting de campagne de Julien
    Ferrand.<br><br>
    Ferrand n'est pas touché. Une militante de soixante-treize ans est en réanimation,
    pronostic vital engagé. Un jeune du service d'ordre a pris une balle dans l'épaule en
    se jetant devant elle, sans réfléchir.<br><br>
    Le tireur criait quelque chose au moment des coups de feu. On ne sait pas encore quoi
    — mobile politique, crise psychiatrique, règlement de comptes personnel. Et pendant
    les trois heures que durera cette incertitude, le pays entier va décider tout seul de
    ce qui s'est passé, et de qui est responsable. Il faut parler avant que ce soit figé.`,
 o:[
  {l:"Aller à l'hôpital cette nuit, et voir Ferrand",
   r:`Vous arrivez à deux heures dix du matin. Vous voyez la militante en réanimation,
      intubée — vous ne lui parlez pas, vous restez un moment sur le seuil de la chambre.
      Vous voyez le jeune du service d'ordre, qui vous demande des nouvelles des autres
      blessés avant même de parler de son épaule.<br><br>
      Puis vous voyez Ferrand. Dix minutes, seul à seul, sans caméra, sans conseiller,
      sans témoin. Personne ne saura jamais ce qui s'est dit dans cette petite salle
      d'attente.<br><br>
      Le lendemain, il refuse publiquement toute attaque contre vous. Pendant huit jours,
      il parle du pays, de la démocratie, de la violence politique — jamais de vous. Ces
      huit jours-là valent très cher en pleine campagne, et vous les lui devez.`,
   e:{social:12,sec:{interieure:6},
      groups:{salaries:10,retraites:12,ruraux:9,jeunes:7}},
   pose:"ralliement_digne", rival:-9},
  {l:"Allocution solennelle : suspendre la campagne huit jours",
   r:`Vingt heures, allocution solennelle de six minutes depuis votre bureau. Vous
      annoncez la suspension de toutes les réunions publiques de campagne — les vôtres,
      celles de tous vos concurrents — et vous appelez chacun à en faire autant. Tous
      acceptent dans l'heure.<br><br>
      Le pays s'arrête un peu. Il respire. Il sort de la fièvre électorale pendant une
      semaine entière, et ça fait visiblement du bien à tout le monde.<br><br>
      Huit jours plus tard, la campagne reprend — plus courte, plus grave, sensiblement
      moins agressive dans le ton. Vous avez perdu des jours de terrain que vous ne
      rattraperez pas. Vous avez gagné une stature : celle du président qui, au moment de
      la violence, a su arrêter la machine.`,
   e:{social:9,sec:{interieure:8},economie:-3,
      groups:{retraites:11,salaries:7,ruraux:6}},
   pose:"campagne_suspendue", rival:-4},
  {l:"Annoncer des mesures d'ordre immédiates, avant toute enquête",
   r:`Vous parlez à minuit, sans attendre les premiers éléments. Contrôle renforcé de tous
      les meetings, fichier des individus signalés élargi par décret, moyens exceptionnels
      débloqués immédiatement pour la police.<br><br>
      À trois heures du matin, l'enquête livre ses premières conclusions : le tireur
      agissait seul, souffrait de troubles psychiatriques lourds et documentés, sans
      mobile politique établi, sans le moindre réseau derrière lui.<br><br>
      Vos annonces de minuit se retrouvent en porte-à-faux total avec les faits. On les
      lit désormais pour ce qu'elles sont : une réaction sécuritaire décidée avant de
      savoir, par pur réflexe. Le mot « instrumentalisation » revient dans tous les
      éditoriaux du matin.`,
   e:{sec:{interieure:18},social:-9,
      groups:{retraites:13,ruraux:10,jeunes:-15,salaries:-5}},
   axe:{autorite:2}, pose:"ordre_immediat", rival:8}
 ]},

{id:"m42", ch:7, mois:42, ico:"🎒", t:"Le lycée",
 intro:[
  [()=>S.flags.revalo_profs, `Vous avez revalorisé les enseignants il y a trois ans, à un
    coût politique réel. Ce sont eux qui parleront aux caméras ce soir, et ils ne vous
    détestent pas.`],
  [()=>valeur("social")<40, `Cela fait des années que les rapports parlementaires
    alertent sur la santé mentale des adolescents. Cela fait des années qu'ils s'empilent
    sur une étagère, non lus.`]
 ],
 d:`Un lycée de deux mille élèves à Poitiers, dans un quartier calme, sans histoires. Un
    garçon de dix-sept ans, sans casier, une arme prise dans l'armoire mal fermée de son
    père, et onze minutes interminables entre le premier tir et l'intervention du
    RAID.<br><br>
    Deux morts : une professeure de mathématiques qui s'était interposée, un élève de
    seconde touché dans le couloir. Le tireur est vivant, arrêté, hospitalisé sous garde.
    Sur son ordinateur, les enquêteurs retrouvent trois signalements le concernant, faits
    par des camarades en février dernier, sur une plateforme de modération qui n'a jamais
    donné la moindre suite.<br><br>
    Les parents attendent devant les grilles depuis quatre heures du matin, sans nouvelles
    précises, à guetter chaque visage qui sort. Il faut décider, vite, ce que l'État
    répond : la prévention, la sécurisation des bâtiments, ou les armes elles-mêmes.`,
 o:[
  {l:"Un plan national de santé mentale pour la jeunesse",
   r:`Trois mille postes de psychologues et de pédopsychiatres créés en deux ans.
      Consultations gratuites et sans avance de frais jusqu'à vingt-cinq ans. Un
      dispositif d'alerte et de suivi obligatoire dans chaque établissement
      scolaire.<br><br>
      Les professeurs de Poitiers publient une lettre ouverte, sobre, terrible : « Il
      aurait fallu le faire avant. Avant ça. » Ils ont raison, et vous ne le contestez
      pas une seconde en public.<br><br>
      Le plan tiendra dans la durée — parce que la douleur de ce moment précis aura rendu
      son financement politiquement impossible à refuser au Parlement. C'est une manière
      triste de faire adopter une bonne réforme. C'est souvent la seule qui marche.`,
   e:{budget:-18,soc:{sante:20,educ:14},
      groups:{jeunes:15,salaries:11,retraites:6,patrons:-6}},
   axe:{social:1}, pose:"prog_sante_mentale", rival:-10},
  {l:"Sécuriser les établissements : portiques, contrôles, présence policière",
   r:`Portiques de sécurité installés dans quinze cents lycées en une rentrée. Un référent
      sûreté nommé dans chaque établissement, souvent un ancien policier ou militaire. Des
      patrouilles aux abords, aux heures d'entrée et de sortie.<br><br>
      Les parents se sentent immédiatement rassurés, et le disent dans les sondages. Les
      élèves, beaucoup moins : ils décrivent des files d'attente de vingt minutes le
      matin, des fouilles de sac aléatoires, une école qui ressemble désormais à un hall
      d'aéroport un jour de grève.<br><br>
      Un proviseur résume à la radio ce que beaucoup pensent tout bas : « Nous avons
      transformé nos établissements en zones sécurisées. Nous n'avons rien réglé de ce qui
      a fait basculer ce garçon-là, ni de ce qui fera basculer le suivant. » La phrase
      tourne en boucle pendant des semaines.`,
   e:{budget:-14,sec:{interieure:18},soc:{educ:-8},
      groups:{retraites:12,ruraux:9,jeunes:-11}},
   axe:{autorite:2}, pose:"prog_securite"},
  {l:"S'attaquer aux armes détenues à domicile, quitte à affronter le lobby",
   r:`Coffre-fort homologué obligatoire pour toute arme détenue à domicile. Contrôle sur
      place tous les deux ans par la gendarmerie. Retrait automatique et immédiat du
      permis de détention en cas de signalement pour violence conjugale ou trouble
      psychiatrique.<br><br>
      Les fédérations de chasse organisent la plus grosse manifestation de leur histoire :
      cent mille personnes défilent à Paris un samedi, tracteurs en tête, et vous
      accusent de « criminaliser la ruralité ».<br><br>
      Le texte passe quand même, amputé d'un bon tiers de ses dispositions au Sénat. Effet
      mesurable dès la première année : le nombre d'armes déclarées bondit de dix-huit
      pour cent. Ce qui veut dire, en creux, qu'elles existaient déjà — non déclarées, non
      contrôlées, au fond des armoires.`,
   e:{sec:{interieure:14},social:5,economie:-3,
      groups:{jeunes:11,salaries:8,ruraux:-14,patrons:-5}},
   pose:"prog_armes", rival:6}
 ]},

{id:"m43", ch:8, mois:43, ico:"🚌", t:"La campagne",
 intro:[
  [()=>S.rival>=62, `Dans les salles, il y a du monde, de la chaleur, des gens debout au
    fond. Dans les sondages, il n'y a rien de bon. Vos équipes ont cessé de commenter les
    deux ensemble.`],
  [()=>S.flags.terrain_regulier, `Vous faites ça, ce porte-à-porte des idées, depuis trois
    ans sans discontinuer. Ça se voit sur scène : vous connaissez les prénoms, les
    situations, et ça change tout.`],
  [()=>popularite()<35, `Deux meetings ont été purement et simplement annulés faute de
    garanties de sécurité suffisantes. On ne l'a pas dit à la presse.`]
 ],
 d:`Six semaines de campagne. Quatre-vingts déplacements. Une odeur de gymnase, de café
    tiède dans des gobelets et de sono qui grésille que vous n'oublierez pas de sitôt.
    Vous avez perdu quatre kilos et gagné une seule certitude solide : le pays ne vous
    doit rien, et il vous le fait sentir à chaque poignée de main.<br><br>
    À Amiens, dans la cohue d'une sortie de meeting, une femme vous attrape le bras et
    vous dit une phrase de six mots. Six mots simples, justes, qui résument mieux que vos
    discours tout ce que vous essayez de faire passer depuis des semaines. Votre équipe
    voudrait que vous les citiez partout, à chaque étape. Vous n'êtes pas sûr d'en avoir
    le droit moral.<br><br>
    Le premier tour est dans huit jours. Il faut choisir la note sur laquelle finir.`,
 o:[
  {l:"Faire campagne sur la peur de l'autre",
   r:`Trois derniers meetings, un seul message martelé sans relâche : ce que le pays
      deviendrait avec lui aux commandes — les libertés rognées, les institutions
      abîmées, la place de la France en Europe.<br><br>
      Ça mobilise votre électorat le plus âgé, et ça se voit dans les remontées : un
      point, peut-être deux.<br><br>
      Ça déprime aussi une partie de vos militants, ceux qui vous avaient rejoint pour un
      projet et pas pour agiter un repoussoir. Deux responsables de fédération
      démissionnent avant le premier tour, en le faisant savoir. Vous avez gagné des
      points en vendant quelque chose que vous n'aimez pas — et ça s'entend, dans votre
      voix, sur scène.`,
   e:{social:-8,groups:{retraites:13,ruraux:9,jeunes:-14,salaries:-4}},
   axe:{autorite:1}, pose:"campagne_peur", rival:-7},
  {l:"Faire campagne sur votre bilan, chiffres en main",
   r:`Cent vingt réunions publiques en six semaines. Un document de quarante pages
      distribué à l'entrée de chaque salle. Des chiffres vérifiables, des courbes, des
      comparaisons avant/après honnêtes.<br><br>
      C'est solide, précis, documenté — et un peu froid pour une fin de campagne. Deux
      organismes de fact-checking confirment l'essentiel de vos données, ce qui est rare
      pour un bilan de campagne et ne fait, évidemment, aucune une de journal.<br><br>
      Vous convainquez ceux qui vous écoutaient déjà et hésitaient encore un peu. Vous ne
      faites bouger personne d'autre. Un bilan, aussi bon soit-il, n'a jamais fait changer
      d'avis quelqu'un qui a décidé de tourner la page.`,
   e:{economie:4,groups:{patrons:9,retraites:6,salaries:5}},
   pose:"campagne_bilan"},
  {l:"Faire campagne sur les gens rencontrés, pas sur vous",
   r:`Vous ouvrez désormais chaque meeting par une histoire. Une infirmière de nuit
      croisée à Lille. Un agriculteur de la Creuse au bord du dépôt de bilan. Une
      professeure de collège à Sarcelles. Pas des exemples fabriqués : des gens que vous
      avez vraiment rencontrés, dont vous connaissez le prénom et l'histoire.<br><br>
      Ce n'est pas un procédé de communication, et ça s'entend tout de suite. Les salles
      écoutent autrement — moins comme un public venu applaudir, plus comme des gens à qui
      on parle vraiment.<br><br>
      C'est la meilleure campagne que vous ayez menée en cinq ans. Et vous l'avez trouvée
      à la toute fin, quand il ne restait plus que huit jours pour l'exploiter.`,
   e:{social:10,groups:{salaries:11,ruraux:12,jeunes:9,retraites:6}},
   pose:"campagne_terrain", rival:-11}
 ]},

{id:"m46", ch:8, mois:46, ico:"🗳️", t:"Le premier tour",
 intro:[
  [()=>S.rival>=60, `Il est arrivé en tête. De onze points nets. Les commentateurs parlent
    déjà de votre quinquennat au passé, avec la nostalgie polie qu'on réserve aux
    partants.`],
  [()=>S.rival<40, `Vous êtes arrivé en tête. Personne n'y croyait il y a un an, à
    commencer par vous, un soir de doute que vous n'avez raconté à personne.`]
 ],
 d:`Vingt heures. Deux visages s'affichent sur l'écran, le vôtre et le sien. Et deux
    semaines, pas une de plus, pour convaincre les trois millions de Français qui n'ont
    voulu ni de l'un ni de l'autre au premier tour.<br><br>
    Les reports de voix sont un calcul froid, presque mécanique : il y a des électeurs à
    aller chercher quelque part, et chaque endroit où vous irez les chercher vous en fera
    perdre ailleurs. Chaque geste appuyé vers un camp est un signal envoyé à l'autre, qui
    le verra.<br><br>
    Votre directrice de campagne déplie la grande carte électorale sur la table basse de
    votre bureau, les reports possibles surlignés en trois couleurs. « Alors. Où est-ce
    qu'on va, monsieur le Président ? »`,
 o:[
  {l:"Chercher les abstentionnistes des quartiers populaires",
   r:`Onze déplacements en douze jours. Des salles pleines, chaudes, bruyantes, des
      questions dures et frontales sur la police, le logement, l'école, posées sans le
      moindre filtre par des gens qui n'attendent plus grand-chose de vous.<br><br>
      La participation monte de quatre points dans les quartiers concernés — un chiffre
      minuscule sur le papier, et décisif dans les faits : ces quatre points-là ne se
      trouvent nulle part ailleurs, dans aucun autre segment de l'électorat, et ils
      peuvent suffire à faire la différence au second tour.<br><br>
      Vos adversaires vous accusent aussitôt de « clientélisme ». C'est le mot qu'on
      emploie quand quelqu'un va chercher des voix qu'on avait, soi-même, renoncé depuis
      longtemps à aller chercher, et qu'on préférait discrètement voir rester à la
      maison.`,
   e:{soc:{pauvrete:10},groups:{jeunes:14,salaries:9,retraites:-6}},
   pose:"report_populaire", rival:-8},
  {l:"Chercher l'électorat modéré de droite",
   r:`Trois déplacements soigneusement choisis en province. Un discours sur l'autorité de
      l'État et le respect des règles. Un autre sur la liberté d'entreprendre et
      d'embaucher. Un vocabulaire pesé pour rassurer une droite modérée qui hésite encore
      à glisser votre nom dans l'enveloppe.<br><br>
      Ça marche : les reports de ce côté-là se solidifient, deux ou trois points
      gagnés.<br><br>
      Mais deux de vos soutiens de gauche annoncent publiquement, avec fracas, qu'ils ne
      voteront pas au second tour. Et une partie de votre électorat de premier tour, celui
      qui vous avait fait passer, vous regarde glisser vers la droite sans lever le petit
      doigt pour vous suivre.`,
   e:{economie:5,cac:4,groups:{patrons:12,retraites:11,jeunes:-9}},
   axe:{social:-1}, pose:"report_droite", rival:-9},
  {l:"Ne courir après personne : tenir votre ligne jusqu'au bout",
   r:`Pas de virage de dernière minute. Pas de meeting de circonstance. Pas de main tendue
      calculée pour la photo. Vous dites la même chose qu'il y a cinq ans, avec cinq ans
      de dossiers, de crises traversées et de cicatrices en plus.<br><br>
      C'est reposant — vous n'avez rien à feindre, rien à réviser. C'est aussi risqué —
      vous ne cherchez pas activement les voix qui vous manquent pour l'emporter.<br><br>
      Un éditorialiste écrit, à trois jours du vote : « Il n'a pas cherché à plaire. C'est
      soit du courage, soit de la fatigue, et lui-même ne sait probablement pas lequel des
      deux le fait tenir. » Vous ne le saurez jamais non plus.`,
   e:{social:7,groups:{salaries:6,jeunes:6,ruraux:5,patrons:4}},
   pose:"report_ligne", rival:-4}
 ]},

{id:"m47", ch:8, mois:47, ico:"🌙", t:"La veille",
 intro:[
  [()=>S.rival>=55, `Vous savez déjà. Tout le monde autour de vous sait déjà. Il ne
    reste plus qu'à le vivre demain soir, à vingt heures pile.`],
  [()=>S.rival<42, `Vous avez de l'avance dans les dernières projections, et personne
    dans l'équipe n'ose prononcer le mot « victoire », par pure superstition.`]
 ],
 d:`Le dernier soir. Plus de meeting, plus de sondage publiable, plus rien à faire
    qu'attendre que soixante-dix millions de personnes fassent leur affaire de cinq ans
    de votre vie.<br><br>
    Vous êtes seul dans le bureau. Sur la table, deux discours imprimés : celui de la
    victoire et celui de la défaite. Vous les avez relus tous les deux, plusieurs fois.
    Celui de la défaite est meilleur — c'est presque toujours le cas, on met plus de soin
    à préparer sa chute qu'à préparer son triomphe, par superstition ou par
    lucidité.<br><br>
    Quelqu'un frappe à la porte. C'est votre plume, qui vient chercher les toutes
    dernières corrections avant de rentrer chez lui. Il faut choisir comment passer cette
    nuit : dormir, parler une dernière fois au pays, ou appeler l'adversaire.`,
 o:[
  {l:"Corriger les deux discours et rentrer dormir",
   r:`Vous relisez les deux textes une dernière fois, stylo à la main. Vous coupez trois
      adjectifs de trop dans celui de la défaite — la sobriété rend toujours mieux, un
      soir comme celui-là, quand chaque mot sera pesé et cité. Vous rendez les feuilles à
      votre plume et vous rentrez chez vous à minuit passé.<br><br>
      Vous dormez quatre heures pleines. C'est déjà plus que la plupart des nuits des six
      dernières semaines de campagne.<br><br>
      Vous vous réveillez sans savoir lequel des deux discours vous prononcerez le soir
      venu, et c'est peut-être la dernière fois de votre vie que l'avenir tient tout
      entier dans deux enveloppes posées côte à côte sur une table.`,
   e:{groups:{salaries:3,retraites:3,ruraux:2}},
   pose:"veille_calme"},
  {l:"Ajouter un dernier message aux Français, ce soir, en direct",
   r:`Deux minutes, sans prompteur, à vingt heures trente, la veille exacte du vote. Vous
      ne demandez à personne de voter pour vous — la loi vous l'interdit formellement, et
      l'esprit du moment aussi. Vous dites simplement ce que vous avez essayé de faire
      pendant cinq ans, et ce que vous auriez voulu avoir le temps de faire en
      plus.<br><br>
      Quatre millions de personnes regardent, un dimanche soir.<br><br>
      Ce n'est pas décisif. Rien ne l'est vraiment, la veille au soir. Mais dans une
      élection qui se jouera peut-être à quelques centaines de milliers de voix, plus rien
      n'est tout à fait négligeable — et vous préférez avoir essayé que vous le
      reprocher.`,
   e:{social:6,groups:{salaries:6,jeunes:5,ruraux:5,retraites:4}},
   pose:"veille_message", rival:-5},
  {l:"Appeler Ferrand",
   r:`Vous l'appelez à vingt-deux heures, sur son portable, directement, sans passer par
      les cabinets. La conversation dure quatre minutes et reste parfaitement
      courtoise.<br><br>
      Vous lui dites que, quel que soit le résultat du lendemain, la passation de pouvoir
      se fera correctement, dignement, sans le moindre coup bas de part et d'autre. Il
      vous répond exactement la même chose, du même ton posé.<br><br>
      Aucun des deux ne le racontera jamais à un journaliste. Et c'est précisément ce
      silence partagé qui rend ce coup de fil important : deux hommes qui se sont
      combattus sans relâche pendant un an, et qui prennent quatre minutes, la veille,
      pour se promettre que la République passera avant eux.`,
   e:{social:5,groups:{retraites:7,patrons:5,jeunes:3}},
   pose:"veille_appel", rival:-3}
 ]},

{id:"m31", ch:6, mois:31, ico:"🧑‍🌾", t:"Le blocage",
 intro:[
  [()=>S.flags.rationnement||S.flags.eau_sacrifiee, `Le monde agricole ne vous a pas
    pardonné l'été dernier. Ce blocage-là commence par un contentieux.`],
  [()=>S.axes.ecologie>=3, `Vos normes environnementales sont les plus strictes d'Europe.
    C'est écrit en gros sur les banderoles, et ce n'est pas un compliment.`]
 ],
 d:`Ils sont arrivés à quatre heures du matin, sans prévenir. Six cents tracteurs, huit
    axes autoroutiers coupés, un dépôt pétrolier bloqué depuis la veille au soir. Des feux
    de palettes sur les ronds-points, des lisiers déversés devant les préfectures.<br><br>
    Le président de la FNSEA vous appelle lui-même, et ce qu'il dit n'est pas une menace,
    c'est un aveu : « Je ne les contrôle plus, monsieur le Président. Ce ne sont plus mes
    troupes. Il y a des gens là-bas qui ont vendu leur cheptel pour payer leurs dettes et
    qui n'ont plus rien à perdre. Ils le savent, et ça change tout. »<br><br>
    Les préfets attendent des consignes avant le lever du jour.`,
 o:[
  {l:"Recevoir les organisations et suspendre trois normes",
   r:`Trois arrêtés suspendus dans la nuit même, un moratoire de deux ans sur un quatrième.
      Vous recevez les syndicats à sept heures, café et poignées de main devant les
      caméras.<br><br>
      Les tracteurs repartent avant midi. Le carburant recircule. La crise est éteinte en
      moins d'une journée.<br><br>
      Les associations environnementales publient dès l'après-midi une carte des zones
      concernées par les normes que vous venez de suspendre : ce sont, presque exactement,
      celles où les nappes et les rivières sont déjà les plus dégradées. La carte circule.
      Personne ne peut la contester.`,
   e:{cli:{sols:-14,eau:-8},economie:5,groups:{ruraux:15,jeunes:-11,patrons:6}},
   axe:{ecologie:-1}, pose:"normes_suspendues", rival:-6},
  {l:"Débloquer une aide d'urgence sans toucher aux normes",
   r:`Quatre cents millions d'euros débloqués en quarante-huit heures, versés directement
      sur les comptes des exploitations en difficulté avant la fin du mois.<br><br>
      C'est cher. Ça ne règle rien sur le fond — les normes restent, la colère aussi. Mais
      ça évite qu'un agriculteur ruiné ne fasse un geste irréparable, et ce n'est pas
      rien.<br><br>
      Le président de la FNSEA vous appelle pour vous remercier, en privé. En public, il
      continuera à vous critiquer dès le lendemain matin, sur les mêmes plateaux. C'est le
      jeu, et vous le connaissez : on remercie en coulisse, on cogne à la lumière.`,
   e:{budget:-14,groups:{ruraux:9,jeunes:4}},
   pose:"aide_agricole"},
  {l:"Faire dégager les axes avant le lever du jour",
   r:`Six heures du matin. Huit axes rouverts à la circulation, cent dix interpellations,
      les tracteurs remorqués.<br><br>
      Un blindé de la gendarmerie a poussé un tracteur dans le fossé pour dégager une voie.
      La scène est filmée. L'image est très mauvaise — une machine de guerre contre une
      machine agricole, dans le petit matin.<br><br>
      Le trafic est rétabli avant l'heure de pointe, les usines sont approvisionnées, les
      Français vont au travail. Dans les villes, personne ne retiendra rien. Dans les
      campagnes, on retiendra le blindé, et on se le montrera pendant des années.`,
   e:{sec:{interieure:12},social:-10,groups:{ruraux:-17,retraites:7,jeunes:-5}},
   axe:{autorite:2}, pose:"deblocage_force", rival:12}
 ]},

{id:"m45", ch:8, mois:45, ico:"🎬", t:"La vidéo",
 intro:[
  [()=>S.flags.debat_attaque, `Vous l'avez attaqué au débat sur ce qu'il cachait. On dira,
    forcément, que vous récoltez ce que vous avez semé.`],
  [()=>S.flags.pression_presse, `Vous avez déjà fait pression sur un journal, une fois, et
    ça s'est su. Personne ne vous croira quand vous crierez à la manipulation.`],
  [()=>S.flags.transparence, `Vous avez tout publié pendant cinq ans, sans exception.
    C'est votre seul capital ce matin, et il va falloir le dépenser en entier, d'un
    coup.`]
 ],
 d:`Quarante et une secondes. On vous y voit, dans un salon que vous croyez reconnaître —
    le vôtre, peut-être, un soir après un dîner officiel — prononcer une phrase que vous
    n'avez jamais dite, sur une catégorie de Français que vous n'avez jamais méprisée de
    cette façon.<br><br>
    C'est un faux. Un montage : voix synthétisée à partir de vos archives, décor
    recomposé image par image. Les experts le confirmeront — mais il leur faudra entre
    trois et six jours pour l'établir avec une certitude publiable. Le vote, lui, est dans
    huit jours.<br><br>
    À onze heures ce matin, la vidéo comptait onze millions de vues. Trois grandes chaînes
    l'ont diffusée en la présentant comme « probablement truquée » — ce qui, à ce stade,
    revient très exactement à la diffuser quand même.`,
 o:[
  {l:"Démentir sur toutes les antennes, sans attendre les experts",
   r:`Sept plateaux de télévision en trente heures. La même phrase, répétée à chaque
      fois, les yeux dans la caméra : « C'est un faux, et ce sera prouvé. »<br><br>
      Vous avez l'air sincère, parce que vous l'êtes réellement. Mais démentir, à la
      télévision, c'est d'abord répéter — et pendant que vous parlez de la vidéo sur sept
      chaînes différentes, la vidéo elle-même gagne trois millions de vues
      supplémentaires.<br><br>
      L'expertise officielle, qui confirmera sans ambiguïté le trucage, tombera le
      surlendemain du vote. Trop tard pour changer quoi que ce soit au résultat, juste à
      temps pour que vous ayez raison sur un scrutin déjà joué et compté.`,
   e:{social:6,groups:{salaries:7,retraites:6,ruraux:5,jeunes:4}},
   pose:"sprint_final", rival:-5},
  {l:"Publier tout : agenda, images sources, expertise en direct",
   r:`Vous ouvrez tout, sur un plateau, en direct et sans filet. L'agenda minute par
      minute du jour où la scène est censée s'être déroulée. Les images réelles, brutes,
      horodatées, de ce que vous faisiez à cette heure-là. Deux laboratoires d'analyse,
      en duplex, qui décortiquent le faux image par image devant les téléspectateurs.<br><br>
      La démonstration est technique, longue — quarante minutes — et rigoureusement
      incontestable. Près de la moitié du pays la regarde jusqu'au bout.<br><br>
      Le faux s'effondre en une seule soirée. Et quelque chose d'autre s'installe, de plus
      durable : l'idée qu'on peut vérifier, que la preuve matérielle existe, qu'on n'est
      pas condamné à choisir entre deux récits.`,
   e:{social:11,budget:-4,groups:{jeunes:13,salaries:9,patrons:5}},
   pose:"transparence_totale", rival:-11},
  {l:"Porter plainte et faire suspendre les comptes qui la relaient",
   r:`Plainte déposée dans l'heure au parquet de Paris. Référé obtenu dès le lendemain
      matin. Quatre cents comptes suspendus par décision de justice en quarante-huit
      heures.<br><br>
      La vidéo, elle, continue de circuler — par messagerie privée, par groupes fermés,
      par téléchargement, très loin de la portée des suspensions judiciaires. On ne
      rattrape pas quarante et une secondes lâchées sur le réseau.<br><br>
      Et le débat glisse, exactement là où vous ne vouliez surtout pas qu'il aille : on ne
      parle plus du faux, ni de qui a bien pu le fabriquer et le payer. On parle d'un
      président sortant qui fait fermer des comptes à huit jours d'un vote. Le mot
      « censure » apparaît partout, en gras.`,
   e:{sec:{interieure:6},social:-9,
      groups:{jeunes:-13,salaries:-7,retraites:7}},
   axe:{autorite:2}, pose:"censure_plateformes", rival:7}
 ]},

{id:"m48", ch:8, mois:48, ico:"⏳", t:"Le dimanche",
 intro:[
  [()=>S.rival>=55, `Vous avez fait ce que vous pouviez faire. Les tout derniers chiffres
    disent que ce ne sera pas suffisant, et les tout derniers chiffres se trompent
    rarement de beaucoup.`],
  [()=>S.rival<40, `Tout indique, ce matin, que vous allez l'emporter. Vous n'arrivez pas
    à y croire complètement, et c'est sans doute une bonne chose pour la suite.`],
  [()=>S.flags.transparence, `Quoi qu'il arrive ce soir à vingt heures, vous n'aurez rien
    caché de ces cinq années. C'est peu de chose, et c'est énorme.`]
 ],
 d:`Dix heures du matin. Vous avez voté à onze heures moins le quart, dans votre bureau de
    vote habituel, devant deux cents photographes agglutinés derrière une corde. Depuis,
    il n'y a plus rien à faire — rien du tout.<br><br>
    Cinq ans de mandat tiennent désormais dans les huit heures qui viennent. Le personnel
    de l'Élysée est étrangement silencieux ce matin ; ils ont déjà vécu ça, plusieurs
    fois, sous plusieurs présidents, et ils savent que ce soir, quel que soit le
    résultat, cette maison changera de rythme, de voix, d'habitudes du jour au
    lendemain.<br><br>
    Votre plus jeune conseiller passe la tête par la porte entrouverte et vous demande, à
    voix basse, presque en s'excusant, si vous voulez qu'on allume les écrans du salon.`,
 o:[
  {l:"« Non. On les allumera à vingt heures. »",
   r:`Vous passez la journée dans le parc, puis dans le bureau, à ne rien faire d'utile.
      Vous relisez des dossiers que vous ne signerez peut-être jamais. Vous marchez dans
      les allées gravillonnées, longtemps, sans but précis, en croisant des jardiniers qui
      détournent les yeux par gêne.<br><br>
      À dix-neuf heures cinquante, le personnel se rassemble de lui-même dans le grand
      salon, sans que personne l'ait demandé ni organisé — les huissiers en gants blancs,
      les conseillers, deux cuisiniers en tablier montés des sous-sols. Quelqu'un allume
      enfin la télévision.<br><br>
      Personne ne parle. On regarde l'horloge en bas de l'écran descendre lentement vers
      vingt heures, et la barre de progression du dépouillement se remplir pixel par
      pixel. Dix minutes. Puis cinq. Puis deux. Puis une.`,
   e:{groups:{salaries:3,retraites:4,ruraux:3,jeunes:2}},
   pose:"dimanche_calme", final:true},
  {l:"Écrire une lettre à votre successeur, quel qu'il soit",
   r:`Vous écrivez trois pages, à la main, à la table du bureau vide. Vous n'y mettez
      aucun conseil — il n'en voudrait pas, et vous non plus à sa place. Vous y mettez les
      dossiers qu'on ne trouve pas dans les notes officielles : le nom de l'interlocuteur
      qui décroche vraiment dans telle capitale, le pays qu'il faut appeler avant tous les
      autres en cas de crise, le chiffre qu'on ne donne jamais aux journalistes.<br><br>
      Les choses dont on hérite sans le savoir, et qu'il vaut mieux savoir dès le premier
      jour.<br><br>
      Vous pliez la lettre en trois, vous la glissez dans le tiroir de droite du bureau.
      Elle y sera dans huit heures — que ce soit vous, ou lui, qui ouvre ce tiroir demain
      matin.`,
   e:{social:6,groups:{jeunes:6,salaries:5,retraites:5,ruraux:4}},
   pose:"lettre_successeur", final:true},
  {l:"Passer les derniers coups de fil : chaque voix compte encore",
   r:`Quarante appels dans la journée. Des maires de petites communes, des présidents de
      fédération, deux dirigeants syndicaux, un ancien Premier ministre qui ne vous aimait
      pourtant pas.<br><br>
      Vous ne demandez rien — il est bien trop tard pour demander quoi que ce soit. Vous
      remerciez, un par un. C'est la seule chose qu'on puisse encore faire un dimanche à
      quatorze heures, quand le vote a commencé et que tout est joué sans être encore
      connu.<br><br>
      Trois d'entre eux vous rappelleront le soir même, quel que soit le résultat — pour
      vous féliciter, ou juste pour vous dire qu'ils sont là. Ces trois-là, vous vous en
      souviendrez longtemps après avoir quitté cette maison.`,
   e:{groups:{salaries:5,ruraux:6,retraites:4}},
   pose:"derniers_appels", rival:-3, final:true}
 ]},

/* ═══════════ ANNÉE V · le second mandat commence ═══════════ */

{id:"n49", ch:9, mois:49, ico:"🏛️", t:"Le second serment",
 intro:[
  [()=>S.rival>=55, `Vous avez gagné de justesse. La moitié du pays a voté pour l'autre,
    et cette moitié-là ne l'oubliera pas.`],
  [()=>S.rival<40, `Vous avez gagné largement. C'est précisément ce qui rend la suite
    dangereuse : personne ne vous dira plus non.`]
 ],
 d:`Salle des fêtes, deuxième investiture. Les mêmes lustres, les mêmes visages, et une
    différence que personne ne prononce à voix haute : dans cinq ans, vous partirez.<br><br>
    Le président du Conseil constitutionnel proclame les résultats. En descendant de
    l'estrade, votre secrétaire général vous glisse : « À partir d'aujourd'hui, monsieur le
    Président, tout ce que vous ferez sera pour après vous. »<br><br>
    Trois personnes dans cette salle veulent déjà votre place.`,
 o:[
  {l:"Annoncer que vous ne vous représenterez jamais, dès ce soir",
   r:`Vous le dites en huit mots, à la fin du discours, sans que personne s'y attende.<br><br>
      L'effet est immédiat et double : vous gagnez une liberté d'action que peu de présidents
      ont connue, et vous devenez un homme dont on compte les jours. Les deux commencent
      le même soir.`,
   e:{social:8,groups:{salaries:7,jeunes:9,ruraux:6,retraites:5}},
   pose:"renonciation_publique", rival:-6},
  {l:"Former un gouvernement de personnalités hors parti",
   r:`Une directrice d'hôpital, un économiste, une préfète, un ancien juge. Six ministres
      sur dix-huit n'ont jamais été élus.<br><br>
      Les partis hurlent à la technocratie. Les nominations sont saluées ailleurs, et deux
      dossiers qui traînaient depuis quatre ans sont réglés en six semaines.`,
   e:{economie:7,social:5,soc:{sante:8},groups:{patrons:8,salaries:5,jeunes:5}},
   pose:"gouvernement_experts"},
  {l:"Reconduire l'équipe sortante : la continuité, rien d'autre",
   r:`Aucun changement, aucun signal. Le communiqué tient en quatre lignes.<br><br>
      Vos ministres sont soulagés et vos militants consternés. Un éditorial résume ce que
      beaucoup pensent : « Il a gagné cinq ans et il n'a rien à en faire. » La phrase est
      injuste. Elle vous suivra quand même.`,
   e:{economie:3,groups:{patrons:5,jeunes:-6,salaries:-4}},
   pose:"continuite_seche", rival:7}
 ]},

{id:"n50", ch:9, mois:50, ico:"🗝️", t:"Ce que vous n'aviez pas pu faire",
 intro:[
  [()=>S.flags.recul_majeur||S.flags.recul_precoce, `Il y a un texte que vous avez retiré
    sous la pression. Il est toujours dans un tiroir, et vous le savez.`],
  [()=>S.dette>160, `Avec cette dette, la marge est étroite. Ce qui n'a pas été fait en
    cinq ans coûtera plus cher aujourd'hui.`]
 ],
 d:`Votre directrice de cabinet a préparé une liste : les réformes abandonnées du premier
    mandat. Onze dossiers, tous impopulaires, tous nécessaires.<br><br>
    « Vous avez trois ans de fenêtre utile, monsieur le Président. Après, plus personne ne
    votera rien pour un homme qui s'en va. Ce que vous ne lancez pas avant l'an VII ne se
    fera pas. »<br><br>
    Elle a souligné trois lignes.`,
 o:[
  {l:"La réforme des retraites, enfin, et jusqu'au bout",
   r:`Le texte est déposé en mars. Six semaines de manifestations, quatre nuits de débat,
      et une loi qui passe à onze voix.<br><br>
      Le système est équilibré à l'horizon 2050 pour la première fois depuis trente ans.
      Votre popularité perd quatorze points en un trimestre. Vous saviez le prix, vous
      l'avez payé, et il n'y a rien d'héroïque là-dedans : juste un calcul assumé.`,
   e:{budget:16,dette:-9,economie:8,soc:{pouvoir:-18,pauvrete:-10},
      groups:{salaries:-16,retraites:-14,patrons:14}},
   axe:{social:-1}, pose:"retraites_faites", rival:9},
  {l:"La refonte de l'État : fusionner, supprimer, simplifier",
   r:`Quatre agences supprimées, deux ministères fusionnés, trente mille postes non
      remplacés sur cinq ans.<br><br>
      C'est austère, technique, et ça produit un effet inattendu : les délais administratifs
      baissent de trente pour cent en deux ans. Personne ne vous en remerciera parce que
      personne ne mesure ce qui a cessé d'être pénible.`,
   e:{budget:12,economie:9,cac:5,social:-8,
      groups:{patrons:12,salaries:-9,ruraux:-6}},
   pose:"refonte_etat"},
  {l:"La grande loi sur la fin de vie et la santé mentale",
   r:`Deux ans de travaux, une convention citoyenne, un texte qui divise les familles avant
      de diviser l'Assemblée.<br><br>
      Il passe en novembre. Ce n'est pas une réforme d'économie ni de puissance : c'est
      celle dont on vous parlera dans les dîners pendant vingt ans, et celle que des gens
      vous remercieront d'avoir faite, en vous croisant, longtemps après.`,
   e:{budget:-11,soc:{sante:24,pauvrete:10},social:9,
      groups:{salaries:9,retraites:11,jeunes:8}},
   axe:{social:1}, pose:"loi_fin_de_vie", rival:-8}
 ]},

{id:"n51", ch:9, mois:51, ico:"👥", t:"Les trois qui attendent",
 d:`Ils sont trois dans votre camp à vouloir vous succéder, et ils ont commencé le soir de
    votre réélection.<br><br>
    Le Premier ministre a la légitimité. La ministre de l'Économie a les réseaux et les
    résultats. Le jeune président de région a quarante et un ans et un talent que vous
    n'aviez pas à son âge.<br><br>
    Aucun des trois n'a demandé à vous voir. C'est bien pire : ils s'organisent sans vous.`,
 o:[
  {l:"Choisir maintenant et l'installer",
   r:`Vous tranchez pour l'un d'eux et vous lui donnez les moyens : agenda, dossiers,
      déplacements internationaux.<br><br>
      Les deux autres comprennent en une semaine. L'un reste et travaille, l'autre commence
      à parler aux journalistes. Vous avez un dauphin et un ennemi intérieur, ce qui est
      le tarif normal.`,
   e:{social:3,groups:{patrons:5,retraites:4}},
   dauphin:22, pose:"dauphin_choisi"},
  {l:"Les faire travailler ensemble et trancher plus tard",
   r:`Vous les mettez sur trois grands dossiers, publiquement, à égalité.<br><br>
      Ils se surveillent et ils produisent : c'est le meilleur trimestre gouvernemental
      depuis longtemps. La question reste ouverte, ce qui vous garde puissant et les garde
      loyaux. Jusqu'au jour où il faudra choisir, et ce jour approchera.`,
   e:{economie:6,social:5,groups:{salaries:5,patrons:6,jeunes:4}},
   dauphin:10, pose:"competition_ouverte"},
  {l:"Ne pas entrer dans ce jeu : gouverner, c'est tout",
   r:`Vous refusez la question chaque fois qu'on vous la pose, et on vous la posera
      quatre-vingts fois.<br><br>
      Vous gardez les mains libres. Votre camp, lui, s'organise sans vous et se divise
      lentement, en trois écuries qui ne se parlent plus. Ce sera le problème de la fin,
      et ce sera un vrai problème.`,
   e:{economie:4,groups:{patrons:4}},
   dauphin:-8, pose:"succession_ignoree"}
 ]},

{id:"n52", ch:9, mois:52, ico:"🌐", t:"La guerre ailleurs",
 intro:[
  [()=>valeur("securite")<45, `Nos armées sont à l'os. Ce que vous allez promettre, il
    faudra pouvoir le tenir.`],
  [()=>S.flags.riposte||S.axes.autorite>=4, `Vous avez déjà frappé une fois. On vous
    regarde différemment dans les états-majors alliés.`]
 ],
 d:`Un allié européen est attaqué sur son flanc est. Pas une escarmouche : des colonnes
    blindées, une capitale sous alerte, et un article de traité que personne n'avait
    jamais invoqué.<br><br>
    Le Conseil de défense siège depuis onze heures. Trois options sur la table, et un chef
    d'état-major qui répète la même phrase : « Ce que nous enverrons, nous ne l'aurons plus
    ici pendant dix-huit mois. »<br><br>
    L'Assemblée sera consultée. Elle ne décidera pas.`,
 o:[
