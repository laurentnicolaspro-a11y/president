    Trois nuits d'émeutes dans deux cents communes. Quatre-vingt-dix bâtiments publics
    brûlés, dont douze écoles. Mille huit cents interpellations, dont une majorité de
    mineurs.<br><br>
    Le policier est en détention provisoire. Deux syndicats de police appellent à la
    « mise à l'arrêt ».`,
 o:[
  {l:"Rappeler que la justice s'applique à tous, y compris à la police",
   r:`Vous le dites en trois phrases, sans ambiguïté, en soutenant l'institution
      judiciaire.<br><br>
      Les syndicats de police vous accusent de lâchage et le mouvement d'humeur dure dix
      jours. Les émeutes, elles, cessent la quatrième nuit. Les préfets attribueront cet
      arrêt à votre déclaration, dans une note que vous ne lirez jamais.`,
   e:{sec:{interieure:-6},social:9,
      groups:{jeunes:14,salaries:7,retraites:-9,ruraux:-6}},
   axe:{autorite:-1}, pose:"justice_pour_tous", rival:6},
  {l:"État d'urgence et couvre-feu dans les communes touchées",
   r:`Couvre-feu à vingt et une heures dans deux cents communes, quarante mille policiers
      et gendarmes mobilisés.<br><br>
      La quatrième nuit est calme. La cinquième aussi. Le couvre-feu sera levé au bout de
      trois semaines, et douze mille jeunes auront un contrôle judiciaire pour des faits
      qui, pour la plupart, seront requalifiés plus tard.`,
   e:{sec:{interieure:18},social:-13,
      groups:{retraites:14,ruraux:11,jeunes:-19,salaries:-6}},
   axe:{autorite:2}, pose:"couvre_feu", rival:5},
  {l:"Réforme immédiate de la doctrine du refus d'obtempérer",
   r:`Suspension de l'usage des armes hors légitime défense caractérisée, dans l'attente
      d'une révision législative.<br><br>
      Le nombre de tirs mortels lors de refus d'obtempérer passe de treize à deux par an.
      Deux syndicats de police déposent un préavis de grève de six mois. Vous avez sauvé
      onze vies par an et perdu la police pour le reste du mandat.`,
   e:{sec:{interieure:-10},social:11,
      groups:{jeunes:16,salaries:8,retraites:-11,ruraux:-8}},
   axe:{autorite:-2}, pose:"doctrine_reformee", rival:8}
 ]},

{id:"n84", ch:14, mois:84, ico:"📊", t:"Sept ans",
 intro:[
  [()=>S.pib>3700, `L'économie a tenu. C'est votre argument le plus solide et le plus
    silencieux.`],
  [()=>S.dette>190, `La dette est le seul chiffre dont on parlera. Il écrase tous les
    autres.`]
 ],
 d:`L'INSEE publie le bilan économique et social de la décennie. Ce n'est pas un document
    politique : c'est deux cents pages de séries statistiques.<br><br>
    Il y a des courbes qui montent et d'autres qui descendent, et à peu près tout le monde
    peut y trouver de quoi vous accabler ou vous défendre.<br><br>
    Votre directrice de la communication propose d'en faire quelque chose. Votre directrice
    de cabinet propose de ne rien en faire.`,
 o:[
  {l:"Publier une lecture honnête : les réussites et les échecs",
   r:`Un document de vingt pages, signé de vous, qui reprend les séries de l'INSEE sans
      en écarter une seule.<br><br>
      Trois économistes de sensibilités opposées le qualifient d'« exercice inhabituel de
      sincérité ». Il ne fait pas la une. Il sera cité pendant dix ans.`,
   e:{social:8,economie:4,groups:{jeunes:9,salaries:7,patrons:6}},
   pose:"bilan_honnete", dauphin:4},
  {l:"Communiquer sur les chiffres favorables",
   r:`Une campagne de quatre semaines, six indicateurs bien choisis, une vidéo par
      thème.<br><br>
      Trois fact-checkers relèvent les omissions dans la semaine. Ce n'est pas du
      mensonge et ça n'en donne pas moins l'impression. Vous avez dépensé quatre millions
      pour renforcer ceux qui vous soutenaient déjà.`,
   e:{groups:{patrons:6,retraites:5,jeunes:-6,salaries:-4}},
   pose:"com_bilan", rival:5},
  {l:"Laisser les chiffres parler seuls",
   r:`Aucun commentaire officiel. Le rapport vit sa vie.<br><br>
      Les journaux en font ce qu'ils veulent, c'est-à-dire trois articles nuancés et
      quinze reprises orientées. Vous n'avez pas pesé sur la lecture de votre propre
      bilan, ce qui est une forme d'élégance ou de démission.`,
   e:{groups:{patrons:3,salaries:2}},
   pose:"silence_insee"}
 ]},

{id:"n86", ch:15, mois:86, ico:"🎤", t:"Le débat de la primaire",
 intro:[[()=>S.dauphin<30, `Votre camp cherche encore quelqu'un. Ce débat sera un
   inventaire des absences.`]],
 d:`Trois candidats de votre camp débattent en direct. On vous cite trente-quatre fois en
    deux heures, et pas toujours en bien.<br><br>
    Deux d'entre eux prennent leurs distances avec votre bilan. Le troisième le défend et
    perd le débat.<br><br>
    À la fin, une question aux trois : « Demanderez-vous au président sortant de faire
    campagne avec vous ? » Il y a un silence de deux secondes.`,
 o:[
  {l:"Ne pas réagir : c'est leur campagne",
   r:`Aucun commentaire, aucun message privé.<br><br>
      Ils s'émancipent, ce qui est nécessaire et douloureux. Le candidat désigné aura les
      mains libres pour construire son propre récit, et c'est probablement ce qui lui
      donnera sa chance.`,
   e:{groups:{jeunes:3,salaries:2}},
   dauphin:6, pose:"laisser_faire_primaire"},
  {l:"Rappeler publiquement ce que votre bilan leur permet",
   r:`Une intervention de six minutes, factuelle, sur ce qu'ils héritent : des comptes,
      des lois, des infrastructures.<br><br>
      C'est légitime et c'est maladroit : un président sortant qui recadre ses propres
      candidats donne à voir un camp divisé. L'opposition n'a plus qu'à laisser tourner
      les images.`,
   e:{social:-4,groups:{patrons:4,jeunes:-5,salaries:-4}},
   dauphin:-7, pose:"recadrage_primaire", rival:6},
  {l:"Recevoir les trois ensemble, sans caméras",
   r:`Deux heures dans le salon vert. Vous ne prenez pas parti, vous leur donnez ce que
      vous avez : les dossiers, les échéances, les pièges.<br><br>
      Ils sortent séparément et ne racontent rien. La campagne de votre camp sera de
      meilleure qualité pour ça, et personne ne saura jamais pourquoi.`,
   e:{social:4,groups:{patrons:4,salaries:4,jeunes:3}},
   dauphin:11, pose:"reunion_trois"}
 ]},

{id:"n87", ch:15, mois:87, ico:"🌍", t:"Le dernier sommet",
 d:`Votre dernier G7. On vous applaudit à l'entrée, ce qui ne se fait pas et se fait pour
    les sortants.<br><br>
    Un texte est sur la table sur la taxation minimale des multinationales. Il manque une
    signature pour atteindre le seuil qui le rend applicable. La France peut la donner ou
    la retenir, et deux de vos industriels vous ont écrit cette semaine.<br><br>
    Votre successeur, quel qu'il soit, héritera de ce que vous signez ce matin.`,
 o:[
  {l:"Signer et emporter l'accord",
   r:`Vous signez à onze heures dix. Le seuil est atteint, l'accord entre en vigueur en
      2035.<br><br>
      Onze milliards de recettes annuelles pour la France, à terme. Quatre groupes
      annoncent une revue de leur implantation européenne. On vous applaudit une seconde
      fois à la sortie, ce qui n'arrive jamais deux fois.`,
   e:{budget:9,economie:-4,cac:-8,social:7,
      groups:{salaries:9,jeunes:8,patrons:-14}},
   axe:{social:1}, pose:"taxation_signee", dauphin:4},
  {l:"Conditionner votre signature à des contreparties industrielles",
   r:`Trente-six heures de négociation pour obtenir un mécanisme de compensation
      européen.<br><br>
      Vous signez au dernier moment, avec une annexe. L'accord est plus faible et vos
      industriels sont protégés. C'est de la bonne diplomatie et un texte un peu moins
      utile.`,
   e:{budget:5,economie:3,groups:{patrons:6,salaries:4}},
   pose:"signature_conditionnee"},
  {l:"Refuser de signer",
   r:`Vous ne signez pas. Le seuil n'est pas atteint, l'accord est reporté sine die.<br><br>
      Vos industriels vous remercient par communiqué. Six pays publient une déclaration
      commune où la France n'apparaît pas, et c'est la dernière image de vous dans une
      enceinte internationale.`,
   e:{economie:6,cac:7,social:-8,
      groups:{patrons:14,salaries:-9,jeunes:-11}},
   axe:{social:-1}, pose:"refus_taxation", rival:7}
 ]},

{id:"n89", ch:15, mois:89, ico:"📉", t:"Le choc",
 intro:[[()=>S.dette>180, `Avec cette dette, vous n'avez presque aucune marge de
   manœuvre. C'est le moment que ça choisit.`]],
 d:`Un défaut souverain à l'autre bout du monde déclenche une réaction en chaîne. En six
    séances, les marchés européens perdent quatorze pour cent.<br><br>
    Ce n'est pas 2008 : le système bancaire tient. Mais le crédit se resserre, deux
    grandes entreprises annoncent des plans, et le mot « récession » entre dans les
    prévisions officielles.<br><br>
    Vous avez quinze mois avant de partir. Votre successeur héritera de ce que vous ferez
    de ces quinze mois.`,
 o:[
  {l:"Plan de soutien massif, financé par la dette",
   r:`Vingt-cinq milliards : chômage partiel, garanties de prêts, report de charges.<br><br>
      La récession est évitée de justesse, la dette prend onze points. Votre successeur
      passera son mandat à la rembourser en expliquant que ce n'était pas son choix. Il
      aura raison, et l'économie aura tenu.`,
   e:{budget:-24,dette:11,economie:9,cac:7,soc:{pouvoir:8},pib:0.9,
      groups:{salaries:12,patrons:11,jeunes:6}},
   pose:"soutien_massif"},
  {l:"Soutien ciblé sur les secteurs stratégiques uniquement",
   r:`Huit milliards, quatre filières, des critères stricts.<br><br>
      Les secteurs protégés tiennent, les autres encaissent. Trente mille emplois perdus
      dans les services. C'est le choix comptable et il produit exactement ce qu'il
      promettait : moins de dette et plus de chômage.`,
   e:{budget:-9,dette:3,economie:4,
      groups:{patrons:8,salaries:-7,jeunes:-5}},
   pose:"soutien_cible"},
  {l:"Ne rien faire : laisser passer le cycle",
   r:`Aucun plan. Vous expliquez que la France n'a plus les moyens d'amortir chaque choc.<br><br>
      C'est probablement vrai et c'est indéfendable devant quiconque perd son emploi. La
      récession dure trois trimestres. Deux cent mille chômeurs de plus, et une phrase de
      vous qui tourne en boucle : « Nous n'avons plus les moyens. »`,
   e:{economie:-11,cac:-9,soc:{pouvoir:-14,pauvrete:-12},pib:-1.4,
      groups:{salaries:-15,jeunes:-11,patrons:-6}},
   pose:"laisser_passer", rival:13}
 ]},

{id:"n90", ch:15, mois:90, ico:"📖", t:"Le dernier texte",
 intro:[[()=>popularite()<32, `Vous n'avez plus de majorité. Faire voter quoi que ce soit
   relève de l'exploit.`]],
 d:`Il vous reste six mois de session utile. Votre directrice de cabinet a posé trois
    textes sur la table : le dernier que vous pourrez faire adopter.<br><br>
    Une loi sur la fin de vie, si elle n'a pas été faite. Une loi sur la transmission des
    entreprises familiales. Une loi de programmation de l'éducation sur quinze ans.<br><br>
    « Un seul, monsieur le Président. Après, l'Assemblée sera en campagne. »`,
 o:[
  {l:"La programmation éducative sur quinze ans",
   r:`Quinze ans de trajectoire budgétaire votée pour l'école : effectifs, salaires,
      bâti.<br><br>
      Trois gouvernements successifs devront s'y tenir ou l'abroger publiquement, ce qui
      est très différent de ne rien faire discrètement. Aucun ne l'abrogera. Ce sera votre
      loi la plus durable et personne ne l'associera jamais à votre nom.`,
   e:{budget:-9,soc:{educ:26},economie:5,
      groups:{jeunes:14,salaries:9,patrons:-4}},
   axe:{social:1}, pose:"loi_education", dauphin:4},
  {l:"La transmission des entreprises familiales",
   r:`Fiscalité de la transmission allégée sous condition de maintien de l'emploi et du
      siège.<br><br>
      Onze mille entreprises transmises au lieu d'être vendues à des fonds sur cinq ans.
      C'est technique, invisible et c'est du tissu industriel qui reste français. Le
      patronat vous en sera reconnaissant, ce qui ne s'était jamais produit.`,
   e:{budget:-6,economie:11,cac:6,pib:1.1,
      groups:{patrons:16,ruraux:8,salaries:5}},
   pose:"loi_transmission"},
  {l:"Renoncer : laisser le champ libre à votre successeur",
   r:`Aucun texte. Vous consacrez les six derniers mois à l'exécution de ce qui est déjà
      voté.<br><br>
      C'est une forme rare de discipline. Deux commentateurs y voient de la sagesse,
      quinze de l'épuisement. Vos services, eux, rattrapent en six mois un retard
      d'application de deux ans.`,
   e:{economie:6,soc:{sante:6,educ:5},groups:{patrons:5,salaries:5}},
   pose:"renoncement_final", dauphin:3}
 ]},

{id:"n91", ch:16, mois:91, ico:"🏅", t:"Ce qu'on vous propose",
 d:`Trois propositions arrivent la même semaine : la présidence d'une fondation
    internationale, un siège au Conseil constitutionnel qui vous revient de droit, et une
    maison d'édition qui offre beaucoup pour vos mémoires.<br><br>
    Aucune n'est indigne. Toutes engagent la manière dont on parlera de vous, et la
    liberté de ce que vous pourrez dire.<br><br>
    Votre épouse vous a posé une seule question hier soir : « Tu as envie de quoi,
    exactement ? »`,
 o:[
  {l:"Le Conseil constitutionnel : rester utile, en silence",
   r:`Vous annoncez que vous siégerez. C'est votre droit et c'est discret.<br><br>
      Vous vous déporterez sur onze dossiers en trois ans, ce qui est beaucoup et
      correct. Deux juristes écriront que la présence d'anciens présidents dans cette
      institution est un problème. Ils auront raison et vous serez irréprochable.`,
   e:{groups:{retraites:5,patrons:4}},
   pose:"conseil_constit"},
  {l:"La fondation internationale : continuer sur le climat et la santé",
   r:`Vous acceptez, sans rémunération, en le disant.<br><br>
      Quatre ans plus tard, la fondation aura levé deux milliards et financé onze
      programmes. C'est une vraie deuxième vie et c'est ce qui vous vaudra, tardivement,
      une réévaluation de votre bilan par des gens qui vous détestaient.`,
   e:{social:6,cli:{air:4},groups:{jeunes:9,salaries:5}},
   pose:"fondation", dauphin:3},
  {l:"Les mémoires : raconter, sans ménagement",
   r:`Vous signez pour un livre à paraître dans deux ans. Vous prévenez l'éditeur : il n'y
      aura ni règlement de comptes ni auto-célébration.<br><br>
      Le livre paraîtra et fera exactement ce qu'il annonce, ce qui décevra tout le monde
      la première année et en fera une source la décennie suivante.`,
   e:{social:4,groups:{jeunes:5,salaries:4,patrons:-3}},
   pose:"memoires"}
 ]},

{id:"n93", ch:16, mois:93, ico:"🤝", t:"La passation",
 intro:[
  [()=>S.rival>=58, `Ce sera Ferrand. Vous préparez la passation pour l'homme que vous
    avez combattu huit ans.`],
  [()=>S.dauphin>=55, `Ce sera probablement le vôtre. Ça ne rend pas l'exercice plus
    simple.`]
 ],
 d:`Le secrétaire général prépare le dossier de passation : cent quarante notes, quatre
    classeurs, et une liste de dossiers sensibles à transmettre de vive voix.<br><br>
    La tradition est de tout transmettre. La pratique, depuis vingt ans, est de transmettre
    l'essentiel et de garder deux ou trois choses.<br><br>
    « Que fait-on des trois dossiers de la dernière chemise, monsieur le Président ? »`,
 o:[
  {l:"Tout transmettre, y compris ce qui vous met en cause",
   r:`Les trois dossiers sont dans le classeur, avec une note explicative de votre main.<br><br>
      L'un d'eux concerne une décision qui vous vaudra des ennuis dans quatre ans, et vous
      le savez en le mettant là. Le secrétaire général vous regarde faire sans rien dire.
      Il travaille ici depuis vingt-deux ans et il n'avait jamais vu ça.`,
   e:{social:9,groups:{jeunes:10,salaries:8,ruraux:6,retraites:5}},
   pose:"transmission_totale", dauphin:4},
  {l:"Transmettre l'essentiel, garder ce qui n'engage que vous",
   r:`Deux dossiers sur trois. Le troisième part aux archives sous dérogation de
      vingt-cinq ans.<br><br>
      C'est ce que font tous vos prédécesseurs. Ce n'est ni illégal ni glorieux. Dans
      vingt-cinq ans, un historien ouvrira ce carton et écrira un article.`,
   e:{groups:{patrons:3,retraites:3}},
   pose:"transmission_partielle"},
  {l:"Détruire ce qui peut l'être légalement",
   r:`Deux dossiers versés aux archives, un détruit selon la procédure applicable aux
      documents de travail.<br><br>
      C'est légal, tracé, et il en restera une ligne dans un registre. Cette ligne suffira
      à un journaliste, dans six ans, pour poser une question à laquelle personne ne
      pourra répondre.`,
   e:{social:-9,groups:{jeunes:-10,salaries:-8}},
   pose:"destruction_dossiers", rival:8}
 ]},

{id:"n94", ch:16, mois:94, ico:"🕯️", t:"L'appel de nuit",
 d:`Trois heures du matin. C'est le standard de l'Élysée : une prise d'otages dans un
    centre commercial, quatre personnes retenues, un homme qui demande à vous parler.<br><br>
    Ce sera votre dernière crise. Le RAID est en place, le négociateur est en ligne, et le
    preneur d'otages répète qu'il ne parlera qu'au président.<br><br>
    Le directeur du RAID vous prévient : « Ça peut durer douze heures ou finir en douze
    secondes. »`,
 o:[
  {l:"Lui parler, sous conduite du négociateur",
   r:`Onze minutes de conversation, sur haut-parleur, avec le négociateur à côté de vous.<br><br>
      Il libère deux otages pendant l'appel et se rend à sept heures dix. Personne n'est
      blessé. Le directeur du RAID vous dira plus tard que c'était risqué et que ça a
      marché, dans cet ordre.`,
   e:{sec:{interieure:14},social:8,
      groups:{retraites:11,salaries:9,ruraux:8,jeunes:6}},
   pose:"negociation_directe"},
  {l:"Refuser et laisser les professionnels travailler",
   r:`Vous ne prenez pas la ligne. Le négociateur travaille six heures.<br><br>
      Assaut à neuf heures vingt : le preneur d'otages est tué, un otage est blessé au
      bras. C'est le protocole, il a été respecté, et le bilan est celui d'une opération
      réussie. Vous n'arrivez pas à le formuler comme ça.`,
   e:{sec:{interieure:10},social:-3,
      groups:{retraites:7,ruraux:5,jeunes:-4}},
   pose:"protocole_respecte"},
  {l:"Vous rendre sur place",
   r:`Vous arrivez à cinq heures. Vous restez dans le PC de crise, sans intervenir, sans
      caméras.<br><br>
      L'assaut a lieu à huit heures et se passe bien. Votre présence n'a servi à rien
      d'opérationnel. Elle a servi à autre chose : quarante hommes ont vu que le président
      était debout à cinq heures du matin pour quatre inconnus.`,
   e:{sec:{interieure:11},social:6,
      groups:{retraites:9,salaries:7,ruraux:7}},
   pose:"presence_pc", dauphin:3}
 ]},
];

const SCENES = {};
HISTOIRE.forEach(s=>SCENES[s.id]=s);

const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août",
              "septembre","octobre","novembre","décembre"];
const DUREE_MANDAT = 48, DELAI_LOI = 3, MAX_CHANTIERS = 2, MAX_HIST = 130;

/* ══════════════════════════════════════════════════════════
   2. ÉTAT
   ══════════════════════════════════════════════════════════ */
let S, modeCourant = null;

const clamp = (v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const r1 = v=>Math.round(v*10)/10;
const moy = o=>{const k=Object.keys(o);return k.reduce((s,x)=>s+o[x],0)/k.length;};
const nb = v=>Math.round(v).toLocaleString("fr-FR");

function nouvellePartie(){
  S = {
    tour:1, mandat:1, fini:null,
    pib:PIB0, tres:50, dette:112, cac:7450,
    eco:55,
    sec:{interieure:56, defense:54},
    cli:{air:46, eau:52, foret:53, sols:49},
    soc:{pouvoir:49, sante:54, educ:52, pauvrete:53},
    grp:{salaries:52, retraites:55, jeunes:48, ruraux:47, patrons:50},
    monde:PAYS.map(p=>p.pib),
    lois:[], delaiLoi:0,
    chantiers:[], projetsFinis:[],
    tax:{ir:50,tva:50,is:50,carbone:40},
    dep:{sante:52,educ:50,defense:46,police:50,ecolo:50},
    ev:null, evScene:false, evFait:false, vus:[], hist:[],
    axes:{autorite:0, social:0, ecologie:0},
    flags:{}, rival:40, dauphin:20, chapitre:0, chroniques:[], scenesVues:[],
    jrn:[{txt:"Prise de fonction. Chaque mois : tranchez le dossier posé sur votre bureau, "+
              "puis passez au mois suivant.",cl:""},
         {txt:"Toutes les jauges du bandeau s'ouvrent d'un clic pour voir le détail. "+
              "Vos leviers de fond sont en bas : lois, chantiers, budget.",cl:""}]
  };
  enregistrerHistorique();
  tirerEvenement();
  sauver(); rendre();
}

/* ---- valeurs dérivées ---- */
const popularite = ()=>Object.keys(GROUPES).reduce((s,k)=>s+S.grp[k]*GROUPES[k].poids,0);

function valeur(k){
  if(k==="popularite") return popularite();
  if(k==="finances")   return S.tres;
  if(k==="economie")   return S.eco;
  if(k==="securite")   return moy(S.sec);
  if(k==="climat")     return moy(S.cli);
  if(k==="social")     return moy(S.soc);
  if(k==="rival")      return S.rival;
  return 50;
}

/* croissance annuelle du PIB, en % */
function croissance(){
  let c = (S.eco-50)*.11 + (modsMensuels().croissance||0);
  c -= Math.max(0,(S.dette-130))*.006;
  return clamp(c,-7,6);
}
const chomage   = ()=>clamp(9.0-(S.eco-50)*.11, 4.2, 22);
/* niveau d'équilibre du CAC 40 : il suit l'économie, pas une envolée sans fin */
const cacCible  = ()=>clamp(4200 + S.eco*68 - (S.tax.is-50)*22, 2600, 14000);
function inflation(){
  const d = Object.values(S.dep).reduce((a,b)=>a+b,0);
  return clamp(1.6 + Math.max(0,(S.dette-120))*.012 + (d-248)*.006, .2, 9);
}
const detteMd = ()=>S.dette/100*S.pib;

function note(){
  const r=S.dette;
  if(r<80)  return {n:"AAA",c:"#4caf7d"};
  if(r<100) return {n:"AA", c:"#4caf7d"};
  if(r<120) return {n:"A",  c:"#8bc48a"};
  if(r<145) return {n:"BBB",c:"#d9b26a"};
  if(r<175) return {n:"BB", c:"#d99a4a"};
  if(r<205) return {n:"B",  c:"#d97a4a"};
  if(r<240) return {n:"CCC",c:"#c0455a"};
  return {n:"D", c:"#c0455a"};
}

/* classement mondial : la France utilise son PIB courant */
function classement(){
  return PAYS.map((p,i)=>({...p, pib: i===IFR ? S.pib : S.monde[i], moi: i===IFR}))
             .sort((a,b)=>b.pib-a.pib)
             .map((p,i)=>({...p, rang:i+1}));
}
const rang = ()=>classement().find(p=>p.moi).rang;
const ordinal = n=>n===1 ? "1ʳᵉ" : n+"ᵉ";

/* ══════════════════════════════════════════════════════════
   3. EFFETS
   ══════════════════════════════════════════════════════════ */
function appliquer(e){
  if(!e) return;
  // effets globaux : répartis sur tous les sous-indicateurs du domaine
  if(e.securite!=null) for(const k in S.sec) S.sec[k]=clamp(S.sec[k]+e.securite);
  if(e.climat  !=null) for(const k in S.cli) S.cli[k]=clamp(S.cli[k]+e.climat);
  if(e.social  !=null) for(const k in S.soc) S.soc[k]=clamp(S.soc[k]+e.social);
  if(e.popularite!=null) for(const k in S.grp) S.grp[k]=clamp(S.grp[k]+e.popularite);
  // effets ciblés
  if(e.sec) for(const k in e.sec) if(S.sec[k]!=null) S.sec[k]=clamp(S.sec[k]+e.sec[k]);
  if(e.cli) for(const k in e.cli) if(S.cli[k]!=null) S.cli[k]=clamp(S.cli[k]+e.cli[k]);
  if(e.soc) for(const k in e.soc) if(S.soc[k]!=null) S.soc[k]=clamp(S.soc[k]+e.soc[k]);
  if(e.groups) for(const k in e.groups) if(S.grp[k]!=null) S.grp[k]=clamp(S.grp[k]+e.groups[k]);
  // grandeurs simples
  if(e.economie!=null) S.eco  = clamp(S.eco+e.economie);
  if(e.budget  !=null){
    // une dépense au-delà de la trésorerie creuse la dette ; un excédent la rembourse en partie
    let t = S.tres + e.budget;
    if(t < 0){ S.dette = Math.max(0, S.dette - t); t = 0; }
    else if(t > 100){ S.dette = Math.max(0, S.dette - (t-100)*.6); t = 100; }
    S.tres = t;
  }
  if(e.dette   !=null) S.dette= Math.max(0,S.dette+e.dette);
  if(e.cac     !=null) S.cac  = clamp(S.cac*(1+e.cac/100), 2000, 25000);
  if(e.pib     !=null) S.pib  = Math.max(600, S.pib*(1+e.pib/100));
}

/* cumul des effets mensuels des lois votées et des chantiers livrés */
function modsMensuels(){
  const t={};
  const add=o=>{ if(!o) return;
    for(const k in o){
      if(k==="groups"||k==="sec"||k==="cli"||k==="soc"){
        t[k]=t[k]||{}; for(const g in o[k]) t[k][g]=(t[k][g]||0)+o[k][g];
      } else t[k]=(t[k]||0)+o[k];
    }};
  S.lois.forEach(id=>add((LOIS.find(l=>l.id===id)||{}).tour));
  S.projetsFinis.forEach(id=>add((PROJETS.find(p=>p.id===id)||{}).tour));
  return t;
}

function calculBudget(){
  const t=S.tax, d=S.dep;
  // effet Laffer : au-delà de 70, chaque point d'impôt rapporte beaucoup moins
  const laf = x => x<=70 ? x : 70 + (x-70)*.35;
  // les recettes suivent l'activité : un PIB qui recule, ce sont des recettes qui fondent
  const idx = S.pib/PIB0;
  const recettes = (26 + laf(t.ir)*.22 + laf(t.tva)*.20 + laf(t.is)*.14 + laf(t.carbone)*.08)*idx;
  // un pays plus riche paie aussi plus cher ses fonctionnaires et ses prestations :
  // les dépenses suivent le PIB, un peu moins vite que les recettes
  const idxDep = 1 + (idx-1)*.95;
  const depenses = (20 + (d.sante+d.educ+d.defense+d.police+d.ecolo)*.14)*idxDep;
  const structurel = (S.tour-1)*.125*idxDep;  // vieillissement, inflation, engagements passés
  const interets = S.dette*.016;
  const mods = modsMensuels().budget || 0;
  return {recettes, depenses, structurel, interets, mods, idx,
          solde: recettes-depenses-structurel-interets+mods};
}

function enregistrerHistorique(){
  S.hist.push({t:S.tour, pib:S.pib, dette:S.dette, cac:S.cac, tres:S.tres,
    pop:popularite(), eco:S.eco, sec:moy(S.sec), cli:moy(S.cli), soc:moy(S.soc),
    chom:chomage(), rang:rang(), rival:S.rival});
  if(S.hist.length>MAX_HIST) S.hist.shift();
}

/* ══════════════════════════════════════════════════════════
   4. DÉROULEMENT DU TOUR
   ══════════════════════════════════════════════════════════ */
/* la scène en cours, ou null si c'est un événement ordinaire */
function sceneCourante(){ return S.evScene ? SCENES[S.ev] : null; }
/* options réellement offertes : certaines portes ne s'ouvrent pas pour tout le monde */
function optionsVisibles(n){ return n.o.filter(o=>!o.si || o.si()); }
/* le domaine que vous avez le plus négligé — sert aux variantes de crise */
function talonAchille(){
  const j=[["economie",S.eco],["securite",valeur("securite")],
           ["climat",valeur("climat")],["social",valeur("social")]];
  j.sort((a,b)=>a[1]-b[1]); return j[0][0];
}

/* La scène du mois : on prend la première variante éligible écrite pour ce mois.
   L'ordre du tableau fait la priorité — les variantes spécifiques avant la version
   par défaut. */
function scenePourMois(){
  const cand = HISTOIRE.filter(s=>s.o && s.mois===S.tour
    && !S.scenesVues.includes(s.id) && (!s.si || s.si()));
  if(!cand.length) return null;
  // une variante conditionnelle l'emporte toujours sur la version par défaut
  cand.sort((a,b)=>(b.si?1:0)-(a.si?1:0));
  return cand[0];
}

function tirerEvenement(){
  S.evFait = false;
  S.reaction = null;
  const sc = scenePourMois();
  if(sc){ S.ev=sc.id; S.evScene=true; S.chapitre=sc.ch; return; }
  S.evScene = false;
  let pool = EVENTS.filter(e=>!S.vus.includes(e.id));
  if(!pool.length){ S.vus=[]; pool=EVENTS.slice(); }
  S.ev = pool[Math.floor(Math.random()*pool.length)].id;
}

function choisir(i){
  if(S.evFait || S.fini) return;
  const sc = sceneCourante();

  if(sc){
    const opt = optionsVisibles(sc)[i];
    if(!opt) return;
    appliquer(opt.e);
    if(opt.axe) for(const k in opt.axe) S.axes[k] = (S.axes[k]||0) + opt.axe[k];
    if(opt.rival) S.rival = clamp(S.rival + opt.rival, 32, 100);
    if(opt.pose) S.flags[opt.pose] = S.tour;
    // gouverner use : toute décision mécontente une part du pays
    appliquer({popularite:-2.1});
    S.chroniques.push({tour:S.tour, ch:sc.ch, titre:sc.t, choix:opt.l, rival:opt.rival||0});
    S.scenesVues.push(sc.id);
    S.reaction = {choix:opt.l, txt:opt.r || reactionParDefaut(opt), eff:opt.e};
    S.jrn = [{txt:`📖 ${CHAPITRES[sc.ch-1].titre} — « ${opt.l} »`, cl:""}];
  } else {
    const ev = EVENTS.find(e=>e.id===S.ev);
    appliquer(ev.o[i].e);
    S.vus.push(ev.id);
    S.reaction = {choix:ev.o[i].l, txt:ev.o[i].r || reactionParDefaut(ev.o[i]), eff:ev.o[i].e};
    S.jrn = [{txt:`« ${ev.o[i].l} » — décision actée.`, cl:""}];
  }

  S.evFait = true;
  sauver(); rendre();
}

function moisSuivant(){
  if(S.fini) return;
  if(!S.evFait){ secouerBureau(); return; }

  const jrn=[];
  const b = calculBudget();

  // --- trésorerie et dette ---
  let tres = S.tres + b.solde;
  if(tres < 0){ S.dette += -tres; tres = 0; }
  if(tres > 100){ S.dette = Math.max(0, S.dette-(tres-100)*.6); tres = 100; }
  S.tres = tres;
  if(b.solde>0) S.dette = Math.max(0, S.dette - b.solde*.12);

  jrn.push({txt:`Solde du mois : ${b.solde>=0?"+":""}${r1(b.solde)} Md€ · `+
                `dette ${Math.round(S.dette)} % du PIB (${nb(detteMd())} Md€)`,
            cl:b.solde>=0?"up":"dn"});

  // --- effets des curseurs ---
  const d=S.dep, t=S.tax;
  S.sec.interieure = clamp(S.sec.interieure + (d.police-50)*.048 + (d.defense-50)*.006);
  S.sec.defense    = clamp(S.sec.defense    + (d.defense-50)*.046);

  S.cli.air   = clamp(S.cli.air   + (d.ecolo-50)*.030 + (t.carbone-50)*.030);
  S.cli.eau   = clamp(S.cli.eau   + (d.ecolo-50)*.038);
  S.cli.foret = clamp(S.cli.foret + (d.ecolo-50)*.026);
  S.cli.sols  = clamp(S.cli.sols  + (d.ecolo-50)*.024 - (t.carbone-50)*.006);

  const infl = inflation();
  S.soc.pouvoir  = clamp(S.soc.pouvoir  - (t.ir-50)*.030 - (t.tva-50)*.034 - (infl-2)*.38);
  S.soc.sante    = clamp(S.soc.sante    + (d.sante-50)*.052);
  S.soc.educ     = clamp(S.soc.educ     + (d.educ-50)*.050);
  S.soc.pauvrete = clamp(S.soc.pauvrete + (d.sante-50)*.014 + (d.educ-50)*.010
                                        - (chomage()-8)*.10 - (t.tva-50)*.014);

  S.eco = clamp(S.eco + (d.educ-50)*.018 - (t.is-50)*.055 - (t.ir-50)*.032 - S.dette*.004);

  S.grp.salaries  = clamp(S.grp.salaries  - (t.ir-50)*.045 - (t.tva-50)*.032 + (d.sante-50)*.012);
  S.grp.retraites = clamp(S.grp.retraites - (t.tva-50)*.042 + (d.sante-50)*.020);
  S.grp.jeunes    = clamp(S.grp.jeunes    + (d.educ-50)*.022 - (t.tva-50)*.024);
  S.grp.ruraux    = clamp(S.grp.ruraux    - (t.carbone-50)*.048 + (d.police-50)*.010);
  S.grp.patrons   = clamp(S.grp.patrons   - (t.is-50)*.060 - (t.ir-50)*.026 + (d.defense-50)*.008);

  // --- effets mensuels des lois et chantiers (hors budget, déjà compté) ---
  const m = Object.assign({}, modsMensuels());
  delete m.budget; delete m.croissance;
  appliquer(m);

  // --- humeur générale : l'état du pays se répercute sur l'opinion ---
  const humeur = (moy(S.soc) + S.eco + moy(S.sec) + moy(S.cli))/4;
  for(const k in S.grp) S.grp[k] = clamp(S.grp[k] + (humeur-50)*.022);

  // --- entropie : sans action tout se dégrade, et l'excellence coûte de plus en plus cher ---
  const perte = (v,base)=>base + Math.max(0,(v-72))*.020;
  for(const k in S.sec) S.sec[k] = clamp(S.sec[k]-perte(S.sec[k],.40));
  for(const k in S.soc) S.soc[k] = clamp(S.soc[k]-perte(S.soc[k],.40));
  for(const k in S.cli) S.cli[k] = clamp(S.cli[k]-perte(S.cli[k],.22));
  S.eco = clamp(S.eco - perte(S.eco,.40) - Math.max(0,(S.dette-120))*.004);

  // --- usure du pouvoir, plus rude au second mandat ---
  const usure = .34 + Math.min(S.tour,DUREE_MANDAT)*.011;
  // plus on est haut dans les sondages, plus il est coûteux de s'y maintenir
  for(const k in S.grp) S.grp[k] = clamp(S.grp[k] - usure - Math.max(0,(S.grp[k]-62))*.055);
  jrn.push({txt:`Usure du pouvoir : −${r1(usure)} de popularité ce mois-ci.`, cl:"dn"});

  // au second mandat, votre camp cherche déjà son candidat
  if(S.mandat>=2) S.dauphin = clamp(S.dauphin + (popularite()-46)*.018 + (modsMensuels().dauphin||0), 0, 100);

  // Ferrand prospère sur vos faiblesses
  const avantR = S.rival;
  S.rival = clamp(S.rival + .12 + (56-popularite())*.035, 32, 100);
  if(Math.floor(S.rival)>Math.floor(avantR))
    jrn.push({txt:`📈 Julien Ferrand progresse : ${Math.round(S.rival)} % d'intentions de vote.`,cl:"dn"});

  // --- PIB, dette en ratio, marchés, reste du monde ---
  const cr = croissance();
  const pibAvant = S.pib;
  S.pib = Math.max(600, S.pib*(1+cr/1200));
  // un PIB qui grimpe allège le ratio de dette, mais pas intégralement
  S.dette *= 1 - (1 - pibAvant/S.pib)*.55;
  S.cac = clamp(S.cac + (cacCible()-S.cac)*.10 + S.cac*(Math.random()-.5)*.016, 2000, 16000);
  PAYS.forEach((p,i)=>{ if(i!==IFR)
    S.monde[i] = S.monde[i]*(1 + p.g/1200 + (Math.random()-.5)*.0016); });

  // --- chantiers ---
  S.chantiers.forEach(c=>c.reste--);
  S.chantiers.filter(c=>c.reste<=0).forEach(c=>{
    const p = PROJETS.find(x=>x.id===c.id);
    appliquer(p.fin); S.projetsFinis.push(p.id);
    jrn.push({txt:`🏗️ Chantier livré : ${p.nom}.`, cl:"up"});
  });
  S.chantiers = S.chantiers.filter(c=>c.reste>0);

  if(S.delaiLoi>0){
    S.delaiLoi--;
    if(S.delaiLoi===0) jrn.push({txt:"📜 Le Parlement est prêt à examiner une nouvelle loi.",cl:"up"});
  }

  const rangAvant = rang();
  S.tour++;
  enregistrerHistorique();
  const rangApres = rang();
  if(rangApres<rangAvant) jrn.push({txt:`📈 La France passe ${ordinal(rangApres)} puissance mondiale.`,cl:"up"});
  if(rangApres>rangAvant) jrn.push({txt:`📉 La France recule au rang de ${ordinal(rangApres)} puissance mondiale.`,cl:"dn"});

  S.jrn = jrn;
  if(verifierFin()){ sauver(); rendre(); remonter(); return; }
  tirerEvenement();
  sauver(); rendre(); remonter();
}

function verifierFin(){
  const p = popularite();
  const echecs = [
    [p<=0,             "🗳️","Destitution",
     "Votre popularité est tombée à néant. L'Assemblée vote la motion de censure : vous quittez l'Élysée sous les huées."],
    [moy(S.sec)<=0,    "🚨","Chaos",
     "Le pays a sombré dans l'insécurité. L'état d'urgence permanent a eu raison de votre autorité."],
    [moy(S.soc)<=0,    "🔥","Insurrection",
     "La fracture sociale a explosé. Des millions de manifestants encerclent le palais."],
    [S.eco<=0,         "💸","Effondrement",
     "L'économie française s'est écroulée. Le FMI prend la main."],
    [moy(S.cli)<=0,    "🏜️","Désastre écologique",
     "Le territoire est ravagé. L'Histoire retiendra votre inaction."],
    [S.dette>=275,     "🏦","Faillite de l'État",
     "La dette a dépassé tout contrôle. La France est placée sous tutelle."]
  ];
  for(const [c,em,t,d] of echecs) if(c){ S.fini={ok:false,em,t,d}; return true; }

  if(S.tour > DUREE_MANDAT*S.mandat){
    if(S.mandat===1){
      const res = resultatElection();
      if(res.gagne){
        S.mandat = 2;
        S.dauphin = 20;
        S.jrn = [{txt:`🗳️ Réélu avec ${res.moi} % contre ${res.ferrand} %. Un second mandat commence — `+
                      `et cette fois, vous ne pourrez pas vous représenter.`, cl:"up"}].concat(S.jrn||[]);
        return false;
      }
      S.fini = epilogue(res); return true;
    }
    S.fini = epilogueFinal(); return true;
  }
  return false;
}

/* le second tour : les deux camps se partagent cent pour cent des voix */
function resultatElection(){
  const p = popularite(), r = Math.max(32, S.rival);
  const moi = Math.round(p/(p+r)*100);
  return {moi, ferrand:100-moi, gagne:moi>50};
}

/* ---- l'élection, et la fin que votre parcours a écrite ---- */
function epilogue(res){
  const F = S.flags, A = S.axes;
  const moi = res.moi, ferrand = res.ferrand, gagne = res.gagne;
  const score = `Vous obtenez ${moi} % au second tour, Julien Ferrand ${ferrand} %.`;

  const fins = gagne ? [
   [F.legs_climat && valeur("climat")>55, "🌍","Le président de la bascule",
    `${score} Vous êtes réélu, et l'on retiendra une chose : sous votre mandat, la France a
     cessé de repousser la question climatique. Vos adversaires disent que cela a coûté cher.
     Vos successeurs diront que cela a été payé au bon moment.`],
   [F.legs_social && valeur("social")>55, "❤️","Le président des jours meilleurs",
    `${score} Vous êtes réélu par ceux qui, cinq ans plus tôt, ne croyaient plus qu'un pouvoir
     puisse encore améliorer leur quotidien. La dette, elle, attendra le prochain.`],
   [F.legs_avenir, "🎓","Le président qui a semé",
    `${score} Vous êtes réélu sans triomphe. Ce que vous avez construit — des écoles, des
     laboratoires, des années gagnées — ne se verra pas avant longtemps. C'est le pari que
     vous avez fait, en sachant que d'autres en récolteraient les fruits.`],
   [F.legs_comptes && S.dette<128, "⚖️","Le président comptable",
    `${score} Vous êtes réélu par les marchés avant de l'être par les Français. Les comptes
     sont tenus, la note est bonne, et le pays vous trouve un peu froid. L'Histoire, elle,
     aime les gens qui laissent une maison en ordre.`],
   [A.autorite>=4, "🛡️","Le président de l'ordre",
    `${score} Vous êtes réélu sur la sécurité et vous le savez. Le pays est plus calme et
     un peu plus dur. Les libertés que vous avez suspendues « provisoirement » n'ont jamais
     été rétablies, et plus personne ne s'en étonne.`],
   [true, "🏛️","Réélu",
    `${score} Vous êtes réélu sans qu'on sache très bien pourquoi, sinon que l'autre faisait
     peur. Cinq années de plus commencent, et cette fois vous n'aurez plus l'excuse
     de l'apprentissage.`]
  ] : [
   [F.pression_presse || F.secret_defense, "📰","Rattrapé",
    `${score} Ce n'est pas votre bilan qui vous a battu, c'est ce que vous avez essayé de
     cacher. Camille Reyes a publié le reste trois semaines avant le scrutin. Ferrand
     n'a eu qu'à laisser faire.`],
   [A.autorite>=4, "⛓️","Le pays s'est lassé",
    `${score} Vous avez gouverné par la fermeté et vous êtes battu par la fatigue. Ferrand
     reprend vos décrets un par un — non pour les abroger, mais pour les signer à son tour.`],
   [F.transparence, "🕊️","Battu, mais debout",
    `${score} Vous perdez sans vous être renié. Vous avez tout dit, y compris ce qui vous
     coûtait. Le soir du second tour, la salle vous applaudit longtemps ; ce n'est pas une
     victoire, mais ce n'est pas rien.`],
   [S.dette>170, "🏦","Le président de la dette",
    `${score} Vous laissez un pays plus endetté que vous ne l'avez trouvé, et une campagne
     entière l'a répété. Ferrand promet la rigueur. Il découvrira bientôt pourquoi
     vous ne l'avez pas faite.`],
   [true, "🗳️","Ferrand président",
    `${score} Il a construit sa victoire sur chacune de vos hésitations. Vous quittez
     l'Élysée un dimanche de mai, et le lendemain le pays parle déjà d'autre chose.`]
  ];
  const [,em,t,d] = fins.find(f=>f[0]);
  return {ok:gagne, em, t, d, ferrand, score:moi};
}

/* ---- fin des deux mandats : vous ne vous représentez pas.
   Ce qui se joue, c'est qui vous succède et ce qu'il gardera de vous. ---- */
function epilogueFinal(){
  const F=S.flags, A=S.axes, p=popularite();
  const d = clamp(S.dauphin + (p-45)*.35, 0, 100);
  const r = Math.max(32, S.rival);
  const moi = Math.round(d/(d+r)*100);
  const gagne = moi > 50;
  const score = gagne
    ? `Votre camp l'emporte avec ${moi} % contre ${100-moi} % à Julien Ferrand.`
    : `Julien Ferrand est élu avec ${100-moi} % contre ${moi} % à votre camp.`;

  const fins = gagne ? [
   [F.legs_climat||A.ecologie>=5, "🌍","La bascule tient",
    `${score} Vous quittez l'Élysée après dix ans. Ce que vous avez inscrit dans la loi,
     votre successeur n'aura ni l'envie ni les moyens de le défaire. C'est la définition
     la plus honnête d'un héritage : ce qui survit à celui qui l'a fait.`],
   [S.dette<115 && S.eco>60, "⚖️","Une maison en ordre",
    `${score} Vous laissez des comptes tenus, une économie qui tourne et un pays qui ne vous
     aime pas particulièrement. Dans vingt ans, des économistes écriront que ces dix années
     ont été les mieux gérées du siècle. Personne ne le croira sur le moment.`],
   [A.social>=5||F.legs_social, "❤️","Ce qu'on ne défait pas",
    `${score} La protection sociale que vous avez rebâtie est devenue une évidence, et une
     évidence ne se démonte pas. On vous reprochera son coût pendant trente ans. On ne
     touchera pas à un seul de ses articles.`],
   [A.autorite>=6, "🛡️","L'ordre transmis",
    `${score} Vous transmettez un pays plus sûr et plus surveillé. Les pouvoirs d'exception
     que vous avez normalisés passent intacts à votre successeur, qui s'en servira.
     Vous ne saurez jamais si c'est un legs ou une dette.`],
   [true, "🏛️","La continuité",
    `${score} Votre camp garde le pouvoir sans enthousiasme, sur la promesse de faire un
     peu mieux que vous. Dix ans, et le pays vous laisse partir avec ce mélange français
     de gratitude et de soulagement.`]
  ] : [
   [S.dette>180, "🏦","La note à payer",
    `${score} Vous laissez une dette que votre successeur brandira pendant cinq ans comme
     une pièce à conviction. Il découvrira en s'asseyant dans ce bureau pourquoi vous ne
     l'aviez pas réduite. Il ne le dira jamais publiquement.`],
   [F.pression_presse||F.secret_defense||F.chantage_cede, "📰","Le dossier ouvert",
    `${score} Ce que vous avez tenté d'enterrer pendant dix ans ressort le mois suivant
     votre départ. Camille Reyes publie un livre. Il est mesuré, documenté, et il fixe
     durablement la manière dont on parlera de vous.`],
   [S.dauphin<30, "🪑","La chaise vide",
    `${score} Vous n'avez préparé personne. Votre camp est parti à la bataille sans candidat
     crédible et l'a perdue avant d'avoir commencé. Gouverner dix ans sans transmettre,
     c'est bâtir sur un terrain qu'on n'a pas acheté.`],
   [A.autorite>=6, "⛓️","Ce que vous lui laissez",
    `${score} Ferrand hérite d'un arsenal que vous avez construit et qu'il n'aurait pas
     osé réclamer. Il n'abroge rien. Il signe, et il vous cite.`],
   [true, "🌅","Dix ans",
    `${score} Vous partez battu par procuration, ce qui est la manière la plus douce de
     perdre. Le lendemain, vous marchez seul dans une rue où plus personne ne se retourne.
     Cela faisait dix ans que ce n'était pas arrivé.`]
  ];
  const [,em,t,d2] = fins.find(f=>f[0]);
  return {ok:gagne, em, t, d:d2, ferrand:100-moi, score:moi, transmission:true};
}

/* ══════════════════════════════════════════════════════════
   5. RENDU PRINCIPAL
   ══════════════════════════════════════════════════════════ */
function rendre(){
  const an = 2027 + Math.floor((S.tour-1)/12);
  const mo = MOIS[(S.tour-1)%12];
  const dCol = S.dette>=200 ? "#c0455a" : (S.dette>=160 ? "#d99a4a" : "#93a3bd");
  document.getElementById("date").innerHTML =
    `${mo} ${an} · mois ${Math.min(S.tour,DUREE_MANDAT*S.mandat)} / ${DUREE_MANDAT*S.mandat}` + (S.mandat>1 ? ` · 2ᵉ mandat` : ``) +
    ` · PIB ${nb(S.pib)} Md€` +
    ` · <b style="color:${dCol}">dette ${Math.round(S.dette)} %</b>`;
  document.getElementById("rang").textContent = ordinal(rang());

  document.getElementById("jauges").innerHTML = Object.keys(JAUGES).map(k=>{
    const j = JAUGES[k], v = valeur(k);
    // pour le rival, une jauge haute est une mauvaise nouvelle : la couleur s'inverse
    const c = couleur(j.inverse ? 100-v : v);
    return `<button class="j" onclick="ouvrirFiche('${k}')" title="${j.nom} — voir le détail">
      <div class="jt"><span>${j.ico} ${j.nom}</span><b>${Math.round(v)}${j.inverse?" %":""}</b></div>
      <div class="bar"><i style="width:${v}%;background:${c}"></i></div></button>`;
  }).join("");

  const bu = document.getElementById("bureau");
  if(S.fini) bu.innerHTML = ecranFin();
  else {
    const sc = sceneCourante();
    const n  = sc || EVENTS.find(e=>e.id===S.ev);
    const opts = sc ? optionsVisibles(sc) : n.o;
    const etq = sc
      ? `Chapitre ${ROMAINS[sc.ch-1]} · ${CHAPITRES[sc.ch-1].titre}`
      : "Sur votre bureau";
    if(S.evFait && S.reaction){
      // la décision est prise : on montre ce quelle a produit
      bu.innerHTML = `<div class="carte ${sc?"recit":""} consequence">
        <div class="etq">${etq} · Conséquences</div>
        <h2>${n.ico} ${n.t}</h2>
        <div class="choixfait">« ${S.reaction.choix} »</div>
        <div class="texte">${S.reaction.txt.split("<br><br>")
          .map(p=>`<p>${p.trim()}</p>`).join("")}</div>
        <div class="eff">${tagsEffet(S.reaction.eff).join("")}</div>
      </div>`;
    } else {
      bu.innerHTML = `<div class="carte ${sc?"recit":""}">
        <div class="etq">${etq}</div>
        <h2>${n.ico} ${n.t}</h2>
        <div class="texte">${introDe(n)}${
          n.d.split("<br><br>").map(p=>`<p>${p.trim()}</p>`).join("")}</div>
        <div class="choix">${opts.map((o,i)=>
          `<button class="opt" onclick="choisir(${i})">
             <span>${o.l}</span><span class="fleche">›</span></button>`).join("")}</div>
      </div>`;
    }
  }

  const jr = document.getElementById("journal");
  if(S.jrn.length){
    jr.style.display="block";
    document.getElementById("jrn").innerHTML =
      S.jrn.map(l=>`<div class="${l.cl}">${l.txt}</div>`).join("");
  } else jr.style.display="none";

  const su = document.getElementById("suite");
  if(S.fini){
    su.textContent="↻ Rejouer"; su.disabled=false;
    su.onclick=()=>{ if(confirm("Commencer une nouvelle partie ?")) nouvellePartie(); };
  } else {
    su.onclick=moisSuivant; su.disabled=!S.evFait;
    su.textContent = S.evFait ? "Passer au mois suivant →" : "Prenez d'abord une décision";
  }

  const pl=document.getElementById("pLois");
  pl.textContent = S.delaiLoi>0 ? S.delaiLoi : "✓";
  pl.className = S.delaiLoi>0 ? "pastille" : "pastille ok";
  const pp=document.getElementById("pProj");
  pp.textContent = S.chantiers.length ? S.chantiers.length+"/"+MAX_CHANTIERS : "";
  pp.style.display = S.chantiers.length ? "" : "none";

  if(modeCourant) rafraichirModale();
}

function couleur(v){
  if(v<25) return "linear-gradient(90deg,#8e2331,#c0455a)";
  if(v<50) return "linear-gradient(90deg,#a06a2a,#d99a4a)";
  if(v<75) return "linear-gradient(90deg,#3d6fbb,#5b93e0)";
  return "linear-gradient(90deg,#2f8f63,#4caf7d)";
}
function couleurUnie(v){
  if(v<25) return "#c0455a"; if(v<50) return "#d99a4a";
  if(v<75) return "#5b93e0"; return "#4caf7d";
}

/* aperçu compact des effets d'une option */

function ecranFin(){
  const f=S.fini;
  return `<div class="carte"><div class="fin">
    <div class="em">${f.em}</div><h2>${f.t}</h2><p>${f.d}</p>

      <div class="st"><b>${ordinal(rang())}</b><span>rang mondial</span></div>

/* Le paragraphe d'ouverture : la même scène ne s'ouvre pas de la même façon
   selon ce que vous avez fait avant. On prend la première variante qui colle. */
function introDe(n){
  if(!n.intro) return "";
  const v = n.intro.find(([cond])=>{ try{ return cond(); }catch(e){ return false; } });
  return v ? `<p class="intro">${v[1].trim()}</p>` : "";
}

/* Repli : si une option na pas de réaction écrite, on en compose une à partir
   de ce qui a bougé. Sert de filet, pas de norme. */
function reactionParDefaut(opt){
  const e=opt.e||{}, bon=[], mauvais=[];
  const nom={securite:"la sécurité",climat:"l'environnement",social:"le climat social",
             economie:"l'économie",budget:"les finances publiques"};
  for(const k in nom){ if(!e[k]) continue; (e[k]>0?bon:mauvais).push(nom[k]); }
  [["sec",SEC],["cli",CLI],["soc",SOC]].forEach(([c,d])=>{ if(!e[c]) return;
    for(const g in e[c]) (e[c][g]>0?bon:mauvais).push(d[g].nom.toLowerCase()); });
  const ph=[];
  if(bon.length) ph.push("La décision produit ses premiers effets sur "+bon.slice(0,3).join(", ")+".");
  if(mauvais.length) ph.push("Elle se paie ailleurs : "+mauvais.slice(0,3).join(", ")+".");
  if(!ph.length) ph.push("La décision est actée. Le pays en prendra la mesure plus tard.");
  return ph.join(" ");
}

/* on revient en haut pour lire la nouvelle scène depuis son titre */
function remonter(){
  try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }
}

function secouerBureau(){
  const c=document.querySelector(".carte"); if(!c) return;
  c.animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},
             {transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:280});
}

  if(m.startsWith("fiche:")) ouvrirFiche(m.slice(6));

}

/* ---- courbe SVG réutilisable ---- */
let idCourbe=0;
function courbe(vals,{col="#d9b26a",h=110,w=560,fmt=v=>Math.round(v)}={}){
  if(!vals || vals.length<3)
    return `<div class="vide">La courbe apparaîtra après quelques mois de mandat.</div>`;
  const mn=Math.min(...vals), mx=Math.max(...vals), amp=(mx-mn)||1;
  const lo=mn-amp*.15, hi=mx+amp*.15;
  const X=i=>(i/(vals.length-1))*w;
  const Y=v=>h-((v-lo)/(hi-lo))*h;
  let d=`M0 ${Y(vals[0]).toFixed(1)}`;
  vals.forEach((v,i)=>{ if(i) d+=` L${X(i).toFixed(1)} ${Y(v).toFixed(1)}`; });
  const id="c"+(++idCourbe);
  const grille=[0,.25,.5,.75,1].map(f=>
    `<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}"
           stroke="#1e2b42" stroke-width="1"/>`).join("");
  const fin=vals[vals.length-1];
  return `<div class="cwrap">
    <svg class="courbe" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity=".38"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${grille}
      <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="2"
            vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle cx="${w}" cy="${Y(fin).toFixed(1)}" r="3.5" fill="${col}"/>
    </svg>
    <div class="cinfo"><span>il y a ${vals.length} mois</span>
      <span>min ${fmt(mn)} · max ${fmt(mx)}</span><span>aujourd'hui</span></div></div>`;
}
const histo = cle=>S.hist.map(h=>h[cle]);

/* ---- bloc de sous-indicateurs ---- */
function blocSous(ref,def,titre){
  return `<div class="bloc"><h3>${titre}</h3>${Object.keys(def).map(k=>{
    const v=ref[k], m=def[k];
    return `<div class="si">
      <div class="t"><span>${m.ico} ${m.nom}</span><b style="color:${couleurUnie(v)}">${Math.round(v)}</b></div>
      <div class="bar gros"><i style="width:${v}%;background:${couleur(v)}"></i></div>
      <div class="d">${m.info(v).join(" · ")}</div></div>`;
  }).join("")}</div>`;
}

/* ---- 1. la toile des lois ---- */
const CLES = Object.keys(BRANCHES);
const RAYONS = [92,150,208,266,320];

const RAYON_PONT = 238;      // les jonctions siègent entre deux branches
const SEUIL_PONT = 2;        // lois requises de chaque côté

/* indice angulaire d'une jonction : à mi-chemin des deux branches voisines */
function midPont(loi){
  const [a,b]=loi.entre, ia=CLES.indexOf(a), ib=CLES.indexOf(b);
  const lo=Math.min(ia,ib), hi=Math.max(ia,ib);
  return (hi-lo>1) ? ((lo+hi+CLES.length)/2)%CLES.length : (lo+hi)/2;
}
function posLoi(loi){
  if(loi.entre){
    const a=(-90+midPont(loi)*72)*Math.PI/180;
    return {x:400+Math.cos(a)*RAYON_PONT, y:400+Math.sin(a)*RAYON_PONT, pont:true};
  }
  const bi=CLES.indexOf(loi.br);
  const ti=LOIS.filter(l=>l.br===loi.br).indexOf(loi);
  const a=(-90+bi*72)*Math.PI/180, r=RAYONS[ti];
  return {x:400+Math.cos(a)*r, y:400+Math.sin(a)*r, ti, bi};
}
/* combien de lois votées dans une branche */
function votees(br){
  return S.lois.map(id=>LOIS.find(l=>l.id===id)).filter(l=>l&&l.br===br).length;
}
function prereq(loi){
  if(loi.entre) return null;
  const s=LOIS.filter(l=>l.br===loi.br), i=s.indexOf(loi);
  return i===0 ? null : s[i-1];
}
function accessible(loi){
  if(S.lois.includes(loi.id)) return false;
  if(loi.entre) return loi.entre.every(b=>votees(b)>=SEUIL_PONT);
  const p=prereq(loi);
  return !p || S.lois.includes(p.id);
}
/* couleur et libellé : une jonction emprunte aux deux branches qu'elle relie */
function couleurLoi(l){
  return l.entre ? BRANCHES[l.entre[0]].col : BRANCHES[l.br].col;
}
function libelleBranche(l){
  return l.entre
    ? BRANCHES[l.entre[0]].ico+" "+BRANCHES[l.entre[0]].nom+" × "+
      BRANCHES[l.entre[1]].ico+" "+BRANCHES[l.entre[1]].nom
    : BRANCHES[l.br].ico+" "+BRANCHES[l.br].nom;
}

let noeudSel = null;

function ouvrirLois(sel){
  noeudSel = sel || noeudSel || LOIS[0].id;
  const loi = LOIS.find(l=>l.id===noeudSel);

  let fils="";
  CLES.forEach((br,bi)=>{
    let px=400, py=400;
    LOIS.filter(l=>l.br===br).forEach(l=>{
      const p=posLoi(l), act=S.lois.includes(l.id);
      fils+=`<line class="fil ${act?"act":""}" x1="${px.toFixed(1)}" y1="${py.toFixed(1)}"
              x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`;
      px=p.x; py=p.y;
    });
  });
  let web="";
  RAYONS.forEach(r=>{
    let d="";
    for(let i=0;i<=5;i++){
      const a=(-90+i*72)*Math.PI/180;
      const x=400+Math.cos(a)*r, y=400+Math.sin(a)*r;
      if(i===0) d=`M${x.toFixed(1)} ${y.toFixed(1)}`;
      else{
        const am=(-90+(i-.5)*72)*Math.PI/180, rm=r*.90;
        d+=` Q${(400+Math.cos(am)*rm).toFixed(1)} ${(400+Math.sin(am)*rm).toFixed(1)}
             ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
    }
    web+=`<path class="web" d="${d}"/>`;
  });
  // fils des jonctions vers les deux branches qu'elles relient
  let defs="", ponts="";
  LOIS.filter(l=>l.entre).forEach(l=>{
    const p=posLoi(l), ouvert=accessible(l)||S.lois.includes(l.id);
    const c1=BRANCHES[l.entre[0]].col, c2=BRANCHES[l.entre[1]].col;
    defs+=`<linearGradient id="g_${l.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient>`;
    l.entre.forEach((br,k)=>{
      const anc=LOIS.filter(x=>x.br===br)[1];
      if(!anc) return;
      const q=posLoi(anc);
      ponts+=`<line class="fil pont ${ouvert?"act":""}" stroke="${k?c2:c1}"
        x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}"
        x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}"/>`;
    });
  });

  let noeuds="";
  LOIS.forEach(l=>{
    const p=posLoi(l), col=couleurLoi(l);
    const vote=S.lois.includes(l.id), dispo=accessible(l);
    const grad = l.entre ? "url(#g_"+l.id+")" : col;
    const fill = vote ? grad : (dispo?"#1c2740":"#141b28");
    const stroke = noeudSel===l.id ? "#d9b26a" : (vote?grad:(dispo?grad:"#2a3550"));
    const rr = l.entre ? 28 : 25;
    const tirets = (l.entre && !vote && !dispo) ? " stroke-dasharray=" + JSON.stringify("4 3") : "";
    noeuds+=`<g class="nd" opacity="${vote?1:(dispo?.95:.42)}" onclick="ouvrirLois('${l.id}')">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rr}" fill="${fill}"
        stroke="${stroke}" stroke-width="${noeudSel===l.id?3.5:(l.entre?3:2)}"${tirets}/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+7).toFixed(1)}" text-anchor="middle"
        font-size="${l.entre?23:21}" pointer-events="none">${l.ico}</text></g>`;
  });
  let etq="";
  CLES.forEach((br,bi)=>{
    const a=(-90+bi*72)*Math.PI/180, r=RAYONS[4]+36;
    const x=clamp(400+Math.cos(a)*r,58,742), y=400+Math.sin(a)*r;
    etq+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"
      fill="${BRANCHES[br].col}" font-size="16" font-family="Georgia,serif"
      letter-spacing="1">${BRANCHES[br].nom}</text>`;
  });
  const svg=`<svg class="toilesvg" viewBox="0 0 800 800"><defs>${defs}</defs>${web}${ponts}${fils}
    <circle cx="400" cy="400" r="34" fill="#1b2740" stroke="#d9b26a" stroke-width="2.5"/>
    <text x="400" y="409" text-anchor="middle" font-size="26">🏛️</text>
    ${noeuds}${etq}</svg>`;

  const vote=S.lois.includes(loi.id), dispo=accessible(loi), pr=prereq(loi);
  const assez=S.tres>=loi.cout, pret=S.delaiLoi===0;
  let etat="", act=true;
  if(vote){ etat="Loi promulguée."; act=false; }
  else if(!dispo && loi.entre){
    const manque = loi.entre
      .map(b=>({b, n:votees(b)}))
      .filter(x=>x.n<SEUIL_PONT)
      .map(x=>BRANCHES[x.b].nom+" ("+x.n+"/"+SEUIL_PONT+")");
    etat = "Loi de jonction : il faut " + SEUIL_PONT + " lois votées dans chacune des deux " +
           "branches voisines. Manque : " + manque.join(", ") + ".";
    act=false;
  }
  else if(!dispo){ etat=`Nécessite d'abord : « ${pr.nom} ».`; act=false; }
  else if(!pret){ etat=`Le Parlement est saisi. Disponible dans ${S.delaiLoi} mois.`; act=false; }
  else if(!assez){ etat=`Trésorerie insuffisante (${loi.cout} requis).`; act=false; }

  ouvrir("📜 Les lois de la République",
    `${S.lois.length} / ${LOIS.length} votées` +
      ` · ${S.lois.filter(id=>{const l=LOIS.find(x=>x.id===id);return l&&l.entre;}).length}/${LOIS.filter(l=>l.entre).length} jonctions` +
      (S.delaiLoi ? ` · prochaine dans ${S.delaiLoi} mois` : " · vote possible"),
    `<div class="toile"><div class="svgwrap">${svg}</div>
      <div class="detail">
        <div class="br">${libelleBranche(loi)}${loi.entre?" · jonction":""}</div>
        <h3>${loi.ico} ${loi.nom}</h3>
        <p>${loi.txt}</p>
        <div class="eff">${tagsEffet(loi.eff).join("")}</div>${tagsMensuels(loi.tour)}
        <p style="margin:12px 0 10px;font-size:13px">Coût :
          <b style="color:#d9b26a">${loi.cout}</b> de trésorerie</p>
        <button class="btn" ${act?"":"disabled"} onclick="voter('${loi.id}')">
          ${vote?"✓ Déjà votée":"Faire voter la loi"}</button>
        ${etat?`<p style="font-size:12px;color:#c0455a;margin-top:9px">${etat}</p>`:""}
        <div class="legende">${CLES.map(b=>
          `<span style="color:${BRANCHES[b].col}">${BRANCHES[b].nom}</span>`).join("")}</div>
      </div></div>`, "lois");
}

function tagsEffet(e){
  const t=[], glo={securite:"🛡️ Sécurité",climat:"🌍 Climat",social:"⚖️ Social",
                   economie:"📈 Économie",budget:"💰 Trésorerie"};
  for(const k in glo) if(e[k]) t.push(`<span class="tag">${glo[k]} ${e[k]>0?"+":""}${e[k]}</span>`);
  [["sec",SEC,S.sec],["cli",CLI,S.cli],["soc",SOC,S.soc]].forEach(([cle,def])=>{
    if(!e[cle]) return;
    for(const g in e[cle]) t.push(
      `<span class="tag">${def[g].ico} ${def[g].nom} ${e[cle][g]>0?"+":""}${e[cle][g]}</span>`);
  });
  if(e.groups) for(const g in e.groups) t.push(
    `<span class="tag">${GROUPES[g].ico} ${GROUPES[g].nom} ${e.groups[g]>0?"+":""}${e.groups[g]}</span>`);
  if(e.cac) t.push(`<span class="tag">📊 CAC 40 ${e.cac>0?"+":""}${e.cac} %</span>`);
  return t;
}
function tagsMensuels(tr){
  if(!tr || !Object.keys(tr).length) return "";
  const nom={budget:"💰 Trésorerie",securite:"🛡️ Sécurité",climat:"🌍 Climat",
             social:"⚖️ Social",economie:"📈 Économie",croissance:"📊 Croissance"};
  const l=[]; for(const k in tr) if(nom[k]) l.push(`${nom[k]} ${tr[k]>0?"+":""}${r1(tr[k])}`);
  return l.length ? `<p style="font-size:12.5px;color:#93a3bd;margin-top:8px">
    <b style="color:#d9b26a">Chaque mois :</b> ${l.join(" · ")}</p>` : "";
}

function voter(id){
  const loi=LOIS.find(l=>l.id===id);
  if(!loi||S.lois.includes(id)||!accessible(loi)||S.delaiLoi>0||S.tres<loi.cout||S.fini) return;
  S.tres -= loi.cout;
  S.lois.push(id);
  appliquer(loi.eff);
  S.delaiLoi = DELAI_LOI;
  S.jrn = [{txt:`📜 Loi promulguée : ${loi.nom}.`,cl:"up"}].concat(S.jrn);
  sauver(); rendre();
}

/* fabrique la vignette d'un chantier */
function vignetteProjet(p){
  {
    const fini=S.projetsFinis.includes(p.id);
    const ch=S.chantiers.find(c=>c.id===p.id);
    const plein=S.chantiers.length>=MAX_CHANTIERS, assez=S.tres>=p.cout;
    let bas;
    if(fini) bas=`<button class="btn" disabled>✓ Livré</button>`;
    else if(ch) bas=`<div class="prog"><i style="width:${(1-ch.reste/p.duree)*100}%"></i></div>
        <button class="btn" disabled>En chantier — ${ch.reste} mois restants</button>`;
    else bas=`<button class="btn" ${(!assez||plein||S.fini)?"disabled":""} onclick="lancer('${p.id}')">
        Lancer · ${p.cout} 💰 · ${p.duree} mois</button>
        ${!assez?'<p style="font-size:11.5px;color:#c0455a;margin-top:7px">Trésorerie insuffisante</p>':
          (plein?'<p style="font-size:11.5px;color:#c0455a;margin-top:7px">Deux chantiers déjà en cours</p>':"")}`;
    return `<div class="pj ${fini?"fini":(ch?"en":"")}">
      <h4>${p.ico} ${p.nom}</h4><p>${p.txt}</p>
      <div class="eff">${tagsEffet(p.fin).join("")}</div>${bas}</div>`;
  }
}

let domainesOuverts = new Set();
function toggleDomaine(d){
  if(domainesOuverts.has(d)) domainesOuverts.delete(d); else domainesOuverts.add(d);
  ouvrirProjets();
}
function ouvrirProjets(){
  const html = Object.keys(DOMAINES).map(d=>{
    const lot = PROJETS.filter(p=>p.dom===d);
    if(!lot.length) return "";
    const livres = lot.filter(p=>S.projetsFinis.includes(p.id)).length;
    const enCours = lot.filter(p=>S.chantiers.some(c=>c.id===p.id)).length;
    const ouvert = domainesOuverts.has(d);
    return `<div class="dom-acc ${ouvert?"open":""}">
      <button class="dom-head" onclick="toggleDomaine('${d}')">
        <span class="chev">▶</span>
        <span class="dt">${DOMAINES[d].ico} ${DOMAINES[d].nom}</span>
        <span class="dc">${livres}/${lot.length} livrés${enCours?` · ${enCours} en cours`:""}</span>
      </button>
      <div class="dom-body"><div class="grille">${lot.map(vignetteProjet).join("")}</div></div>
    </div>`;
  }).join("");
  ouvrir("🏗️ Grands chantiers",
    `${S.chantiers.length}/${MAX_CHANTIERS} en cours · ${S.projetsFinis.length}/${PROJETS.length} livrés · touchez un domaine pour l'ouvrir`,
    html, "projets");
}
function lancer(id){
  const p=PROJETS.find(x=>x.id===id);
  if(!p||S.fini||S.projetsFinis.includes(id)||S.chantiers.some(c=>c.id===id)) return;
  if(S.chantiers.length>=MAX_CHANTIERS||S.tres<p.cout) return;
  S.tres -= p.cout;
  S.chantiers.push({id, reste:p.duree});
  S.jrn=[{txt:`🏗️ Chantier lancé : ${p.nom} (${p.duree} mois).`,cl:""}].concat(S.jrn);
  sauver(); rendre();
}

      <div class="kpi"><b>${ordinal(rang())}</b><span>rang mondial</span></div>
      <div class="kpi"><b>${nb(S.pib)}</b><span>PIB · Md€</span>
        <small style="color:#93a3bd">${croissance()>=0?"+":""}${r1(croissance())} % / an</small></div>
      <div class="kpi"><b>${Math.round(S.dette)} %</b><span>dette / PIB</span>
        <small style="color:${note().c}">note ${note().n}</small></div>
      <div class="kpi"><b>${b.solde>=0?"+":""}${r1(b.solde)}</b><span>solde mensuel</span></div>
      <div class="kpi"><b>${nb(S.cac)}</b><span>CAC 40</span></div>
      <div class="kpi"><b>${S.lois.length}</b><span>lois votées</span></div>
      <div class="kpi"><b>${S.projetsFinis.length}</b><span>chantiers livrés</span></div>
    </div>
    <div class="bloc"><h3>📖 Chroniques du mandat</h3>
      ${S.chroniques.length ? S.chroniques.map(c=>
        `<div style="padding:7px 0;border-bottom:1px solid #22304a80">
          <div style="font-size:11.5px;color:#93a3bd;letter-spacing:.5px">
            Mois ${c.tour} · Chapitre ${ROMAINS[c.ch-1]} · ${c.titre}</div>
          <div style="font-size:13.5px;color:#d6dfee">« ${c.choix} »</div></div>`).join("")
        : `<p class="vide">Votre histoire n'a pas encore commencé.</p>`}
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#93a3bd">
        <span>Autorité <b style="color:#e8edf6">${S.axes.autorite>0?"+":""}${S.axes.autorite}</b></span>
        <span>Social <b style="color:#e8edf6">${S.axes.social>0?"+":""}${S.axes.social}</b></span>
        <span>Écologie <b style="color:#e8edf6">${S.axes.ecologie>0?"+":""}${S.axes.ecologie}</b></span>
        <span>Julien Ferrand <b style="color:${S.rival>=55?'#c0455a':'#e8edf6'}">${Math.round(S.rival)} %</b></span>
      </div></div>
    <div class="deux" style="margin-top:8px">
      <div><h3 style="color:#d9b26a;margin-bottom:12px">📜 Lois promulguées</h3>${lois}</div>
      <div><h3 style="color:#d9b26a;margin-bottom:12px">🏗️ Chantiers en cours</h3>${ch}
        <h3 style="color:#d9b26a;margin:18px 0 12px">✓ Chantiers livrés</h3>${fi}</div>
    </div>
    ${sauvegardeOK ? "" : `<p style="font-size:12.5px;color:#d99a4a;margin-top:18px">
      ⚠ Sauvegarde automatique indisponible : votre navigateur la bloque pour les fichiers
      ouverts en local. La partie sera perdue si vous rechargez la page.</p>`}
    <button class="btn" style="background:#c0455a;margin-top:22px"
      onclick="if(confirm('Abandonner et recommencer une nouvelle partie ?')){fermer();nouvellePartie();}">
      Nouvelle partie</button>`;
  ouvrir("📊 Bilan du quinquennat",
    `${MOIS[(S.tour-1)%12]} ${2027+Math.floor((S.tour-1)/12)}`, html, "bilan");
}

/* ══════════════════════════════════════════════════════════
   7. SAUVEGARDE
   ══════════════════════════════════════════════════════════ */
const CLE="president_v3";
// certains navigateurs interdisent localStorage sur un fichier ouvert en local
let sauvegardeOK = (()=>{ try{ localStorage.setItem(CLE+"_t","1");
  localStorage.removeItem(CLE+"_t"); return true; }catch(e){ return false; } })();

function sauver(){ if(!sauvegardeOK) return;
  try{ localStorage.setItem(CLE, JSON.stringify(S)); }catch(e){ sauvegardeOK=false; } }

function charger(){
  try{
    const b=localStorage.getItem(CLE); if(!b) return false;
    const o=JSON.parse(b);
    if(!o || typeof o.tour!=="number" || !o.grp || !o.sec || !o.cli || !o.soc) return false;
    S=o;
    // garde-fous si la sauvegarde vient d'une version antérieure
    S.lois=S.lois||[]; S.chantiers=S.chantiers||[]; S.projetsFinis=S.projetsFinis||[];
    S.jrn=S.jrn||[]; S.vus=S.vus||[]; S.hist=S.hist||[];
    S.mandat=S.mandat||1; S.delaiLoi=S.delaiLoi||0;
    S.pib=S.pib||PIB0; S.cac=S.cac||7450; S.tres=S.tres!=null?S.tres:50;
    S.eco=S.eco!=null?S.eco:55;
    if(!Array.isArray(S.monde)||S.monde.length!==PAYS.length) S.monde=PAYS.map(p=>p.pib);
    // couche narrative
    S.axes = Object.assign({autorite:0,social:0,ecologie:0}, S.axes||{});
    S.flags = S.flags||{}; S.chroniques = S.chroniques||[];
    S.rival = typeof S.rival==="number" ? S.rival : 40;
    S.chapitre = S.chapitre||0;
    S.scenesVues = S.scenesVues||[];
    // la scène en cours doit exister, sinon on retombe sur un événement ordinaire
    if(S.evScene && !SCENES[S.ev]){ S.evScene=false; S.ev=null; }
    if(!S.evScene && (!S.ev || !EVENTS.find(e=>e.id===S.ev))) tirerEvenement();
    if(!S.hist.length) enregistrerHistorique();
    return true;
  }catch(e){ return false; }
}

if(!charger()) nouvellePartie(); else rendre();
</script>
