<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Président — Élysée</title>
<style>
:root{
  --bg:#0e1420; --bg2:#141d2e; --panel:#1a2436; --panel2:#22304a;
  --line:#2e3d59; --txt:#e8edf6; --dim:#93a3bd;
  --or:#d9b26a; --bleu:#4a7fd4; --rouge:#c0455a; --vert:#4caf7d;
  --ombre:0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#1c2a44 0%,var(--bg) 60%);
  color:var(--txt); font-family:"Segoe UI",system-ui,sans-serif; font-size:15px;
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
}
h1,h2,h3{font-family:Georgia,"Palatino Linotype",serif; margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
.wrap{width:100%; max-width:1080px; margin:0 auto; padding:14px 16px 90px; flex:1}

/* ---------- Bandeau ---------- */
header{
  background:linear-gradient(180deg,#1b2740,#141d2e);
  border-bottom:2px solid var(--or); box-shadow:var(--ombre);
  position:sticky; top:0; z-index:30;
}
.hbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.blason{font-size:26px}
.ident{min-width:0}
.titre{font-family:Georgia,serif;font-size:19px;letter-spacing:.5px}
.sous{color:var(--dim);font-size:12.5px}
.rang{margin-left:auto;text-align:right;line-height:1.25;flex-shrink:0;
  border:1px solid transparent;border-radius:9px;padding:4px 9px;transition:.15s}
.rang:hover{border-color:var(--or);background:#ffffff0a}
.rang b{color:var(--or);font-size:19px;font-family:Georgia,serif}
.rang span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}

.jauges{max-width:1080px;margin:0 auto;padding:0 16px 12px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.j{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;
  text-align:left;width:100%;transition:.15s}
.j:hover{border-color:var(--or);background:var(--panel2)}
.jt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;gap:6px}
.jt b{color:var(--txt);font-size:12.5px}
.bar{height:7px;background:#0c121d;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s ease,background .5s}
@media(max-width:520px){
  .jauges{grid-template-columns:1fr 1fr}
  .hbar{gap:9px}
  .titre{font-size:16px} .sous{font-size:10.5px}
  .blason{font-size:21px}
  .rang{padding:2px 5px} .rang b{font-size:16px} .rang span{font-size:9px;letter-spacing:.5px}
}

/* ---------- Bureau ---------- */
.carte{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:4px solid var(--or);
  border-radius:12px;padding:20px 22px;box-shadow:var(--ombre);margin-bottom:14px;
  animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.etq{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.carte h2{font-size:21px;margin-bottom:8px}
.carte p{color:#cbd6e8;line-height:1.5;margin:0 0 16px}
.carte .texte{color:#cbd6e8;line-height:1.62;margin:0 0 18px;font-size:15px}
.carte .texte p{margin:0 0 10px}
.carte .texte p:last-child{margin-bottom:0}
.carte .texte p.intro{border-left:2px solid var(--or);padding-left:12px;
  color:#c3a978;font-style:italic;margin-bottom:14px}
.carte.recit{border-left-width:5px;
  background:linear-gradient(180deg,#26355180,var(--panel))}
.carte.recit h2{font-size:23px;margin-bottom:12px}
.carte.recit .texte{font-size:15.5px;line-height:1.7;color:#d6dfee}
.carte.consequence{border-left-color:var(--vert)}
.carte.consequence .etq{color:var(--vert)}
.choixfait{background:#0f1727;border-left:3px solid var(--or);border-radius:0 8px 8px 0;
  padding:9px 14px;margin-bottom:16px;font-size:14.5px;color:var(--or);font-style:italic}
.choix{display:grid;gap:9px}
.opt{
  text-align:left;background:#16203353;border:1px solid var(--line);border-radius:9px;
  padding:11px 14px;transition:.15s;display:flex;justify-content:space-between;gap:12px;align-items:center}
.opt:hover:not(:disabled){background:#26365580;border-color:var(--or);transform:translateX(3px)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt small{color:var(--dim);font-size:11.5px;white-space:nowrap}
.opt .fleche{color:#42506b;font-size:19px;line-height:1;transition:.15s}
.opt:hover:not(:disabled) .fleche{color:var(--or);transform:translateX(2px)}
.carte.consequence .eff{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.carte.consequence .eff::before{content:"Ce que cela a changé";display:block;width:100%;
  font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--vert);margin-bottom:8px}

.suite{
  width:100%;padding:14px;border-radius:11px;font-size:16px;font-weight:600;
  background:linear-gradient(180deg,#d9b26a,#b8914d);color:#1a1206;box-shadow:var(--ombre);
  transition:.15s}
.suite:hover:not(:disabled){filter:brightness(1.08)}
.suite:disabled{background:#26314a;color:#66748c;box-shadow:none;cursor:not-allowed}

.journal{background:#0f1727;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.journal h3{font-size:13px;color:var(--or);margin-bottom:7px;letter-spacing:1px;text-transform:uppercase}
.journal div{font-size:13px;color:var(--dim);padding:2px 0}
.up{color:var(--vert)} .dn{color:var(--rouge)}

/* ---------- Barre d'actions ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;background:#111a29ee;backdrop-filter:blur(8px);
  border-top:1px solid var(--line);z-index:30}
.nav div{max-width:1080px;margin:0 auto;padding:9px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.nav button{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 4px;
  font-size:12.5px;transition:.15s;position:relative}
.nav button:hover{border-color:var(--or);background:var(--panel2)}
.nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:2px}
.pastille{position:absolute;top:5px;right:9px;background:var(--rouge);color:#fff;font-size:10px;
  border-radius:9px;padding:1px 6px}
.pastille.ok{background:var(--vert);color:#06210f}

/* ---------- Modales ---------- */
.mod{position:fixed;inset:0;background:#050912e0;z-index:50;display:none;padding:18px;overflow:auto}
.mod.on{display:block}
.box{max-width:1000px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--ombre);overflow:hidden}
.bhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:#1b2740;position:sticky;top:0;z-index:4}
.bhead h2{font-size:18px;flex:1}
.bhead .info{color:var(--dim);font-size:12.5px;text-align:right}
.fermer{font-size:22px;line-height:1;color:var(--dim);padding:0 4px}
.fermer:hover{color:var(--txt)}
.bbody{padding:18px}

/* ---------- Fiches d'indicateur ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi b{display:block;font-size:20px;color:var(--or);font-family:Georgia,serif;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.kpi small{display:block;font-size:11px;margin-top:3px}
.bloc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:14px}
.bloc h3{font-size:14px;color:var(--or);margin-bottom:11px;letter-spacing:.7px;text-transform:uppercase}
.si{margin-bottom:14px}
.si:last-child{margin-bottom:0}
.si .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:5px;gap:10px}
.si .t b{font-size:14px}
.si .d{font-size:11.5px;color:var(--dim);margin-top:4px}
.bar.gros{height:10px}
.courbe{width:100%;height:auto;display:block}
.cwrap{position:relative;background:#0c1220;border:1px solid var(--line);border-radius:10px;
  padding:12px 12px 8px}
.cinfo{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}

/* ---------- Classement ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--dim);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px;border-bottom:1px solid #22304a80}
.tbl tr.moi{background:#d9b26a1c}
.tbl tr.moi td{color:var(--or);font-weight:700}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .r{width:34px;color:var(--dim);font-family:Georgia,serif;font-size:15px}
.tbl tr.moi .r{color:var(--or)}
.iso{display:inline-block;min-width:28px;text-align:center;margin-right:8px;
  background:#0f1727;border:1px solid var(--line);border-radius:4px;padding:1px 4px;
  font-size:10.5px;letter-spacing:.6px;color:var(--dim);font-weight:700;vertical-align:1px}
.tbl tr.moi .iso{background:#d9b26a22;border-color:var(--or);color:var(--or)}

/* Toile des lois */
.toile{display:grid;grid-template-columns:1fr 320px;gap:18px}
@media(max-width:860px){.toile{grid-template-columns:1fr}}
.svgwrap{background:#0c1220;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  display:flex;justify-content:center;align-items:center}
svg.toilesvg{display:block;width:100%;height:auto;max-height:min(66vh,540px)}
.fil{stroke:#2b3a56;stroke-width:1.6;fill:none}
.fil.act{stroke:var(--or);stroke-width:2.4}
.fil.pont{stroke-width:1.4;stroke-dasharray:5 4;opacity:.45}
.fil.pont.act{stroke-width:2.2;stroke-dasharray:none;opacity:1}
.web{stroke:#1e2b42;stroke-width:1;fill:none}
.nd{cursor:pointer}
.nd circle{transition:.2s}
.nd:hover circle{stroke:var(--or);stroke-width:3}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px}
.detail h3{font-size:16px;margin-bottom:6px}
.detail .br{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--or);margin-bottom:8px}
.detail p{color:#c2cee2;font-size:13.5px;line-height:1.5}
.eff{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:#0f1727;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px}
.btn{width:100%;padding:11px;border-radius:9px;font-weight:600;background:var(--bleu);color:#fff;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{background:#26314a;color:#66748c;cursor:not-allowed}
.legende{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--dim)}
.legende span::before{content:'●';margin-right:4px}
@media(max-width:620px){
  .mod{padding:8px}
  .bhead{padding:11px 13px} .bhead h2{font-size:15.5px} .bhead .info{font-size:11px}
  .bbody{padding:13px}
  .svgwrap{overflow-x:auto;justify-content:flex-start}
  svg.toilesvg{min-width:470px;max-height:none}
}

/* Projets */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.pj{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.pj.en{border-color:var(--bleu)} .pj.fini{border-color:var(--vert);opacity:.75}
.pj h4{margin:0 0 5px;font-size:15px;font-family:Georgia,serif}
.pj p{color:var(--dim);font-size:12.5px;line-height:1.45;margin:0 0 10px}
.prog{height:6px;background:#0c121d;border-radius:4px;overflow:hidden;margin:9px 0}
.prog i{display:block;height:100%;background:var(--bleu);transition:width .4s}

/* Projets — accordéon par domaine */
.dom-acc{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden;background:var(--panel)}
.dom-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
  background:none;border:0;color:inherit;text-align:left;font:inherit}
.dom-head:hover{background:#141d2e}
.dom-head .dt{flex:1;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--or);font-weight:700}
.dom-head .dc{color:var(--dim);font-size:12px;letter-spacing:0;text-transform:none}
.dom-head .chev{color:var(--dim);font-size:11px;transition:transform .25s;flex:none}
.dom-acc.open .dom-head .chev{transform:rotate(90deg)}
.dom-body{display:none;padding:0 16px 16px}
.dom-acc.open .dom-body{display:block}

/* Budget */
.sl{margin-bottom:15px}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.sl label b{color:var(--or)}
.sl small{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}
input[type=range]{width:100%;accent-color:var(--or);height:20px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.deux{grid-template-columns:1fr}}
.solde{background:#0f1727;border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:6px}
.solde.colle{position:sticky;top:8px;z-index:3;box-shadow:var(--ombre);border-color:var(--or)}
.lg{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;gap:12px}
.lg.tot{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-weight:700}

/* Fin */
.fin{text-align:center;padding:34px 22px}
.fin .em{font-size:56px;margin-bottom:12px}
.fin h2{font-size:27px;margin-bottom:10px}
.fin p{color:#c2cee2;line-height:1.6;max-width:520px;margin:0 auto 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:20px 0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px}
.st b{display:block;font-size:20px;color:var(--or);font-family:Georgia,serif}
.st span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.vide{color:var(--dim);text-align:center;padding:26px;font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="blason">🇫🇷</div>
    <div class="ident">
      <div class="titre">Palais de l'Élysée</div>
      <div class="sous" id="date">—</div>
    </div>
    <button class="rang" onclick="ouvrirClassement()">
      <b id="rang">—</b>
      <span>puissance mondiale</span>
    </button>
  </div>
  <div class="jauges" id="jauges"></div>
</header>

<div class="wrap">
  <div id="bureau"></div>
  <div class="journal" id="journal" style="display:none">
    <h3>Note de service</h3>
    <div id="jrn"></div>
  </div>
  <button class="suite" id="suite">Passer au mois suivant →</button>
</div>

<nav class="nav"><div>
  <button onclick="ouvrirLois()"><b>📜</b>Lois<span class="pastille" id="pLois"></span></button>
  <button onclick="ouvrirProjets()"><b>🏗️</b>Projets<span class="pastille" id="pProj"></span></button>
  <button onclick="ouvrirBudget()"><b>💶</b>Budget</button>
  <button onclick="ouvrirBilan()"><b>📊</b>Bilan</button>
</div></nav>

<div class="mod" id="mod"><div class="box">
  <div class="bhead"><h2 id="mTitre"></h2><span class="info" id="mInfo"></span>
    <button class="fermer" onclick="fermer()">✕</button></div>
  <div class="bbody" id="mBody"></div>
</div></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   1. DONNÉES DE RÉFÉRENCE
   ══════════════════════════════════════════════════════════ */

const PIB0 = 2850;   // PIB français de départ, en milliards d'euros

/* Les quinze premières puissances. La France est pilotée par le joueur. */
const PAYS = [
  {n:"États-Unis",  d:"US", pib:29200, g:2.0},
  {n:"Chine",       d:"CN", pib:18700, g:4.0},
  {n:"Allemagne",   d:"DE", pib:4050,  g:1.0},
  {n:"Japon",       d:"JP", pib:3650,  g:0.5},
  {n:"Inde",        d:"IN", pib:3400,  g:6.0},
  {n:"Royaume-Uni", d:"GB", pib:3050,  g:1.4},
  {n:"France",      d:"FR", pib:PIB0,  g:null},
  {n:"Italie",      d:"IT", pib:2500,  g:0.8},
  {n:"Canada",      d:"CA", pib:2280,  g:1.6},
  {n:"Brésil",      d:"BR", pib:2230,  g:2.2},
  {n:"Russie",      d:"RU", pib:2150,  g:1.1},
  {n:"Corée du Sud",d:"KR", pib:1950,  g:2.2},
  {n:"Australie",   d:"AU", pib:1860,  g:2.0},
  {n:"Mexique",     d:"MX", pib:1820,  g:2.0},
  {n:"Espagne",     d:"ES", pib:1760,  g:2.4}
];
const IFR = PAYS.findIndex(p=>p.g===null);   // indice de la France

const BRANCHES = {
  social:      {nom:"Social",       ico:"❤️", col:"#c0455a"},
  securite:    {nom:"Sécurité",     ico:"🛡️", col:"#5b7fb5"},
  ecologie:    {nom:"Écologie",     ico:"🌍", col:"#4caf7d"},
  economie:    {nom:"Économie",     ico:"📈", col:"#d9b26a"},
  institutions:{nom:"Institutions", ico:"⚖️", col:"#9b7cc4"}
};

const GROUPES = {
  salaries: {nom:"Salariés",     ico:"👷", poids:.30},
  retraites:{nom:"Retraités",    ico:"👵", poids:.25},
  jeunes:   {nom:"Jeunes",       ico:"🎓", poids:.18},
  ruraux:   {nom:"Ruraux",       ico:"🌾", poids:.17},
  patrons:  {nom:"Entrepreneurs",ico:"💼", poids:.10}
};

/* Sous-indicateurs. `info` produit la métrique parlante affichée sous la barre.
   jg([c0, c25, c50, c75, c100], v) interpole linéairement entre cinq repères :
   v=0 crise · v=25 · v=50 la France d'aujourd'hui · v=75 · v=100 l'objectif atteint. */
function jg(pts, v){
  v = Math.max(0, Math.min(100, v));
  const seg = Math.min(3, Math.floor(v/25));
  const t = (v - seg*25) / 25;
  return pts[seg] + (pts[seg+1] - pts[seg]) * t;
}
const SEC = {
  interieure:{nom:"Sécurité intérieure",ico:"👮",
    txt:"Police, justice, délinquance du quotidien.",
    info:v=>[`${jg([23,18,13.4,8.5,3.5],v).toFixed(1)} atteintes aux personnes pour 1 000 habitants`,
             `${Math.round(jg([92,76,58,36,12],v))} % des Français se disent inquiets pour leur sécurité`]},
  defense:{nom:"Défense nationale",ico:"🎖️",
    txt:"Armées, dissuasion, capacité à peser.",
    info:v=>[`Effort de défense : ${jg([0.7,1.3,1.9,2.7,3.5],v).toFixed(2)} % du PIB`,
             `Capacité opérationnelle : ${Math.round(v)} / 100`]}
};
const CLI = {
  air:{nom:"Air & carbone",ico:"💨",
    txt:"Émissions, qualité de l'air respiré.",
    info:v=>[`${Math.round(jg([600,505,400,260,110],v))} Mt de CO₂ émises par an`,
             `${Math.round(jg([52,39,25,12,1],v))} jours de pics de pollution par an`]},
  eau:{nom:"Eau",ico:"💧",
    txt:"Ressource, nappes, cours d'eau.",
    info:v=>[`${Math.round(jg([8,25,44,68,94],v))} % des cours d'eau en bon état`,
             `${Math.round(jg([62,46,28,13,0],v))} départements en restriction l'été`]},
  foret:{nom:"Forêts & biodiversité",ico:"🌳",
    txt:"Couvert forestier, espèces protégées.",
    info:v=>[`${jg([24,27.5,31.4,36,42],v).toFixed(1)} % du territoire boisé`,
             `Indice de biodiversité : ${Math.round(v)} / 100`]},
  sols:{nom:"Sols & agriculture",ico:"🌾",
    txt:"Artificialisation, qualité des terres.",
    info:v=>[`${nb(Math.round(jg([46000,35000,24000,12000,2000],v)/500)*500)} hectares artificialisés par an`,
             `${Math.round(jg([2,6,12,26,48],v))} % de la surface agricole en bio`]}

{id:"c1", ch:1, mois:1, ico:"🏛️", t:"Le premier Conseil",
 d:`Sept heures moins le quart, salle Murat. Vous êtes assis à cette table depuis dix minutes
    et vous avez déjà oublié la moitié des noms. Vingt-deux ministres, dont six que vous
    n'aviez jamais rencontrés avant la semaine dernière, et qui vous observent comme on
    regarde quelqu'un dont on attend qu'il commence.<br><br>
    Le secrétaire général — lui, vous le connaissez, il servait déjà votre prédécesseur —
    pose trois chemises cartonnées devant vous. Une bleue, une grise, une noire. « Un plan
    de relance sociale, un plan d'économies, un plan sécurité. Ils sont prêts, tous les
    trois : financés, rédigés, prêts à passer en Conseil. »<br><br>
    Il marque un temps. « Vous en ouvrez une ce matin. Une seule. Celle que vous choisissez,
    les rédactions en feront votre ligne, et vous la porterez cinq ans, quoi que vous
    fassiez ensuite. Prenez le temps du café. »<br><br>
    Dehors, dans la cour d'honneur, les perches des caméras dépassent déjà des grilles.`,
 o:[
  {l:"Ouvrir le plan de relance sociale",
   r:`Vous poussez la chemise bleue au centre de la table. Le secrétaire général la ramasse
      sans un mot et sort la faire parapher.<br><br>
      À midi, les trois chaînes d'info affichent le même bandeau : « Le président choisit le
      social. » Les syndicats saluent un signal fort ; le Medef publie quatre lignes qui
      commencent par « nous prenons acte » et se terminent par « nous serons attentifs au
      financement ». Deux formules pour dire la même inquiétude.<br><br>
      Le seul à n'avoir rien dit, c'est le directeur du Budget. En quittant la salle, il
      s'est arrêté à votre hauteur, a demandé un rendez-vous « dans le courant du mois
      prochain », et il est reparti sans attendre la réponse. Vous notez la date dans un
      coin de votre tête. Vous comprendrez bientôt ce qu'il y avait derrière ce silence.`,
   e:{soc:{pouvoir:16,pauvrete:12},budget:-9,groups:{salaries:9,jeunes:7,patrons:-7}},
   axe:{social:2}, pose:"ligne_sociale"},
  {l:"Ouvrir le plan d'économies",
   r:`Vous choisissez la chemise grise. Le ministre de l'Économie hoche la tête ; deux
      autres, autour de la table, baissent les yeux vers leurs dossiers.<br><br>
      À l'ouverture, la Bourse de Paris prend 1,4 %. Trois éditorialistes emploient le même
      mot dans la journée : « courage ». Vos conseillers en communication sont ravis — un
      président sérieux, dès le premier matin.<br><br>
      Le soir, dans un dépôt de bus de Bobigny, une intersyndicale se réunit pour la
      première fois depuis quatre ans. Ils ne sont qu'une douzaine, dans une salle de
      réunion trop grande, autour d'un thermos. Ils ne savent pas encore exactement ce
      qu'ils vont faire. Mais ils sont d'accord sur un point : ça ne se passera pas comme
      ça.`,
   e:{budget:11,economie:7,cac:4,soc:{pouvoir:-10},groups:{patrons:12,salaries:-9,retraites:-6}},
   axe:{social:-2}, pose:"ligne_liberale"},
  {l:"Ouvrir le plan sécurité",
   r:`Vous prenez la chemise noire. Le ministre de l'Intérieur, qui ne s'y attendait pas, se
      lève à demi pour vous serrer la main devant tout le Conseil. Un geste que la salle
      remarque.<br><br>
      Dans l'heure, les syndicats de police publient un communiqué chaleureux : « enfin un
      pouvoir qui nous fait confiance ». Trois associations de défense des libertés
      publient le leur, plus court : « nous serons vigilantes. »<br><br>
      Elles le seront. L'une d'elles a déjà déposé une demande d'audience et prévenu qu'elle
      publierait un rapport tous les six mois sur l'application du plan. Vous venez de vous
      donner un allié bruyant et un contrôleur permanent, le même matin.`,
   e:{sec:{interieure:18,defense:6},budget:-6,groups:{retraites:9,ruraux:8,jeunes:-8}},
   axe:{autorite:2}, pose:"ligne_autorite"}
 ]},

{id:"m2", ch:1, mois:2, ico:"📡", t:"L'otage",
 d:`Elle s'appelle Hélène Roux, elle a quarante et un ans, elle est infirmière. Elle a été
    enlevée il y a neuf jours sur une piste du Sahel, entre deux dispensaires.<br><br>
    Ce matin, une vidéo de quatre-vingt-dix secondes. Elle lit un texte qu'on lui a écrit,
    la voix plate, le regard à côté de la caméra. À la fin, elle ajoute trois mots qui ne
    sont pas dans le texte, et elle les dit vite : « Ne payez pas. »<br><br>
    La cellule de crise siège depuis l'aube. Le chef d'état-major estime les chances de
    réussite d'un assaut à « un peu moins d'une sur deux ». Le négociateur, lui, demande du
    temps — six semaines — et de l'argent : neuf millions, versés par un intermédiaire, sans
    trace.<br><br>
    Hier soir, la fille d'Hélène Roux, dix-sept ans, a parlé à la télévision. Elle n'a pas
    pleuré. Elle a dit votre nom, une fois, et elle a demandé ce que vous comptiez faire.`,
 o:[
  {l:"Autoriser l'assaut des forces spéciales",
   r:`L'ordre part à minuit. L'assaut a lieu à quatre heures du matin, heure de Paris, et
      dure onze minutes.<br><br>
      Elle est vivante. Déshydratée, un poignet fracturé, mais vivante. Deux ravisseurs
      tués, aucune perte française — c'est ce que dit le premier communiqué. Vous la voyez
      descendre de l'avion à Villacoublay le lendemain, une couverture sur les épaules.
      Elle ne vous regarde pas.<br><br>
      Trois jours plus tard, une information sort que personne n'avait communiquée : un
      opérateur du commando a été gravement blessé au visage pendant l'intervention. Il ne
      reprendra pas le service. Le silence de trois jours autour de sa blessure vous sera
      reproché plus longtemps que l'assaut lui-même.`,
   e:{sec:{defense:16,interieure:4},social:-5,
      groups:{retraites:9,ruraux:8,jeunes:-7,salaries:-4}},
   axe:{autorite:2}, pose:"posture_fiere"},
  {l:"Négocier discrètement, par un pays tiers",
   r:`Six semaines. Elle rentre un mardi, à l'aube, dans un avion sans marquage, sans photo,
      sans communiqué.<br><br>
      Officiellement, la France ne verse pas de rançon. Officieusement, un partenaire
      régional a payé une somme que personne ne confirmera jamais — le rapport annuel d'une
      ONG l'estimera, un an plus tard, à neuf millions d'euros, et cette ligne restera sans
      démenti.<br><br>
      Vous n'avez pas menti : aucun euro public n'est sorti. Vous n'avez pas dit la vérité
      non plus. Hélène Roux, elle, ne fera aucune déclaration. Sa fille publiera une seule
      phrase, des mois après : « Merci à ceux qui ont fait ce qu'il fallait, quoi que ce
      soit. »`,
   e:{budget:-9,sec:{defense:-4},economie:3,
      groups:{salaries:8,jeunes:6,patrons:4}},
   pose:"posture_europeenne"},
  {l:"Rendre l'affaire publique et refuser toute rançon",
   r:`Vous parlez à vingt heures, quatre minutes, sans détour. Vous dites le mot « rançon »,
      le mot « jamais », et vous citez les trois mots qu'elle a ajoutés à la fin de la
      vidéo.<br><br>
      Le pays vous suit — les sondages du lendemain sont sans appel, on approuve la
      fermeté. Les analystes parlent de doctrine assumée, de message envoyé aux
      preneurs d'otages.<br><br>
      Sa fille publie un message d'une ligne à vingt-deux heures : « Il a choisi le
      principe. Moi je choisis ma mère. » Dix-sept ans, et elle vient de résumer la
      tension de tout votre mandat mieux que n'importe lequel de vos conseillers. Hélène
      Roux est toujours au Sahel.`,
   e:{sec:{defense:8},social:6,groups:{jeunes:9,salaries:6,retraites:-6}},
   pose:"posture_climat", rival:-5}
 ]},

{id:"m3", ch:1, mois:3, ico:"🕯️", t:"Le fait divers",
 intro:[
  [()=>S.flags.posture_fiere, `Vous rentrez d'un sommet avec une petite phrase qui a bien
    tourné. Le pays, lui, n'a pas regardé le sommet.`],
  [()=>S.flags.posture_climat, `Votre discours sur le climat a tenu la une deux jours. Le
    troisième, c'est autre chose qui l'a prise.`],
  [()=>S.flags.ligne_autorite, `Vous aviez promis la fermeté dès le premier jour. On va
    vous demander des comptes plus vite que prévu.`]
 ],
 d:`Elle s'appelait Nadia, elle avait vingt-trois ans, elle était institutrice remplaçante.
    Son ancien compagnon l'a tuée un dimanche soir, sur le parking de l'école où elle
    travaillait.<br><br>
    Elle avait porté plainte trois fois en dix-huit mois. Les trois plaintes dormaient dans
    une armoire d'un commissariat de sous-préfecture — faute de temps, faute d'effectifs,
    faute d'avoir pris la menace au sérieux. La dernière datait de six semaines.<br><br>
    En quarante-huit heures, le fait divers est devenu un procès : celui de la police, de
    la justice, et un peu le vôtre. La sœur de Nadia enchaîne les plateaux depuis ce matin.
    Elle est redoutable — calme, précise, elle ne pleure pas, elle cite des dates.<br><br>
    Votre garde des Sceaux attend une réponse avant midi. Pas des condoléances : une
    décision sur ce que l'État change, et à quelle vitesse.`,
 o:[
  {l:"Ordonner un audit national des plaintes classées",
   r:`Quatre-vingt-douze mille dossiers rouverts en trois mois. L'inspection générale rend
      un premier état des lieux en six semaines, et il est mauvais : dans un cas sur cinq,
      la procédure prévue par la loi n'a pas été suivie.<br><br>
      Les syndicats de police dénoncent « une suspicion généralisée jetée sur toute une
      profession » et menacent d'un mouvement. Vous tenez bon.<br><br>
      La sœur de Nadia, elle, ne parle plus aux caméras. Elle envoie une lettre manuscrite
      à l'Élysée, deux pages, où elle écrit qu'elle ne sait pas si ça servira à quelqu'un
      d'autre, mais qu'au moins ce ne sera pas passé sous silence. Vous gardez la lettre
      dans un tiroir de votre bureau. Elle y est toujours à la fin de votre mandat.`,
   e:{budget:-7,sec:{interieure:16},soc:{pauvrete:8},groups:{salaries:9,jeunes:8}},
   pose:"audit_plaintes"},
  {l:"Recevoir la famille, à huis clos",
   r:`Une heure quarante dans le salon vert. Pas de photographe, pas de compte rendu, aucune
      fuite — ce qui, ce mois-ci, est peut-être votre seule réussite parfaite.<br><br>
      Vous écoutez surtout. La sœur de Nadia a apporté un classeur : les mains courantes,
      les récépissés de plainte, les SMS de menace imprimés. Elle vous les fait lire, un
      par un, sans commentaire.<br><br>
      En sortant, elle s'arrête devant les journalistes massés dans la cour. « Il a écouté.
      On verra ce qu'il fait. » Ce n'est pas un blanc-seing, c'est un sursis. Vous avez
      gagné quelques semaines de patience de la part d'une femme qui n'en avait aucune
      raison de vous en accorder.`,
   e:{social:6,groups:{salaries:7,retraites:6,jeunes:5}},
   pose:"empathie"},
  {l:"Annoncer un durcissement pénal immédiat",
   r:`Le texte est prêt en dix jours — un record, et ça se voit. Peines planchers pour les
      violences conjugales, comparution immédiate élargie, bracelet anti-rapprochement
      généralisé.<br><br>
      Vous gagnez douze points chez les plus de soixante ans dans la semaine. Les plateaux
      parlent d'un président qui agit.<br><br>
      Deux choses vous rattraperont. En juin, le Conseil constitutionnel censure deux
      articles sur sept pour disproportion des peines. Et la sœur de Nadia, qui n'a pas été
      consultée, déclare à la télévision qu'on s'est servi de sa sœur pour faire passer un
      texte préparé depuis longtemps. Les deux phrases circuleront ensemble.`,
   e:{sec:{interieure:20},social:-5,groups:{retraites:12,ruraux:9,jeunes:-7}},
   axe:{autorite:2}, pose:"durcissement"}
 ]},

    magistrats, greffiers, bracelets. Bercy a fait l'addition.`]
 ],
 d:`Bercy, sixième étage, dix-huit heures. Le directeur du Trésor est venu avec deux
    documents. Il pose le premier sur la table : celui qu'il a transmis à la presse la
    semaine dernière, la version publique, celle où tout va à peu près.<br><br>
    Puis il pose le second, une seule page, qu'il garde du bout des doigts. « Les
    prévisions de croissance sur lesquelles votre programme a été chiffré étaient
    optimistes. De sept milliards d'euros. » Il vous laisse le temps de lire. « Personne ne
    vous a menti pendant la campagne, monsieur le Président. Simplement, personne n'a voulu
    être celui qui vous dirait ça. »<br><br>
    Sept milliards, ça se rattrape — mais pas en silence, et pas sans que quelqu'un le
    paie. Dehors, il pleut sur la Seine. Le directeur attend une consigne avant de partir.`,
 o:[
  {l:"Rendre le trou public dès demain",
   r:`Conférence de presse à onze heures. Un tableau projeté, sept milliards écrits en
      toutes lettres, et une phrase : « On m'a remis des chiffres. Ils étaient faux. Voici
      les vrais. » Vous ne désignez personne nommément.<br><br>
      Les marchés perdent 2 % dans la matinée, puis se reprennent en fin de journée — les
      investisseurs préfèrent une mauvaise nouvelle dite tôt à une bonne nouvelle démentie
      plus tard.<br><br>
      Le sondage du surlendemain donne un résultat que vos conseillers n'arrivent pas à
      interpréter : 61 % des Français vous trouvent « plus honnête que ses prédécesseurs »,
      et 58 % « moins compétent ». Vous porterez les deux étiquettes en même temps, tout le
      mandat.`,
   e:{budget:4,economie:-4,cac:-4,social:6,groups:{jeunes:9,salaries:6,patrons:-5}},
   pose:"franchise", rival:-6},
  {l:"Combler discrètement, sans rien annoncer",
   r:`Trois nuits d'arbitrages, deux gels de crédits, une réserve de précaution qu'on ne
      reconstituera pas. Le trou est comblé sans qu'aucun titre ne l'annonce.<br><br>
      Presque. Douze jours plus tard, en page 14 d'un quotidien du soir, une brève de
      quinze lignes signée Camille Reyes : « Sept milliards manquants, comblés en silence. »
      L'article ne dit rien de faux et rien de spectaculaire. Il prouve simplement qu'elle
      regardait, et qu'elle a des sources jusque dans les couloirs de Bercy.<br><br>
      Vous rangez la coupure dans une chemise que vous n'ouvrirez plus. À partir de ce
      jour, chaque fois qu'un dossier sensible circulera, vous vous demanderez qui elle
      connaît dans la pièce.`,
   e:{budget:6,soc:{pouvoir:-8},groups:{salaries:-6,retraites:-5}},
   pose:"silence", rival:5},
  {l:"Maintenir le programme et emprunter",
   r:`Vous refusez d'arbitrer. Les engagements de campagne seront tenus, intégralement,
      financés par l'emprunt. « On ne coupe pas dans les promesses au bout de quatre
      mois. »<br><br>
      Vos électeurs applaudissent. Vos économistes, moins : trois d'entre eux publient une
      tribune commune la semaine suivante, où le mot « imprudence » revient deux fois.<br><br>
      Onze jours plus tard, une agence de notation place la France sous « perspective
      négative ». Ce n'est pas une dégradation, c'est un avertissement — poli, à en-tête,
      trois paragraphes. Vous le lisez une fois et vous le rangez. Votre successeur, lui,
      le relira ligne par ligne en s'installant dans ce bureau.`,
   e:{dette:8,soc:{pouvoir:10},groups:{salaries:8,jeunes:7,patrons:-8}},
   axe:{social:1}, pose:"emprunt"}
 ]},

{id:"m5", ch:1, mois:5, ico:"🚜", t:"Le déplacement",
 intro:[
  [()=>S.axes.autorite>=3, `Le service d'ordre a doublé ses effectifs depuis vos annonces
    sécuritaires. Ça se voit, et les gens le voient.`],
  [()=>S.flags.silence, `Vous n'avez rien dit sur le trou budgétaire. La presse locale, elle,
    a fait le calcul, et elle sera là.`],
  [()=>S.flags.franchise, `Vous avez tout dit sur les comptes le mois dernier. On vous en
    veut un peu, on vous respecte un peu. On verra ce qui l'emporte.`],
  [()=>S.flags.ligne_sociale, `La maire vous accueille avec le sourire : votre plan de
    relance a sauvé deux classes dans le canton.`]
 ],
 d:`Une commune de onze cents habitants, choisie par vos équipes parce qu'elle est
    « représentative » — ce qui veut dire qu'elle va mal comme tout le monde. La maire vous
    fait visiter l'école, où une classe ferme à la rentrée, et la maison de santé, vide,
    qui n'a pas trouvé de médecin depuis deux ans malgré trois annonces.<br><br>
    Derrière les barrières Vauban, une centaine de personnes. La moitié applaudit, l'autre
    non. Un homme, la cinquantaine, casquette, se détache et lance une phrase que les
    perches captent parfaitement : « Vous êtes venu pour la photo ! »<br><br>
    Un silence. Les caméras se tournent vers vous, puis vers lui, puis vers vous. Le chef
    du service d'ordre s'est rapproché d'un pas et attend votre signe pour vous ramener
    vers la voiture. Vous avez trois secondes pour décider quel genre de président les
    Français verront ce soir au journal.`,
 o:[
  {l:"Aller lui parler, seul, devant les caméras",
   r:`Vous écartez le service d'ordre de la main et vous marchez vers lui. Il crie encore
      quelques secondes, puis il s'arrête — personne ne crie longtemps face à quelqu'un qui
      s'est tu pour écouter.<br><br>
      La conversation dure neuf minutes, sous les micros. Il s'appelle Patrick, il est
      cariste de nuit dans un entrepôt logistique, cinquante kilomètres aller-retour chaque
      soir, et son gasoil a pris quarante euros au mois. Il ne demande pas grand-chose : il
      veut être sûr que quelqu'un, en haut, sait que ça existe.<br><br>
      La séquence tourne en boucle au journal de vingt heures. Pour une fois, elle ne vous
      dessert pas — au contraire. Vos conseillers, eux, ont eu très peur pendant neuf
      minutes.`,
   e:{social:8,groups:{ruraux:14,salaries:8,jeunes:5}},
   pose:"courage_terrain", rival:-7},
  {l:"Répondre par une annonce : un plan communes rurales",
   r:`Vous coupez court à l'incident par une annonce, faite sur place, au micro : deux
      milliards d'euros, cent quatre-vingts mesures, un plan pour les territoires ruraux.<br><br>
      Le nom du plan sera oublié dans six mois. Les maires ruraux, eux, n'oublieront pas :
      c'est la première fois depuis longtemps qu'on leur promet un chiffre. Reste à le
      verser. L'Association des maires de France a déjà annoncé qu'elle publierait, chaque
      année, un décompte des sommes réellement engagées face aux sommes promises.<br><br>
      Vous venez de créer votre propre juge de paix. S'il manque un euro dans trois ans, ce
      sera écrit noir sur blanc, avec votre nom en haut de la page.`,
   e:{budget:-12,soc:{sante:10,educ:8},groups:{ruraux:16,salaries:4}},
   pose:"plan_rural"},
  {l:"Remonter en voiture et tenir le programme",
   r:`Vous faites un signe de tête au chef du service d'ordre. La visite se termine dans les
      temps, la portière se referme, le cortège s'éloigne.<br><br>
      L'image fait onze secondes au journal de vingt heures : un homme qui crie derrière une
      barrière, une berline noire qui part. Aucun commentaire n'est nécessaire, le montage
      dit tout.<br><br>
      Ces onze secondes seront rediffusées à chacune de vos crises pendant cinq ans. Vos
      adversaires n'auront jamais besoin d'en fabriquer d'autres : vous leur avez donné
      celle-là, un mardi après-midi, dans une commune de onze cents habitants dont personne
      ne retiendra le nom.`,
   e:{groups:{ruraux:-11,salaries:-5,jeunes:-4}},
   pose:"evitement", rival:8}
 ]},

{id:"m6", ch:1, mois:6, ico:"📜", t:"Le premier texte",
 intro:[
  [()=>S.flags.evitement, `On n'a pas oublié la berline. La séquence tourne encore, et vos
    députés se la font resservir dans chaque circonscription.`],
  [()=>S.flags.courage_terrain, `L'image de vous, seul face à cet homme, a fait plus pour
    votre majorité que trois mois de communication. Elle tient mieux qu'avant.`],
  [()=>S.flags.plan_rural, `Votre plan pour les communes rurales a rallié une quinzaine de
    députés du centre. Vous en aurez besoin ce soir.`]
 ],
 d:`Votre première grande loi arrive dans l'hémicycle. Quatorze cents amendements, dont neuf
    cents déposés par une opposition qui ne cherche pas à améliorer le texte mais à le
    noyer sous le nombre — un amendement de suppression par virgule, débattu, mis aux voix,
    rejeté, recommencé.<br><br>
    Votre majorité tient à quatre voix. Le président de votre groupe vient vous voir dans le
    bureau derrière l'hémicycle : « On peut tenir trois nuits. Au-delà, les nôtres
    commencent à rentrer dormir chez eux, et là, on perd un vote sur deux. Faites vos
    comptes. »<br><br>
    Julien Ferrand, lui, a annoncé qu'il siégerait jusqu'au bout, jour et nuit, banc au
    premier rang. Il n'a presque pas pris la parole. Il attend le moment où vous
    trébucherez, et il veut être là quand ça arrivera.`,
 o:[
  {l:"Négocier avec les centristes, quitte à vider le texte",
   r:`Trente-six heures de tractations dans les couloirs, café après café. Le texte passe à
      quatre-vingt-onze voix — un score confortable — mais amputé de ses deux articles les
      plus ambitieux, ceux qui faisaient de cette loi autre chose qu'un aménagement.<br><br>
      Vous avez une loi. Vous n'avez pas la loi que vous vouliez, et votre propre camp le
      sait : trois députés de votre majorité se sont abstenus en le disant à la tribune,
      poliment, mais devant les caméras.<br><br>
      Ferrand n'a rien dit. Il a juste laissé passer, en quittant l'hémicycle, une phrase
      qu'un journaliste a notée : « Il négocie déjà. Au bout de six mois. »`,
   e:{budget:-5,economie:4,social:3,groups:{patrons:7,salaries:-4}},
   pose:"negociateur"},
  {l:"Tenir les trois nuits et faire voter le texte entier",
   r:`Soixante-douze heures. Quatorze cents amendements examinés un par un. La séance
      s'achève à cinq heures vingt du matin, sous les néons, dans un hémicycle à moitié
      vide où vos députés sont restés jusqu'au dernier.<br><br>
      Le texte passe entier, à six voix. Vos parlementaires sortent épuisés et fiers — un
      mélange rare et précieux, qui soude un groupe pour un moment.<br><br>
      Dans les rédactions, on commence à écrire que vous êtes capable de tenir. C'est un
      capital politique réel. Comme tous les capitaux, il ne sert qu'une fois qu'on
      accepte de le dépenser, et il ne se reconstitue pas vite.`,
   e:{social:5,economie:5,groups:{salaries:7,jeunes:6,patrons:-4}},
   pose:"tenu_bon", rival:-5},
  {l:"Engager la responsabilité du gouvernement",
   r:`Le Premier ministre monte à la tribune à seize heures dix et lit les quatre lignes
      réglementaires. La séance est suspendue trois fois dans les huées. Le texte est
      adopté sans vote.<br><br>
      Le soir même, huit mille personnes place de la Concorde — ce qui, objectivement, est
      peu. Mais le mot est lâché. Il est dans tous les titres du lendemain, il est repris
      par Ferrand à chaque déplacement, et il ne vous quittera plus de tout le mandat :
      passage en force.<br><br>
      Vous avez votre loi, complète, en six mois. Vous avez aussi appris à votre majorité
      qu'on pouvait se passer d'elle.`,
   e:{economie:7,budget:4,social:-9,groups:{salaries:-10,jeunes:-9,patrons:9}},
   axe:{autorite:2}, pose:"49_3_precoce", rival:12}
 ]},

/* ─────────── mois 7 · la première épreuve, selon votre ligne ─────────── */
{id:"c2soc", ch:2, mois:7, si:()=>S.flags.ligne_sociale, ico:"🧾", t:"La facture",
 d:`Cinq mois que l'argent de la relance coule. Ce matin, le directeur du Budget est venu
    sans rendez-vous — ça ne lui arrive jamais. Il n'a pas apporté de dossier, juste une
    feuille A4, pliée en deux dans sa poche intérieure.<br><br>
    « À ce rythme, nous empruntons pour financer les mesures que vous avez annoncées en
    janvier. Ce n'est pas illégal, ce n'est pas dramatique cette année. Mais les marchés
    ont commencé à poser des questions, et je n'ai pas toujours de bonne réponse. »<br><br>
    Il hésite, puis ajoute : « Et il y a une journaliste de la rédaction économique qui
    pose exactement les mêmes questions que les marchés. Elle a les mêmes chiffres que moi.
    Je ne sais pas comment. »<br><br>
    Elle s'appelle Camille Reyes. Vous entendez ce nom pour la première fois. Retenez-le.`,
 o:[
  {l:"Assumer le coût publiquement",
   r:`Vous prenez les devants. En ouverture d'une conférence de presse où personne
      n'attendait le sujet, vous donnez vous-même les chiffres : ce que la relance a coûté,
      ce qu'elle a rapporté, ce qui reste à financer.<br><br>
      L'exercice vous vaut une matinée de commentaires acides sur votre « improvisation
      budgétaire ». Il vous rapporte aussi quelque chose de moins visible : Camille Reyes
      range l'article qu'elle préparait. Elle en écrira un autre, plus tard, sur un autre
      sujet — et cette fois, elle vous appellera la veille pour vous prévenir. Vous ne
      saurez jamais si c'est du respect ou du calcul. Les deux, probablement.`,
   e:{budget:-4,soc:{pouvoir:10},groups:{salaries:8,jeunes:6,patrons:-8}},
   axe:{social:1}, pose:"franchise"},
  {l:"Créer un impôt exceptionnel sur les hauts patrimoines",
   r:`Une contribution exceptionnelle : 3 % au-dessus de dix millions d'euros de patrimoine,
      votée en urgence, présentée comme un effort de solidarité limité à deux ans.<br><br>
      Le rendement est réel — quatre milliards la première année. La fuite aussi : Bercy
      recense quatre cents dossiers de départ fiscal en six semaines, chiffre transmis sans
      commentaire dans une note que vous auriez préféré ne pas lire.<br><br>
      Julien Ferrand tient son sujet pour tout le trimestre. Il ne parle plus que de ça,
      dans chaque interview : « la France qui fait fuir ceux qui investissent ». C'est
      injuste, c'est efficace, et vous n'avez pas de contre-argument court.`,
   e:{budget:12,economie:-6,cac:-7,groups:{patrons:-16,salaries:9,jeunes:6}},
   axe:{social:2}, rival:6},
  {l:"Retarder discrètement l'application des mesures",
   r:`Un décret d'application qui ne sort pas. Une circulaire qui se perd entre deux
      ministères. Deux dispositifs repoussés « pour raisons techniques » dont personne
      n'est dupe.<br><br>
      Les associations s'en aperçoivent en avril, dossier par dossier. En mai, onze
      organisations signent une tribune commune. Le titre tient en un mot : « Trahison. »<br><br>
      Ce mot ne quittera plus le vocabulaire de ceux qui vous ont fait élire. Chaque fois
      que vous annoncerez une mesure sociale, désormais, quelqu'un demandera : « Et
      celle-là, elle sera appliquée ? » Vous avez économisé de l'argent et dépensé votre
      crédit auprès des seuls qui vous en accordaient.`,
   e:{budget:8,soc:{pouvoir:-12,pauvrete:-8},groups:{salaries:-11,jeunes:-9}},
   axe:{social:-1}, pose:"promesse_trahie", rival:10}
 ]},

{id:"c2eco", ch:2, mois:7, si:()=>S.flags.ligne_liberale, ico:"🏭", t:"Les corps intermédiaires",
 d:`Le plan d'économies a un nom de code, un calendrier, et déjà une liste d'ennemis. Les
    préfets font remonter la même note depuis trois semaines, dans les mêmes termes : les
    collectivités ne suivront pas.<br><br>
    Dans le salon vert, huit présidents de région vous attendent. Le doyen prend la parole
    avant même que vous soyez assis : « Vous coupez nos dotations de douze pour cent. Nous
    n'avons pas le choix : nous fermerons des lignes de bus, des crèches, des piscines. Et
    à chaque fermeture, nous dirons à qui la faute. Ce sera écrit sur la porte. »<br><br>
    Derrière eux, adossé à la cheminée, un homme se tait et sourit légèrement. Julien
    Ferrand, président du Grand Est, qui n'a pas demandé la parole et n'en a pas besoin.
    Il est venu regarder.`,
 o:[
  {l:"Maintenir les coupes, sans exception",
   r:`Douze pour cent, appliqués partout, à la ligne près. À la rentrée : cent quarante
      lignes de bus supprimées, dix-sept crèches fermées, et chaque fermeture accompagnée
      d'un communiqué de la mairie ou du conseil régional qui vous nomme personnellement.<br><br>
      Julien Ferrand fait le tour des communes concernées, une par une, avec un tableau
      imprimé sous le bras. Il ne parle pas de lui, ne fait pas de meeting. Il lit vos
      chiffres à voix haute, devant la crèche fermée, et il laisse les habitants tirer la
      conclusion. C'est la méthode la plus lente et la plus dévastatrice qui soit.`,
   e:{budget:10,soc:{pouvoir:-10,sante:-8},groups:{ruraux:-13,salaries:-8,patrons:9}},
   axe:{autorite:1,social:-1}, rival:12},
  {l:"Négocier un contrat par région",
   r:`Huit contrats, huit trajectoires différentes, huit signatures étalées sur quatre
      mois. Une région garde ses transports contre un effort sur le personnel, une autre
      l'inverse.<br><br>
      C'est laborieux, illisible dans la presse, impossible à résumer en un titre. Et ça
      fonctionne : l'effort budgétaire est bien réel, mais aucune région ne peut se poser
      en victime d'un sacrifice imposé. Les préfets vous en sont reconnaissants d'une
      manière qu'ils ne diront jamais en public.<br><br>
      Ferrand a signé comme les autres. En sortant, à un journaliste qui lui tendait un
      micro, il a simplement répondu : « On a discuté. C'est déjà ça. »`,
   e:{budget:2,economie:4,groups:{ruraux:6,patrons:5}},
   axe:{social:0}, pose:"negociateur"},
  {l:"Reculer et préserver les dotations",
   r:`Vous renoncez aux coupes sur les collectivités. Les huit présidents de région sortent
      de l'Élysée en souriant ; l'un d'eux glisse aux caméras que « le dialogue a fini par
      payer ».<br><br>
      Dans votre propre camp, le mot qui circule le lendemain est moins aimable. On parle
      d'un président qui « annonce, puis retire ». C'est la deuxième fois en sept mois —
      après la loi vidée de moitié. Vos députés commencent à tenir un décompte, à
      moitié pour rire, à moitié sérieusement.`,
   e:{budget:-8,groups:{ruraux:11,salaries:5,patrons:-9}},
   axe:{social:1}, pose:"recul_precoce", rival:7}
 ]},

{id:"c2sec", ch:2, mois:7, ico:"🚔", t:"Le contrôle de trop",
 d:`Une vidéo de quarante secondes tourne depuis hier soir. Un contrôle d'identité qui
    dérape, un homme plaqué au sol, trois policiers, une voix off qui commente. Onze
    millions de vues à midi.<br><br>
    Votre ministre de l'Intérieur est venu vous voir avec l'expression « séquence
    tronquée » toute prête. Le procureur, lui, a déjà ouvert une enquête pour violences.
    Et devant le commissariat du quartier, deux cents personnes se sont assises par terre,
    en silence, sans slogan — ce qui est plus difficile à filmer et plus difficile à
    disperser.<br><br>
    Camille Reyes a appelé le cabinet en fin de matinée. Elle a retrouvé deux autres
    vidéos du même équipage, sur les six derniers mois. Elle les publie jeudi, quoi que
    vous fassiez d'ici là.`,
 o:[
  {l:"Suspendre les policiers, et l'annoncer",
   r:`Trois suspensions conservatoires, annoncées à dix-huit heures, avant même les
      conclusions de l'IGPN. Vous précisez : « conservatoire ne veut pas dire coupable,
      ça veut dire qu'on regarde. »<br><br>
      Le quartier se calme dans la nuit. Le sit-in se lève de lui-même le lendemain matin.<br><br>
      Les syndicats de police, eux, appellent à un rassemblement devant tous les
      commissariats de France et emploient un mot que vous entendrez souvent : « lâchage ».
      Vous avez choisi un camp cet après-midi. Les deux camps l'ont entendu, et aucun des
      deux ne l'oubliera.`,
   e:{sec:{interieure:-8},soc:{pauvrete:10},groups:{jeunes:13,retraites:-7,ruraux:-6}},
   axe:{autorite:-1}, pose:"franchise"},
  {l:"Soutenir les forces de l'ordre sans réserve",
   r:`« Nos policiers font un métier difficile, dans des conditions difficiles, et je ne les
      laisserai pas juger sur quarante secondes coupées au montage. » La phrase est nette,
      elle est reprise partout, elle vous vaut une ovation debout au congrès d'un syndicat
      de police.<br><br>
      Jeudi, Camille Reyes publie les deux autres vidéos. Le même équipage, les mêmes
      gestes, à deux mois d'intervalle. Vous ne le saviez pas quand vous avez parlé — mais
      ça, personne ne le croira. On retiendra que vous avez défendu, sans savoir, des
      hommes qui recommençaient.`,
   e:{sec:{interieure:12},social:-7,groups:{retraites:10,ruraux:9,jeunes:-16}},
   axe:{autorite:2}, rival:5, pose:"ligne_ferme"},
  {l:"Renvoyer à l'enquête et ne rien dire",
   r:`« La justice fera son travail. » Vous répétez la formule, mot pour mot, quatre fois en
      trois jours, à quatre journalistes différents.<br><br>
      Elle ne fâche personne et ne rassure personne. Le sit-in devant le commissariat dure
      onze jours de plus, faute d'interlocuteur — les gens ne partent pas parce qu'il n'y a
      personne à qui parler.<br><br>
      Dans les rédactions, une petite phrase commence à revenir à votre sujet : « il ne
      tranche pas ». Après le fait divers du mois dernier, après la loi négociée, ça
      s'accumule. C'est une réputation qui s'installe en quelques semaines et qui met des
      années à se défaire.`,
   e:{groups:{jeunes:-8,retraites:-4,salaries:-5}},
   axe:{autorite:0}, pose:"silence", rival:9}
 ]},

{id:"m8", ch:2, mois:8, ico:"🌡️", t:"Le mois d'août",
 intro:[
  [()=>S.flags.budget_ecolo||S.axes.ecologie>=2, `Vous avez mis l'écologie au centre. Cet
    été-là va dire si c'était de la conviction ou de la communication.`],
  [()=>S.flags.posture_climat, `Vous aviez dit au monde entier que le climat passait avant
    le reste. Le climat, lui, n'a pas attendu.`],
  [()=>valeur("climat")<45, `Les alertes s'accumulent depuis des mois dans des rapports que
    personne n'a ouverts. Celui-ci, vous allez le lire.`]
 ],
 d:`Quarante-trois degrés à Nîmes, quarante et un à Lyon. Le pays est en vacances, la
    moitié de vos ministres est injoignable, et c'est exactement le moment que les choses
    choisissent pour se casser toutes en même temps.<br><br>
    Deux départements du Sud brûlent — huit mille hectares, deux villages évacués. Une
    centrale nucléaire doit réduire sa production faute d'eau assez froide pour ses
    circuits. Et dans un EHPAD de l'arrière-pays, la climatisation est tombée en panne :
    quatre résidents sont morts en trois jours.<br><br>
    Votre directeur de cabinet vous appelle à six heures du matin. Il ne prend pas de
    détour : « Vous rentrez et vous prenez la main, ou vous laissez le Premier ministre
    gérer et vous restez où vous êtes. Les deux se défendent. Mais quel que soit votre
    choix, on vous le ressortira. Alors choisissez en connaissance de cause. »`,
 o:[
  {l:"Rentrer et prendre la main",
   r:`Vous atterrissez à Nîmes le lendemain à six heures. Cellule de crise installée dans
      la préfecture, réquisition de deux Canadair supplémentaires auprès d'un pays voisin,
      plan blanc déclenché dans quatre départements.<br><br>
      Le feu est maîtrisé en trois jours. Personne ne saura jamais si c'est grâce à vos
      décisions ou parce que le vent a tourné le mardi soir — les deux, sans doute.<br><br>
      Mais tout le monde aura vu les images : le président en bras de chemise sur le
      terrain calciné, le président à l'EHPAD, le président qui reste. En politique, être
      là quand ça brûle vaut plus que d'avoir raison de loin.`,
   e:{soc:{sante:14},cli:{eau:8,foret:8},budget:-8,
      groups:{retraites:11,ruraux:9,salaries:6}},
   pose:"presence", rival:-6},
  {l:"Laisser Matignon gérer, rester en retrait",
   r:`Le Premier ministre gère, et plutôt bien : la cellule tourne, les moyens arrivent, le
      feu est éteint dans les temps. Sur le plan technique, votre absence n'a rien
      coûté.<br><br>
      Sur le plan des images, une seule circule. Une photo prise au téléobjectif, à
      contre-jour, d'une terrasse au bord d'une piscine. On ne vous y reconnaît qu'à
      moitié. Elle est parfaitement anodine et parfaitement dévastatrice.<br><br>
      Elle ressortira chaque été, à la première canicule, pendant tout votre mandat. Elle
      est devenue un raccourci : quand il faisait quarante degrés et que le pays brûlait,
      il était à la piscine.`,
   e:{groups:{retraites:-9,ruraux:-8,salaries:-5}},
   pose:"absence", rival:9},
  {l:"Rentrer et lancer un plan canicule permanent",
   r:`Vous rentrez, et vous ne vous contentez pas de gérer le feu. Vous annoncez un plan
      structurel : un milliard six sur trois ans. Climatisation obligatoire dans tous les
      EHPAD, réserves hydrauliques régionales, cartographie nationale des îlots de chaleur
      urbains.<br><br>
      Les gériatres saluent, les préfets soufflent. Un climatologue résume à la radio, et
      la phrase est reprise partout : « C'est la première fois qu'un gouvernement traite ça
      comme un problème permanent, et pas comme un accident qui se répète. »<br><br>
      Cette phrase-là vous suivra, en bien, jusqu'à la fin du mandat.`,
   e:{budget:-14,soc:{sante:18},cli:{eau:14,foret:10},
      groups:{retraites:13,jeunes:7,patrons:-5}},
   axe:{ecologie:1}, pose:"plan_canicule"}
 ]},

{id:"m9", ch:2, mois:9, ico:"🏫", t:"La rentrée",
 intro:[
  [()=>S.flags.absence, `Votre mois d'août n'est pas passé. « Il était où ? » est devenu
    une phrase qu'on entend jusque dans les cours d'école.`],
  [()=>S.flags.conflit_syndicats||S.axes.autorite>=3, `Les syndicats enseignants vous ont
    classé depuis longtemps. Ils ne viennent plus négocier, ils viennent constater.`],
  [()=>S.flags.budget_ecolo, `Vous avez sanctuarisé l'écologie au dernier budget. Les
    professeurs ont bien compris ce que ça voulait dire pour eux.`]
 ],
 d:`Rentrée scolaire. Quatre mille postes d'enseignants non pourvus dans le pays. Dans
    certains départements, on a recruté des contractuels en trois jours d'entretien pour
    qu'il y ait quelqu'un devant les classes le jour J.<br><br>
    La photo qui tourne depuis lundi : une classe de CP, trente-quatre élèves, et une
    remplaçante de vingt-deux ans qui n'a jamais enseigné, jetée là faute de mieux. Elle a
    accepté de témoigner à visage découvert, dans un reportage du soir. Elle est posée,
    lucide, sans amertume. Elle explique juste qu'elle fait ce qu'elle peut, et que ce
    n'est pas assez.<br><br>
    Les syndicats appellent à la grève dans dix jours. Votre ministre de l'Éducation vous
    dit que c'est jouable de la désamorcer — mais qu'il faut décider maintenant, et que ça
    se compte en milliards.`,
 o:[
  {l:"Revaloriser les salaires enseignants",
   r:`Deux cent quarante euros nets de plus par mois, pour tous, dès janvier. Le budget de
      l'Éducation nationale devient le premier de l'État — ce qu'il était déjà, mais cette
      fois vous le dites à la tribune, et vous en faites un choix assumé.<br><br>
      La grève est levée avant même d'avoir commencé. Un responsable syndical, interrogé au
      micro sur le perron du ministère, lâche : « On ne s'y attendait pas. Honnêtement. »<br><br>
      C'est le plus beau compliment que vous recevrez cette année. Il coûte quinze
      milliards par an, définitivement inscrits au budget, que votre successeur héritera
      sans avoir voté.`,
   e:{budget:-15,soc:{educ:26},groups:{salaries:11,jeunes:9,patrons:-6}},
   axe:{social:1}, pose:"revalo_profs", rival:-7},
  {l:"Réformer le recrutement, sans argent neuf",
   r:`Concours ouverts dès la licence, pré-recrutement rémunéré, une voie d'accès nouvelle
      pour les reconversions professionnelles. Une réforme intelligente, cohérente, et
      gratuite.<br><br>
      Donc invisible. Les plateaux n'en parlent pas — il n'y a ni chèque ni conflit à
      filmer. Les syndicats maintiennent leur préavis de grève, qui sera modérément suivi.<br><br>
      Les postes seront pourvus dans trois ans, si tout se passe bien et si les
      gouvernements suivants ne détricotent pas le dispositif. Vous ne serez probablement
      plus là pour couper le ruban. C'est le sort ordinaire des réformes qui marchent :
      elles profitent à celui d'après.`,
   e:{soc:{educ:10},economie:3,groups:{jeunes:4,patrons:5,salaries:-4}},
   pose:"reforme_recrutement"},
  {l:"Dénoncer l'immobilisme des syndicats",
   r:`Dans une interview, vous employez les mots « corporatisme » et « blocage ». Vous
      dites que l'école a besoin d'être réformée et que certains préfèrent la défendre
      telle qu'elle est, quitte à la laisser couler.<br><br>
      La formule fait un tabac chez vos soutiens. Ailleurs, c'est un carnage. La grève,
      qui devait être modeste, devient la plus suivie depuis quinze ans : deux jours de
      classes fermées, des centaines de milliers de parents à trouver une solution en
      urgence, et une colère qui ne retombera pas.<br><br>
      Vous vous êtes fait un adversaire de plus, et pas des moindres : la salle des profs.
      Elle vote, elle parle aux parents, et elle a de la mémoire.`,
   e:{soc:{educ:-8},social:-7,groups:{salaries:-12,jeunes:-8,patrons:10}},
   axe:{autorite:1}, pose:"conflit_syndicats", rival:9}
 ]},

{id:"m10", ch:2, mois:10, ico:"💶", t:"L'arbitrage",
 d:`La nuit du budget. Onze ministres autour d'une table, une seule enveloppe, et deux
    milliards d'euros à trouver quelque part avant l'aube.<br><br>
    À trois heures du matin, il ne reste plus que trois lignes en discussion, et elles ne
    peuvent pas toutes tenir : l'hôpital, la défense, la transition écologique. Chaque
    ministre a de bons arguments, des chiffres, un dossier de presse déjà prêt. Et chacun
    sait que celui qui perd cette nuit ne rattrapera pas son retard avant deux ans, au
    mieux.<br><br>
    Le débat tourne en rond depuis une heure. Les trois ministres concernés ont cessé de
    se regarder. Le directeur du Budget a posé son stylo. Tout le monde attend que vous
    disiez un nom. C'est votre budget, pas le leur — et à cette heure-ci, c'est aussi
    votre solitude.`,
 o:[
  {l:"Sanctuariser l'hôpital",
   r:`Cinq heures dix du matin. Vous tranchez pour la santé. La ministre concernée ferme
      les yeux une seconde ; le ministre des Armées, lui, quitte la pièce sans un mot et
      remet sa démission trois semaines plus tard, « pour raisons personnelles » — la
      formule que tout le monde emploie et que personne ne croit.<br><br>
      Les urgences rouvrent des lits, recrutent. C'est concret, ça se voit dès l'hiver.<br><br>
      Le chef d'état-major des armées, lui, écrit une lettre. Elle est mesurée, elle ne
      vous accuse de rien nommément, elle parle de « décrochage capacitaire ». Elle
      paraîtra dans Le Monde en novembre. Vous l'aurez lue avant tout le monde et vous
      n'aurez rien pu y répondre.`,
   e:{soc:{sante:22,pauvrete:8},sec:{defense:-8},cli:{air:-6},
      groups:{retraites:12,salaries:9}},
   axe:{social:1}, pose:"budget_sante"},
  {l:"Sanctuariser la défense",
   r:`Vous tranchez pour les armées. La loi de programmation militaire est réévaluée de
      neuf milliards, et vos alliés le remarquent dès le lendemain — un allié de l'Est vous
      appelle pour vous remercier, ce qui vaut mieux qu'un discours.<br><br>
      Les fédérations hospitalières, elles, publient dès le surlendemain une carte de
      France. En rouge, les services d'urgence qui fermeront dans l'année faute de moyens :
      il y en a quarante et un. La carte est claire, lisible d'un coup d'œil, et elle
      circulera pendant des mois — sur les réseaux, dans les tracts, sur les pare-brise.`,
   e:{sec:{defense:22,interieure:6},soc:{sante:-10},cli:{air:-6},
      groups:{retraites:8,ruraux:7,jeunes:-8}},
   axe:{autorite:1}, pose:"budget_defense"},
  {l:"Sanctuariser la transition écologique",
   r:`Vous tranchez pour le climat. C'est la première fois qu'un arbitrage budgétaire, en
      France, en pleine nuit et sous contrainte, va dans ce sens. Les ONG environnementales
      le disent le lendemain sans trop y croire, comme si elles attendaient le
      rétropédalage.<br><br>
      Deux de vos ministres estiment qu'ils ont perdu cette nuit-là. L'un d'eux le fait
      savoir dès le lendemain, en « off », à trois journalistes : « ce budget n'a pas de
      priorité, il a une lubie. »<br><br>
      Vous avez gagné une ligne dans les livres d'histoire et deux adversaires à
      l'intérieur de votre propre gouvernement.`,
   e:{cli:{air:20,eau:12,foret:8},sec:{defense:-8},soc:{sante:-8},
      groups:{jeunes:14,ruraux:-7,patrons:-5}},
   axe:{ecologie:2}, pose:"budget_ecolo"}
 ]},

{id:"m11", ch:2, mois:11, ico:"🇪🇺", t:"Bruxelles",
 intro:[
  [()=>S.dette>135, `Votre dette a franchi un seuil que les autres capitales surveillent.
    On vous reçoit poliment, comme on reçoit un dossier.`],
  [()=>S.flags.posture_europeenne, `Vous aviez promis de ne rien faire seul. On va vérifier
    ce que vaut la promesse quand elle coûte quelque chose.`],
  [()=>S.flags.refus_ue||S.axes.autorite>=3, `Votre réputation vous précède : on vous dit
    imprévisible. Certains y voient un défaut, d'autres un levier.`]
 ],
 d:`Conseil européen, deuxième jour, trois heures du matin. Le texte final sur la table
    impose des trajectoires budgétaires contraignantes, avec sanctions automatiques, et la
    France est nommément citée en annexe — parmi les mauvais élèves à surveiller.<br><br>
    La chancelière allemande vous prend à part dans un couloir désert, deux gobelets de
    café à la main. Elle vous en tend un. « Signez. Vous aurez trois ans avant que
    quiconque vérifie quoi que ce soit. D'ici là, vous aurez été réélu, ou remplacé. Dans
    les deux cas, ce ne sera plus votre problème. » Elle sourit. Ce n'est pas une
    plaisanterie, c'est un conseil.<br><br>
    Dans la salle, vingt-six chefs d'État et de gouvernement attendent que vous reveniez
    vous asseoir. Le vote est à l'unanimité : sans votre voix, il n'y a pas d'accord, et
    tout le monde le sait.`,
 o:[
  {l:"Signer et assumer la contrainte",
   r:`Vous signez. Les marchés saluent dès l'ouverture : le spread avec l'Allemagne se
      resserre de dix-huit points, ce qui, traduit en intérêts, représente plusieurs
      centaines de millions économisés sur l'année.<br><br>
      Vous rentrez avec un texte qui vous liera pendant trois ans, et qui liera aussi votre
      successeur.<br><br>
      Dans l'avion du retour, votre ministre des Finances est visiblement soulagé. Votre
      conseiller politique, lui, regarde par le hublot et ne dit rien pendant tout le vol —
      ce qui, chez lui, est la forme la plus complète du désaccord.`,
   e:{budget:7,economie:5,cac:6,soc:{pouvoir:-8},
      groups:{patrons:11,salaries:-7,ruraux:-5}},
   pose:"signature_ue"},
  {l:"Signer, contre une clause d'investissement vert",
   r:`Quatre heures de négociation dans un bureau de la Commission, pour obtenir une annexe
      de onze lignes : les investissements de transition écologique sortent du calcul du
      déficit contraint.<br><br>
      C'est technique, invisible pour le grand public, illisible dans un titre de presse.
      Et ça vaut quinze milliards d'euros de marge de manœuvre sur trois ans. Deux autres
      pays, qui hésitaient, se rallient à votre position dans les jours qui suivent.<br><br>
      C'est votre première vraie victoire européenne. Elle ne fera pas la une. Mais dans
      les cabinets, à Paris comme à Berlin, on retiendra que vous savez négocier une
      virgule quand elle rapporte gros.`,
   e:{budget:3,cli:{air:12,eau:6},economie:3,groups:{jeunes:9,patrons:4}},
   axe:{ecologie:1}, pose:"clause_verte", rival:-4},
  {l:"Refuser de signer",
   r:`Vous revenez dans la salle et vous annoncez que la France ne signera pas ce texte. Un
      silence. La chancelière ne vous regarde pas. La conférence de presse commune, une
      heure plus tard, est glaciale, et le mot « isolement » revient dans toutes les
      dépêches avant midi.<br><br>
      En France, une partie de l'opinion vous trouve courageux — enfin un président qui ne
      se couche pas.<br><br>
      Le lendemain, la Commission ouvre une procédure pour déficit excessif, et l'agence de
      notation avance sa revue de trois mois. Vous avez gagné une image de fermeté et
      perdu, concrètement, du temps et des points de taux. Le calcul se fera plus tard.`,
   e:{pib:-1.2,economie:-7,cac:-9,dette:4,groups:{ruraux:12,jeunes:6,patrons:-13}},
   axe:{autorite:1}, pose:"refus_ue", rival:-8}
 ]},

{id:"m12", ch:2, mois:12, ico:"🥂", t:"La nuit des vœux",
 intro:[
  [()=>popularite()<40, `Une première année difficile. Sur le prompteur, le mot « ensemble »
    revenait onze fois : votre plume avait compris ce qu'il fallait réparer.`],
  [()=>S.rival>=45, `Julien Ferrand présentera ses propres vœux demain. Ils seront plus
    regardés que les vôtres, et vous le savez déjà.`]
 ],
 d:`Vingt heures dix, le trente et un décembre. Vous venez d'enregistrer vos vœux — six
    minutes, cravate bleue, le bilan d'une année « de redressement » — quand votre chef de
    cabinet entre dans la loge sans frapper. Il n'a jamais fait ça.<br><br>
    Un immeuble a brûlé à Aubervilliers il y a deux heures. Neuf morts, dont quatre
    enfants. Le bâtiment était frappé d'un arrêté de péril depuis dix-huit mois. Personne
    n'a relogé personne. Le maire savait, la préfecture savait, votre ministère du
    Logement avait le dossier.<br><br>
    La diffusion est dans deux heures. Sur le prompteur, votre première phrase, celle que
    vous venez d'enregistrer avec le sourire, est : « Cette année a été celle du
    redressement. » Il faut décider, maintenant, ce que vingt millions de Français vont
    entendre à minuit moins cinq.`,
 o:[
  {l:"Tout réécrire : ne parler que d'eux",
   r:`Vous réenregistrez à vingt-deux heures. Six minutes sans un chiffre, sans un bilan.
      Vous nommez l'immeuble, la rue, la date de l'arrêté de péril. Vous dites qu'un
      bâtiment déclaré dangereux dix-huit mois plus tôt et jamais évacué, c'est une faute
      de l'État, et que l'État, ce soir, c'est vous.<br><br>
      L'audience est la plus forte pour des vœux présidentiels depuis quinze ans.<br><br>
      Le lendemain, sans attendre d'instruction de Paris, deux préfets lancent un
      recensement des bâtiments frappés d'arrêté de péril dans leur département. C'est le
      genre d'effet qu'aucun sondage ne mesure et qui, pourtant, compte.`,
   e:{soc:{pauvrete:16,pouvoir:6},social:8,
      groups:{salaries:11,jeunes:12,ruraux:6,patrons:-5}},
   axe:{social:1}, pose:"voeux_humilite", rival:-11},
  {l:"Y aller cette nuit, annuler la diffusion",
   r:`Vous montez dans la voiture à minuit. Vous arrivez au gymnase où les familles ont été
      relogées à une heure vingt. Pas de podium, pas de discours, pas de caméras — vous
      avez demandé qu'il n'y en ait pas.<br><br>
      Vous restez jusqu'à l'aube. Vous parlez à des gens qui ont tout perdu il y a
      quelques heures. Une femme vous dit une phrase, à voix basse, que personne n'entend
      et que vous ne répéterez jamais à personne.<br><br>
      Les vœux enregistrés ne seront jamais diffusés. À leur place, le service de presse
      publie un communiqué de trois lignes. Certains trouveront ça juste. D'autres
      diront que le président a raté ses vœux. Vous, vous ne saurez pas quoi en penser.`,
   e:{soc:{pauvrete:12},social:11,budget:-6,
      groups:{salaries:13,jeunes:11,ruraux:8,retraites:-4}},
   pose:"voeux_terrain", rival:-13},
  {l:"Diffuser les vœux prévus, traiter le dossier demain",
   r:`Vous décidez de ne rien changer. Les vœux passent à vingt heures : « Cette année a été
      celle du redressement. » Le dossier d'Aubervilliers sera traité dès le 2 janvier,
      avec le sérieux qu'il faut.<br><br>
      Dès vingt et une heures, les chaînes montent votre phrase en boucle contre les images
      de l'immeuble éventré. Le rapprochement se fait en quelques minutes, partout, et il
      est imparable : neuf morts, dont quatre enfants, et un président qui parle de
      redressement.<br><br>
      Vous ne vous en débarrasserez pas cette année. Peut-être pas du tout.`,
   e:{economie:4,soc:{pauvrete:-10},
      groups:{patrons:8,salaries:-11,jeunes:-13,retraites:4}},
   pose:"voeux_bilan", rival:9}
 ]},

/* ═══════════ ANNÉE II ═══════════ */

{id:"m13", ch:3, mois:13, ico:"🚧", t:"Le barrage",
 intro:[
  [()=>S.flags.evitement||S.flags.absence, `On vous reproche déjà de ne pas être là quand
    ça compte. Cette nuit, ça a compté.`],
  [()=>S.axes.autorite>=3, `Les consignes de fermeté que vous avez données aux préfets sont
    en vigueur depuis des mois. Elles vont être relues, ligne par ligne, par tout le monde.`]
 ],
 d:`Il s'appelait Kevin, il avait vingt-trois ans, il faisait les trois-huit dans un atelier
    de la Sarthe. Depuis six jours, il passait ses soirées sur un rond-point de
    départementale, avec une trentaine d'autres, un brasero, et des pancartes contre le prix
    du carburant — et contre d'autres choses, plus difficiles à écrire sur un carton.<br><br>
    Cette nuit, un poids lourd a forcé le passage à quatre heures du matin. Le chauffeur
    affirme n'avoir rien vu. Il y a une vidéo de caméra de recul, et sur la vidéo, on voit.<br><br>
    À midi, on comptait quarante blocages dans le pays. À dix-huit heures, deux cents. Ce
    n'est plus une jacquerie du carburant, c'est devenu la mort d'un jeune homme, et
    l'Intérieur vous demande une ligne avant le journal de vingt heures — apaiser, ou tenir.`,
 o:[
  {l:"Aller sur le rond-point, dès demain, sans service d'ordre",
   r:`Onze heures du matin, cinq degrés, la fumée du brasero. Vous restez deux heures. On
      vous engueule d'abord, longtemps, puis on finit par vous parler.<br><br>
      Le père de Kevin refuse de vous serrer la main devant les caméras — et il a raison de
      le faire. Mais il accepte de vous parler vingt minutes, à l'écart, adossé à un
      abribus. Il ne vous demande rien. Il veut juste que vous sachiez à quoi ressemblaient
      les journées de son fils.<br><br>
      Le soir même, pour la première fois en une semaine, le nombre de blocages cesse
      d'augmenter. Vos conseillers en sécurité ont passé la matinée le souffle court. Ils
      vous le diront plus tard.`,
   e:{social:10,soc:{pouvoir:6},groups:{ruraux:15,salaries:11,jeunes:7}},
   pose:"terrain_regulier", rival:-12},
  {l:"Geler la taxe carburant et recevoir une délégation",
   r:`Le gel est annoncé à dix-huit heures : deux milliards d'euros de recettes en moins, et
      un aveu que tout le monde comprend — la trajectoire carbone est suspendue jusqu'à
      nouvel ordre.<br><br>
      Les blocages se vident en quatre jours. La colère retombe. Les associations
      environnementales, elles, parlent de « capitulation », et elles n'ont pas tort.<br><br>
      Vous avez acheté la paix sociale de cet hiver. Vous l'avez payée avec une monnaie qui
      n'est pas la vôtre : celle de la décennie suivante, qui devra rattraper le retard que
      vous venez de prendre. La facture climatique existe toujours. Elle a juste été
      repoussée d'un cran.`,
   e:{budget:-13,cli:{air:-10},soc:{pouvoir:14},
      groups:{ruraux:13,salaries:9,jeunes:-6}},
   axe:{ecologie:-1}, pose:"annonce_choc", rival:-6},
  {l:"Faire évacuer les ronds-points avant qu'un autre meure",
   r:`Quatre heures du matin. Deux cents ronds-points, huit mille gendarmes mobiles, l'ordre
      d'en finir avant le lever du jour. Cent quarante interpellations, dix-neuf blessés,
      dont quatre gendarmes.<br><br>
      À sept heures, les giratoires sont dégagés et la circulation reprend. Vous pouvez
      dire, techniquement, que vous avez rétabli l'ordre public.<br><br>
      À huit heures, les images sont partout : des retraités tirés par les bras devant un
      brasero éteint, une femme de soixante ans assise sur le bitume qui refuse de bouger.
      Vous avez fait circuler les voitures. Vous avez aussi fabriqué, en une nuit, un
      symbole que vos adversaires n'auront plus qu'à ressortir.`,
   e:{sec:{interieure:14},social:-13,
      groups:{ruraux:-18,jeunes:-11,retraites:8,patrons:9}},
   axe:{autorite:2}, pose:"evacuation", rival:13}
 ]},

{id:"c3dure", ch:3, mois:14, si:()=>S.axes.autorite>=2, ico:"🔥", t:"Un million dans la rue",
 d:`Ils étaient trois cent mille en octobre. Ils sont un million aujourd'hui, et ce n'est
    plus un cortège syndical, c'est un pays qui s'arrête. Raffineries bloquées, dépôts de
    carburant sous cadenas, trains à quai, lycées barricadés par leurs propres élèves.<br><br>
    À vingt-trois heures, le Premier ministre vous appelle depuis Matignon. Sa voix est
    calme, ce qui est mauvais signe. « Il nous reste trois options, monsieur le Président,
    et vous les connaissez toutes les trois. Je vous demande une seule chose : ne décidez
    pas ce soir en regardant les chaînes d'information. »<br><br>
    Sur l'écran, le son coupé, Julien Ferrand parle depuis un plateau qui l'écoute comme on
    écoute quelqu'un qui a déjà gagné. Le texte qui a mis le pays dans la rue est le vôtre.
    Il faut décider si vous le portez jusqu'au bout, si vous négociez, ou si vous le
    retirez.`,
 o:[
  {l:"Passer en force par le 49.3",
   r:`Seize heures dix. Le Premier ministre monte à la tribune et lit les quatre lignes
      réglementaires dans un hémicycle debout, qui hurle. La séance est suspendue trois
      fois. Le texte est adopté sans vote.<br><br>
      Le soir, huit cent mille personnes défilent dans le pays. Trois députés de votre
      majorité annoncent, à la sortie de l'Assemblée, qu'ils ne voteront plus rien
      jusqu'à la fin du mandat.<br><br>
      Vous avez votre loi, complète, en vigueur. Vous avez aussi appris à votre majorité
      qu'on peut se passer d'elle, et au pays que vous passez outre quand il dit non. Ces
      deux leçons-là ne s'oublient pas. Ferrand les répétera à chaque déplacement pendant
      trois ans.`,
   e:{budget:7,social:-13,sec:{interieure:-6},groups:{salaries:-15,jeunes:-13,patrons:11}},
   axe:{autorite:2}, pose:"passage_force", rival:15},
  {l:"Ouvrir une conférence sociale",
   r:`Huit semaines de négociation. Quatorze organisations autour d'une table, des sous-
      commissions, des nuits blanches, et au bout un relevé de conclusions de trente-deux
      pages que personne ne lira en entier.<br><br>
      C'est lent, c'est coûteux, et ça marche : la rue se vide progressivement, sans
      qu'aucun camp n'ait été humilié devant les caméras. Le texte ressort raboté, mais
      voté, et voté par des gens qui l'ont amendé eux-mêmes.<br><br>
      Un vieux permanent syndical, à la sortie de la dernière séance, confie à un
      journaliste : « Ça faisait vingt ans qu'on ne nous avait pas fait travailler comme
      ça. » Il ne sait pas si c'est un compliment. Vous non plus.`,
   e:{budget:-9,soc:{pouvoir:12,pauvrete:8},groups:{salaries:12,jeunes:7,patrons:-8}},
   axe:{social:1}, pose:"negociateur", rival:-4},
  {l:"Retirer le texte",
   r:`Vous retirez à dix-neuf heures, par un communiqué de quatre lignes. Le pays s'arrête
      de bloquer dans la nuit ; à minuit, les dépôts de carburant rouvrent.<br><br>
      Dans votre camp, c'est un séisme. On a tenu six semaines sous les huées, on a envoyé
      des députés au feu dans leurs circonscriptions, et c'était pour rien. Votre ministre
      du Travail vous remet sa démission le lendemain matin, par un SMS de deux phrases.<br><br>
      Ferrand résume la séquence en une formule, le soir même, au journal de vingt heures :
      « Il cède quand on pousse. » Elle est injuste, elle est efficace, et elle vous
      collera à la peau jusqu'au bout.`,
   e:{budget:-6,economie:-6,cac:-5,groups:{salaries:9,patrons:-13,ruraux:-4}},
   axe:{autorite:-2}, pose:"recul_majeur", rival:11}
 ]},

{id:"c3negocie", ch:3, mois:14, si:()=>S.axes.social>=1, ico:"🤝", t:"La table ronde",
 d:`Vous avez exigé que ça se passe ici, à l'Élysée, dans la salle des fêtes, sous les
    lustres et les dorures. Syndicats d'un côté de la grande table, patronat de l'autre, et
    vous au milieu — la place la moins confortable de la pièce.<br><br>
    Il est quatre heures du matin. Il reste un point de blocage, et deux hommes qui ont
    cessé de se regarder depuis minuit. La secrétaire générale de la CFDT fait glisser une
    feuille A4 vers vous, par-dessus les tasses froides. « Signez ça, et nous sortons
    ensemble annoncer un accord. Ne signez pas, et nous sortons chacun de notre côté dire
    que vous avez fait échouer la négociation. »<br><br>
    Sur la feuille, il y a un chiffre. La proposition coûte six milliards d'euros. Elle
    ferme la crise ce matin — ou pas.`,
 o:[
  {l:"Signer l'accord",
   r:`Six milliards. Une signature à quatre heures vingt du matin, sous les lustres, avec
      la fatigue de tout le monde dans la pièce. Et une photo : vous, debout, entre la
      patronne de la CFDT et le président du Medef, tous les trois épuisés. Elle fait la
      une partout le lendemain.<br><br>
      C'est cher, très cher, et vous devrez trouver comment le financer. Mais c'est aussi
      la première fois depuis longtemps qu'un accord social est signé plutôt qu'imposé.<br><br>
      Les commentateurs, qui avaient préparé leurs éditos sur l'énième bras de fer, cherchent
