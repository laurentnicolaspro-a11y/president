<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Président — Élysée</title>
<style>
:root{
  --bg:#0e1420; --bg2:#141d2e; --panel:#1a2436; --panel2:#22304a;
  --line:#2e3d59; --txt:#e8edf6; --dim:#93a3bd;
  --or:#d9b26a; --bleu:#4a7fd4; --rouge:#c0455a; --vert:#4caf7d;
  --ombre:0 8px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#1c2a44 0%,var(--bg) 60%);
  color:var(--txt); font-family:"Segoe UI",system-ui,sans-serif; font-size:15px;
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
}
h1,h2,h3{font-family:Georgia,"Palatino Linotype",serif; margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
.wrap{width:100%; max-width:1080px; margin:0 auto; padding:14px 16px 90px; flex:1}

/* ---------- Bandeau ---------- */
header{
  background:linear-gradient(180deg,#1b2740,#141d2e);
  border-bottom:2px solid var(--or); box-shadow:var(--ombre);
  position:sticky; top:0; z-index:30;
}
.hbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.blason{font-size:26px}
.ident{min-width:0}
.titre{font-family:Georgia,serif;font-size:19px;letter-spacing:.5px}
.sous{color:var(--dim);font-size:12.5px}
.rang{margin-left:auto;text-align:right;line-height:1.25;flex-shrink:0;
  border:1px solid transparent;border-radius:9px;padding:4px 9px;transition:.15s}
.rang:hover{border-color:var(--or);background:#ffffff0a}
.rang b{color:var(--or);font-size:19px;font-family:Georgia,serif}
.rang span{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:1px}

.jauges{max-width:1080px;margin:0 auto;padding:0 16px 12px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.j{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;
  text-align:left;width:100%;transition:.15s}
.j:hover{border-color:var(--or);background:var(--panel2)}
.jt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;gap:6px}
.jt b{color:var(--txt);font-size:12.5px}
.bar{height:7px;background:#0c121d;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s ease,background .5s}
@media(max-width:520px){
  .jauges{grid-template-columns:1fr 1fr}
  .hbar{gap:9px}
  .titre{font-size:16px} .sous{font-size:10.5px}
  .blason{font-size:21px}
  .rang{padding:2px 5px} .rang b{font-size:16px} .rang span{font-size:9px;letter-spacing:.5px}
}

/* ---------- Bureau ---------- */
.carte{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-left:4px solid var(--or);
  border-radius:12px;padding:20px 22px;box-shadow:var(--ombre);margin-bottom:14px;
  animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.etq{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.carte h2{font-size:21px;margin-bottom:8px}
.carte p{color:#cbd6e8;line-height:1.5;margin:0 0 16px}
.carte .texte{color:#cbd6e8;line-height:1.62;margin:0 0 18px;font-size:15px}
.carte .texte p{margin:0 0 10px}
.carte .texte p:last-child{margin-bottom:0}
.carte .texte p.intro{border-left:2px solid var(--or);padding-left:12px;
  color:#c3a978;font-style:italic;margin-bottom:14px}
.carte.recit{border-left-width:5px;
  background:linear-gradient(180deg,#26355180,var(--panel))}
.carte.recit h2{font-size:23px;margin-bottom:12px}
.carte.recit .texte{font-size:15.5px;line-height:1.7;color:#d6dfee}
.carte.consequence{border-left-color:var(--vert)}
.carte.consequence .etq{color:var(--vert)}
.choixfait{background:#0f1727;border-left:3px solid var(--or);border-radius:0 8px 8px 0;
  padding:9px 14px;margin-bottom:16px;font-size:14.5px;color:var(--or);font-style:italic}
.choix{display:grid;gap:9px}
.opt{
  text-align:left;background:#16203353;border:1px solid var(--line);border-radius:9px;
  padding:11px 14px;transition:.15s;display:flex;justify-content:space-between;gap:12px;align-items:center}
.opt:hover:not(:disabled){background:#26365580;border-color:var(--or);transform:translateX(3px)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt small{color:var(--dim);font-size:11.5px;white-space:nowrap}

.suite{
  width:100%;padding:14px;border-radius:11px;font-size:16px;font-weight:600;
  background:linear-gradient(180deg,#d9b26a,#b8914d);color:#1a1206;box-shadow:var(--ombre);
  transition:.15s}
.suite:hover:not(:disabled){filter:brightness(1.08)}
.suite:disabled{background:#26314a;color:#66748c;box-shadow:none;cursor:not-allowed}

.journal{background:#0f1727;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.journal h3{font-size:13px;color:var(--or);margin-bottom:7px;letter-spacing:1px;text-transform:uppercase}
.journal div{font-size:13px;color:var(--dim);padding:2px 0}
.up{color:var(--vert)} .dn{color:var(--rouge)}

/* ---------- Barre d'actions ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;background:#111a29ee;backdrop-filter:blur(8px);
  border-top:1px solid var(--line);z-index:30}
.nav div{max-width:1080px;margin:0 auto;padding:9px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.nav button{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 4px;
  font-size:12.5px;transition:.15s;position:relative}
.nav button:hover{border-color:var(--or);background:var(--panel2)}
.nav button b{display:block;font-size:19px;font-weight:400;margin-bottom:2px}
.pastille{position:absolute;top:5px;right:9px;background:var(--rouge);color:#fff;font-size:10px;
  border-radius:9px;padding:1px 6px}
.pastille.ok{background:var(--vert);color:#06210f}

/* ---------- Modales ---------- */
.mod{position:fixed;inset:0;background:#050912e0;z-index:50;display:none;padding:18px;overflow:auto}
.mod.on{display:block}
.box{max-width:1000px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--ombre);overflow:hidden}
.bhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:#1b2740;position:sticky;top:0;z-index:4}
.bhead h2{font-size:18px;flex:1}
.bhead .info{color:var(--dim);font-size:12.5px;text-align:right}
.fermer{font-size:22px;line-height:1;color:var(--dim);padding:0 4px}
.fermer:hover{color:var(--txt)}
.bbody{padding:18px}

/* ---------- Fiches d'indicateur ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.kpi b{display:block;font-size:20px;color:var(--or);font-family:Georgia,serif;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.kpi small{display:block;font-size:11px;margin-top:3px}
.bloc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:14px}
.bloc h3{font-size:14px;color:var(--or);margin-bottom:11px;letter-spacing:.7px;text-transform:uppercase}
.si{margin-bottom:14px}
.si:last-child{margin-bottom:0}
.si .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:5px;gap:10px}
.si .t b{font-size:14px}
.si .d{font-size:11.5px;color:var(--dim);margin-top:4px}
.bar.gros{height:10px}
.courbe{width:100%;height:auto;display:block}
.cwrap{position:relative;background:#0c1220;border:1px solid var(--line);border-radius:10px;
  padding:12px 12px 8px}
.cinfo{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}

/* ---------- Classement ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--dim);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px;border-bottom:1px solid #22304a80}
.tbl tr.moi{background:#d9b26a1c}
.tbl tr.moi td{color:var(--or);font-weight:700}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .r{width:34px;color:var(--dim);font-family:Georgia,serif;font-size:15px}
.tbl tr.moi .r{color:var(--or)}
.iso{display:inline-block;min-width:28px;text-align:center;margin-right:8px;
  background:#0f1727;border:1px solid var(--line);border-radius:4px;padding:1px 4px;
  font-size:10.5px;letter-spacing:.6px;color:var(--dim);font-weight:700;vertical-align:1px}
.tbl tr.moi .iso{background:#d9b26a22;border-color:var(--or);color:var(--or)}

/* Toile des lois */
.toile{display:grid;grid-template-columns:1fr 320px;gap:18px}
@media(max-width:860px){.toile{grid-template-columns:1fr}}
.svgwrap{background:#0c1220;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  display:flex;justify-content:center;align-items:center}
svg.toilesvg{display:block;width:100%;height:auto;max-height:min(66vh,540px)}
.fil{stroke:#2b3a56;stroke-width:1.6;fill:none}
.fil.act{stroke:var(--or);stroke-width:2.4}
.web{stroke:#1e2b42;stroke-width:1;fill:none}
.nd{cursor:pointer}
.nd circle{transition:.2s}
.nd:hover circle{stroke:var(--or);stroke-width:3}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px}
.detail h3{font-size:16px;margin-bottom:6px}
.detail .br{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--or);margin-bottom:8px}
.detail p{color:#c2cee2;font-size:13.5px;line-height:1.5}
.eff{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:#0f1727;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11.5px}
.btn{width:100%;padding:11px;border-radius:9px;font-weight:600;background:var(--bleu);color:#fff;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{background:#26314a;color:#66748c;cursor:not-allowed}
.legende{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--dim)}
.legende span::before{content:'●';margin-right:4px}
@media(max-width:620px){
  .mod{padding:8px}
  .bhead{padding:11px 13px} .bhead h2{font-size:15.5px} .bhead .info{font-size:11px}
  .bbody{padding:13px}
  .svgwrap{overflow-x:auto;justify-content:flex-start}
  svg.toilesvg{min-width:470px;max-height:none}
}

/* Projets */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.pj{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.pj.en{border-color:var(--bleu)} .pj.fini{border-color:var(--vert);opacity:.75}
.pj h4{margin:0 0 5px;font-size:15px;font-family:Georgia,serif}
.pj p{color:var(--dim);font-size:12.5px;line-height:1.45;margin:0 0 10px}
.prog{height:6px;background:#0c121d;border-radius:4px;overflow:hidden;margin:9px 0}
.prog i{display:block;height:100%;background:var(--bleu);transition:width .4s}

/* Budget */
.sl{margin-bottom:15px}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.sl label b{color:var(--or)}
.sl small{display:block;color:var(--dim);font-size:11.5px;margin-top:4px}
input[type=range]{width:100%;accent-color:var(--or);height:20px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.deux{grid-template-columns:1fr}}
.solde{background:#0f1727;border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:6px}
.solde.colle{position:sticky;top:8px;z-index:3;box-shadow:var(--ombre);border-color:var(--or)}
.lg{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;gap:12px}
.lg.tot{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-weight:700}

/* Fin */
.fin{text-align:center;padding:34px 22px}
.fin .em{font-size:56px;margin-bottom:12px}
.fin h2{font-size:27px;margin-bottom:10px}
.fin p{color:#c2cee2;line-height:1.6;max-width:520px;margin:0 auto 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:20px 0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px}
.st b{display:block;font-size:20px;color:var(--or);font-family:Georgia,serif}
.st span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.vide{color:var(--dim);text-align:center;padding:26px;font-size:13.5px}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="blason">🇫🇷</div>
    <div class="ident">
      <div class="titre">Palais de l'Élysée</div>
      <div class="sous" id="date">—</div>
    </div>
    <button class="rang" onclick="ouvrirClassement()">
      <b id="rang">—</b>
      <span>puissance mondiale</span>
    </button>
  </div>
  <div class="jauges" id="jauges"></div>
</header>

<div class="wrap">
  <div id="bureau"></div>
  <div class="journal" id="journal" style="display:none">
    <h3>Note de service</h3>
    <div id="jrn"></div>
  </div>
  <button class="suite" id="suite">Passer au mois suivant →</button>
</div>

<nav class="nav"><div>
  <button onclick="ouvrirLois()"><b>📜</b>Lois<span class="pastille" id="pLois"></span></button>
  <button onclick="ouvrirProjets()"><b>🏗️</b>Projets<span class="pastille" id="pProj"></span></button>
  <button onclick="ouvrirBudget()"><b>💶</b>Budget</button>
  <button onclick="ouvrirBilan()"><b>📊</b>Bilan</button>
</div></nav>

<div class="mod" id="mod"><div class="box">
  <div class="bhead"><h2 id="mTitre"></h2><span class="info" id="mInfo"></span>
    <button class="fermer" onclick="fermer()">✕</button></div>
  <div class="bbody" id="mBody"></div>
</div></div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════
   1. DONNÉES DE RÉFÉRENCE
   ══════════════════════════════════════════════════════════ */

const PIB0 = 2850;   // PIB français de départ, en milliards d'euros

/* Les quinze premières puissances. La France est pilotée par le joueur. */
const PAYS = [
  {n:"États-Unis",  d:"US", pib:29200, g:2.0},
  {n:"Chine",       d:"CN", pib:18700, g:4.0},
  {n:"Allemagne",   d:"DE", pib:4050,  g:1.0},
  {n:"Japon",       d:"JP", pib:3650,  g:0.5},
  {n:"Inde",        d:"IN", pib:3400,  g:6.0},
  {n:"Royaume-Uni", d:"GB", pib:3050,  g:1.4},
  {n:"France",      d:"FR", pib:PIB0,  g:null},
  {n:"Italie",      d:"IT", pib:2500,  g:0.8},
  {n:"Canada",      d:"CA", pib:2280,  g:1.6},
  {n:"Brésil",      d:"BR", pib:2230,  g:2.2},
  {n:"Russie",      d:"RU", pib:2150,  g:1.1},
  {n:"Corée du Sud",d:"KR", pib:1950,  g:2.2},
  {n:"Australie",   d:"AU", pib:1860,  g:2.0},
  {n:"Mexique",     d:"MX", pib:1820,  g:2.0},
  {n:"Espagne",     d:"ES", pib:1760,  g:2.4}
];
const IFR = PAYS.findIndex(p=>p.g===null);   // indice de la France

const BRANCHES = {
  social:      {nom:"Social",       ico:"❤️", col:"#c0455a"},
  securite:    {nom:"Sécurité",     ico:"🛡️", col:"#5b7fb5"},
  ecologie:    {nom:"Écologie",     ico:"🌍", col:"#4caf7d"},
  economie:    {nom:"Économie",     ico:"📈", col:"#d9b26a"},
  institutions:{nom:"Institutions", ico:"⚖️", col:"#9b7cc4"}
};

const GROUPES = {
  salaries: {nom:"Salariés",     ico:"👷", poids:.30},
  retraites:{nom:"Retraités",    ico:"👵", poids:.25},
  jeunes:   {nom:"Jeunes",       ico:"🎓", poids:.18},
  ruraux:   {nom:"Ruraux",       ico:"🌾", poids:.17},
  patrons:  {nom:"Entrepreneurs",ico:"💼", poids:.10}
};

/* Sous-indicateurs. `info` produit la métrique parlante affichée sous la barre. */
const SEC = {
  interieure:{nom:"Sécurité intérieure",ico:"👮",
    txt:"Police, justice, délinquance du quotidien.",
    info:v=>[`${(13.4-(v-50)*.094).toFixed(1)} atteintes aux personnes pour 1 000 habitants`,
             `${Math.round(58-(v-50)*.52)} % des Français se disent inquiets pour leur sécurité`]},
  defense:{nom:"Défense nationale",ico:"🎖️",
    txt:"Armées, dissuasion, capacité à peser.",
    info:v=>[`Effort de défense : ${(1.35+(v-50)*.021).toFixed(2)} % du PIB`,
             `Capacité opérationnelle : ${Math.round(v)} / 100`]}
};
const CLI = {
  air:{nom:"Air & carbone",ico:"💨",
    txt:"Émissions, qualité de l'air respiré.",
    info:v=>[`${Math.round(408-(v-50)*3.5)} Mt de CO₂ émises par an`,
             `${Math.round(31-(v-50)*.28)} jours de pics de pollution`]},
  eau:{nom:"Eau",ico:"💧",
    txt:"Ressource, nappes, cours d'eau.",
    info:v=>[`${Math.round(44+(v-50)*.62)} % des cours d'eau en bon état`,
             `${Math.round(28-(v-50)*.30)} départements en restriction l'été`]},
  foret:{nom:"Forêts & biodiversité",ico:"🌳",
    txt:"Couvert forestier, espèces protégées.",
    info:v=>[`${(31.4+(v-50)*.09).toFixed(1)} % du territoire boisé`,
             `Indice de biodiversité : ${Math.round(v)} / 100`]},
  sols:{nom:"Sols & agriculture",ico:"🌾",
    txt:"Artificialisation, qualité des terres.",
    info:v=>[`${nb(24000-(v-50)*260)} hectares artificialisés par an`,
             `${Math.round(12+(v-50)*.42)} % de la surface agricole en bio`]}
};
const SOC = {
  pouvoir:{nom:"Pouvoir d'achat",ico:"🛒",
    txt:"Salaires, prix, reste à vivre.",
    info:v=>[`Revenu médian : ${nb(1930+(v-50)*13)} € par mois`,
             `${Math.round(34-(v-50)*.46)} % des ménages finissent le mois à découvert`]},
  sante:{nom:"Santé & hôpital",ico:"🏥",
    txt:"Accès aux soins, état de l'hôpital public.",
    info:v=>[`${(5.4-(v-50)*.056).toFixed(1)} h d'attente moyenne aux urgences`,
             `${Math.round(6.2-(v-50)*.072)} millions de Français sans médecin traitant`]},
  educ:{nom:"Éducation & jeunesse",ico:"🎓",
    txt:"École, formation, insertion des jeunes.",
    info:v=>[`${Math.round(24.6-(v-50)*.08)} élèves par classe en moyenne`,
             `${(8.4-(v-50)*.09).toFixed(1)} % de décrochage scolaire`]},
  pauvrete:{nom:"Pauvreté & inégalités",ico:"🤝",
    txt:"Précarité, écarts de revenus.",
    info:v=>[`${(14.8-(v-50)*.16).toFixed(1)} % de la population sous le seuil de pauvreté`,
             `${nb(Math.round(330-(v-50)*2.6)*1000)} personnes sans domicile`]}
};

/* Les jauges du bandeau. `sous` désigne le groupe de sous-indicateurs, s'il y en a. */
const JAUGES = {
  finances:  {nom:"Trésorerie", ico:"💰"},
  popularite:{nom:"Popularité", ico:"❤️", sous:"grp"},
  securite:  {nom:"Sécurité",   ico:"🛡️", sous:"sec"},
  climat:    {nom:"Climat",     ico:"🌍", sous:"cli"},
  social:    {nom:"Social",     ico:"⚖️", sous:"soc"},
  economie:  {nom:"Économie",   ico:"📈"},
  rival:     {nom:"Ferrand",    ico:"🎯", inverse:true}
};

/* ── Lois ──────────────────────────────────────────────────
   `eff`  effet immédiat · `tour` effet répété chaque mois
   Un effet global (social:+8) se répartit sur tous les sous-indicateurs.
   Un effet ciblé (soc:{pouvoir:+20}) ne touche que celui-là — il doit donc
   être proportionnellement plus fort pour peser autant sur la moyenne.     */

   axe:{autorite:2}, pose:"ligne_autorite"}
 ]},

{id:"m2", ch:1, mois:2, ico:"📡", t:"L'otage",
 d:`Une infirmière française, quarante et un ans, enlevée il y a neuf jours au Sahel.
    Ce matin, une vidéo de quatre-vingt-dix secondes. Elle lit un texte qu'on lui a écrit,
    et à la fin, elle ajoute trois mots qui ne sont pas dans le texte : « Ne payez pas. »<br><br>
    La cellule de crise est réunie depuis l'aube. Le chef d'état-major estime l'assaut à
    « une chance sur deux, peut-être un peu moins ». Le négociateur, lui, demande six
    semaines et neuf millions.<br><br>
    Sa fille de dix-sept ans a donné une interview hier soir. Elle vous a nommé.`,
 o:[
  {l:"Autoriser l'assaut des forces spéciales",
   r:`Quatre heures du matin, heure de Paris. L'assaut dure onze minutes. Elle est vivante, déshydratée, une fracture au poignet. Deux ravisseurs tués, aucune perte de notre côté.<br><br>Vous la voyez descendre de l'avion à Villacoublay le lendemain. Elle ne vous regarde pas. Plus tard, on apprendra qu'un de nos hommes a été blessé au visage, et cette information-là mettra trois jours à sortir.`,
   e:{sec:{defense:16,interieure:4},social:-5,
      groups:{retraites:9,ruraux:8,jeunes:-7,salaries:-4}},
   axe:{autorite:2}, pose:"posture_fiere"},
  {l:"Négocier par les canaux alliés, sans jamais l'admettre",
   r:`Six semaines. Elle rentre un mardi, discrètement, sans avion présidentiel et sans photo.<br><br>Officiellement, la France ne paie pas de rançon. Officieusement, un partenaire régional a versé une somme que personne ne confirmera jamais, et que le rapport annuel d'une ONG estimera à neuf millions d'euros. Vous n'avez pas menti. Vous n'avez pas dit la vérité non plus.`,
   e:{budget:-9,sec:{defense:-4},economie:3,
      groups:{salaries:8,jeunes:6,patrons:4}},
   pose:"posture_europeenne"},
  {l:"Rendre l'affaire publique et refuser toute rançon",
   r:`Vous parlez à vingt heures. Vous dites le mot « rançon », le mot « jamais », et vous citez ses trois mots à elle.<br><br>Le pays vous suit. Sa fille, elle, publie un message d'une ligne : « Il a choisi le principe. Je choisis ma mère. » Elle a dix-sept ans et elle vient de résumer votre mandat mieux que vos conseillers.`,
   e:{sec:{defense:8},social:6,groups:{jeunes:9,salaries:6,retraites:-6}},
   pose:"posture_climat", rival:-5}
 ]},

{id:"m3", ch:1, mois:3, ico:"🕯️", t:"Le fait divers",
 intro:[
  [()=>S.flags.posture_fiere, `Vous rentrez du sommet avec une petite phrase qui a bien
    marché. Le pays, lui, n'a pas regardé le sommet.`],
  [()=>S.flags.posture_climat, `Votre discours sur le climat a fait la une deux jours.
    Le troisième, c'est autre chose qui l'a prise.`],
  [()=>S.flags.ligne_autorite, `Vous aviez promis la fermeté dès le premier jour. On va
    vous demander des comptes plus vite que prévu.`]
 ],
 d:`Une jeune femme de vingt-trois ans, tuée par son ancien compagnon. Trois plaintes déposées,
    trois classements sans suite. Le dossier était dans une armoire d'un commissariat de
    sous-préfecture.<br><br>
    En deux jours, c'est devenu autre chose qu'un drame : c'est devenu une accusation. Sa sœur
    parle à toutes les caméras, et elle parle bien.<br><br>
    Votre ministre de la Justice vous demande une décision avant midi.`,
 o:[
  {l:"Ordonner un audit de toutes les plaintes classées",
   r:`Quatre-vingt-douze mille dossiers rouverts. L'inspection générale met six semaines à livrer un premier état des lieux et il est mauvais : dans un cas sur cinq, la procédure n'a pas été suivie.<br><br>Les syndicats de police protestent contre « la suspicion généralisée ». La sœur de la victime, elle, envoie une lettre manuscrite à l'Élysée. Vous la gardez.`,
   e:{budget:-7,sec:{interieure:16},soc:{pauvrete:8},groups:{salaries:9,jeunes:8}},
   pose:"audit_plaintes"},
  {l:"Recevoir la famille, sans caméras",
   r:`Une heure quarante dans le salon vert. Personne n'a filmé, personne n'a rien fait fuiter, et c'est peut-être la seule chose vraiment réussie de votre mois.<br><br>En sortant, la sœur parle aux journalistes massés dehors : « Il a écouté. On verra ce qu'il fait. » Ce n'est pas un blanc-seing. C'est du temps qu'on vous accorde.`,
   e:{social:6,groups:{salaries:7,retraites:6,jeunes:5}},
   pose:"empathie"},
  {l:"Annoncer un durcissement pénal immédiat",
   r:`Le texte est prêt en dix jours, ce qui est un record et se voit. Les peines planchers reviennent, les délais de comparution se raccourcissent.<br><br>Vous gagnez douze points chez les plus de soixante ans. Le Conseil constitutionnel censurera deux articles sur sept en juin, et la sœur de la victime dira à la télévision qu'on s'est servi d'elle. Les deux vous coûteront.`,
   e:{sec:{interieure:20},social:-5,groups:{retraites:12,ruraux:9,jeunes:-7}},
   axe:{autorite:2}, pose:"durcissement"}
 ]},

{id:"m4", ch:1, mois:4, ico:"🧮", t:"La vraie feuille",
 intro:[
  [()=>S.flags.ligne_sociale, `Votre plan de relance tourne depuis trois mois. Personne ne
    vous a encore dit combien il coûtait vraiment.`],
  [()=>S.flags.ligne_liberale, `Vous avez fait campagne sur le sérieux budgétaire. C'est
    précisément pour ça que ce rendez-vous va être désagréable.`],
  [()=>S.flags.durcissement, `Le durcissement pénal que vous avez annoncé coûte cher :
    des places de prison, des magistrats, des greffiers. Bercy a compté.`]
 ],
 d:`Bercy, sixième étage. Le directeur du Trésor a apporté deux documents : celui qu'il a
    remis à la presse, et l'autre.<br><br>
    « Les prévisions de croissance sur lesquelles votre programme a été chiffré étaient
    optimistes. De sept milliards. Personne ne vous a menti, monsieur le Président : personne
    n'a voulu être celui qui vous le dirait pendant la campagne. »<br><br>
    Il attend. Dehors, il pleut sur la Seine.`,
 o:[
  {l:"Rendre le trou public dès demain",
   r:`Conférence de presse à onze heures, tableau projeté, sept milliards écrits en toutes lettres. Vous ne désignez personne.<br><br>Les marchés baissent de 2 %, puis se reprennent. Un sondage sorti le surlendemain donne un chiffre étrange : 61 % des Français vous jugent « plus honnête que ses prédécesseurs », et 58 % « moins compétent ». Vous vivrez avec les deux.`,
   e:{budget:4,economie:-4,cac:-4,social:6,groups:{jeunes:9,salaries:6,patrons:-5}},
   pose:"franchise", rival:-6},
  {l:"Combler discrètement, sans rien annoncer",
   r:`Trois arbitrages nocturnes, deux gels de crédits, une réserve de précaution qu'on ne reconstituera pas. Le trou est bouché et personne n'a rien vu.<br><br>Enfin, presque : Camille Reyes publie une brève de quinze lignes en page 14. Elle ne dit pas grand-chose. Mais elle prouve qu'elle regardait, et vous savez désormais qu'elle continuera.`,
   e:{budget:6,soc:{pouvoir:-8},groups:{salaries:-6,retraites:-5}},
   pose:"silence", rival:5},
  {l:"Maintenir le programme et emprunter",
   r:`Vous refusez d'arbitrer et vous assumez : les engagements de campagne seront tenus, financés par la dette. Vos électeurs applaudissent.<br><br>L'agence de notation place la France sous « perspective négative » onze jours plus tard. Ce n'est pas une dégradation. C'est un avertissement, poli, à en-tête, que votre successeur relira.`,
   e:{dette:8,soc:{pouvoir:10},groups:{salaries:8,jeunes:7,patrons:-8}},
   axe:{social:1}, pose:"emprunt"}
 ]},

{id:"m5", ch:1, mois:5, ico:"🚜", t:"Le déplacement",
 intro:[
  [()=>S.axes.autorite>=3, `Le service d'ordre a doublé les effectifs depuis vos annonces
    sécuritaires. Ça se voit. Et les gens le voient.`],
  [()=>S.flags.silence, `Vous n'avez rien dit sur le trou budgétaire. La presse locale, elle,
    a fait le calcul. Elle sera là.`],
  [()=>S.flags.franchise, `Vous avez tout dit sur les comptes il y a un mois. On vous en veut
    un peu, on vous respecte un peu. On verra ce qui l'emporte.`],
  [()=>S.flags.ligne_sociale, `La maire vous accueille avec le sourire : votre plan de relance
    a sauvé deux classes dans le canton.`]
 ],
 d:`Une commune de onze cents habitants, choisie parce qu'elle est « représentative ». La
    maire vous fait visiter l'école qui ferme une classe et la maison de santé qui n'a pas
    trouvé de médecin depuis deux ans.<br><br>
    Derrière la barrière, une centaine de personnes. Certaines applaudissent, d'autres non.
    Un homme crie une phrase que les micros captent parfaitement : « Vous êtes venu pour la
    photo ! »<br><br>
    Le service d'ordre attend votre signe pour vous faire remonter en voiture.`,
 o:[
  {l:"Aller lui parler, seul, devant les caméras",
   r:`Vous avez marché vers lui. Il a crié encore quelques secondes, puis il s'est arrêté, parce que personne ne crie longtemps face à quelqu'un qui écoute.<br><br>La conversation a duré neuf minutes. Il travaille de nuit dans une plateforme logistique, il fait cinquante kilomètres par jour. La séquence tourne en boucle le soir, et pour une fois elle ne vous dessert pas.`,
   e:{social:8,groups:{ruraux:14,salaries:8,jeunes:5}},
   pose:"courage_terrain", rival:-7},
  {l:"Répondre par une annonce : un plan pour les communes rurales",
   r:`Deux milliards, cent quatre-vingts mesures, un nom de plan qu'on aura oublié dans six mois.<br><br>Les maires ruraux, eux, n'oublieront pas : c'est la première fois depuis longtemps qu'on leur promet quelque chose de chiffré. Reste à le verser. L'Association des maires de France a déjà annoncé qu'elle publierait un décompte annuel.`,
   e:{budget:-12,soc:{sante:10,educ:8},groups:{ruraux:16,salaries:4}},
   pose:"plan_rural"},
  {l:"Remonter en voiture et tenir le programme",
   r:`La portière se referme, le cortège part, et l'image fait onze secondes au journal de vingt heures : un homme qui crie, une voiture qui s'éloigne.<br><br>Elle sera rediffusée à chaque crise pendant les cinq années qui viennent. Vos adversaires n'auront pas besoin d'en fabriquer d'autres.`,
   e:{groups:{ruraux:-11,salaries:-5,jeunes:-4}},
   pose:"evitement", rival:8}
 ]},

{id:"m6", ch:1, mois:6, ico:"📜", t:"Le premier texte",
 intro:[
  [()=>S.flags.evitement, `On n'a pas oublié la voiture. La séquence tourne encore, et vos
    députés se la font resservir dans chaque circonscription.`],
  [()=>S.flags.courage_terrain, `L'image de vous, seul face à cet homme, a fait plus pour
    votre majorité que trois mois de communication. Elle tient mieux qu'avant.`],
  [()=>S.flags.plan_rural, `Votre plan pour les communes rurales a rallié une quinzaine de
    députés du centre. Vous en aurez besoin ce soir.`]
 ],
 d:`Votre loi arrive dans l'hémicycle. Quatorze cents amendements, dont neuf cents déposés
    par une opposition qui ne cherche pas à améliorer le texte mais à le noyer.<br><br>
    Votre majorité tient à quatre voix. Le président du groupe vient vous voir : « On peut
    tenir trois nuits. Après, les nôtres commenceront à rentrer chez eux, et là, on perd
    un vote sur deux. »<br><br>
    Julien Ferrand, lui, a promis de siéger jusqu'au bout.`,
 o:[
  {l:"Négocier avec les centristes, quitte à vider le texte",
   r:`Trente-six heures de couloir. Le texte passe à quatre-vingt-onze voix, amputé de ses deux articles les plus ambitieux.<br><br>Vous avez une loi. Vous n'avez pas la loi que vous vouliez, et votre propre camp le sait : trois députés de votre majorité se sont abstenus en le disant tout haut.`,
   e:{budget:-5,economie:4,social:3,groups:{patrons:7,salaries:-4}},
   pose:"negociateur"},
  {l:"Tenir les trois nuits et faire voter tel quel",
   r:`Soixante-douze heures, quatorze cents amendements, une séance qui s'achève à cinq heures vingt du matin. Le texte passe entier, à six voix.<br><br>Vos députés sont épuisés et fiers, ce qui est un mélange précieux et rare. On vous croit capable de tenir. C'est un capital : il se dépense.`,
   e:{social:5,economie:5,groups:{salaries:7,jeunes:6,patrons:-4}},
   pose:"tenu_bon", rival:-5},
  {l:"Engager la responsabilité du gouvernement",
   r:`Le Premier ministre monte à la tribune à seize heures dix. La séance est suspendue trois fois. Le texte est adopté sans vote.<br><br>Dehors, huit mille personnes place de la Concorde le soir même — ce qui n'est rien. Mais le mot est lâché, il est dans tous les titres, et il ne vous quittera plus : passage en force.`,
   e:{economie:7,budget:4,social:-9,groups:{salaries:-10,jeunes:-9,patrons:9}},
   axe:{autorite:2}, pose:"49_3_precoce", rival:12}
 ]},

/* ─────────── mois 7 · la première épreuve, selon votre ligne ─────────── */
{id:"c2soc", ch:2, mois:7, si:()=>S.flags.ligne_sociale, ico:"🧾", t:"La facture",
 d:`Cinq mois que l'argent coule. Ce matin, le directeur du Budget est venu sans rendez-vous.
    Il n'a pas apporté de dossier, juste une feuille.<br><br>
    « À ce rythme, nous empruntons pour payer les mesures que vous avez annoncées en janvier.
    Les marchés ont commencé à poser des questions. Une journaliste de la rédaction économique
    en pose aussi — elle a les mêmes chiffres que moi. »<br><br>
    Elle s'appelle Camille Reyes. Retenez ce nom.`,
 o:[
  {l:"Assumer publiquement le coût",
   r:`Vous donnez les chiffres vous-même, en préambule d'une conférence de presse où personne ne les attendait.<br><br>L'exercice vous coûte une matinée de commentaires acides et vous rapporte quelque chose de moins mesurable : Camille Reyes range son papier. Elle en écrira un autre, plus tard, et elle vous préviendra avant.`,
   e:{budget:-4,soc:{pouvoir:10},groups:{salaries:8,jeunes:6,patrons:-8}},
   axe:{social:1}, pose:"franchise"},
  {l:"Financer par un impôt exceptionnel sur les hauts patrimoines",
   r:`Contribution exceptionnelle, 3 % au-dessus de dix millions, votée en urgence.<br><br>Le rendement est réel. La fuite aussi : quatre cents dossiers de départ fiscal en six semaines, un chiffre que Bercy transmet sans commentaire. Julien Ferrand tient son sujet pour les trois mois qui viennent, et il le tiendra bien.`,
   e:{budget:12,economie:-6,cac:-7,groups:{patrons:-16,salaries:9,jeunes:6}},
   axe:{social:2}, rival:6},
  {l:"Retarder discrètement l'application des mesures",
   r:`Un décret d'application qui ne sort pas, une circulaire qui se perd, deux dispositifs repoussés « pour raisons techniques ».<br><br>Les associations s'en aperçoivent en avril. Le mot « trahison » apparaît dans une tribune signée par onze organisations. Il ne quittera plus le vocabulaire de vos anciens soutiens.`,
   e:{budget:8,soc:{pouvoir:-12,pauvrete:-8},groups:{salaries:-11,jeunes:-9}},
   axe:{social:-1}, pose:"promesse_trahie", rival:10}
 ]},

{id:"c2eco", ch:2, mois:7, si:()=>S.flags.ligne_liberale, ico:"🏭", t:"Les corps intermédiaires",
 d:`Le plan d'économies a un nom de code et déjà des ennemis. Les préfets font remonter la
    même note depuis trois semaines : les collectivités ne suivront pas.<br><br>
    Dans le salon vert, huit présidents de région attendent. Le doyen prend la parole avant
    même que vous soyez assis : « Vous coupez nos dotations de douze pour cent. Nous fermerons
    des lignes de bus et des crèches, et nous dirons à qui la faute. »<br><br>
    Derrière eux, un homme se tait et sourit. Julien Ferrand, président du Grand Est.`,
 o:[
  {l:"Maintenir les coupes intégralement",
   r:`Douze pour cent, appliqués sans exception. Cent quarante lignes de bus supprimées à la rentrée, dix-sept crèches fermées, et chaque fermeture accompagnée d'un communiqué qui vous nomme.<br><br>Julien Ferrand fait le tour des communes concernées avec un tableau imprimé. Il ne parle pas de lui. Il lit vos chiffres à voix haute.`,
   e:{budget:10,soc:{pouvoir:-10,sante:-8},groups:{ruraux:-13,salaries:-8,patrons:9}},
   axe:{autorite:1,social:-1}, rival:12},
  {l:"Négocier des contrats région par région",
   r:`Huit contrats, huit trajectoires, huit signatures étalées sur quatre mois.<br><br>C'est laborieux, illisible, et ça fonctionne : l'effort budgétaire est réel sans qu'aucune région ne puisse crier au sacrifice. Les préfets vous en sont reconnaissants d'une manière qu'ils ne diront jamais publiquement.`,
   e:{budget:2,economie:4,groups:{ruraux:6,patrons:5}},
   axe:{social:0}, pose:"negociateur"},
  {l:"Reculer et préserver les dotations",
   r:`Les dotations sont maintenues. Les présidents de région sortent de l'Élysée en souriant, et l'un d'eux glisse aux caméras que « le dialogue a payé ».<br><br>Dans votre propre camp, le mot qui circule le lendemain est moins aimable : on parle d'un président qui « annonce puis retire ». C'est la deuxième fois. On compte.`,
   e:{budget:-8,groups:{ruraux:11,salaries:5,patrons:-9}},
   axe:{social:1}, pose:"recul_precoce", rival:7}
 ]},

{id:"c2sec", ch:2, mois:7, ico:"🚔", t:"Le contrôle de trop",
 d:`Une vidéo de quarante secondes tourne depuis hier soir. Un contrôle d'identité, un homme
    au sol, trois policiers. Onze millions de vues.<br><br>
    Votre ministre de l'Intérieur veut parler de « séquence tronquée ». Le procureur a ouvert
    une enquête. Devant le commissariat du quartier, deux cents personnes se sont assises en
    silence.<br><br>
    Camille Reyes, la journaliste, a déjà retrouvé deux autres vidéos du même équipage.`,
 o:[
  {l:"Suspendre les policiers et le dire",
   r:`Trois suspensions conservatoires annoncées à dix-huit heures, avant même les conclusions de l'IGPN.<br><br>Le quartier se calme dans la nuit. Les syndicats de police, eux, appellent à un rassemblement devant les commissariats et emploient le mot « lâchage ». Vous avez choisi votre camp, et les deux camps l'ont entendu.`,
   e:{sec:{interieure:-8},soc:{pauvrete:10},groups:{jeunes:13,retraites:-7,ruraux:-6}},
   axe:{autorite:-1}, pose:"franchise"},
  {l:"Soutenir vos forces de l'ordre sans réserve",
   r:`« Nos policiers font un travail difficile et je ne les laisserai pas juger sur quarante secondes. » La phrase est nette, elle est reprise partout, elle vous vaut une ovation en congrès syndical.<br><br>Trois jours plus tard, Camille Reyes publie les deux autres vidéos. Le même équipage. Vous ne saviez pas, et personne ne vous croira.`,
   e:{sec:{interieure:12},social:-7,groups:{retraites:10,ruraux:9,jeunes:-16}},
   axe:{autorite:2}, rival:5, pose:"ligne_ferme"},
  {l:"Renvoyer à l'enquête et ne rien dire",
   r:`« La justice fera son travail. » Vous répétez la formule quatre fois en trois jours.<br><br>Elle ne fâche personne et ne rassure personne. Le sit-in devant le commissariat dure onze jours de plus, faute d'interlocuteur. On commence à dire de vous que vous ne tranchez pas — c'est une réputation qui s'installe vite et se défait mal.`,
   e:{groups:{jeunes:-8,retraites:-4,salaries:-5}},
   axe:{autorite:0}, pose:"silence", rival:9}
 ]},

{id:"m8", ch:2, mois:8, ico:"🌡️", t:"Le mois d'août",
 intro:[
  [()=>S.flags.budget_ecolo||S.axes.ecologie>=2, `Vous avez mis l'écologie au centre. Cet
    été-là va vous dire si c'était de la conviction ou de la communication.`],
  [()=>S.flags.posture_climat, `Vous aviez dit au monde entier que le climat passait avant
    le reste. Le climat, lui, n'a pas attendu.`],
  [()=>valeur("climat")<45, `Les alertes s'accumulent depuis des mois dans des rapports que
    personne n'a ouverts. Celui-ci, vous allez le lire.`]
 ],
 d:`Quarante-trois degrés à Nîmes. Le pays est vide, les ministres sont en vacances, et
    c'est exactement le moment que choisissent les choses pour se casser.<br><br>
    Deux départements brûlent, une centrale doit réduire sa production faute d'eau de
    refroidissement, et un EHPAD a perdu quatre résidents en trois jours.<br><br>
    Votre directeur de cabinet vous appelle à six heures : « Vous rentrez, ou vous laissez
    le Premier ministre gérer ? La réponse à cette question, on vous la ressortira. »`,
 o:[
  {l:"Rentrer immédiatement et prendre la main",
   r:`Vous atterrissez à Nîmes à six heures du matin. Cellule de crise sur place, réquisition de deux Canadair supplémentaires, plan blanc dans quatre départements.<br><br>Le feu est maîtrisé en trois jours. Personne ne saura si c'est grâce à vous ou grâce au vent qui a tourné. Mais tout le monde aura vu que vous étiez là.`,
   e:{soc:{sante:14},cli:{eau:8,foret:8},budget:-8,
      groups:{retraites:11,ruraux:9,salaries:6}},
   pose:"presence", rival:-6},
  {l:"Laisser Matignon gérer et rester en retrait",
   r:`Le Premier ministre gère, plutôt bien d'ailleurs. Le dispositif fonctionne, les moyens arrivent.<br><br>Une seule image circule : une photo de vous, prise au téléobjectif, sur une terrasse. Elle est parfaitement anodine et parfaitement dévastatrice. Elle ressortira chaque été.`,
   e:{groups:{retraites:-9,ruraux:-8,salaries:-5}},
   pose:"absence", rival:9},
  {l:"Rentrer et annoncer un plan canicule permanent",
   r:`Un milliard six, climatisation des EHPAD, réserve hydraulique, cartographie des îlots de chaleur.<br><br>Les gériatres saluent, les préfets soufflent, et un climatologue résume à la radio : « C'est la première fois qu'on traite ça comme un problème permanent et non comme un accident. » La phrase vous suivra, en bien.`,
   e:{budget:-14,soc:{sante:18},cli:{eau:14,foret:10},
      groups:{retraites:13,jeunes:7,patrons:-5}},
   axe:{ecologie:1}, pose:"plan_canicule"}
 ]},

{id:"m9", ch:2, mois:9, ico:"🏫", t:"La rentrée",
 intro:[
  [()=>S.flags.absence, `Votre absence en août n'est pas passée. « Il était où ? » est devenu
    une phrase qu'on entend dans les cours d'école.`],
  [()=>S.flags.conflit_syndicats||S.axes.autorite>=3, `Les syndicats enseignants vous ont
    classé depuis longtemps. Ils ne viennent plus négocier, ils viennent constater.`],
  [()=>S.flags.budget_ecolo, `Vous avez sanctuarisé l'écologie l'an dernier. Les professeurs
    ont retenu ce que ça voulait dire pour eux.`]
 ],
 d:`Quatre mille postes non pourvus. Dans certains départements, on a recruté des contractuels
    en trois jours d'entretien pour tenir les classes.<br><br>
    La photo qui tourne, c'est celle d'une classe de CP avec trente-quatre élèves et une
    remplaçante de vingt-deux ans qui n'a jamais enseigné. Elle a accepté de témoigner, à
    visage découvert. Elle est très bien.<br><br>
    Les syndicats appellent à la grève dans dix jours.`,
 o:[
  {l:"Revaloriser les salaires enseignants",
   r:`Deux cent quarante euros nets mensuels, dès janvier. Le budget de l'Éducation devient le premier de l'État, ce qu'il était déjà, mais cette fois on le dit.<br><br>La grève est levée avant d'avoir commencé. Un syndicaliste concède au micro : « On ne s'y attendait pas. » C'est le meilleur compliment que vous recevrez cette année.`,
   e:{budget:-15,soc:{educ:26},groups:{salaries:11,jeunes:9,patrons:-6}},
   axe:{social:1}, pose:"revalo_profs", rival:-7},
  {l:"Réformer le recrutement, sans argent neuf",
   r:`Concours ouverts en licence, pré-recrutement, une nouvelle voie d'accès pour les reconversions.<br><br>La réforme est intelligente et gratuite, donc personne ne la remarque. Les postes seront pourvus dans trois ans si tout se passe bien. Vous ne serez peut-être plus là pour le voir.`,
   e:{soc:{educ:10},economie:3,groups:{jeunes:4,patrons:5,salaries:-4}},
   pose:"reforme_recrutement"},
  {l:"Dénoncer l'immobilisme des syndicats",
   r:`Vous parlez de « corporatisme » et de « blocage ». La formule fait un tabac chez vos soutiens et un carnage ailleurs.<br><br>La grève, qui devait mobiliser modestement, devient la plus suivie depuis quinze ans. Deux jours de classes perdues, des parents excédés, et un adversaire de plus qui ne vous quittera pas : la salle des profs.`,
   e:{soc:{educ:-8},social:-7,groups:{salaries:-12,jeunes:-8,patrons:10}},
   axe:{autorite:1}, pose:"conflit_syndicats", rival:9}
 ]},

{id:"m10", ch:2, mois:10, ico:"💶", t:"L'arbitrage",
 d:`La nuit du budget. Onze ministres, une seule enveloppe, et deux milliards à trouver
    quelque part.<br><br>
    À trois heures du matin, il ne reste que trois lignes en discussion : l'hôpital, la
    défense, la transition écologique. Chacun a de bons arguments et chacun sait que celui
    qui perd cette nuit ne rattrapera pas avant deux ans.<br><br>
    Tous se tournent vers vous. C'est votre budget, pas le leur.`,
 o:[
  {l:"Sanctuariser l'hôpital",
   r:`Cinq heures dix du matin. Vous tranchez pour la santé. Le ministre des Armées quitte la pièce sans un mot et donne sa démission trois semaines plus tard, « pour raisons personnelles ».<br><br>Les urgences recrutent. Le chef d'état-major, lui, écrit une lettre que Le Monde publiera en novembre.`,
   e:{soc:{sante:22,pauvrete:8},sec:{defense:-8},cli:{air:-6},
      groups:{retraites:12,salaries:9}},
   axe:{social:1}, pose:"budget_sante"},
  {l:"Sanctuariser la défense",
   r:`Vous tranchez pour les armées. La loi de programmation militaire est réévaluée de neuf milliards.<br><br>Vos alliés le remarquent, et c'est utile. Les fédérations hospitalières publient le lendemain une carte des services fermés dans l'année. Elle est très lisible et elle circulera longtemps.`,
   e:{sec:{defense:22,interieure:6},soc:{sante:-10},cli:{air:-6},
      groups:{retraites:8,ruraux:7,jeunes:-8}},
   axe:{autorite:1}, pose:"budget_defense"},
  {l:"Sanctuariser la transition écologique",
   r:`Vous tranchez pour le climat. C'est la première fois qu'un arbitrage budgétaire va dans ce sens en France, et les ONG le disent sans y croire tout à fait.<br><br>Deux ministres considèrent qu'ils ont perdu, et l'un d'eux le fera savoir en « off » dès le lendemain. Vous avez gagné une ligne dans les livres d'histoire et deux ennemis dans votre gouvernement.`,
   e:{cli:{air:20,eau:12,foret:8},sec:{defense:-8},soc:{sante:-8},
      groups:{jeunes:14,ruraux:-7,patrons:-5}},
   axe:{ecologie:2}, pose:"budget_ecolo"}
 ]},

{id:"m11", ch:2, mois:11, ico:"🇪🇺", t:"Bruxelles",
 intro:[
  [()=>S.dette>135, `Votre dette a franchi un seuil que les autres capitales surveillent.
    On vous accueille poliment, comme on accueille un dossier.`],
  [()=>S.flags.posture_europeenne, `Vous aviez promis de ne rien faire seul. On va vérifier
    ce que vaut la promesse quand elle coûte quelque chose.`],
  [()=>S.flags.refus_ue||S.axes.autorite>=3, `Votre réputation vous précède : on vous
    considère comme imprévisible. Certains y voient un défaut, d'autres un levier.`]
 ],
 d:`Conseil européen, deuxième jour. Le texte sur la table exige des trajectoires budgétaires
    contraignantes, et la France est nommément citée en annexe.<br><br>
    La chancelière vous prend à part dans un couloir : « Signez. Vous aurez trois ans avant
    que quiconque vérifie, et d'ici là vous aurez été réélu ou remplacé. » Elle sourit.
    Ce n'est pas une plaisanterie.<br><br>
    Vingt-six paires d'yeux vous attendent dans la salle.`,
 o:[
  {l:"Signer et assumer la contrainte",
   r:`Vous signez. Les marchés saluent, le spread se resserre de dix-huit points, et vous rentrez avec un texte qui vous liera pendant trois ans.<br><br>Dans l'avion, votre ministre des Finances est soulagé. Votre conseiller politique, lui, regarde par le hublot et ne dit rien du tout, ce qui est sa manière de désapprouver.`,
   e:{budget:7,economie:5,cac:6,soc:{pouvoir:-8},
      groups:{patrons:11,salaries:-7,ruraux:-5}},
   pose:"signature_ue"},
  {l:"Signer en obtenant une clause d'investissement vert",
   r:`Quatre heures de négociation pour une annexe de onze lignes : les investissements de transition sortent du calcul du déficit.<br><br>C'est technique, invisible, et ça vaut quinze milliards de marge sur trois ans. Deux autres pays s'y rallient dans la foulée. C'est votre première vraie victoire européenne.`,
   e:{budget:3,cli:{air:12,eau:6},economie:3,groups:{jeunes:9,patrons:4}},
   axe:{ecologie:1}, pose:"clause_verte", rival:-4},
  {l:"Refuser de signer",
   r:`Vous refusez. La salle est silencieuse, la conférence de presse est glaciale, et le mot « isolement » revient dans toutes les dépêches.<br><br>En France, on vous trouve courageux. Le lendemain, la Commission ouvre une procédure et l'agence de notation avance sa revue de trois mois. Vous avez gagné une image et perdu du temps.`,
   e:{pib:-1.2,economie:-7,cac:-9,dette:4,groups:{ruraux:12,jeunes:6,patrons:-13}},
   axe:{autorite:1}, pose:"refus_ue", rival:-8}
 ]},

{id:"m12", ch:2, mois:12, ico:"🥂", t:"La nuit des vœux",
 intro:[
  [()=>popularite()<40, `Une première année difficile. Sur le prompteur, le mot « ensemble »
    revenait onze fois : votre plume avait compris ce qu'il fallait réparer.`],
  [()=>S.rival>=45, `Julien Ferrand présentera ses propres vœux demain. Ils seront plus
    regardés que les vôtres, et vous le savez déjà.`]
 ],
 d:`Vingt heures dix, le trente et un décembre. Vous venez d'enregistrer vos vœux quand
    votre chef de cabinet entre sans frapper, ce qu'il n'a jamais fait.<br><br>
    Un immeuble a brûlé à Aubervilliers. Neuf morts, dont quatre enfants. Le bâtiment était
    frappé d'un arrêté de péril depuis dix-huit mois, et personne n'a relogé personne.<br><br>
    La diffusion est dans deux heures. Sur le prompteur, votre première phrase est :
    « Cette année a été celle du redressement. »`,
 o:[
  {l:"Tout réécrire : parler d'eux et de rien d'autre",
   r:`Six minutes sans un chiffre, sans un bilan. Vous nommez l'immeuble, la rue, et vous dites qu'un arrêté de péril de dix-huit mois est une faute de l'État.<br><br>L'audience est la plus forte depuis quinze ans pour des vœux. Le lendemain, deux préfets lancent un recensement des bâtiments dangereux sans attendre d'instruction. C'est ce genre de chose qu'on ne mesure pas et qui compte.`,
   e:{soc:{pauvrete:16,pouvoir:6},social:8,
      groups:{salaries:11,jeunes:12,ruraux:6,patrons:-5}},
   axe:{social:1}, pose:"voeux_humilite", rival:-11},
  {l:"Y aller cette nuit, annuler la diffusion",
   r:`Vous arrivez à une heure vingt du matin. Il n'y a pas de podium, pas de discours, juste un gymnase, des couvertures et des gens qui ne dorment pas.<br><br>Vous restez jusqu'à l'aube. Une femme vous dit une phrase que les caméras ne captent pas et que vous ne répéterez à personne. Les vœux ne seront jamais diffusés.`,
   e:{soc:{pauvrete:12},social:11,budget:-6,
      groups:{salaries:13,jeunes:11,ruraux:8,retraites:-4}},
   pose:"voeux_terrain", rival:-13},
  {l:"Diffuser les vœux prévus et traiter le dossier demain",
   r:`« Cette année a été celle du redressement. » La phrase passe à vingt heures, montée en boucle contre les images de l'incendie dès vingt-et-une heures.<br><br>Le rapprochement est fait par tout le monde, en quelques minutes, et il est imparable. Neuf morts et un président qui parle de redressement. Vous ne vous en débarrasserez pas cette année.`,
   e:{economie:4,soc:{pauvrete:-10},
      groups:{patrons:8,salaries:-11,jeunes:-13,retraites:4}},
   pose:"voeux_bilan", rival:9}
 ]},

/* ═══════════ ANNÉE II ═══════════ */

{id:"m13", ch:3, mois:13, ico:"🚧", t:"Le barrage",
 intro:[
  [()=>S.flags.evitement||S.flags.absence, `On vous reproche déjà de ne pas être là quand
    ça compte. Cette nuit, ça comptait.`],
  [()=>S.axes.autorite>=3, `Les consignes de fermeté que vous avez données aux préfets sont
    en vigueur depuis des mois. Elles vont être relues ligne par ligne.`]
 ],
 d:`Il était vingt-trois ans. Il tenait une pancarte sur un rond-point de la Sarthe depuis
    six jours, avec une trentaine d'autres, contre le prix du carburant et pour des choses
    plus difficiles à écrire sur une pancarte.<br><br>
    Un poids lourd a forcé le passage à quatre heures du matin. Le chauffeur dit qu'il n'a
    rien vu. Il y a une vidéo, et sur la vidéo, on voit.<br><br>
    À midi, il y avait quarante blocages dans le pays. À dix-huit heures, deux cents.`,
 o:[
  {l:"Aller sur le rond-point, dès demain, sans service d'ordre",
   r:`Onze heures du matin, cinq degrés, un brasero. Vous restez deux heures. On vous engueule, beaucoup, puis on vous parle.<br><br>Le père du jeune homme refuse de vous serrer la main devant les caméras, et il a raison de le faire. Mais il vous parle vingt minutes à l'écart. Le soir, le nombre de blocages cesse d'augmenter pour la première fois.`,
   e:{social:10,soc:{pouvoir:6},groups:{ruraux:15,salaries:11,jeunes:7}},
   pose:"terrain_regulier", rival:-12},
  {l:"Geler la taxe et recevoir une délégation",
   r:`Le gel est annoncé à dix-huit heures. C'est un renoncement de deux milliards et un aveu : la trajectoire carbone est suspendue.<br><br>Les blocages se vident en quatre jours. Les associations environnementales parlent de « capitulation », et elles n'ont pas tort. Vous avez acheté la paix sociale avec une monnaie qui n'était pas la vôtre : celle de la décennie suivante.`,
   e:{budget:-13,cli:{air:-10},soc:{pouvoir:14},
      groups:{ruraux:13,salaries:9,jeunes:-6}},
   axe:{ecologie:-1}, pose:"annonce_choc", rival:-6},
  {l:"Faire évacuer les ronds-points avant qu'un autre meure",
   r:`Quatre heures du matin, deux cents ronds-points, huit mille gendarmes. Cent quarante interpellations, dix-neuf blessés dont quatre gendarmes.<br><br>À sept heures, le pays est déblayé. À huit heures, les images sont partout : des retraités tirés par les bras devant un brasero éteint. Vous avez rétabli la circulation et vous avez fabriqué un symbole.`,
   e:{sec:{interieure:14},social:-13,
      groups:{ruraux:-18,jeunes:-11,retraites:8,patrons:9}},
   axe:{autorite:2}, pose:"evacuation", rival:13}
 ]},

{id:"c3dure", ch:3, mois:14, si:()=>S.axes.autorite>=2, ico:"🔥", t:"Un million dans la rue",
 d:`Ils étaient trois cent mille en octobre. Ils sont un million aujourd'hui, et ce n'est plus
    un cortège, c'est un pays. Raffineries bloquées, trains à l'arrêt, lycées barricadés.<br><br>
    À vingt-trois heures, le Premier ministre vous appelle depuis Matignon : « Nous n'avons plus
    que trois options et vous les connaissez. Je vous demande une chose : ne décidez pas ce soir
    en regardant les chaînes d'info. »<br><br>
    Sur l'écran coupé du son, Julien Ferrand parle à un plateau conquis.`,
 o:[
  {l:"Passer en force par le 49.3",
   r:`Seize heures dix. Le Premier ministre lit les quatre lignes réglementaires dans un hémicycle debout qui hurle. La séance est suspendue trois fois.<br><br>Le texte est adopté sans vote. Le soir, huit cent mille personnes défilent. Trois députés de votre majorité annoncent qu'ils ne voteront plus rien. Vous avez votre loi et vous avez perdu votre majorité morale.`,
   e:{budget:7,social:-13,sec:{interieure:-6},groups:{salaries:-15,jeunes:-13,patrons:11}},
   axe:{autorite:2}, pose:"passage_force", rival:15},
  {l:"Ouvrir une conférence sociale",
   r:`Huit semaines de négociation, quatorze organisations autour d'une table, et un relevé de conclusions de trente-deux pages.<br><br>C'est lent, coûteux, et la rue se vide progressivement sans qu'aucun camp n'ait été humilié. Un vieux syndicaliste confie à un journaliste : « Ça faisait vingt ans qu'on ne nous avait pas fait travailler comme ça. »`,
   e:{budget:-9,soc:{pouvoir:12,pauvrete:8},groups:{salaries:12,jeunes:7,patrons:-8}},
   axe:{social:1}, pose:"negociateur", rival:-4},
  {l:"Retirer le texte",
   r:`Vous retirez à dix-neuf heures. Le pays s'arrête de bloquer dans la nuit.<br><br>Dans votre camp, c'est un séisme : on a tenu six semaines sous les huées pour rien. Votre ministre du Travail démissionne le lendemain matin, par SMS. Ferrand résume en une phrase : « Il cède quand on pousse. » Elle vous poursuivra.`,
   e:{budget:-6,economie:-6,cac:-5,groups:{salaries:9,patrons:-13,ruraux:-4}},
   axe:{autorite:-2}, pose:"recul_majeur", rival:11}
 ]},

{id:"c3negocie", ch:3, mois:14, si:()=>S.axes.social>=1, ico:"🤝", t:"La table ronde",
 d:`Vous avez tenu à ce que ça se passe ici, dans la salle des fêtes, sous les lustres. Syndicats
    d'un côté, patronat de l'autre, et vous au milieu — la position la moins confortable.<br><br>
    À quatre heures du matin, il reste un point de blocage et deux hommes qui ne se regardent
    plus. La secrétaire générale de la CFDT pousse une feuille vers vous : « Signez ça et nous
    sortons ensemble annoncer un accord. Ne signez pas, et nous sortons séparément. »<br><br>
    La feuille coûte six milliards.`,
 o:[
  {l:"Signer l'accord",
   r:`Six milliards, une signature à quatre heures vingt du matin, et une photo de vous entre la CFDT et le Medef qui fait la une partout.<br><br>C'est cher. C'est aussi la première fois depuis longtemps qu'un accord est signé plutôt qu'imposé, et les commentateurs, qui ne s'y attendaient pas, cherchent leurs mots.`,
   e:{budget:-11,soc:{pouvoir:16,pauvrete:10},social:6,groups:{salaries:14,jeunes:8,patrons:-6}},
   axe:{social:1}, pose:"accord_signe", rival:-8},
  {l:"Proposer un accord réduit de moitié",
   r:`Trois milliards au lieu de six. Deux organisations signent, deux refusent, la CGT claque la porte.<br><br>L'accord existe, il est bancal, il tiendra. Personne ne crie victoire et personne ne crie à la trahison. C'est le genre de résultat dont on ne fait pas des affiches.`,
   e:{budget:-5,soc:{pouvoir:7},groups:{salaries:5,patrons:-3}},
   pose:"demi_accord"},
  {l:"Refuser et renvoyer chacun à ses responsabilités",
   r:`Vous quittez la salle à quatre heures et demie sans signer. Les deux camps sortent séparément et se contredisent devant les caméras.<br><br>Le conflit reprend dix jours plus tard, plus dur, sans plus personne pour arbitrer. Vous avez économisé six milliards et brûlé le seul canal de discussion qui existait.`,
   e:{budget:3,economie:4,social:-8,groups:{salaries:-12,patrons:10,jeunes:-6}},
   axe:{autorite:1,social:-1}, rival:9}
 ]},

{id:"c3faible", ch:3, mois:14, ico:"🪧", t:"Le pays vous échappe",
 d:`Ce n'est pas une grève. C'est plus diffus, plus inquiétant : des ronds-points occupés, des
    mairies qui démissionnent en bloc, des maires qui rendent leur écharpe devant les caméras.<br><br>
    Personne ne demande rien de précis. Un sondage tombe à dix-neuf heures : soixante-huit pour
    cent des Français estiment que « le pouvoir ne décide plus rien ».<br><br>
    Julien Ferrand a annoncé ce matin qu'il quittait son parti pour « fonder autre chose ».`,
 o:[
  {l:"Une allocution solennelle : reprendre la main",
   r:`Vingt heures, douze minutes, sans prompteur. Vous reconnaissez le désarroi, vous fixez trois caps, vous ne promettez rien de chiffré.<br><br>Dix-neuf millions de téléspectateurs. Le mouvement ne s'arrête pas, mais il change de nature : on recommence à discuter de contenu plutôt que de vous. C'est déjà beaucoup.`,
   e:{social:5,groups:{salaries:6,retraites:7,ruraux:5,jeunes:4}},
   axe:{autorite:1}, pose:"reprise_main", rival:-6},
  {l:"Lancer un grand débat national",
   r:`Dix mille réunions, deux millions de contributions, quatre mois d'agenda.<br><br>C'est un pari sur le temps et il fonctionne à moitié : la colère se canalise, mais les attentes créées ne seront pas toutes satisfaites, et on vous le rappellera. Reste une chose vraie : personne n'a été empêché de parler.`,
   e:{budget:-7,social:8,groups:{ruraux:10,salaries:7,jeunes:5,patrons:-5}},
   axe:{social:1}, pose:"grand_debat", rival:-3},
  {l:"Faire évacuer les blocages",
   r:`Trois nuits d'opérations, mille deux cents interpellations, quarante-sept blessés dont onze forces de l'ordre.<br><br>Les ronds-points sont dégagés le jeudi. Le vendredi, une vidéo d'un retraité au sol tourne partout. Vous avez rétabli l'ordre et fabriqué un martyre, ce qui est le marché habituel de ce genre de décision.`,
   e:{sec:{interieure:14},social:-11,groups:{ruraux:-14,jeunes:-11,retraites:8,patrons:7}},
   axe:{autorite:2}, pose:"evacuation", rival:13}
 ]},

/* ─────────── CHAPITRE IV · MI-MANDAT ─────────── */
{id:"c4remaniement", ch:4, mois:20, ico:"🔄", t:"Le remaniement",
 d:`Deux ans. La moitié du chemin, et le moment où les présidents changent d'équipe pour faire
    croire qu'ils changent de politique.<br><br>
    Votre Premier ministre le sait : il a posé sa lettre sur la table sans un mot. Trois noms
    circulent pour le remplacer — un technicien, une figure sociale, un homme d'ordre.<br><br>
    Dans le même temps, l'institut de sondage vous transmet une note confidentielle : le
    mouvement de Julien Ferrand est crédité de vingt-six pour cent des intentions de vote.`,
 o:[
  {l:"Nommer un technicien : gérer, ne plus promettre",
   r:`Un inspecteur des finances de cinquante-quatre ans, connu de personne, qui parle en tableaux.<br><br>Les marchés adorent, les militants s'effondrent. En six mois il redresse trois dossiers que personne n'avait su tenir et il perd toutes les batailles de communication. C'est exactement ce que vous aviez demandé.`,
   e:{economie:8,budget:5,cac:4,social:-4,groups:{patrons:9,salaries:-5}},
   pose:"pm_technicien"},
  {l:"Nommer une figure sociale : reprendre la gauche",
   r:`Une ancienne syndicaliste devenue députée, respectée jusque chez ses adversaires.<br><br>La nomination réveille votre électorat d'origine et fait grincer Bercy. Elle pose une condition en acceptant : elle veut arbitrer elle-même sur la santé. Vous acceptez. Vous ne le regretterez pas, mais ça vous coûtera.`,
   e:{soc:{pouvoir:12,pauvrete:12},budget:-8,groups:{salaries:11,jeunes:9,patrons:-10}},
   axe:{social:2}, pose:"pm_social"},
  {l:"Nommer un homme d'ordre : couper l'herbe sous le pied de Ferrand",
   r:`Un préfet devenu ministre, réputé pour ne jamais reculer.<br><br>Ferrand perd son monopole sur l'autorité et cela se voit dans les enquêtes. Mais votre aile gauche se disloque : deux ministres démissionnent en trois semaines, et l'un d'eux dit en partant que « ce n'est plus le même gouvernement ». Il a raison.`,
   e:{sec:{interieure:16},social:-6,groups:{retraites:11,ruraux:10,jeunes:-12}},
   axe:{autorite:2}, pose:"pm_ordre", rival:-8}
 ]},

{id:"c4censure", ch:4, mois:20, si:()=>S.flags.passage_force||S.flags.evacuation, ico:"⚖️", t:"La motion de censure",
 d:`Il manque neuf voix à l'opposition. Neuf députés qui n'ont pas encore dit ce qu'ils feraient,
    et que tout le monde appelle depuis quarante-huit heures.<br><br>
    Votre directeur de cabinet a fait le compte des demandes : une sous-préfecture sauvée, deux
    lignes ferroviaires, un hôpital de proximité. « Ça se paie, monsieur le Président. Mais ça
    se paie une seule fois. »<br><br>
    Ferrand, lui, a déjà écrit son discours de l'après.`,
 o:[
  {l:"Acheter les voix, une par une",
   r:`Une sous-préfecture sauvée, deux lignes ferroviaires, un hôpital de proximité, et neuf députés qui trouvent finalement que la censure serait excessive.<br><br>La motion échoue à sept voix. Le coût réel apparaîtra dans le budget de l'année suivante, ligne par ligne, et un journaliste finira par faire l'addition.`,
   e:{budget:-14,economie:-3,groups:{ruraux:9,salaries:-6,patrons:-7}},
   pose:"marchandage", rival:6},
  {l:"Aller au bras de fer, sans rien céder",
   r:`Vous ne recevez personne, vous ne promettez rien. Le vote a lieu un jeudi à vingt-trois heures.<br><br>La motion échoue à quatre voix, sans que personne sache vraiment pourquoi. Vous avez tenu, vous n'avez rien payé, et vous avez découvert que votre majorité tenait à quatre personnes dont vous ignoriez les noms.`,
   e:{social:-8,groups:{salaries:-9,jeunes:-7,patrons:12,retraites:5}},
   axe:{autorite:2}, pose:"bras_de_fer", rival:10},
  {l:"Prendre les devants : engager votre responsabilité et proposer un référendum",
   r:`Vous annoncez le référendum avant le vote de la motion, ce qui prend tout le monde de court, y compris votre propre camp.<br><br>La censure devient sans objet. Ferrand, qui avait préparé un discours de victoire, doit faire campagne sur une question que vous avez choisie. C'est le meilleur coup politique de votre mandat.`,
   e:{social:9,budget:-5,groups:{salaries:7,jeunes:10,ruraux:8,patrons:-6}},
   axe:{social:1}, pose:"referendum", rival:-10,
   si:()=>popularite()>42}
 ]},

/* ─────────── CHAPITRE V · LA CRISE MAJEURE ───────────
   La crise frappe là où vous avez le moins investi.                      */
{id:"c5eco", ch:5, mois:26, si:()=>talonAchille()==="economie", ico:"💥", t:"Le jour où tout s'arrête",
 d:`Un fonds d'investissement a fait sauter la banque. Pas la vôtre : une banque régionale, dont
    personne ne connaissait le nom hier et dont tout le monde parle ce matin.<br><br>
    À neuf heures, deux autres établissements suspendent leurs retraits. À onze heures, des files
    se forment devant les distributeurs. Le gouverneur de la Banque de France ne prend pas de
    gants : « Vous avez jusqu'à ce soir. Demain il sera trop tard, et ce sera vrai pour tout
    le monde. »`,
 o:[
  {l:"Garantir tous les dépôts, quoi qu'il en coûte",
   r:`Allocution à vingt-deux heures : « Pas un épargnant français ne perdra un euro. » La phrase est reprise en boucle.<br><br>Les files disparaissent dès le lendemain matin. Vingt-deux milliards engagés, la dette bondit, et le système tient. Trois ans plus tard, l'État aura récupéré une partie de la mise. Personne ne s'en souviendra.`,
   e:{pib:0.6,budget:-22,dette:14,economie:9,cac:8,groups:{salaries:12,retraites:11,patrons:9}},
   pose:"sauvetage", rival:-6},
  {l:"Laisser la banque tomber, sauver les épargnants seuls",
   r:`La banque est mise en résolution. Les dépôts sont garantis, les actionnaires et les créanciers juniors perdent tout.<br><br>C'est orthodoxe, c'est juste, et ça déclenche deux jours de panique supplémentaires. Quatorze mille salariés du groupe apprennent leur sort par la presse. La contagion est évitée de justesse.`,
   e:{pib:-1.6,budget:-9,economie:-8,cac:-12,groups:{patrons:-14,salaries:5,retraites:6}},
   axe:{social:1}},
  {l:"Nationaliser et faire payer les actionnaires",
   r:`Nationalisation par ordonnance, actionnaires dilués à zéro, dirigeants révoqués.<br><br>Le pays approuve massivement. La Bourse de Paris perd huit pour cent en deux séances et deux banques étrangères réduisent leur exposition à la France. Vous avez fait justice, et la justice a un prix affiché en temps réel.`,
   e:{pib:-2,budget:-13,economie:-4,cac:-16,soc:{pauvrete:10},
      groups:{salaries:14,jeunes:9,patrons:-20}},
   axe:{social:2}, rival:5, pose:"nationalisation"}
 ]},

{id:"c5sec", ch:5, mois:26, si:()=>talonAchille()==="securite", ico:"🚨", t:"Vingt-deux heures quarante",
 d:`L'attaque a duré six minutes. Le bilan provisoire est sur la table depuis une heure et vous
    ne l'avez pas encore retourné.<br><br>
    Le ministre de l'Intérieur parle vite, trop vite. Le directeur de la DGSI, lui, dit une phrase
    que vous n'oublierez pas : « Nous les avions signalés. Il y a onze mois. Le dossier a été
    classé faute d'effectifs. »<br><br>
    Camille Reyes a déjà le numéro du dossier.`,
 o:[
  {l:"Décréter l'état d'urgence",
   r:`Signé à trois heures du matin, en vigueur à l'aube. Perquisitions administratives, assignations, rassemblements interdits.<br><br>Le pays vous soutient à soixante-douze pour cent la première semaine. À la sixième, la Défenseure des droits recense quatre cents cas de perquisitions sans lien avec le terrorisme. La courbe du soutien s'inverse exactement là.`,
   e:{sec:{interieure:24},social:-12,budget:-10,
      groups:{retraites:14,ruraux:11,jeunes:-17}},
   axe:{autorite:2}, pose:"etat_urgence"},
  {l:"Unité nationale, deuil, et la vérité sur le dossier classé",
   r:`Vous annoncez les faits, y compris le signalement classé onze mois plus tôt, et vous dites que c'est une défaillance de l'État.<br><br>C'est un aveu inhabituel dans ces circonstances. Le directeur de la DGSI vous en remerciera privément : il n'aura pas à porter seul ce que personne n'a voulu porter.`,
   e:{sec:{interieure:8},social:8,groups:{salaries:9,jeunes:7,retraites:8,ruraux:6}},
   axe:{autorite:0}, pose:"franchise", rival:-9},
  {l:"Frapper à l'étranger dans les quarante-huit heures",
   r:`Quatre Rafale, deux cibles, une frappe à trois heures du matin, heure locale.<br><br>Les objectifs sont détruits. Deux semaines plus tard, une ONG documente sept victimes civiles. Le ministère parle de « dommages en cours d'évaluation », formule qui ne sera jamais suivie d'une évaluation.`,
   e:{sec:{defense:22,interieure:6},budget:-14,economie:-4,
      groups:{retraites:12,ruraux:9,jeunes:-9}},
   axe:{autorite:2}, pose:"riposte"}
 ]},

{id:"c5cli", ch:5, mois:26, si:()=>talonAchille()==="climat", ico:"🏜️", t:"L'été sans eau",
 d:`Quatre-vingt-douze départements en restriction. Dans le Sud, des communes entières sont
    livrées par camion-citerne depuis trois semaines.<br><br>
    Le préfet du Vaucluse vous appelle directement, ce qui ne se fait pas : « Monsieur le
    Président, j'ai des agriculteurs qui pompent la nuit dans les rivières interdites et des
    maires qui me demandent s'ils doivent les dénoncer. Dites-moi ce que je réponds. »<br><br>
    Il fait quarante-et-un degrés à Avignon. Il est neuf heures du matin.`,
 o:[
  {l:"Rationner l'eau agricole, sans exception",
   r:`Arrêté préfectoral dans quatre-vingt-douze départements : irrigation interdite, sans dérogation.<br><br>Les nappes remontent pour la première fois depuis six ans. Trente pour cent des récoltes de maïs sont perdues, deux cents exploitations déposent le bilan, et un syndicat agricole appelle à « la désobéissance ». Vous avez sauvé l'eau et cassé une filière.`,
   e:{cli:{eau:30,sols:14},economie:-7,groups:{ruraux:-19,jeunes:11,salaries:5}},
   axe:{ecologie:2,autorite:1}, pose:"rationnement", rival:8},
  {l:"Plan d'urgence : dessalement, retenues, réutilisation",
   r:`Vingt milliards : trois usines de dessalement, réutilisation des eaux usées, réseaux repris.<br><br>Rien ne sera opérationnel avant quatre ans, ce que vous dites honnêtement. En attendant, les camions-citernes continuent. C'est le bon plan et il arrive avec dix ans de retard, ce qui n'est pas votre faute mais devient votre problème.`,
   e:{budget:-20,cli:{eau:22,air:6},economie:5,groups:{ruraux:12,patrons:8,jeunes:5}},
   axe:{ecologie:1}, pose:"plan_eau"},
  {l:"Lever les restrictions pour sauver les récoltes",
   r:`Les arrêtés sont levés en quarante-huit heures. Les récoltes sont sauvées, la filière respire.<br><br>Deux mois plus tard, quatre communes du Vaucluse n'ont plus d'eau potable au robinet. Le lien est immédiat et personne ne peut le nier. Le préfet qui vous avait appelé demande sa mutation.`,
   e:{cli:{eau:-26,sols:-14},economie:6,groups:{ruraux:16,jeunes:-15,patrons:7}},
   axe:{ecologie:-2}, pose:"eau_sacrifiee", rival:6}
 ]},

{id:"c5soc", ch:5, mois:26, ico:"🏥", t:"L'hôpital ferme",
 d:`Ce n'est pas une grève, c'est une démission collective. Quarante-trois urgentistes d'un même
    CHU ont posé leur blouse le même matin.<br><br>
    En trois jours, six autres hôpitaux ont suivi. Une femme est morte dans une ambulance qui
    cherchait un service ouvert ; sa fille a parlé au journal de vingt heures et son visage est
    maintenant partout.<br><br>
    Le directeur général de la santé attend dans le couloir depuis une heure.`,
 o:[
  {l:"Revalorisation immédiate et massive des soignants",
   r:`Quatre cents euros nets, prime de nuit doublée, deux mille postes ouverts en urgence.<br><br>Dix-neuf des quarante-trois démissionnaires reviennent. Dix-neuf sur quarante-trois : c'est beaucoup et c'est peu. Le service rouvre en six semaines. Dix-neuf milliards par an, définitivement inscrits au budget.`,
   e:{budget:-19,soc:{sante:32,pouvoir:10},groups:{salaries:15,retraites:13,patrons:-7}},
   axe:{social:2}, pose:"sauvetage_hopital", rival:-8},
  {l:"Réquisitionner les personnels démissionnaires",
   r:`Réquisition préfectorale notifiée à domicile, sous peine de sanctions.<br><br>Le service rouvre en quatre jours. Quarante et un soignants saisissent le tribunal administratif. Six mois plus tard, la réquisition sera jugée illégale, et à ce moment-là trente d'entre eux auront quitté l'hôpital public pour de bon.`,
   e:{sec:{interieure:4},soc:{sante:8},social:-14,
      groups:{salaries:-17,retraites:6,jeunes:-9}},
   axe:{autorite:2}, pose:"requisition", rival:12},
  {l:"Ouvrir l'hôpital public au privé pour tenir",
   r:`Convention d'urgence : les cliniques privées prennent en charge une partie des urgences publiques, financées à l'acte.<br><br>Ça tient. Les délais baissent. Et une ligne de partage apparaît dans les statistiques dès la première année : les patients sans complémentaire attendent deux fois plus longtemps. Le chiffre sortira au pire moment.`,
   e:{budget:-6,soc:{sante:16,pauvrete:-12},economie:5,cac:6,
      groups:{patrons:14,salaries:-11,jeunes:-6}},
   axe:{social:-2}, pose:"privatisation", rival:7}
 ]},

/* ─────────── CHAPITRE VI · L'AFFAIRE ─────────── */

{id:"c6dossier", ch:6, mois:32, ico:"🕵️", t:"Le dossier Reyes",
 d:`Camille Reyes publie dans huit jours. Votre directeur de cabinet a obtenu le sommaire :
    trois ans de notes internes, des arbitrages que vous croyiez oraux, et deux virements que
    personne n'a jamais su expliquer.<br><br>
    « Ce n'est pas illégal, monsieur le Président. C'est pire : c'est lisible. N'importe qui
    comprendra en une lecture. »<br><br>
    Il y a une chose à décider avant vendredi, et une seule.`,
 o:[
  {l:"Tout publier vous-même, avant elle",
   r:`Vendredi neuf heures : trois ans de notes internes mises en ligne, y compris les deux virements.<br><br>Vous prenez trois jours de tempête et vous coupez l'herbe sous le pied de tout le monde. Camille Reyes publie quand même, mais son article n'a plus rien à révéler. Elle écrit une phrase que vous garderez : « Il a choisi de se faire mal avant qu'on le lui fasse. »`,
   e:{social:10,groups:{salaries:8,jeunes:11,ruraux:7,retraites:5,patrons:-5}},
   axe:{social:1}, pose:"transparence", rival:-12},
  {l:"Faire pression sur le journal",
   r:`Deux appels, un déjeuner, un rappel discret d'une aide publique à la presse dont le titre bénéficie.<br><br>L'article paraît quand même, amputé de deux paragraphes. La rédaction publie un communiqué expliquant pourquoi. Et Camille Reyes conserve, datée, la trace de chaque tentative. Elle attendra le bon moment.`,
   e:{sec:{interieure:-6},social:-14,groups:{jeunes:-16,salaries:-11,retraites:-6}},
   axe:{autorite:2}, pose:"pression_presse", rival:16},
  {l:"Ne rien faire et préparer la riposte",
   r:`Vous laissez venir, avec trois éléments de langage prêts et deux relais mobilisés.<br><br>L'article sort et fait exactement le bruit prévu. Votre riposte est correcte, la séquence dure neuf jours au lieu de trois, et rien n'est réglé sur le fond. Vous avez géré un problème au lieu de le traiter.`,
   e:{social:-6,groups:{salaries:-6,jeunes:-7}},
   pose:"silence", rival:8}
 ]},

{id:"c6enquete", ch:6, mois:32, si:()=>S.flags.franchise, ico:"📰", t:"La commission d'enquête",
 d:`Vous avez toujours joué franc jeu avec elle, et c'est peut-être pour ça que Camille Reyes
    vous a prévenu avant de publier. L'article ne vous vise pas : il vise votre entourage.<br><br>
    Une commission d'enquête parlementaire est votée dans la foulée. Elle peut vous laver
    définitivement — ou passer dix-huit mois à fouiller pendant que vous essayez de gouverner.<br><br>
    Ferrand en a réclamé la présidence.`,
 o:[
  {l:"Accepter la commission et lui ouvrir toutes les portes",
   r:`Tous les documents transmis, tous les collaborateurs autorisés à témoigner, sans exception.<br><br>La commission travaille quatorze mois et conclut à des « défaillances d'organisation sans intention frauduleuse ». C'est une victoire terne, obtenue par la seule méthode qui rende une victoire crédible.`,
   e:{social:12,budget:-3,groups:{salaries:9,jeunes:12,ruraux:8,retraites:7}},
   axe:{social:1}, pose:"transparence", rival:-14},
  {l:"Accepter, mais refuser la présidence à Ferrand",
   r:`La commission est créée, présidée par un député d'opposition qui n'est pas lui.<br><br>Ferrand crie au verrouillage pendant trois jours, puis passe à autre chose : la commission travaille sérieusement et ne lui donne rien à exploiter. Vous avez évité de lui offrir une tribune. Vous avez aussi montré que vous y pensiez.`,
   e:{social:4,groups:{jeunes:4,salaries:3,patrons:4}},
   pose:"demi_transparence", rival:4},
  {l:"Invoquer le secret de la défense nationale",
   r:`Quatre pièces classifiées, deux auditions refusées, une décision juridiquement inattaquable.<br><br>Elle est politiquement catastrophique : à partir de ce jour, le sujet n'est plus l'affaire mais ce que vous cachez. Le mot « secret » figure dans quatre-vingts pour cent des titres qui vous concernent pendant six semaines.`,
   e:{sec:{defense:6},social:-13,groups:{jeunes:-14,salaries:-10,ruraux:-7}},
   axe:{autorite:2}, pose:"secret_defense", rival:15}
 ]},

/* ─────────── CHAPITRE VII · LE DERNIER VIRAGE ─────────── */
{id:"c7", ch:7, mois:38, ico:"⏳", t:"Ce qu'il reste à sauver",
 d:`Il vous reste six mois et un budget. Le dernier que vous ferez voter, celui sur lequel on
    vous jugera.<br><br>
    Votre conseiller politique est venu sans dossier, ce qui ne lui ressemble pas. Il s'assoit,
    regarde le jardin, puis vous : « Vous ne pouvez plus tout tenir. Il faut choisir ce que les
    gens retiendront de vous. Une chose. Une seule. »<br><br>
    Il a raison, et vous le savez depuis des semaines.`,
 o:[
  {l:"Le pouvoir d'achat : un chèque à tous les ménages",
   r:`Six cents euros par foyer sous condition de ressources, versés en trois fois avant l'été.<br><br>Vingt et un milliards. C'est massif, immédiatement perceptible, et parfaitement indéfendable devant la Cour des comptes. Les gens s'en souviendront, et le prochain budget aussi.`,
   e:{pib:-0.5,budget:-21,dette:9,soc:{pouvoir:26,pauvrete:14},
      groups:{salaries:16,retraites:14,jeunes:9,patrons:-8}},
   axe:{social:1}, pose:"legs_social"},
  {l:"L'avenir : investir massivement dans l'école et la recherche",
   r:`Seize milliards fléchés sur l'école, l'université et les laboratoires, sur sept ans.<br><br>Aucun effet avant votre départ. Les syndicats étudiants saluent, les retraités s'interrogent, et un prix Nobel français écrit une tribune pour dire que c'est la première fois depuis trente ans. C'est le genre de décision qui ne rapporte des voix qu'à ceux qui viendront après.`,
   e:{pib:1.4,budget:-16,soc:{educ:30},economie:8,cac:5,
      groups:{jeunes:17,patrons:7,salaries:6,retraites:-6}},
   pose:"legs_avenir"},
  {l:"Les comptes : un budget à l'équilibre, quoi qu'il en coûte",
   r:`Vingt milliards d'économies, un déficit ramené sous les trois pour cent pour la première fois depuis vingt ans.<br><br>Les agences relèvent la perspective. Dans le pays, la mesure est comprise et elle est impopulaire : on vous crédite du sérieux et on vous en veut. Les deux à la fois, jusqu'au bout.`,
   e:{pib:0.8,budget:20,dette:-12,economie:6,cac:9,soc:{pouvoir:-14,pauvrete:-10},
      groups:{patrons:16,salaries:-13,retraites:-11}},
   axe:{social:-2}, pose:"legs_comptes", rival:7},
  {l:"Le climat : graver la transition dans la loi avant de partir",
   r:`Loi-cadre contraignante, budget carbone opposable, objectifs inscrits dans le droit.<br><br>C'est difficile à défaire — c'est même tout l'intérêt. Trois fédérations industrielles saisissent le Conseil constitutionnel, qui valide l'essentiel. Vous laissez quelque chose derrière vous, et vous partez peut-être pour ça.`,
   e:{pib:-0.7,budget:-14,cli:{air:26,eau:14,foret:12,sols:10},economie:-5,
      groups:{jeunes:16,ruraux:-9,patrons:-9}},
   axe:{ecologie:2}, pose:"legs_climat"}
 ]},

/* ─────────── CHAPITRE VIII · LA CAMPAGNE ─────────── */
{id:"c8", ch:8, mois:44, ico:"🎙️", t:"Le débat",
 d:`Vingt heures cinquante. Dans huit minutes, vous serez assis en face de Julien Ferrand, et
    vingt millions de personnes regarderont.<br><br>
    La maquilleuse a fini. Votre directrice de campagne tient une fiche qu'elle n'ose pas vous
    donner : les trois questions auxquelles vous n'avez pas de bonne réponse. Vous les connaissez
    déjà.<br><br>
    « Monsieur le Président, dans huit minutes. »<br>
    Vous ajustez votre veste. C'est votre dernier vrai choix.`,
 o:[
  {l:"Défendre votre bilan, point par point",
   r:`Deux heures quarante de chiffres, de dates et de courbes. Vous êtes solide, précis, jamais pris en défaut.<br><br>Les fact-checkers vous donnent raison sur onze points sur treize. L'audience, elle, décroche à la quarantième minute. On ne gagne pas un débat en ayant raison plus longtemps que l'autre.`,
   e:{groups:{salaries:5,retraites:6,patrons:5,ruraux:4,jeunes:3}},
   pose:"debat_bilan", final:true},
  {l:"Attaquer Ferrand sur ce qu'il cache",
   r:`Vous sortez le dossier à la cinquantième minute. Il pâlit, se défend mal, et le moment est spectaculaire.<br><br>Les commentateurs parlent d'un « coup ». Les téléspectateurs interrogés le lendemain emploient un autre mot : « petit ». Vous avez gagné l'échange et perdu quelque chose de plus difficile à récupérer.`,
   e:{social:-4,groups:{jeunes:-5,salaries:4,retraites:7,ruraux:5}},
   pose:"debat_attaque", rival:-14, final:true},
  {l:"Parler du pays, pas de vous ni de lui",
