/* ---- 1. la toile des lois ---- */
const CLES = Object.keys(BRANCHES);
const RAYONS = [92,150,208,266,320];

function posLoi(loi){
  const bi=CLES.indexOf(loi.br);
  const ti=LOIS.filter(l=>l.br===loi.br).indexOf(loi);
  const a=(-90+bi*72)*Math.PI/180, r=RAYONS[ti];
  return {x:400+Math.cos(a)*r, y:400+Math.sin(a)*r, ti, bi};
}
function prereq(loi){
  const s=LOIS.filter(l=>l.br===loi.br), i=s.indexOf(loi);
  return i===0 ? null : s[i-1];
}
function accessible(loi){
  if(S.lois.includes(loi.id)) return false;
  const p=prereq(loi);
  return !p || S.lois.includes(p.id);
}

let noeudSel = null;

function ouvrirLois(sel){
  noeudSel = sel || noeudSel || LOIS[0].id;
  const loi = LOIS.find(l=>l.id===noeudSel);

  let fils="";
  CLES.forEach((br,bi)=>{
    let px=400, py=400;
    LOIS.filter(l=>l.br===br).forEach(l=>{
      const p=posLoi(l), act=S.lois.includes(l.id);
      fils+=`<line class="fil ${act?"act":""}" x1="${px.toFixed(1)}" y1="${py.toFixed(1)}"
              x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`;
      px=p.x; py=p.y;
    });
  });
  let web="";
  RAYONS.forEach(r=>{
    let d="";
    for(let i=0;i<=5;i++){
      const a=(-90+i*72)*Math.PI/180;
      const x=400+Math.cos(a)*r, y=400+Math.sin(a)*r;
      if(i===0) d=`M${x.toFixed(1)} ${y.toFixed(1)}`;
      else{
        const am=(-90+(i-.5)*72)*Math.PI/180, rm=r*.90;
        d+=` Q${(400+Math.cos(am)*rm).toFixed(1)} ${(400+Math.sin(am)*rm).toFixed(1)}
             ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
    }
    web+=`<path class="web" d="${d}"/>`;
  });
  let noeuds="";
  LOIS.forEach(l=>{
    const p=posLoi(l), col=BRANCHES[l.br].col;
    const vote=S.lois.includes(l.id), dispo=accessible(l);
    const fill=vote?col:(dispo?"#1c2740":"#141b28");
    const stroke=noeudSel===l.id?"#d9b26a":(vote?col:(dispo?col:"#2a3550"));
    noeuds+=`<g class="nd" opacity="${vote?1:(dispo?.95:.42)}" onclick="ouvrirLois('${l.id}')">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="25" fill="${fill}"
        stroke="${stroke}" stroke-width="${noeudSel===l.id?3.5:2}"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y+7).toFixed(1)}" text-anchor="middle"
        font-size="21" pointer-events="none">${l.ico}</text></g>`;
  });
  let etq="";
  CLES.forEach((br,bi)=>{
    const a=(-90+bi*72)*Math.PI/180, r=RAYONS[4]+36;
    const x=clamp(400+Math.cos(a)*r,58,742), y=400+Math.sin(a)*r;
    etq+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"
      fill="${BRANCHES[br].col}" font-size="16" font-family="Georgia,serif"
      letter-spacing="1">${BRANCHES[br].nom}</text>`;
  });
  const svg=`<svg class="toilesvg" viewBox="0 0 800 800">${web}${fils}
    <circle cx="400" cy="400" r="34" fill="#1b2740" stroke="#d9b26a" stroke-width="2.5"/>
    <text x="400" y="409" text-anchor="middle" font-size="26">🏛️</text>
    ${noeuds}${etq}</svg>`;

  const vote=S.lois.includes(loi.id), dispo=accessible(loi), pr=prereq(loi);
  const assez=S.tres>=loi.cout, pret=S.delaiLoi===0;
  let etat="", act=true;
  if(vote){ etat="Loi promulguée."; act=false; }
  else if(!dispo){ etat=`Nécessite d'abord : « ${pr.nom} ».`; act=false; }
  else if(!pret){ etat=`Le Parlement est saisi. Disponible dans ${S.delaiLoi} mois.`; act=false; }
  else if(!assez){ etat=`Trésorerie insuffisante (${loi.cout} requis).`; act=false; }

  ouvrir("📜 Les lois de la République",
    `${S.lois.length} / ${LOIS.length} votées` +
      (S.delaiLoi ? ` · prochaine dans ${S.delaiLoi} mois` : " · vote possible"),
    `<div class="toile"><div class="svgwrap">${svg}</div>
      <div class="detail">
        <div class="br">${BRANCHES[loi.br].ico} ${BRANCHES[loi.br].nom}</div>
        <h3>${loi.ico} ${loi.nom}</h3>
        <p>${loi.txt}</p>
        <div class="eff">${tagsEffet(loi.eff).join("")}</div>${tagsMensuels(loi.tour)}
        <p style="margin:12px 0 10px;font-size:13px">Coût :
          <b style="color:#d9b26a">${loi.cout}</b> de trésorerie</p>
        <button class="btn" ${act?"":"disabled"} onclick="voter('${loi.id}')">
          ${vote?"✓ Déjà votée":"Faire voter la loi"}</button>
        ${etat?`<p style="font-size:12px;color:#c0455a;margin-top:9px">${etat}</p>`:""}
        <div class="legende">${CLES.map(b=>
          `<span style="color:${BRANCHES[b].col}">${BRANCHES[b].nom}</span>`).join("")}</div>
      </div></div>`, "lois");
}

function tagsEffet(e){
  const t=[], glo={securite:"🛡️ Sécurité",climat:"🌍 Climat",social:"⚖️ Social",
                   economie:"📈 Économie",budget:"💰 Trésorerie"};
  for(const k in glo) if(e[k]) t.push(`<span class="tag">${glo[k]} ${e[k]>0?"+":""}${e[k]}</span>`);
  [["sec",SEC,S.sec],["cli",CLI,S.cli],["soc",SOC,S.soc]].forEach(([cle,def])=>{
    if(!e[cle]) return;
    for(const g in e[cle]) t.push(
      `<span class="tag">${def[g].ico} ${def[g].nom} ${e[cle][g]>0?"+":""}${e[cle][g]}</span>`);
  });
  if(e.groups) for(const g in e.groups) t.push(
    `<span class="tag">${GROUPES[g].ico} ${GROUPES[g].nom} ${e.groups[g]>0?"+":""}${e.groups[g]}</span>`);
  if(e.cac) t.push(`<span class="tag">📊 CAC 40 ${e.cac>0?"+":""}${e.cac} %</span>`);
  return t;
}
function tagsMensuels(tr){
  if(!tr || !Object.keys(tr).length) return "";
  const nom={budget:"💰 Trésorerie",securite:"🛡️ Sécurité",climat:"🌍 Climat",
             social:"⚖️ Social",economie:"📈 Économie",croissance:"📊 Croissance"};
  const l=[]; for(const k in tr) if(nom[k]) l.push(`${nom[k]} ${tr[k]>0?"+":""}${r1(tr[k])}`);
  return l.length ? `<p style="font-size:12.5px;color:#93a3bd;margin-top:8px">
    <b style="color:#d9b26a">Chaque mois :</b> ${l.join(" · ")}</p>` : "";
}

function voter(id){
  const loi=LOIS.find(l=>l.id===id);
  if(!loi||S.lois.includes(id)||!accessible(loi)||S.delaiLoi>0||S.tres<loi.cout||S.fini) return;
  S.tres -= loi.cout;
  S.lois.push(id);
  appliquer(loi.eff);
  S.delaiLoi = DELAI_LOI;
  S.jrn = [{txt:`📜 Loi promulguée : ${loi.nom}.`,cl:"up"}].concat(S.jrn);
  sauver(); rendre();
}

/* ---- 2. les chantiers ---- */
function ouvrirProjets(){
  const html=`<div class="grille">${PROJETS.map(p=>{
    const fini=S.projetsFinis.includes(p.id);
    const ch=S.chantiers.find(c=>c.id===p.id);
    const plein=S.chantiers.length>=MAX_CHANTIERS, assez=S.tres>=p.cout;
    let bas;
    if(fini) bas=`<button class="btn" disabled>✓ Livré</button>`;
    else if(ch) bas=`<div class="prog"><i style="width:${(1-ch.reste/p.duree)*100}%"></i></div>
        <button class="btn" disabled>En chantier — ${ch.reste} mois restants</button>`;
    else bas=`<button class="btn" ${(!assez||plein||S.fini)?"disabled":""} onclick="lancer('${p.id}')">
        Lancer · ${p.cout} 💰 · ${p.duree} mois</button>
        ${!assez?'<p style="font-size:11.5px;color:#c0455a;margin-top:7px">Trésorerie insuffisante</p>':
          (plein?'<p style="font-size:11.5px;color:#c0455a;margin-top:7px">Deux chantiers déjà en cours</p>':"")}`;
    return `<div class="pj ${fini?"fini":(ch?"en":"")}">
      <h4>${p.ico} ${p.nom}</h4><p>${p.txt}</p>
      <div class="eff">${tagsEffet(p.fin).join("")}</div>${bas}</div>`;
  }).join("")}</div>`;
  ouvrir("🏗️ Grands chantiers",
    `${S.chantiers.length}/${MAX_CHANTIERS} en cours · ${S.projetsFinis.length} livrés`,
    html, "projets");
}
function lancer(id){
  const p=PROJETS.find(x=>x.id===id);
  if(!p||S.fini||S.projetsFinis.includes(id)||S.chantiers.some(c=>c.id===id)) return;
  if(S.chantiers.length>=MAX_CHANTIERS||S.tres<p.cout) return;
  S.tres -= p.cout;
  S.chantiers.push({id, reste:p.duree});
  S.jrn=[{txt:`🏗️ Chantier lancé : ${p.nom} (${p.duree} mois).`,cl:""}].concat(S.jrn);
  sauver(); rendre();
}

/* ---- 3. budget ---- */
const LIB_TAX={ir:["Impôt sur le revenu","Rentre de l'argent, fâche salariés et cadres"],
  tva:["TVA","Recette massive, pèse sur le pouvoir d'achat de tous"],
  is:["Impôt sur les sociétés","Frappe les entreprises, la croissance et le CAC 40"],
  carbone:["Taxe carbone","Assainit l'air, très mal vécu en zone rurale"]};
const LIB_DEP={sante:["🏥 Santé","Hôpital, accès aux soins, retraités rassurés"],
  educ:["🎓 Éducation","École, jeunesse et croissance à long terme"],
  defense:["🎖️ Défense","Armées, dissuasion et rang mondial"],
  police:["👮 Police & justice","Sécurité intérieure, tend le climat social"],
  ecolo:["🌿 Transition écologique","Le seul levier durable sur l'environnement"]};

function ouvrirBudget(){
  const b=calculBudget();
  const sl=(cle,val,lib,grp)=>`<div class="sl">
    <label><span>${lib[0]}</span><b id="v_${grp}_${cle}">${val}</b></label>
    <input type="range" min="0" max="100" value="${val}"
      oninput="regler('${grp}','${cle}',this.value)">
    <small>${lib[1]}</small></div>`;
  const html=`<div class="solde colle" id="solde">${ligneSolde(b)}</div>
    <div class="deux" style="margin-top:18px">
      <div><h3 style="margin-bottom:14px;color:#d9b26a">Recettes fiscales</h3>
        ${Object.keys(S.tax).map(k=>sl(k,S.tax[k],LIB_TAX[k],"tax")).join("")}</div>
      <div><h3 style="margin-bottom:14px;color:#d9b26a">Dépenses publiques</h3>
        ${Object.keys(S.dep).map(k=>sl(k,S.dep[k],LIB_DEP[k],"dep")).join("")}</div>
    </div>`;
  ouvrir("💶 Budget de l'État",
    `Dette : ${Math.round(S.dette)} % du PIB · note ${note().n}`, html, "budget");
}
function ligneSolde(b){
  return `<div class="lg"><span>Recettes fiscales
      <small style="color:#93a3bd">(indexées sur le PIB, ×${r1(b.idx)})</small></span>
      <b class="up">+${r1(b.recettes)}</b></div>
  <div class="lg"><span>Dépenses des ministères</span><b class="dn">−${r1(b.depenses)}</b></div>
  <div class="lg"><span>Charge structurelle
      <small style="color:#93a3bd">(vieillissement, inflation)</small></span>
      <b class="dn">−${r1(b.structurel)}</b></div>
  <div class="lg"><span>Intérêts de la dette</span><b class="dn">−${r1(b.interets)}</b></div>
  <div class="lg"><span>Lois & chantiers</span>
      <b class="${b.mods>=0?"up":"dn"}">${b.mods>=0?"+":"−"}${r1(Math.abs(b.mods))}</b></div>
  <div class="lg tot"><span>Solde mensuel</span>
      <b class="${b.solde>=0?"up":"dn"}">${b.solde>=0?"+":""}${r1(b.solde)} Md€</b></div>`;
}
function regler(grp,cle,val){
  S[grp][cle]=+val;
  const el=document.getElementById(`v_${grp}_${cle}`); if(el) el.textContent=val;
  const so=document.getElementById("solde"); if(so) so.innerHTML=ligneSolde(calculBudget());
  sauver();
}

/* ---- 4. bilan ---- */
function ouvrirBilan(){
  const b=calculBudget();
  const lois = S.lois.length
    ? CLES.map(br=>{
        const l=S.lois.map(id=>LOIS.find(x=>x.id===id)).filter(x=>x&&x.br===br);
        return l.length?`<div style="margin-bottom:9px">
          <b style="color:${BRANCHES[br].col}">${BRANCHES[br].nom}</b><br>
          <span style="font-size:13px;color:#c2cee2">${l.map(x=>x.ico+" "+x.nom).join("<br>")}</span>
          </div>`:"";
      }).join("")
    : `<p class="vide">Aucune loi votée pour l'instant.</p>`;
  const ch = S.chantiers.length
    ? S.chantiers.map(c=>{const p=PROJETS.find(x=>x.id===c.id);
        return `<div style="font-size:13px;margin-bottom:6px">${p.ico} ${p.nom}
          <span style="color:#93a3bd">— ${c.reste} mois</span></div>`;}).join("")
    : `<p class="vide">Aucun chantier en cours.</p>`;
  const fi = S.projetsFinis.length
    ? S.projetsFinis.map(id=>{const p=PROJETS.find(x=>x.id===id);
        return `<div style="font-size:13px;margin-bottom:6px">${p.ico} ${p.nom}</div>`;}).join("")
    : `<p class="vide">Aucun chantier livré.</p>`;

  const html=`<div class="kpis">
      <div class="kpi"><b>${S.tour}</b><span>mois au pouvoir</span></div>
      <div class="kpi"><b>${ordinal(rang())}</b><span>rang mondial</span></div>
      <div class="kpi"><b>${nb(S.pib)}</b><span>PIB · Md€</span>
        <small style="color:#93a3bd">${croissance()>=0?"+":""}${r1(croissance())} % / an</small></div>
      <div class="kpi"><b>${Math.round(S.dette)} %</b><span>dette / PIB</span>
        <small style="color:${note().c}">note ${note().n}</small></div>
      <div class="kpi"><b>${b.solde>=0?"+":""}${r1(b.solde)}</b><span>solde mensuel</span></div>
      <div class="kpi"><b>${nb(S.cac)}</b><span>CAC 40</span></div>
      <div class="kpi"><b>${S.lois.length}</b><span>lois votées</span></div>
      <div class="kpi"><b>${S.projetsFinis.length}</b><span>chantiers livrés</span></div>
    </div>
    <div class="bloc"><h3>📖 Chroniques du mandat</h3>
      ${S.chroniques.length ? S.chroniques.map(c=>
        `<div style="padding:7px 0;border-bottom:1px solid #22304a80">
          <div style="font-size:11.5px;color:#93a3bd;letter-spacing:.5px">
            Mois ${c.tour} · Chapitre ${ROMAINS[c.ch-1]} · ${c.titre}</div>
          <div style="font-size:13.5px;color:#d6dfee">« ${c.choix} »</div></div>`).join("")
        : `<p class="vide">Votre histoire n'a pas encore commencé.</p>`}
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:#93a3bd">
        <span>Autorité <b style="color:#e8edf6">${S.axes.autorite>0?"+":""}${S.axes.autorite}</b></span>
        <span>Social <b style="color:#e8edf6">${S.axes.social>0?"+":""}${S.axes.social}</b></span>
        <span>Écologie <b style="color:#e8edf6">${S.axes.ecologie>0?"+":""}${S.axes.ecologie}</b></span>
        <span>Julien Ferrand <b style="color:${S.rival>=55?'#c0455a':'#e8edf6'}">${Math.round(S.rival)} %</b></span>
      </div></div>
    <div class="deux" style="margin-top:8px">
      <div><h3 style="color:#d9b26a;margin-bottom:12px">📜 Lois promulguées</h3>${lois}</div>
      <div><h3 style="color:#d9b26a;margin-bottom:12px">🏗️ Chantiers en cours</h3>${ch}
        <h3 style="color:#d9b26a;margin:18px 0 12px">✓ Chantiers livrés</h3>${fi}</div>
    </div>
    ${sauvegardeOK ? "" : `<p style="font-size:12.5px;color:#d99a4a;margin-top:18px">
      ⚠ Sauvegarde automatique indisponible : votre navigateur la bloque pour les fichiers
      ouverts en local. La partie sera perdue si vous rechargez la page.</p>`}
    <button class="btn" style="background:#c0455a;margin-top:22px"
      onclick="if(confirm('Abandonner et recommencer une nouvelle partie ?')){fermer();nouvellePartie();}">
      Nouvelle partie</button>`;
  ouvrir("📊 Bilan du quinquennat",
    `${MOIS[(S.tour-1)%12]} ${2027+Math.floor((S.tour-1)/12)}`, html, "bilan");
}

/* ══════════════════════════════════════════════════════════
   7. SAUVEGARDE
   ══════════════════════════════════════════════════════════ */
const CLE="president_v3";
// certains navigateurs interdisent localStorage sur un fichier ouvert en local
let sauvegardeOK = (()=>{ try{ localStorage.setItem(CLE+"_t","1");
  localStorage.removeItem(CLE+"_t"); return true; }catch(e){ return false; } })();

function sauver(){ if(!sauvegardeOK) return;
  try{ localStorage.setItem(CLE, JSON.stringify(S)); }catch(e){ sauvegardeOK=false; } }

function charger(){
  try{
    const b=localStorage.getItem(CLE); if(!b) return false;
    const o=JSON.parse(b);
    if(!o || typeof o.tour!=="number" || !o.grp || !o.sec || !o.cli || !o.soc) return false;
    S=o;
    // garde-fous si la sauvegarde vient d'une version antérieure
    S.lois=S.lois||[]; S.chantiers=S.chantiers||[]; S.projetsFinis=S.projetsFinis||[];
    S.jrn=S.jrn||[]; S.vus=S.vus||[]; S.hist=S.hist||[];
    S.mandat=S.mandat||1; S.delaiLoi=S.delaiLoi||0;
    S.pib=S.pib||PIB0; S.cac=S.cac||7450; S.tres=S.tres!=null?S.tres:50;
    S.eco=S.eco!=null?S.eco:55;
    if(!Array.isArray(S.monde)||S.monde.length!==PAYS.length) S.monde=PAYS.map(p=>p.pib);
    // couche narrative
    S.axes = Object.assign({autorite:0,social:0,ecologie:0}, S.axes||{});
    S.flags = S.flags||{}; S.chroniques = S.chroniques||[];
    S.rival = typeof S.rival==="number" ? S.rival : 40;
    S.chapitre = S.chapitre||0;
    S.scenesVues = S.scenesVues||[];
    // la scène en cours doit exister, sinon on retombe sur un événement ordinaire
    if(S.evScene && !SCENES[S.ev]){ S.evScene=false; S.ev=null; }
    if(!S.evScene && (!S.ev || !EVENTS.find(e=>e.id===S.ev))) tirerEvenement();
    if(!S.hist.length) enregistrerHistorique();
    return true;
  }catch(e){ return false; }
}

if(!charger()) nouvellePartie(); else rendre();
</script>
