<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Président le Jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#030712;--surface:#0d1117;--surface2:#161b22;--border:#21262d;
    --accent:#4285f4;--accent2:#ea4335;--accent3:#34a853;--accent4:#fbbc04;
    --text:#e6edf3;--muted:#7d8590;--red:#ff3b5c;--glow:0 0 20px rgba(66,133,244,0.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(66,133,244,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(66,133,244,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

  #landing{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;z-index:1;}
  .globe-container{position:relative;width:180px;height:180px;margin:0 auto 2.5rem;}
  .globe{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(66,133,244,0.35),rgba(52,168,83,0.15),rgba(3,7,18,0.85));border:2px solid rgba(66,133,244,0.45);box-shadow:0 0 60px rgba(66,133,244,0.3),inset 0 0 60px rgba(66,133,244,0.1);animation:globePulse 3s ease-in-out infinite;position:relative;overflow:hidden;}
  .globe::before{content:'';position:absolute;inset:-50%;border-radius:50%;background:repeating-linear-gradient(0deg,transparent,transparent 18px,rgba(66,133,244,0.07) 18px,rgba(66,133,244,0.07) 20px);animation:globeSpin 20s linear infinite;}
  .globe::after{content:'';position:absolute;inset:-50%;border-radius:50%;background:repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(52,168,83,0.05) 18px,rgba(52,168,83,0.05) 20px);animation:globeSpin 30s linear infinite reverse;}
  .globe-ring{position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(66,133,244,0.22);animation:ringRotate 8s linear infinite;}
  .globe-ring::before{content:'✦';position:absolute;top:10px;left:50%;transform:translateX(-50%);color:var(--accent);font-size:9px;}
  @keyframes globePulse{0%,100%{box-shadow:0 0 60px rgba(66,133,244,0.3),inset 0 0 60px rgba(66,133,244,0.1);}50%{box-shadow:0 0 110px rgba(66,133,244,0.5),inset 0 0 80px rgba(66,133,244,0.2);}}
  @keyframes globeSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes ringRotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .title-main{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,5.5vw,4rem);font-weight:900;letter-spacing:0.08em;line-height:1.1;background:linear-gradient(135deg,var(--accent) 0%,#fff 50%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.5rem;animation:titleGlow 2s ease-in-out infinite alternate;}
  @keyframes titleGlow{from{filter:drop-shadow(0 0 10px rgba(66,133,244,0.5));}to{filter:drop-shadow(0 0 28px rgba(66,133,244,0.85));}}
  .title-sub{font-family:'Share Tech Mono',monospace;color:var(--accent);font-size:0.85rem;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:1rem;}
  .title-desc{color:var(--muted);font-size:1rem;font-weight:300;max-width:500px;margin:0 auto 1.5rem;line-height:1.65;}
  .beta-badge{display:inline-block;background:rgba(66,133,244,0.1);border:1px solid rgba(66,133,244,0.4);color:var(--accent);font-family:'Share Tech Mono',monospace;font-size:0.68rem;padding:0.2rem 0.7rem;border-radius:2px;letter-spacing:0.2em;margin-bottom:2.2rem;animation:blink 2s step-end infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
  .powered-badge{display:flex;align-items:center;gap:0.6rem;background:rgba(66,133,244,0.06);border:1px solid rgba(66,133,244,0.2);border-radius:4px;padding:0.5rem 1.2rem;margin-bottom:2.2rem;font-family:'Share Tech Mono',monospace;font-size:0.75rem;color:var(--muted);}
  .g-dots{display:flex;gap:3px;}.g-dot{width:8px;height:8px;border-radius:50%;}
  .g-dot:nth-child(1){background:var(--accent);}.g-dot:nth-child(2){background:var(--accent2);}.g-dot:nth-child(3){background:var(--accent3);}.g-dot:nth-child(4){background:var(--accent4);}
  .powered-badge span{color:var(--accent);}
  .btn-row{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
  .play-btn{position:relative;padding:1rem 3rem;background:transparent;border:2px solid var(--accent);color:var(--accent);font-family:'Orbitron',monospace;font-size:0.95rem;font-weight:700;letter-spacing:0.15em;cursor:pointer;transition:all 0.3s;clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);overflow:hidden;}
  .play-btn::before{content:'';position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);transition:transform 0.3s;z-index:-1;}
  .play-btn:hover{color:#fff;box-shadow:var(--glow);}.play-btn:hover::before{transform:translateX(0);}
  .rules-btn{padding:1rem 2rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Orbitron',monospace;font-size:0.85rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
  .rules-btn:hover{border-color:var(--muted);color:var(--text);}
  .legal-btn{padding:1rem 1.5rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
  .legal-btn:hover{border-color:var(--accent3);color:var(--accent3);}
  .resume-btn{padding:1rem 2rem;background:rgba(52,168,83,0.08);border:2px solid var(--accent3);color:var(--accent3);font-family:'Orbitron',monospace;font-size:0.85rem;letter-spacing:0.12em;cursor:pointer;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);position:relative;overflow:hidden;}
  .resume-btn::before{content:'';position:absolute;inset:0;background:var(--accent3);transform:translateX(-100%);transition:transform 0.3s;z-index:-1;}
  .resume-btn:hover{color:#fff;box-shadow:0 0 20px rgba(52,168,83,0.4);}.resume-btn:hover::before{transform:translateX(0);}
  .save-indicator{font-family:'Share Tech Mono',monospace;font-size:0.68rem;color:var(--accent3);letter-spacing:0.1em;margin-top:0.5rem;opacity:0;transition:opacity 0.5s;}.save-indicator.show{opacity:1;}

  /* GAME */
  #game{display:none;position:fixed;inset:0;z-index:1;padding:1rem;flex-direction:column;overflow:hidden;background:var(--bg);}
  #game.active{display:flex;}
  .hud{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:4px;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem;}
  .hud-title{font-family:'Orbitron',monospace;font-size:0.82rem;color:var(--accent);letter-spacing:0.1em;}
  .hud-center{display:flex;gap:1.5rem;font-family:'Share Tech Mono',monospace;font-size:0.75rem;color:var(--muted);}
  .hud-center b{color:var(--text);font-weight:normal;}
  .hud-ai{display:flex;align-items:center;gap:5px;font-size:0.7rem;padding:0.2rem 0.7rem;border-radius:2px;font-family:'Share Tech Mono',monospace;background:rgba(66,133,244,0.1);color:var(--accent);border:1px solid rgba(66,133,244,0.3);}
  .hud-dots{display:flex;gap:2px;}.hud-dot{width:5px;height:5px;border-radius:50%;}
  .hud-dot:nth-child(1){background:var(--accent);}.hud-dot:nth-child(2){background:var(--accent2);}.hud-dot:nth-child(3){background:var(--accent3);}.hud-dot:nth-child(4){background:var(--accent4);}
  .report-hud-btn{display:flex;align-items:center;gap:4px;background:none;border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:0.68rem;padding:0.25rem 0.6rem;cursor:pointer;border-radius:2px;transition:all 0.3s;letter-spacing:0.05em;}
  .report-hud-btn:hover{border-color:var(--red);color:var(--red);}

  .nego-badge{display:none;align-items:center;gap:5px;font-size:0.68rem;padding:0.2rem 0.7rem;border-radius:2px;font-family:'Share Tech Mono',monospace;background:rgba(251,188,4,0.12);color:var(--accent4);border:1px solid rgba(251,188,4,0.4);animation:critPulse 1.5s ease-in-out infinite;letter-spacing:0.06em;}
  .nego-badge.active{display:flex;}

  .chat-container{flex:1;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;max-width:1000px;width:100%;margin:0 auto;min-height:0;}
  .chat-messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;min-height:0;}
  .chat-messages::-webkit-scrollbar{width:4px;}.chat-messages::-webkit-scrollbar-track{background:var(--surface);}.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .msg{max-width:92%;animation:msgIn 0.3s ease-out;}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.ai{align-self:flex-start;}.msg.user{align-self:flex-end;}
  .msg-header{font-family:'Share Tech Mono',monospace;font-size:0.67rem;margin-bottom:0.3rem;letter-spacing:0.08em;}
  .msg.ai .msg-header{color:var(--accent);}.msg.user .msg-header{color:var(--accent2);text-align:right;}
  .msg-body{padding:0.9rem 1.1rem;border-radius:4px;font-size:0.93rem;line-height:1.75;word-break:break-word;}
  .msg.ai .msg-body{background:var(--surface2);border:1px solid var(--border);border-left:2px solid var(--accent);}
  .msg.user .msg-body{background:rgba(234,67,53,0.07);border:1px solid rgba(234,67,53,0.2);border-right:2px solid var(--accent2);}
  .msg-body h1{font-family:'Orbitron',monospace;color:var(--accent);font-size:1.05rem;font-weight:700;letter-spacing:0.08em;margin:1.2rem 0 0.6rem;padding-bottom:0.4rem;border-bottom:1px solid rgba(66,133,244,0.25);}
  .msg-body h2{font-family:'Orbitron',monospace;color:var(--accent);font-size:0.9rem;font-weight:700;letter-spacing:0.06em;margin:1rem 0 0.5rem;}
  .msg-body h3{font-family:'Rajdhani',sans-serif;color:var(--accent4);font-size:0.95rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin:0.9rem 0 0.4rem;}
  .msg-body p{margin:0.55rem 0;line-height:1.8;color:var(--text);}.msg-body p:first-child{margin-top:0;}.msg-body p:last-child{margin-bottom:0;}
  .msg-body table{width:100%;border-collapse:collapse;margin:0.9rem 0;font-family:'Share Tech Mono',monospace;font-size:0.82rem;}
  .msg-body th{background:rgba(66,133,244,0.15);color:var(--accent);border:1px solid rgba(66,133,244,0.25);padding:0.45rem 0.9rem;text-align:left;font-weight:700;letter-spacing:0.05em;}
  .msg-body td{border:1px solid var(--border);padding:0.4rem 0.9rem;color:var(--text);}
  .msg-body tr:nth-child(even) td{background:rgba(255,255,255,0.02);}.msg-body tr:hover td{background:rgba(66,133,244,0.05);transition:background 0.15s;}
  .ind-up{color:#34a853;font-weight:700;}.ind-down{color:#ff3b5c;font-weight:700;}.ind-warn{color:#fbbc04;font-weight:700;}
  .ind-crit{color:#ff3b5c;font-weight:700;animation:critPulse 0.8s ease-in-out infinite;}.ind-ok{color:#34a853;font-weight:700;}
  @keyframes critPulse{0%,100%{opacity:1}50%{opacity:0.35}}
  .msg-body tr.row-warn td{background:rgba(251,188,4,0.07)!important;border-color:rgba(251,188,4,0.3)!important;}
  .msg-body tr.row-crit td{background:rgba(255,59,92,0.09)!important;border-color:rgba(255,59,92,0.35)!important;}
  .msg-body tr.row-good td{background:rgba(52,168,83,0.06)!important;border-color:rgba(52,168,83,0.25)!important;}
  .alert-banner{display:flex;align-items:center;gap:0.6rem;background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.45);border-left:3px solid #ff3b5c;padding:0.5rem 0.9rem;border-radius:3px;margin:0.4rem 0;font-family:'Share Tech Mono',monospace;font-size:0.78rem;color:#ff3b5c;animation:critPulse 1.2s ease-in-out infinite;}
  .warn-banner{display:flex;align-items:center;gap:0.6rem;background:rgba(251,188,4,0.08);border:1px solid rgba(251,188,4,0.4);border-left:3px solid #fbbc04;padding:0.5rem 0.9rem;border-radius:3px;margin:0.4rem 0;font-family:'Share Tech Mono',monospace;font-size:0.78rem;color:#fbbc04;}
  .msg-body ul,.msg-body ol{padding-left:1.5rem;margin:0.5rem 0 0.7rem;}.msg-body li{margin:0.3rem 0;line-height:1.7;color:var(--text);}
  .msg-body ul li::marker{color:var(--accent);}.msg-body ol li::marker{color:var(--accent4);font-family:'Share Tech Mono',monospace;}
  .msg-body strong{color:var(--accent4);font-weight:700;}.msg-body em{color:var(--muted);font-style:italic;}
  .msg-body code{background:rgba(66,133,244,0.1);padding:0.1rem 0.35rem;border-radius:2px;font-family:'Share Tech Mono',monospace;font-size:0.85em;color:var(--accent3);}
  .msg-body hr{border:none;border-top:1px solid rgba(66,133,244,0.2);margin:1rem 0;}
  .msg-body .cta-block{background:rgba(66,133,244,0.06);border:1px solid rgba(66,133,244,0.25);border-left:3px solid var(--accent);padding:0.6rem 1rem;border-radius:3px;margin:0.9rem 0 0;font-family:'Share Tech Mono',monospace;font-size:0.82rem;color:var(--accent);letter-spacing:0.04em;}

  /* ===== CHOIX CLIQUABLES (Phase 2) ===== */
  .choice-btn{display:block;width:100%;text-align:left;background:rgba(66,133,244,0.06);border:1px solid rgba(66,133,244,0.25);border-left:3px solid var(--accent);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:0.93rem;padding:0.65rem 1rem;margin:0.3rem 0;cursor:pointer;border-radius:3px;transition:all 0.2s;line-height:1.5;}
  .choice-btn:hover{background:rgba(66,133,244,0.15);border-color:var(--accent);color:#fff;transform:translateX(4px);}
  .choice-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
  .choice-btn.chosen{border-color:var(--accent3);background:rgba(52,168,83,0.1);opacity:1!important;}
  .choice-btn.custom{border-left-color:var(--accent4);background:rgba(251,188,4,0.05);}
  .choice-btn.custom:hover{background:rgba(251,188,4,0.12);border-color:var(--accent4);color:#fff;}

  /* ===== BOUTONS NÉGOCIATION ===== */
  .nego-panel{background:rgba(251,188,4,0.04);border:1px solid rgba(251,188,4,0.3);border-left:3px solid var(--accent4);border-radius:4px;padding:0.9rem 1rem;margin-top:0.5rem;animation:msgIn 0.3s ease-out;}
  .nego-panel-title{font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--accent4);letter-spacing:0.1em;margin-bottom:0.7rem;text-transform:uppercase;}
  .nego-btn{display:block;width:100%;text-align:left;font-family:'Rajdhani',sans-serif;font-size:0.9rem;padding:0.55rem 0.9rem;margin:0.25rem 0;cursor:pointer;border-radius:3px;transition:all 0.2s;line-height:1.5;border:1px solid;}
  .nego-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .nego-btn.accept{background:rgba(52,168,83,0.08);border-color:rgba(52,168,83,0.4);color:var(--accent3);}
  .nego-btn.accept:hover:not(:disabled){background:rgba(52,168,83,0.2);border-color:var(--accent3);color:#fff;}
  .nego-btn.refuse{background:rgba(255,59,92,0.08);border-color:rgba(255,59,92,0.4);color:var(--red);}
  .nego-btn.refuse:hover:not(:disabled){background:rgba(255,59,92,0.18);border-color:var(--red);color:#fff;}
  .nego-btn.change{background:rgba(66,133,244,0.07);border-color:rgba(66,133,244,0.3);color:var(--accent);}
  .nego-btn.change:hover:not(:disabled){background:rgba(66,133,244,0.16);border-color:var(--accent);color:#fff;}
  .nego-btn.custom-nego{background:rgba(251,188,4,0.06);border-color:rgba(251,188,4,0.35);color:var(--accent4);}
  .nego-btn.custom-nego:hover:not(:disabled){background:rgba(251,188,4,0.15);border-color:var(--accent4);color:#fff;}
  .nego-btn.end-nego{background:rgba(125,133,144,0.08);border-color:rgba(125,133,144,0.3);color:var(--muted);}
  .nego-btn.end-nego:hover:not(:disabled){background:rgba(125,133,144,0.18);border-color:var(--muted);color:var(--text);}

  .country-picker-btn{display:inline-flex;align-items:center;gap:8px;margin-top:0.8rem;padding:0.75rem 1.8rem;background:transparent;border:2px solid var(--accent3);color:var(--accent3);font-family:'Orbitron',monospace;font-size:0.82rem;font-weight:700;letter-spacing:0.12em;cursor:pointer;border-radius:4px;transition:all 0.3s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);position:relative;overflow:hidden;animation:pulseGreen 2s ease-in-out infinite;}
  .country-picker-btn::before{content:'';position:absolute;inset:0;background:var(--accent3);transform:translateX(-100%);transition:transform 0.3s;z-index:-1;}
  .country-picker-btn:hover{color:#fff;box-shadow:0 0 22px rgba(52,168,83,0.5);}.country-picker-btn:hover::before{transform:translateX(0);}
  @keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(52,168,83,0);}50%{box-shadow:0 0 14px 4px rgba(52,168,83,0.35);}}

  .continue-btn{display:inline-flex;align-items:center;gap:8px;margin-top:0.8rem;padding:0.75rem 2rem;background:transparent;border:2px solid var(--accent);color:var(--accent);font-family:'Orbitron',monospace;font-size:0.85rem;font-weight:700;letter-spacing:0.15em;cursor:pointer;border-radius:4px;transition:all 0.3s;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);position:relative;overflow:hidden;animation:pulseBlue 1.5s ease-in-out infinite;}
  .continue-btn::before{content:'';position:absolute;inset:0;background:var(--accent);transform:translateX(-100%);transition:transform 0.3s;z-index:-1;}
  .continue-btn:hover{color:#fff;box-shadow:var(--glow);}.continue-btn:hover::before{transform:translateX(0);}
  @keyframes pulseBlue{0%,100%{box-shadow:0 0 0 0 rgba(66,133,244,0);}50%{box-shadow:0 0 16px 4px rgba(66,133,244,0.4);}}

  .msg-actions{align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;gap:0.4rem;animation:msgIn 0.35s ease-out;}

  #country-modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.96);z-index:350;align-items:center;justify-content:center;padding:1.5rem;}
  #country-modal.active{display:flex;}
  .country-box{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent3);max-width:520px;width:100%;padding:2rem;border-radius:4px;animation:modalIn 0.3s ease-out;}
  @keyframes modalIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
  .country-box h2{font-family:'Orbitron',monospace;color:var(--accent3);font-size:1rem;letter-spacing:0.12em;margin-bottom:0.5rem;}
  .country-box p{color:var(--muted);font-size:0.85rem;margin-bottom:1.5rem;line-height:1.6;}
  .country-input-wrap{position:relative;margin-bottom:1.2rem;}
  .country-input-wrap label{display:block;font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:0.4rem;}
  #country-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1rem;padding:0.7rem 1rem;border-radius:4px;outline:none;transition:border-color 0.3s;}
  #country-input:focus{border-color:var(--accent3);}
  #country-input::placeholder{color:var(--muted);}
  .country-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-top:none;border-radius:0 0 4px 4px;max-height:180px;overflow-y:auto;z-index:10;display:none;}
  .country-suggestions.show{display:block;}
  .country-suggestion-item{padding:0.5rem 1rem;font-family:'Rajdhani',sans-serif;font-size:0.92rem;color:var(--text);cursor:pointer;transition:background 0.15s;}
  .country-suggestion-item:hover{background:rgba(66,133,244,0.12);color:var(--accent);}
  .diff-label{font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--muted);letter-spacing:0.1em;display:block;margin-bottom:0.6rem;}
  .diff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;margin-bottom:1.5rem;}
  .diff-btn{padding:0.55rem 0.4rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:0.7rem;letter-spacing:0.04em;cursor:pointer;border-radius:3px;transition:all 0.2s;text-align:center;}
  .diff-btn:hover{border-color:var(--accent);color:var(--accent);}
  .diff-btn.selected{border-color:var(--accent3);color:var(--accent3);background:rgba(52,168,83,0.1);}
  .country-confirm-btn{width:100%;padding:0.8rem;background:var(--accent3);border:none;color:#fff;font-family:'Orbitron',monospace;font-size:0.85rem;font-weight:700;letter-spacing:0.12em;cursor:pointer;border-radius:4px;transition:all 0.2s;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
  .country-confirm-btn:hover{background:#2d9e47;box-shadow:0 0 20px rgba(52,168,83,0.4);}
  .country-confirm-btn:disabled{opacity:0.35;cursor:not-allowed;}

  #custom-modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.96);z-index:300;align-items:center;justify-content:center;padding:1.5rem;}
  #custom-modal.active{display:flex;}
  .custom-box{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent4);max-width:560px;width:100%;padding:1.8rem;border-radius:4px;}
  .custom-box h2{font-family:'Orbitron',monospace;color:var(--accent4);font-size:0.95rem;letter-spacing:0.1em;margin-bottom:0.5rem;}
  .custom-box p{font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--muted);margin-bottom:1rem;}
  .custom-box textarea{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1rem;padding:0.8rem;border-radius:4px;margin-bottom:1rem;resize:vertical;outline:none;}
  .custom-box textarea:focus{border-color:var(--accent4);}
  .custom-box .btn-row{display:flex;gap:0.8rem;justify-content:flex-end;}
  .custom-confirm{padding:0.6rem 1.4rem;background:var(--accent4);border:none;color:#000;font-family:'Orbitron',monospace;font-size:0.75rem;font-weight:700;letter-spacing:0.1em;cursor:pointer;border-radius:4px;transition:all 0.2s;}
  .custom-confirm:hover{background:#ffd040;}
  .custom-cancel{padding:0.6rem 1.2rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;border-radius:4px;transition:all 0.2s;}
  .custom-cancel:hover{border-color:var(--red);color:var(--red);}

  #report-modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.96);z-index:300;align-items:center;justify-content:center;padding:1.5rem;}
  #report-modal.active{display:flex;}
  .report-box{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--red);max-width:500px;width:100%;padding:1.8rem;border-radius:4px;}
  .report-box h2{font-family:'Orbitron',monospace;color:var(--red);font-size:1rem;letter-spacing:0.12em;margin-bottom:1.2rem;}
  .report-box p{color:var(--muted);margin-bottom:1rem;font-size:0.87rem;line-height:1.6;}
  .report-box textarea{width:100%;min-height:120px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Rajdhani',sans-serif;padding:0.8rem;border-radius:4px;margin-bottom:1rem;resize:vertical;}
  .report-box .btn-row{display:flex;gap:1rem;justify-content:flex-end;}
  .report-btn-submit{padding:0.6rem 1.2rem;background:var(--red);border:none;color:white;font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;border-radius:4px;transition:all 0.2s;}
  .report-btn-submit:hover{background:#ff1a33;}
  .report-btn-cancel{padding:0.6rem 1.2rem;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Orbitron',monospace;font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;border-radius:4px;transition:all 0.2s;}
  .report-btn-cancel:hover{border-color:var(--red);color:var(--red);}
  .report-success{position:fixed;bottom:1rem;right:1rem;background:rgba(52,168,83,0.9);color:white;padding:0.8rem 1.2rem;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:0.8rem;z-index:400;transform:translateY(20px);opacity:0;transition:all 0.3s;}
  .report-success.show{transform:translateY(0);opacity:1;}

  .typing-indicator{display:none;align-self:flex-start;padding:0.8rem 1.2rem;background:var(--surface2);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:4px;}
  .typing-indicator.active{display:flex;gap:4px;align-items:center;}
  .typing-dot{width:6px;height:6px;border-radius:50%;animation:typingBounce 1.2s ease-in-out infinite;}
  .typing-dot:nth-child(1){background:var(--accent);}.typing-dot:nth-child(2){background:var(--accent2);animation-delay:0.2s;}.typing-dot:nth-child(3){background:var(--accent3);animation-delay:0.4s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-6px);opacity:1;}}

  #loading{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;}
  #loading.active{display:flex;}
  .loading-text{font-family:'Orbitron',monospace;font-size:1rem;color:var(--accent);letter-spacing:0.2em;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .loading-bar-container{width:280px;height:2px;background:var(--surface2);overflow:hidden;}
  .loading-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3),var(--accent4));animation:loadBar 1.8s ease-in-out infinite;}
  @keyframes loadBar{0%{width:0%;margin-left:0%}50%{width:80%;margin-left:0%}100%{width:0%;margin-left:100%}}

  #rules-modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.96);z-index:200;align-items:center;justify-content:center;padding:1.5rem;}
  #rules-modal.active{display:flex;}
  .rules-box{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:2rem;border-radius:4px;}
  .rules-box::-webkit-scrollbar{width:4px;}.rules-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  .rules-box h2{font-family:'Orbitron',monospace;color:var(--accent);font-size:1rem;letter-spacing:0.12em;margin-bottom:1.5rem;padding-bottom:0.7rem;border-bottom:1px solid var(--border);}
  .rules-box h3{font-family:'Rajdhani',sans-serif;color:var(--accent2);font-size:0.92rem;font-weight:700;letter-spacing:0.1em;margin:1.3rem 0 0.5rem;text-transform:uppercase;}
  .rules-box p,.rules-box li{font-size:0.87rem;color:var(--muted);line-height:1.75;margin-bottom:0.3rem;}.rules-box ul{padding-left:1.3rem;}.rules-box strong{color:var(--text);font-weight:600;}
  .rules-box .rule-block{background:var(--surface2);border:1px solid var(--border);border-left:2px solid var(--accent);padding:0.8rem 1rem;border-radius:3px;margin:0.6rem 0;}.rules-box .rule-block p{margin:0;}
  .close-rules{margin-top:1.5rem;width:100%;padding:0.7rem;background:none;border:1px solid var(--accent);color:var(--accent);font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;}
  .close-rules:hover{background:var(--accent);color:#fff;}

  #legal-modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.96);z-index:200;align-items:center;justify-content:center;padding:1.5rem;}
  #legal-modal.active{display:flex;} #legal-modal a{color:var(--accent);text-decoration:none;} #legal-modal a:hover{text-decoration:underline;}

  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);}
  .corner-deco{position:fixed;width:48px;height:48px;pointer-events:none;z-index:0;opacity:0.2;}
  .corner-deco.tl{top:14px;left:14px;border-top:2px solid var(--accent);border-left:2px solid var(--accent3);}.corner-deco.tr{top:14px;right:14px;border-top:2px solid var(--accent2);border-right:2px solid var(--accent);}
  .corner-deco.bl{bottom:14px;left:14px;border-bottom:2px solid var(--accent3);border-left:2px solid var(--accent4);}.corner-deco.br{bottom:14px;right:14px;border-bottom:2px solid var(--accent4);border-right:2px solid var(--accent2);}

  .audio-btn{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:0.68rem;padding:0.25rem 0.7rem;cursor:pointer;border-radius:2px;transition:all 0.3s;letter-spacing:0.05em;}
  .audio-btn:hover{border-color:var(--accent);color:var(--accent);}.audio-btn.playing{border-color:var(--accent3);color:var(--accent3);}.audio-btn.tension{border-color:var(--accent4);color:var(--accent4);}.audio-btn.crisis{border-color:var(--red);color:var(--red);animation:critPulse 1s ease-in-out infinite;}
  .audio-bars{display:flex;align-items:flex-end;gap:2px;height:12px;}.audio-bar{width:3px;background:currentColor;border-radius:1px;}
  @keyframes barBounce{0%,100%{height:3px}50%{height:12px}}
  #news-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:500;background:#0d0d0d;border-top:2px solid var(--accent2);height:36px;overflow:hidden;flex-direction:row;align-items:center;}
  #news-banner.active{display:flex;}
  .news-label{flex-shrink:0;background:var(--accent2);color:#fff;font-family:'Orbitron',monospace;font-size:0.62rem;font-weight:700;letter-spacing:0.12em;padding:0 0.9rem;height:100%;display:flex;align-items:center;white-space:nowrap;}
  .news-track-wrap{flex:1;overflow:hidden;height:100%;position:relative;}
  .news-track{display:flex;align-items:center;height:100%;white-space:nowrap;animation:newsScroll 28s linear infinite;font-family:'Share Tech Mono',monospace;font-size:0.78rem;color:#f0f0f0;letter-spacing:0.04em;}
  @keyframes newsScroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
  .fs-btn{display:flex;align-items:center;gap:4px;background:none;border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:0.68rem;padding:0.25rem 0.6rem;cursor:pointer;border-radius:2px;transition:all 0.3s;letter-spacing:0.05em;}
  #stats-modal{display:none;position:fixed;inset:0;background:rgba(3,7,18,0.96);z-index:200;align-items:center;justify-content:center;padding:1.5rem;}
  #stats-modal.active{display:flex;}
  .stats-box{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent4);max-width:860px;width:100%;max-height:88vh;overflow-y:auto;padding:1.8rem;border-radius:4px;}
  .chart-card{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1rem;}
  .chart-wrap{position:relative;height:140px;}
  .bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:0.6rem;max-width:1000px;width:100%;margin-left:auto;margin-right:auto;padding:0 0.2rem;}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="corner-deco tl"></div><div class="corner-deco tr"></div>
<div id="loading"><div class="loading-text">INITIALISATION...</div><div class="loading-bar-container"><div class="loading-bar"></div></div></div>

<div id="landing">
  <div class="globe-container"><div class="globe"></div><div class="globe-ring"></div></div>
  <div class="title-main">PRÉSIDENT<br>LE JEU</div>
  <div class="btn-row">
    <button class="play-btn" onclick="startGame()">▶ JOUER</button>
    <button class="rules-btn" onclick="document.getElementById('rules-modal').classList.add('active')">RÈGLES</button>
  </div>
  <div id="save-info" style="margin-top:1rem;display:none;">
    <button class="resume-btn" onclick="resumeGame()">↺ REPRENDRE LA PARTIE</button>
  </div>
</div>

<div id="country-modal">
  <div class="country-box">
    <h2>🌍 CHOISISSEZ VOTRE PAYS</h2>
    <input type="text" id="country-input" placeholder="Ex : France, Japon..." oninput="filterCountries(this.value)" />
    <div class="country-suggestions" id="country-suggestions"></div>
    <div class="diff-grid">
      <button class="diff-btn selected" data-diff="Facile" onclick="selectDiff(this)">😊 Facile</button>
      <button class="diff-btn" data-diff="Normal" onclick="selectDiff(this)">⚖️ Normal</button>
      <button class="diff-btn" data-diff="Difficile" onclick="selectDiff(this)">🔥 Difficile</button>
    </div>
    <button class="country-confirm-btn" id="country-confirm-btn" onclick="confirmCountry()" disabled>▶ CONFIRMER</button>
  </div>
</div>

<div id="game">
  <div class="hud">
    <span class="hud-title">▲ PRÉSIDENT LE JEU</span>
    <div class="hud-center">
      <span>PAYS <b id="hud-country">—</b></span>
      <span>DATE <b id="hud-date">—</b></span>
    </div>
    <span class="nego-badge" id="nego-badge">🤝 NÉGOCIATION EN COURS</span>
    <button class="audio-btn" id="audio-btn" onclick="toggleAudio()">♪ SON</button>
    <button onclick="openStats()">📊 STATS</button>
  </div>
  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <div class="typing-indicator" id="typing">...</div>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="fs-btn" onclick="toggleFullscreen()">⛶ PLEIN ÉCRAN</button>
    <button class="reset-btn" onclick="resetGame()">✕ ABANDONNER</button>
  </div>
</div>

<div id="news-banner">
  <div class="news-label">⚡ BREAKING NEWS</div>
  <div class="news-track-wrap"><div class="news-track" id="news-track"></div></div>
</div>

<script>
// --- LOGIQUE GLOBALE ---
const COUNTRIES = ['France','États-Unis','Allemagne','Japon','Brésil','Russie','Chine','Royaume-Uni','Inde','Canada','Italie','Espagne','Australie','Suisse'];
let conversationHistory = [], gamePhase = 'init', selectedDiff = 'Facile', isLoading = false;

// --- API ---
async function callAPI(initMessage, isInit) {
  setLoading(true);
  const messages = isInit ? [{role:'user', content:initMessage}] : conversationHistory;
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages})
    });
    const data = await response.json();
    const text = data.text || '';
    if(isInit) conversationHistory = [{role:'user', content:initMessage}, {role:'assistant', content:text}];
    else conversationHistory.push({role:'assistant', content:text});
    addMessage('ai', text);
    updateHUD(text);
  } catch(e) { addMessage('ai', 'Erreur de connexion API.'); }
  setLoading(false);
}

// --- AFFICHAGE MESSAGES ---
function addMessage(role, content) {
  const container = document.getElementById('chat-messages');
  const typing = document.getElementById('typing');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const body = document.createElement('div');
  body.className = 'msg-body';
  
  if(role === 'ai') {
    const cleaned = extractNews(content);
    body.innerHTML = window.marked ? window.marked.parse(cleaned) : cleaned;
    container.insertBefore(div, typing);
    div.appendChild(body);
    
    // Détection Négociation ou Phase 1/2
    if(isNegotiationMessage(content)) {
      gamePhase = 'negotiation';
      document.getElementById('nego-badge').classList.add('active');
      injectNegoPanel(container, typing);
    } else {
      renderChoices(body);
      injectActionButtons(content);
    }
  } else {
    body.textContent = content;
    div.appendChild(body);
    container.insertBefore(div, typing);
  }
  container.scrollTop = container.scrollHeight;
}

// --- SYSTÈME NÉGOCIATION ---
function isNegotiationMessage(text) {
  return /phase de n[ée]gociation|n[ée]gociation/i.test(text) && !/phase [12]/i.test(text);
}

function injectNegoPanel(container, typing) {
  const old = document.querySelector('.nego-panel');
  if (old) old.remove();
  const panel = document.createElement('div');
  panel.className = 'nego-panel msg-actions';
  panel.innerHTML = `
    <div class="nego-panel-title">🤝 RÉPONDRE À LA PROPOSITION</div>
    <button class="nego-btn accept" onclick="sendNegoChoice(this, '✅ J\\'accepte la proposition.')">✅ Accepter la proposition</button>
    <button class="nego-btn refuse" onclick="sendNegoChoice(this, '❌ Je refuse la proposition.')">❌ Refuser la proposition</button>
    <button class="nego-btn end-nego" onclick="sendNegoChoice(this, 'Je mets fin à la réunion. Reprenons le jeu.')">🚪 Terminer la négociation</button>
  `;
  container.insertBefore(panel, typing);
}

function sendNegoChoice(btn, text) {
  const panel = btn.closest('.nego-panel');
  panel.querySelectorAll('button').forEach(b => b.disabled = true);
  
  if (text.includes('Reprenons le jeu')) {
    gamePhase = 'playing';
    document.getElementById('nego-badge').classList.remove('active');
  }
  
  addMessage('user', text);
  conversationHistory.push({role: 'user', content: text});
  callAPI(null, false);
}

// --- PHASE 2 ---
function renderChoices(body) {
  if (gamePhase === 'negotiation') return;
  body.querySelectorAll('ol li').forEach((li, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<b>${idx+1}.</b> ${li.textContent}`;
    btn.onclick = () => {
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      addMessage('user', li.textContent);
      conversationHistory.push({role: 'user', content: li.textContent});
      callAPI(null, false);
    };
    li.innerHTML = '';
    li.appendChild(btn);
  });
}

function injectActionButtons(text) {
  const container = document.getElementById('chat-messages');
  const typing = document.getElementById('typing');
  if (gamePhase === 'init') {
    const div = document.createElement('div');
    div.className = 'msg-actions';
    div.innerHTML = '<button class="country-picker-btn" onclick="openCountryModal()">🌍 Choisir mon pays</button>';
    container.insertBefore(div, typing);
  }
}

// --- UTILITAIRES ---
function setLoading(v) { isLoading = v; document.getElementById('typing').style.display = v ? 'flex' : 'none'; }
function openCountryModal() { document.getElementById('country-modal').classList.add('active'); }
function selectDiff(btn) { document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); selectedDiff = btn.dataset.diff; }
function filterCountries(v) { document.getElementById('country-confirm-btn').disabled = !v; }
function confirmCountry() {
  const c = document.getElementById('country-input').value;
  document.getElementById('country-modal').classList.remove('active');
  document.getElementById('hud-country').textContent = c;
  gamePhase = 'playing';
  callAPI(`Je dirige ${c} en ${selectedDiff}`, false);
}
function startGame() { document.getElementById('landing').style.display = 'none'; document.getElementById('game').style.display = 'flex'; callAPI("Bonjour", true); }
function extractNews(t) { return t.replace(/\[NEWS:.*?\]/g, ''); }
function updateHUD(t) { const d = t.match(/(?:Janvier|Février|Mars|Avril|Mai|Juin|Juillet|Août|Septembre|Octobre|Novembre|Décembre)\s+\d{4}/i); if(d) document.getElementById('hud-date').textContent = d[0]; }
</script>
</body>
</html>
